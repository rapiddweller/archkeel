# The workspace lives in native/: a root Cargo.toml would be a stray file in the repository root.
[workspace]
resolver = "2"
members = ["wire", "typescript"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
archkeel-wire = { path = "wire" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# `preserve_order`: the order of `paths` keys and of `exports` conditions decides the result.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tree-sitter = "0.25"
# The grammar release of the Python collector (`tree-sitter-typescript` in uv.lock).
tree-sitter-typescript = "=0.23.2"

# AD-317: the wheel binary. A panic aborts the process, and the host reports execution_error.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
