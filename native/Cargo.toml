# The workspace lives in native/: a root Cargo.toml would be a stray file in the repository root.
[workspace]
resolver = "2"
members = ["wire", "snapshot", "build-support", "typescript", "rust"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
archkeel-build-support = { path = "build-support" }
archkeel-snapshot = { path = "snapshot" }
archkeel-wire = { path = "wire" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# `preserve_order`: the order of `paths` keys and of `exports` conditions decides the result.
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
# The Rust collector reads source with `syn`, the parser of proc macros. The `span-locations`
# feature gives the line and column of a token outside a proc macro.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "3.0", default-features = false, features = ["full", "visit", "parsing", "clone-impls"] }
sha2 = "0.10"
tree-sitter = "0.25"
# The grammar release of the Python collector (`tree-sitter-typescript` in uv.lock).
tree-sitter-typescript = "=0.23.2"

# AD-317: the wheel binary. A panic aborts the process, and the host reports execution_error.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
# An arithmetic overflow (+, -, *) stops the scan instead of wrapping. An `as` cast still
# truncates without a check: `clippy::cast_possible_truncation` counts those in `make native-report`.
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A panic aborts the process (AD-317) and ends the whole scan: a failure must be a value.
unwrap_used = "deny"
expect_used = "deny"
# AD-327: a panic ends the whole scan; no panic family macro in non-test code.
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# AD-327: size and shape ratchets. Thresholds are in clippy.toml. A function above a limit carries
# `#[expect(..., reason = ...)]`, and the expectation fails the build once the function is fixed.
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
# AD-327: reports only. `make native-report` counts them; they do not block.
