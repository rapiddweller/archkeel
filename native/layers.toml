# AD-327: the layers of the native workspace. `tests/test_self_native_layers.py` reads this file,
# `cargo metadata` and the `crate::` paths of each crate. It fails when a crate depends on a crate
# that its entry does not list, when a crate that is not a collector depends on a `tree-sitter`
# crate, and when a module cycle appears that is not in `cycles`.
# A new crate needs an entry here. The names are the vocabulary of an Archkeel contract
# (component and "may use"), so a later move to an Archkeel contract is a change of data.

# Crates that only a collector may use (a name prefix).
parser_prefixes = ["tree-sitter"]

[crates.archkeel-wire]
role = "library"
dir = "wire"
may_use = []

[crates.archkeel-build-support]
role = "library"
dir = "build-support"
may_use = []

[crates.archkeel-typescript-collector]
role = "collector"
dir = "typescript"
may_use = ["archkeel-wire", "archkeel-build-support"]

[crates.archkeel-rust-collector]
role = "collector"
dir = "rust"
may_use = ["archkeel-wire", "archkeel-build-support"]
