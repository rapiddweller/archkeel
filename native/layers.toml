# AD-327: the layers of the native workspace. `tests/test_self_native_layers.py` reads this file,
# `cargo metadata` and the `crate::` paths of each crate. It fails when a crate depends on a crate
# that its entry does not list, when a crate that is not a collector depends on a `tree-sitter`
# crate, and when a module cycle appears that is not in `cycles`.
# A new crate needs an entry here. The names are the vocabulary of an Archkeel contract
# (component and "may use"), so a later move to an Archkeel contract is a change of data.

# Crates that only a collector may use (a name prefix).
parser_prefixes = ["tree-sitter"]

# Directions (epic #880, target v2): collectors -> facts, snapshot, build-support -> wire;
# store -> facts. No library uses a collector, and no library uses a parser crate. No collector
# uses another collector or the store. `planned = true` marks a crate that has no code yet: the
# entry fixes its place before it gets code, and the test fails when the crate appears with the
# mark still set. `archkeel-build-support` is the crate of #916 (the one build script helper).
#
# `native/architecture-contract.json` holds the same crates and directions in the vocabulary of an
# Archkeel contract (component, requires). Keep both files equal until the Rust collector of #916
# checks the contract and this file is removed.

[crates.archkeel-wire]
role = "library"
dir = "wire"
may_use = ["archkeel-facts"]

[crates.archkeel-snapshot]
role = "library"
dir = "snapshot"
may_use = ["archkeel-wire"]

# AD-345: the one typed definition of each collector fact. It uses no parser and no other crate.
[crates.archkeel-facts]
role = "library"
dir = "facts"
may_use = []

# AD-346: validate a collector reply once, give the read-set and write architecture.json. It reads
# collector facts only, never a parser.
[crates.archkeel-store]
role = "library"
dir = "store"
may_use = ["archkeel-facts"]

[crates.archkeel-build-support]
role = "library"
dir = "build-support"
may_use = []

[crates.archkeel-typescript-collector]
role = "collector"
dir = "typescript"
may_use = ["archkeel-wire", "archkeel-snapshot", "archkeel-facts", "archkeel-build-support"]

[crates.archkeel-rust-collector]
role = "collector"
dir = "rust"
may_use = ["archkeel-wire", "archkeel-snapshot", "archkeel-facts", "archkeel-build-support"]
