[package]
name = "archkeel-report"
description = "The report v2 payload of Archkeel: the typed Report frame, its canonical bytes and its check (AD-361, AD-371)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# AD-359, AD-381: the report takes the outcome of the evaluator and checks each PASS against the
# model and the rule; it reads the run proof of the model and names the word of a rule kind.
[dependencies]
archkeel-contract = { path = "../contract" }
archkeel-eval = { path = "../eval" }
archkeel-model = { path = "../model" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
archkeel-store = { path = "../store" }
flate2.workspace = true

[lints]
workspace = true
