[package]
name = "archkeel-typescript-collector"
description = "Native TypeScript collector of Archkeel; a library that the core links and a subprocess of the host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

# AD-406: the collection is a library that `archkeel-collect` links into the core; the binary is
# its thin process wrapper and writes the same bytes as before.
[lib]
name = "archkeel_typescript_collector"
path = "src/lib.rs"

[[bin]]
name = "archkeel-typescript-collector"
path = "src/main.rs"

[dependencies]
archkeel-facts.workspace = true
archkeel-pytext.workspace = true
archkeel-snapshot.workspace = true
archkeel-wire.workspace = true
serde_json.workspace = true
tree-sitter.workspace = true
tree-sitter-typescript.workspace = true

[features]
# Test only: `--dump` prints the per-file syntax facts as JSON for `tests/test_collector_native_syntax.py`.
# The release binary is built without it (AD-323).
dump = []

[dev-dependencies]
archkeel-snapshot = { workspace = true, features = ["test-tree"] }

[build-dependencies]
archkeel-build-support.workspace = true

[lints]
workspace = true
