[package]
name = "archkeel-dart-collector"
description = "Native Dart collector of Archkeel (#880): slice 1, the discovery of the sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
archkeel-dart-grammar = { path = "../dart-grammar" }
archkeel-facts.workspace = true
archkeel-pytext.workspace = true
archkeel-snapshot.workspace = true
archkeel-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
tree-sitter.workspace = true

[features]
# Test only: `--dump` prints the discovery sections as JSON for `tools/dart_discovery_parity.py`.
# The release binary is built without it (AD-323).
dump = []

[dev-dependencies]
archkeel-snapshot = { workspace = true, features = ["test-tree"] }

[build-dependencies]
archkeel-build-support.workspace = true

[lints]
workspace = true
