# AD-316: the dependency policy of the native collector. `make native-check` runs
# `cargo deny check`. The binary reads untrusted source and writes one reply to stdout, so it
# needs no network, no TLS and no child processes.

[graph]
# The six targets of the platform wheels (AD-317).
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Each RustSec advisory fails the check, also for an unmaintained or unsound transitive crate.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Only the licenses that the current crates need. A new license is a reviewed change.
allow = ["Apache-2.0", "MIT"]
confidence-threshold = 0.93

# `serde_json` with `preserve_order` (the order of `paths` keys and `exports` conditions decides
# resolution) needs `indexmap`, and its `hashbrown` needs `foldhash`, which has the Zlib license.
# Zlib is permissive and OSI approved. The exception is for this one crate (AD-320).
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

# AD-345 and AD-335: the serde and schemars derives of `archkeel-facts` and the `syn` parser of the
# Rust collector need `proc-macro2`, and it needs `unicode-ident`, which carries the Unicode data license next to MIT or Apache-2.0. Unicode-3.0 is
# permissive and OSI approved. The crate runs only in the compiler; the binary does not link it.
[[licenses.exceptions]]
crate = "unicode-ident"
allow = ["Unicode-3.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The workspace crates use path dependencies; they are not published.
allow-wildcard-paths = true
deny = [
    { crate = "reqwest", reason = "network: the collector reads local files only" },
    { crate = "hyper", reason = "network: the collector reads local files only" },
    { crate = "h2", reason = "network: the collector reads local files only" },
    { crate = "ureq", reason = "network: the collector reads local files only" },
    { crate = "curl", reason = "network: the collector reads local files only" },
    { crate = "curl-sys", reason = "network: the collector reads local files only" },
    { crate = "isahc", reason = "network: the collector reads local files only" },
    { crate = "socket2", reason = "network: the collector reads local files only" },
    { crate = "mio", reason = "network: the collector reads local files only" },
    { crate = "tokio", reason = "network and async runtime: the collector is synchronous" },
    { crate = "async-std", reason = "network and async runtime: the collector is synchronous" },
    { crate = "smol", reason = "network and async runtime: the collector is synchronous" },
    { crate = "openssl", reason = "TLS: the collector has no network" },
    { crate = "openssl-sys", reason = "TLS: the collector has no network" },
    { crate = "native-tls", reason = "TLS: the collector has no network" },
    { crate = "rustls", reason = "TLS: the collector has no network" },
    { crate = "boring", reason = "TLS: the collector has no network" },
    { crate = "subprocess", reason = "process: the collector starts no child process" },
    { crate = "duct", reason = "process: the collector starts no child process" },
    { crate = "command-group", reason = "process: the collector starts no child process" },
    # AD-327: only a collector crate may use a parser. `wrappers` names the crates that may depend
    # on the denied crate. The grammar crate depends on `tree-sitter-language`, not on `tree-sitter`.
    # AD-342: `archkeel-dart-grammar` uses `tree-sitter` as a dev-dependency only, for its parity test.
    { crate = "tree-sitter", wrappers = ["archkeel-typescript-collector", "archkeel-dart-grammar"], reason = "only a collector crate parses source" },
    { crate = "tree-sitter-language", wrappers = ["tree-sitter", "tree-sitter-typescript", "archkeel-dart-grammar"], reason = "every grammar crate depends on it: a new grammar crate fails here until it is listed and has an external_dependency_scope rule" },
    { crate = "tree-sitter-typescript", wrappers = ["archkeel-typescript-collector"], reason = "only a collector crate parses source" },
]

[sources]
# crates.io only: no other registry and no Git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
