[package]
name = "archkeel-core"
description = "The core of Archkeel: the one process after the collector (AD-359, AD-363)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# AD-359: the core is the only binary of the WP6 crates. The host uses it for no verdict yet.
[[bin]]
name = "archkeel-core"
path = "src/main.rs"

[dependencies]
archkeel-contract = { path = "../contract" }
archkeel-model = { path = "../model" }
archkeel-store = { path = "../store" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
archkeel-build-support.workspace = true

[dev-dependencies]
flate2.workspace = true

[lints]
workspace = true
