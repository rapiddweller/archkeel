[package]
name = "archkeel-python-collector"
description = "Native Python collector of Archkeel: the library that the core links and a thin binary (AD-450)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# AD-334: `--dump` prints the parse outcome of each file for the tests. Not in the wheel.
dump = []

[dependencies]
archkeel-pytext.workspace = true
archkeel-facts.workspace = true
archkeel-snapshot.workspace = true
archkeel-wire.workspace = true
ruff_python_ast.workspace = true
ruff_python_parser.workspace = true
ruff_text_size.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[build-dependencies]
archkeel-build-support.workspace = true

[dev-dependencies]
flate2.workspace = true
archkeel-snapshot = { workspace = true, features = ["test-tree"] }

[lints]
workspace = true
