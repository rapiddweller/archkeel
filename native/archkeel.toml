# AD-335: Archkeel checks its own native workspace with its own contract. `make self-validate-native`
# runs `archkeel validate --config native/archkeel.toml` from the repository root.
[scan]
# AD-776: the paths below are relative to the repository root, one folder up.
root = ".."
language = "rust"
roots = ["native"]
namespace = "native"
contract = "native/architecture-contract.json"
# The report and the rules read production code only (the collector owns the cfg(test) rule).
exclude_test_sources = true
# AD-1047: off here, because 9 cold `cargo check` runs of this workspace exceed the 15-minute job cap (#1964, #1999).
# Facts drop 33.6% of the REQUIRES-COMPLETE holds: measure with `rust_type_reach = true` (see the PR text).
rust_type_reach = false
