# AD-335: Archkeel checks its own native workspace with its own contract. `make self-validate`
# scans it as the core part of the system document, from the repository root.
[scan]
# AD-776: the paths below are relative to the repository root, one folder up.
root = ".."
language = "rust"
roots = ["native"]
namespace = "native"
contract = "native/architecture-contract.json"
# The report and the rules read production code only (the collector owns the cfg(test) rule).
exclude_test_sources = true
# AD-1047: the compiler type-reach facts drop the trait-impl, destructor and receiver gaps that no body can run.
rust_type_reach = true
