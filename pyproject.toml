[project]
name = "archkeel"
dynamic = ["version", "readme"]
description = "Deterministic architecture checks for AI-assisted code changes"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rapiddweller Asia Co., Ltd." }]
maintainers = [{ name = "Alexander Kell", email = "Alexander.Kell@rapiddweller.com" }]
keywords = ["architecture", "static-analysis", "code-review", "ai-assisted", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Stdlib has no PEP 440 specifier parser and no styled terminal or help output.
dependencies = [
    "packaging>=24.2,<27",
    "rich>=13.9,<16",
    "rich-argparse>=1.6,<2",
]

[project.urls]
Repository = "https://github.com/rapiddweller/archkeel"
Documentation = "https://github.com/rapiddweller/archkeel/blob/main/docs/reference.md"
Issues = "https://github.com/rapiddweller/archkeel/issues"

[project.scripts]
archkeel = "archkeel.cli:main"

[build-system]
# Hatchling maps the single schema/ source into wheels without a custom build hook.
# Git tags own versions; the README hook keeps local image paths out of PyPI metadata.
requires = ["hatchling>=1.32,<2", "hatch-vcs>=0.5,<1", "hatch-fancy-pypi-readme>=25.1,<26"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

# One rule for every asset, not one per file: the per-file list went stale the moment the
# README gained an image, and PyPI showed a broken one for each that nobody had added here.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|href)="(docs/)'
replacement = '\1="https://raw.githubusercontent.com/rapiddweller/archkeel/main/\2'

# A relative Markdown link resolves against PyPI's own page, so it 404s there.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/[^)]+)\)'
replacement = '](https://github.com/rapiddweller/archkeel/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/archkeel"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "archkeel/schema"

[tool.hatch.build.targets.sdist]
# The sdist ships what rebuilds the wheel, not the test suite: pytest needs a Git checkout
# (fixtures/E-runtime's two pinned interpreters, tools/, cross-test imports) that a tarball
# cannot offer, so a shipped-but-skipped suite would only be a second, weaker "tests pass".
# Distributors rebuild from the Git tag.
only-include = ["src", "schema"]

[dependency-groups]
# Pytest preserves analyzer tests, Ruff checks style, and MyPy enforces the static boundary.
dev = [
    "ruff==0.16.0",
    "pytest>=8.3.4,<9",
    "mypy==1.18.2",
    "jsonschema==4.25.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import repository tools such as tools/interface_profile.py.
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# A double must match the signature it replaces, including arguments it ignores.
"tests/*" = ["ARG"]
"fixtures/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
