[project]
name = "archkeel"
dynamic = ["version", "readme"]
description = "Architecture checks for coding agents"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rapiddweller Asia Co., Ltd." }]
maintainers = [{ name = "Alexander Kell", email = "Alexander.Kell@rapiddweller.com" }]
keywords = ["architecture", "static-analysis", "code-review", "coding-agents", "harness-engineering", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# The shell uses only the standard library; the Rust core decides each run (AD-432).
dependencies = []

[project.urls]
Repository = "https://github.com/rapiddweller/archkeel"
Documentation = "https://github.com/rapiddweller/archkeel/blob/main/docs/reference.md"
Issues = "https://github.com/rapiddweller/archkeel/issues"

[project.scripts]
archkeel = "archkeel.cli:main"

[build-system]
# Hatchling maps the single schema/ source into wheels; the custom hook only bundles the binary.
# Git tags own versions; the README hook keeps local image paths out of PyPI metadata.
requires = ["hatchling>=1.32,<2", "hatch-vcs>=0.5,<1", "hatch-fancy-pypi-readme>=25.1,<26"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

# One rule for every asset, not one per file: the per-file list went stale the moment the
# README gained an image, and PyPI showed a broken one for each that nobody had added here.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|href)="(docs/)'
replacement = '\1="https://raw.githubusercontent.com/rapiddweller/archkeel/main/\2'

# A relative Markdown link resolves against PyPI's own page, so it 404s there.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:docs|fixtures)/[^)]+)\)'
replacement = '](https://github.com/rapiddweller/archkeel/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/archkeel"]
# AD-290: the Studio sources build studio.js; the wheel ships only what the server serves.
exclude = [
  "src/archkeel/cli/assets/SKILL.md",
  "src/archkeel/studio/ui/*.ts",
  "src/archkeel/studio/ui/*.tsx",
  "src/archkeel/studio/ui/views",
  "src/archkeel/studio/ui/tsconfig.json",
  "src/archkeel/studio/ui/AGENTS.md",
]

# AD-436: the hook puts the core into each wheel and refuses a wheel without the core.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "native/hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"schema" = "archkeel/schema"
"skills/archkeel/SKILL.md" = "archkeel/cli/assets/SKILL.md"

[tool.hatch.build.targets.sdist]
# The sdist ships what rebuilds the wheel, not the test suite: pytest needs a Git checkout
# (fixtures/E-runtime's two pinned interpreters, tools/, cross-test imports) that a tarball
# cannot offer, so a shipped-but-skipped suite would only be a second, weaker "tests pass".
# Distributors rebuild from the Git tag. README.md is the declared readme source, so the
# tarball carries it rather than leaning on the description hatchling froze into PKG-INFO.
# The wheel hook is a build input; the native sources are not, so an sdist never runs cargo.
# A wheel from the sdist needs a prebuilt core in ARCHKEEL_BUNDLE_NATIVE (AD-436).
only-include = ["src", "schema", "README.md", "skills", "native/hatch_build.py"]

[dependency-groups]
# Pytest runs the tests, Ruff checks style, and MyPy checks the types of the shell and the tools.
# The tests lock the native build and read wheel tags; a tool compares the Dart grammar.
dev = [
    "ruff==0.16.0",
    "pytest>=8.3.4,<9",
    "pytest-xdist==3.8.0",
    "mypy==1.18.2",
    "jsonschema==4.25.1",
    "filelock==4.0.10",
    "packaging>=24.2,<27",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-dart==0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import repository tools such as tools/publish_release.py.
pythonpath = ["."]
addopts = "-rs -p no:cacheprovider -m 'not browser and not native_wheel'"
markers = [
    "browser: runs the rendered report in Chromium",
    "native_wheel: builds or installs the platform wheel; make native-wheel runs it",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# A double must match the signature it replaces, including arguments it ignores.
"tests/*" = ["ARG"]
"fixtures/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
