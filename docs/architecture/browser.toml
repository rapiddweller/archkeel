[scan]
# AD-776: the paths below are relative to the repository root, two folders up.
root = "../.."
language = "typescript"
namespace = "browser"
contract = "docs/architecture/target/browser-contract.json"
tsconfig = "docs/architecture/browser.tsconfig.json"
roots = [
  # The Explorer runs flow.runtime.js: tools/browser_runtime.py joins the parts of flow/ into it.
  "native/report/assets/explorer/flow.runtime.js",
  "native/report/assets/explorer/report-canvas.js",
  "native/report/assets/explorer/report-presentation.js",
  "native/report/assets/explorer/report-scene.js",
  "native/report/assets/explorer/report-graph-scene.js",
  "native/report/assets/explorer/report-graph-protocol.js",
  "native/report/assets/explorer/report-atlas-deviations.js",
  "native/report/assets/explorer/report-layout.js",
  "native/report/assets/explorer/report-placement.js",
]
