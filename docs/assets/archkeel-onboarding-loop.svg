<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1286" viewBox="0 0 980 1286" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif">
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#6E6E66"/></marker></defs>
<rect width="100%" height="100%" fill="#000000"/>
<rect x="24" y="88" width="312" height="1168" rx="14" fill="#090909"/>
<rect x="334" y="88" width="312" height="1168" rx="14" fill="#090909"/>
<rect x="644" y="88" width="312" height="1168" rx="14" fill="#090909"/>
<text x="40" y="42" fill="#E8E8E2" font-size="19" font-weight="600">How an architecture contract comes to exist</text>
<text x="40" y="66" fill="#8A8A84" font-size="12.5">Every box is one real command. The agent reads and drafts; only the architect decides; the gate refuses the rest.</text>
<text x="40" y="102" fill="#5EEAD4" font-size="11" font-weight="700" letter-spacing="1.4">AGENT</text>
<text x="40" y="118" fill="#8A8A84" font-size="10.5">reads and drafts</text>
<text x="350" y="102" fill="#F4C95D" font-size="11" font-weight="700" letter-spacing="1.4">ARCHKEEL</text>
<text x="350" y="118" fill="#8A8A84" font-size="10.5">refuses or passes</text>
<text x="660" y="102" fill="#C5F82A" font-size="11" font-weight="700" letter-spacing="1.4">ARCHITECT</text>
<text x="660" y="118" fill="#8A8A84" font-size="10.5">decides</text>
<rect x="40" y="138" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="40" y="138" width="3" height="128" rx="1.5" fill="#5EEAD4"/>
<circle cx="66" cy="162" r="10" fill="none" stroke="#5EEAD4" stroke-width="1.2"/>
<text x="66" y="166" fill="#5EEAD4" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="86" y="162" fill="#E8E8E2" font-size="12.5" font-weight="600">The agent drafts the structure</text>
<text x="56" y="206" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel init --source shop --namespace</text>
<text x="56" y="219" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">shop</text>
<text x="56" y="240" fill="#5EEAD4" font-size="10.5">5 components, 20 open decisions, 0</text>
<text x="56" y="253" fill="#5EEAD4" font-size="10.5">dependency rules</text>
<path d="M 180.0 266 V 282.0 Q 180.0 294.0 192.0 294.0 H 478.0 Q 490.0 294.0 490.0 306.0 V 312" fill="none" stroke="#6E6E66" stroke-width="1.8" stroke-linecap="round" marker-end="url(#tip)"/>
<rect x="350" y="322" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="350" y="322" width="3" height="128" rx="1.5" fill="#F4C95D"/>
<circle cx="376" cy="346" r="10" fill="none" stroke="#F4C95D" stroke-width="1.2"/>
<text x="376" y="350" fill="#F4C95D" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="396" y="346" fill="#E8E8E2" font-size="12.5" font-weight="600">Archkeel refuses the draft</text>
<text x="366" y="390" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel validate</text>
<text x="366" y="424" fill="#F4C95D" font-size="10.5">exit 2, 20 x decision.open</text>
<path d="M 490.0 450 V 466.0 Q 490.0 478.0 502.0 478.0 H 788.0 Q 800.0 478.0 800.0 490.0 V 496" fill="none" stroke="#6E6E66" stroke-width="1.8" stroke-linecap="round" marker-end="url(#tip)"/>
<rect x="660" y="506" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="660" y="506" width="3" height="128" rx="1.5" fill="#C5F82A"/>
<circle cx="686" cy="530" r="10" fill="none" stroke="#C5F82A" stroke-width="1.2"/>
<text x="686" y="534" fill="#C5F82A" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="706" y="530" fill="#E8E8E2" font-size="12.5" font-weight="600">The architect decides every</text>
<text x="706" y="545" fill="#E8E8E2" font-size="12.5" font-weight="600">pair</text>
<text x="676" y="574" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel validate</text>
<text x="676" y="608" fill="#C5F82A" font-size="10.5">exit 0, no diagnostics</text>
<path d="M 800.0 634 V 650.0 Q 800.0 662.0 788.0 662.0 H 502.0 Q 490.0 662.0 490.0 674.0 V 680" fill="none" stroke="#6E6E66" stroke-width="1.8" stroke-linecap="round" marker-end="url(#tip)"/>
<rect x="350" y="690" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="350" y="690" width="3" height="128" rx="1.5" fill="#F4C95D"/>
<circle cx="376" cy="714" r="10" fill="none" stroke="#F4C95D" stroke-width="1.2"/>
<text x="376" y="718" fill="#F4C95D" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="396" y="714" fill="#E8E8E2" font-size="12.5" font-weight="600">The report names an oversized</text>
<text x="396" y="729" fill="#E8E8E2" font-size="12.5" font-weight="600">component</text>
<text x="366" y="758" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel report</text>
<text x="366" y="792" fill="#F4C95D" font-size="10.5">1 component larger than its own level</text>
<path d="M 490.0 818 V 834.0 Q 490.0 846.0 478.0 846.0 H 192.0 Q 180.0 846.0 180.0 858.0 V 864" fill="none" stroke="#6E6E66" stroke-width="1.8" stroke-linecap="round" marker-end="url(#tip)"/>
<rect x="40" y="874" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="40" y="874" width="3" height="128" rx="1.5" fill="#5EEAD4"/>
<circle cx="66" cy="898" r="10" fill="none" stroke="#5EEAD4" stroke-width="1.2"/>
<text x="66" y="902" fill="#5EEAD4" font-size="11" font-weight="700" text-anchor="middle">5</text>
<text x="86" y="898" fill="#E8E8E2" font-size="12.5" font-weight="600">The agent drafts the inside</text>
<text x="56" y="942" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel init --source shop/store</text>
<text x="56" y="955" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">--namespace shop.store</text>
<text x="56" y="976" fill="#5EEAD4" font-size="10.5">4 sub-components, 12 open decisions</text>
<path d="M 180.0 1002 V 1018.0 Q 180.0 1030.0 192.0 1030.0 H 478.0 Q 490.0 1030.0 490.0 1042.0 V 1048" fill="none" stroke="#6E6E66" stroke-width="1.8" stroke-linecap="round" marker-end="url(#tip)"/>
<rect x="350" y="1058" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="350" y="1058" width="3" height="128" rx="1.5" fill="#FF6B6B"/>
<circle cx="376" cy="1082" r="10" fill="none" stroke="#FF6B6B" stroke-width="1.2"/>
<text x="376" y="1086" fill="#FF6B6B" font-size="11" font-weight="700" text-anchor="middle">6</text>
<text x="396" y="1082" fill="#E8E8E2" font-size="12.5" font-weight="600">An agent crosses a closed</text>
<text x="396" y="1097" fill="#E8E8E2" font-size="12.5" font-weight="600">boundary</text>
<text x="366" y="1126" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel report</text>
<text x="366" y="1160" fill="#FF6B6B" font-size="10.5">FAIL, 3 violations:</text>
<text x="366" y="1173" fill="#FF6B6B" font-size="10.5">store:STORE-REQUIRES-COMPLETE</text>
<text x="40" y="1270" fill="#8A8A84" font-size="11.5">The agent never decides a boundary, and the gate never guesses one.</text>
</svg>
