<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1094" viewBox="0 0 980 1094" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif">
<defs><marker id="tip" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 6 4 L 0 7 z" fill="#2A2A28"/></marker></defs>
<rect width="100%" height="100%" fill="#000000"/>
<text x="40" y="42" fill="#E8E8E2" font-size="19" font-weight="600">How an architecture contract comes to exist</text>
<text x="40" y="66" fill="#8A8A84" font-size="12.5">Every box is one real command. The agent reads and drafts; only the architect decides; the gate refuses the rest.</text>
<text x="40" y="102" fill="#5EEAD4" font-size="11" font-weight="700" letter-spacing="1.4">AGENT</text>
<text x="40" y="118" fill="#8A8A84" font-size="10.5">reads and drafts</text>
<text x="350" y="102" fill="#F4C95D" font-size="11" font-weight="700" letter-spacing="1.4">ARCHKEEL</text>
<text x="350" y="118" fill="#8A8A84" font-size="10.5">refuses or passes</text>
<text x="660" y="102" fill="#C5F82A" font-size="11" font-weight="700" letter-spacing="1.4">ARCHITECT</text>
<text x="660" y="118" fill="#8A8A84" font-size="10.5">decides</text>
<rect x="40" y="138" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="40" y="138" width="3" height="128" rx="1.5" fill="#5EEAD4"/>
<circle cx="66" cy="162" r="10" fill="none" stroke="#5EEAD4" stroke-width="1.2"/>
<text x="66" y="166" fill="#5EEAD4" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="86" y="162" fill="#E8E8E2" font-size="12.5" font-weight="600">The agent drafts the structure</text>
<text x="56" y="206" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel init --source shop --namespace</text>
<text x="56" y="219" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">shop</text>
<text x="56" y="240" fill="#5EEAD4" font-size="10.5">5 components, 20 open decisions, 0</text>
<text x="56" y="253" fill="#5EEAD4" font-size="10.5">dependency rules</text>
<path d="M 180.0 266 C 180.0 278.0, 490.0 278.0, 490.0 283" fill="none" stroke="#2A2A28" stroke-width="1.4" marker-end="url(#tip)"/>
<rect x="350" y="290" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="350" y="290" width="3" height="128" rx="1.5" fill="#F4C95D"/>
<circle cx="376" cy="314" r="10" fill="none" stroke="#F4C95D" stroke-width="1.2"/>
<text x="376" y="318" fill="#F4C95D" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="396" y="314" fill="#E8E8E2" font-size="12.5" font-weight="600">Archkeel refuses the draft</text>
<text x="366" y="358" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel validate</text>
<text x="366" y="392" fill="#F4C95D" font-size="10.5">exit 2, 20 x decision.open</text>
<path d="M 490.0 418 C 490.0 430.0, 800.0 430.0, 800.0 435" fill="none" stroke="#2A2A28" stroke-width="1.4" marker-end="url(#tip)"/>
<rect x="660" y="442" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="660" y="442" width="3" height="128" rx="1.5" fill="#C5F82A"/>
<circle cx="686" cy="466" r="10" fill="none" stroke="#C5F82A" stroke-width="1.2"/>
<text x="686" y="470" fill="#C5F82A" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="706" y="466" fill="#E8E8E2" font-size="12.5" font-weight="600">The architect decides every</text>
<text x="706" y="481" fill="#E8E8E2" font-size="12.5" font-weight="600">pair</text>
<text x="676" y="510" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel validate</text>
<text x="676" y="544" fill="#C5F82A" font-size="10.5">exit 0, no diagnostics</text>
<path d="M 800.0 570 C 800.0 582.0, 490.0 582.0, 490.0 587" fill="none" stroke="#2A2A28" stroke-width="1.4" marker-end="url(#tip)"/>
<rect x="350" y="594" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="350" y="594" width="3" height="128" rx="1.5" fill="#F4C95D"/>
<circle cx="376" cy="618" r="10" fill="none" stroke="#F4C95D" stroke-width="1.2"/>
<text x="376" y="622" fill="#F4C95D" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="396" y="618" fill="#E8E8E2" font-size="12.5" font-weight="600">The report names an oversized</text>
<text x="396" y="633" fill="#E8E8E2" font-size="12.5" font-weight="600">component</text>
<text x="366" y="662" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel report</text>
<text x="366" y="696" fill="#F4C95D" font-size="10.5">1 component larger than its own level</text>
<path d="M 490.0 722 C 490.0 734.0, 180.0 734.0, 180.0 739" fill="none" stroke="#2A2A28" stroke-width="1.4" marker-end="url(#tip)"/>
<rect x="40" y="746" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="40" y="746" width="3" height="128" rx="1.5" fill="#5EEAD4"/>
<circle cx="66" cy="770" r="10" fill="none" stroke="#5EEAD4" stroke-width="1.2"/>
<text x="66" y="774" fill="#5EEAD4" font-size="11" font-weight="700" text-anchor="middle">5</text>
<text x="86" y="770" fill="#E8E8E2" font-size="12.5" font-weight="600">The agent drafts the inside</text>
<text x="56" y="814" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel init --source shop/store</text>
<text x="56" y="827" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">--namespace shop.store</text>
<text x="56" y="848" fill="#5EEAD4" font-size="10.5">4 sub-components, 12 open decisions</text>
<path d="M 180.0 874 C 180.0 886.0, 490.0 886.0, 490.0 891" fill="none" stroke="#2A2A28" stroke-width="1.4" marker-end="url(#tip)"/>
<rect x="350" y="898" width="280" height="128" rx="10" fill="#141414" stroke="#2A2A28"/>
<rect x="350" y="898" width="3" height="128" rx="1.5" fill="#FF6B6B"/>
<circle cx="376" cy="922" r="10" fill="none" stroke="#FF6B6B" stroke-width="1.2"/>
<text x="376" y="926" fill="#FF6B6B" font-size="11" font-weight="700" text-anchor="middle">6</text>
<text x="396" y="922" fill="#E8E8E2" font-size="12.5" font-weight="600">An agent crosses a closed</text>
<text x="396" y="937" fill="#E8E8E2" font-size="12.5" font-weight="600">boundary</text>
<text x="366" y="966" fill="#8A8A84" font-size="9.8" font-family="ui-monospace, Menlo, monospace">$ archkeel report</text>
<text x="366" y="1000" fill="#FF6B6B" font-size="10.5">FAIL, 3 violations:</text>
<text x="366" y="1013" fill="#FF6B6B" font-size="10.5">store:STORE-REQUIRES-COMPLETE</text>
<text x="40" y="1078" fill="#8A8A84" font-size="11.5">The agent never decides a boundary, and the gate never guesses one.</text>
</svg>
