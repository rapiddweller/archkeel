name: Verify final typed TypeScript intent
on:
  push:
    branches: [verify/542-typescript-final-against]
permissions:
  contents: read
jobs:
  exact-final-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b82eb4419209ad9df2220c4a248938e70737e2c1
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify exact committed source and baseline amendment
        run: uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against a82fe0ee484e0b84f28159eed5b8cf5272767ea9 --amendment docs/architecture/decisions/issue-542-typescript-control-amendment.json
