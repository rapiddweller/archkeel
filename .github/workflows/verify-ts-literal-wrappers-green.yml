name: Focused native TypeScript literal-wrapper GREEN
on:
  push:
    branches: [verify/542-typescript-literal-wrappers-green]
permissions:
  contents: read
jobs:
  focused-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b9f2c7cf8f3653edf68b77ac9f6293bfcbf65728
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual native wrapper and immutable Target guard controls
        run: uv run --locked python -m pytest -q tests/test_typescript_string_constructs.py tests/test_typescript_syntax_compatibility.py tests/test_typescript_syntax_types.py tests/test_typescript_control_target.py
      - name: Formatter diff on the two changed Python sources
        run: uv run --locked ruff format --diff src/archkeel/analyzer/typescript/parse.py tests/test_typescript_string_constructs.py
