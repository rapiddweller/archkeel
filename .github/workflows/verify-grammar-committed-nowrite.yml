name: Replay committed rule grammar without writes
on:
  push:
    branches: [verify/542-grammar-committed-nowrite]
permissions:
  contents: read
jobs:
  no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a9fb1879aea33aa747fc4ce7d43965729f8879d3
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Validate committed normal ratchet and bound intent without write flags
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against e5215b1403d98522003220b4c240aae9b011575f --amendment docs/architecture/decisions/2026-10-16-contract-rule-grammar-amendment.json > "$RUNNER_TEMP/owner-nowrite.json"
          task_status=$?
          python - <<'PY'
          import json,os,pathlib
          data=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"owner-nowrite.json").read_text())
          print(json.dumps({k:data.get(k) for k in ("exit_code","failures","diagnostics","measurements","widenings","amendment_status")},separators=(",",":")))
          PY
          git diff --exit-code
          exit "$task_status"
