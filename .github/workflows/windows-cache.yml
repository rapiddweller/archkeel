name: Windows cache

# AD-1390: the Windows type check of a pull request restores this cache and never saves it.

on:
  push:
    branches: [main]
    paths:
      - "native/Cargo.lock"
      - "native/rust-toolchain.toml"
      - ".github/workflows/windows-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cache
  cancel-in-progress: false

jobs:
  save:
    name: Save the Windows check cache
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # This step restores the entry if it exists and saves it at the end of the job if it does not.
      - name: Restore or save the Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-windows-check-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}

      - name: Check Windows native tests
        working-directory: native
        run: cargo check --locked --tests
