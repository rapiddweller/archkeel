name: Boundary reason owned-port native RED
on:
  push:
    branches: [verify/542-boundary-reasons-red]
permissions:
  contents: read
jobs:
  native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual private ports and existing wire controls
        run: uv run --locked python -m pytest -q tests/test_boundary_reason_types.py -k 'not native_real_port_widening' --tb=short
      - name: Exact unchanged production proof
        if: ${{ always() }}
        run: |
          git diff --exit-code f264c77eb55b1761a37a8083e479c3f1bc45f5cc -- src
          uv run --locked ruff format tests/test_boundary_reason_types.py
          uv run --locked ruff check --fix tests/test_boundary_reason_types.py
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          print("HOSTED_FORMATTED_TEST=" + json.dumps(Path("tests/test_boundary_reason_types.py").read_text()))
          PY
      - name: Genuine independent field and return RED evidence
        if: ${{ always() }}
        run: |
          uv run --locked python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          sys.path.insert(0, "tests")
          from test_boundary_reason_types import _repository, _model, _comparison
          from archkeel.ir.trace import trace_valid_violations
          with TemporaryDirectory() as temporary:
              root, config = _repository(Path(temporary))
              observed = _model(root, config)
              comparison = _comparison(observed)
              rows = [dict(subject=row.subject_id, aspect=row.aspect, status=row.status, evidence=list(row.evidence_ids)) for row in comparison.assessments if row.subject_id in {"BOUNDARY-POSITION-REASON", "BOUNDARY-REASON-CLASSIFIER"}]
              print("GENUINE_NATIVE_REASON_PORT_RED=" + json.dumps(rows, sort_keys=True))
              assert sum(row["status"] == "FAIL" for row in rows) >= 2
              print("GENUINE_TRACE_VALID_VIOLATIONS", [row.id for row in trace_valid_violations(observed)])
          PY
