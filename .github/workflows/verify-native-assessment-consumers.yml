name: Verify native assessment consumer corrections
on:
  push:
    branches: [verify/542-native-assessment-consumers]
permissions:
  contents: read
jobs:
  causal-and-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cf963ecb214d1c37bc67f549fe9c22dd35acd335
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual unchanged predecessor failure control
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          old=Path("/tmp/archkeel-assessment-causal-f638")
          subprocess.run(["git","worktree","add","--detach",str(old),"f63840b5c912ae40eff42fa7b12fd41240566d46"],check=True)
          cases=["tests/test_architecture_projection.py::test_native_core_through_enforcement_uses_the_shared_predicate","tests/test_module_object_grants.py::test_unknown_names_are_not_converted_to_a_module_object_permission"]
          result=subprocess.run(["uv","run","--locked","python","-m","pytest","-q",*cases],cwd=old,capture_output=True,text=True)
          print(result.stdout[-18000:],flush=True)
          print(result.stderr[-2000:],flush=True)
          assert result.returncode==1,result.returncode
          assert "2 failed" in result.stdout,result.stdout[-1000:]
          assert "ImportError" in result.stdout and "_requires_covers" in result.stdout
          assert "undecided" in result.stdout and "AssessmentStatus.UNKNOWN" in result.stdout
          print("ACTUAL_F638_CAUSAL_TWO_FAILURES=PASS",flush=True)
          
          PY
      - run: uv run --locked python -m pytest -q tests/test_architecture_projection.py tests/test_module_object_grants.py tests/test_requires_component_references.py tests/test_requires_target_references.py
      - run: uv run --locked ruff check tests/test_architecture_projection.py tests/test_module_object_grants.py
      - run: uv run --locked ruff format --check tests/test_architecture_projection.py tests/test_module_object_grants.py
      - run: git diff --exit-code
