name: Verify source symbol local selection and final quality
on:
  push:
    branches: ['verify/542-source-symbol-local-green']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a3696da9a0c71825d1df2df47c1cce990c28c1af
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.11.12'
          version: '0.12.13'
      - run: uv sync --locked
      - run: make lint typecheck architecture-graph-schema
      - run: uv run --locked pytest -q tests/test_source_symbol_consumers.py tests/test_source_symbol_kind_types.py tests/test_repository_hygiene.py tests/test_boundary_types_aliases.py tests/test_boundary_types_reexport_proofs.py tests/test_boundary_types_facades.py tests/test_public_api.py
      - run: git diff --exit-code
