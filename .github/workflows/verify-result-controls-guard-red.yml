name: Result control native guard RED
on:
  push:
    branches: [verify/542-result-controls-guard-red]
permissions:
  contents: read
jobs:
  actual-native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 78cdf9721bd0965a83fe308fa3cf64b3c31e9200
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Observe missing real-owner contract guards without changing production
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(["uv","run","--locked","python","-m","pytest","-q","tests/test_core_command_result.py","-k","native_actual_result_control"],capture_output=True,text=True)
          print(result.stdout)
          print(result.stderr)
          assert result.returncode == 1
          assert "6 failed" in result.stdout and "ERROR" not in result.stdout
          PY
