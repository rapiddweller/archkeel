name: Verify Python binding constructor compatibility
on:
  push:
    branches: [verify/542-python-binding-compatibility]
permissions:
  contents: read
jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Export canonical formatting patch
        run: |
          uv run --locked ruff format src/archkeel/analyzer/python/binding_types.py src/archkeel/analyzer/python/scopes.py tests/test_typed_python_bindings.py
          uv run --locked ruff check --fix src/archkeel/analyzer/python/binding_types.py src/archkeel/analyzer/python/scopes.py tests/test_typed_python_bindings.py
          uv run --locked ruff format src/archkeel/analyzer/python/binding_types.py src/archkeel/analyzer/python/scopes.py tests/test_typed_python_bindings.py
          python - <<'PY'
          import base64
          import subprocess
          print("FORMAT_PATCH=" + base64.b64encode(subprocess.check_output(["git", "diff", "--", "src", "tests"])).decode())
          PY
      - name: Binding compatibility and native source regressions
        run: >-
          uv run --locked python -m pytest -n2 --dist=loadfile -q
          tests/test_typed_python_bindings.py tests/test_boundary_types_aliases.py
          tests/test_binding_proof_reuse.py tests/test_binding_claim_completeness.py
          tests/test_python_scope_certification.py tests/test_boundary_type_ambiguous_bindings.py
          tests/test_source_namespace_acceptance.py tests/test_source_trust_boundary.py
          tests/test_source_types.py tests/test_repository_hygiene.py
      - run: uv run --locked ruff check src tests
      - run: uv run --locked mypy src
      - name: Native actual-base comparison and normal amendment
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 7b2a14de58eb18be716c8eadef5c43928ec464a5 --amendment docs/architecture/decisions/issue-542-python-bindings-amendment.json --write-amendment --decided-by ake2l --rationale "Give Source binding controls one nominal owner, retain conservative compiler scope evidence and strengthen authored binding field types without additional allowances." > "$RUNNER_TEMP/555-bindings-native.json"
          native_exit=$?
          uv run --locked python - "$RUNNER_TEMP/555-bindings-native.json" "$native_exit" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          print("NATIVE_RESULT=" + json.dumps({"exit_code": int(sys.argv[2]), "diagnostics": result.get("diagnostics"), "failures": result.get("failures"), "measurements": result.get("measurements")}))
          path = Path("docs/architecture/decisions/issue-542-python-bindings-amendment.json")
          print("AMENDMENT_BASE64=" + base64.b64encode(path.read_bytes()).decode())
          if int(sys.argv[2]) == 0:
              scalars = result["measurements"]["scalars"]
              assert scalars["calls_unresolved"] == 918
              assert scalars["unknown_positions"] == 58
              assert scalars["typing_positions"] == 52
              assert scalars["violations"] == 0
          PY
          exit "$native_exit"
      - name: Replay normal amendment without writes
        run: |
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 7b2a14de58eb18be716c8eadef5c43928ec464a5 --amendment docs/architecture/decisions/issue-542-python-bindings-amendment.json > "$RUNNER_TEMP/555-bindings-replay.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "555-bindings-replay.json").read_bytes())
          print("NO_WRITE_REPLAY=" + json.dumps({"diagnostics": result.get("diagnostics"), "failures": result.get("failures"), "measurements": result.get("measurements")}))
          PY
