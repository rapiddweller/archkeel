name: Verify exact committed typed API amendments
on:
  push:
    branches: [verify/542-final-feature-and-cli]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 336843016ef644cccdb5158289b584b78c34f255
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Verify actual API and committed no-write amendment
        run: |
          uv run --locked python -m pytest -q tests/test_contract_version_types.py
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 6c0083535d34ba84c8bd648474e87b7142ab0653 --amendment docs/architecture/decisions/2026-10-16-contract-version-types.json > "$RUNNER_TEMP/version-final.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "version-final.json").read_text())
          assert data["exit_code"] == 0 and data["amendment_status"] == "valid", data
          assert not data["diagnostics"] and not data["failures"], data
          print("FINAL_VERSION=" + json.dumps({key: data.get(key) for key in ("exit_code", "amendment_status", "measurements", "diagnostics", "failures")}, separators=(",", ":")))
          PY
          git diff --exit-code -- architecture-baseline.json docs/architecture/decisions/2026-10-16-contract-version-types.json
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 58e89aae1bf63e3faab01dd9fd386e44a296e8d6
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Verify actual API and committed no-write amendment
        run: |
          uv run --locked python -m pytest -q tests/test_cli_typed_inputs.py tests/test_cli_input_target.py tests/test_local_string_comparisons.py
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 7f99d03afaaea57530c56d688ce84e4b0867152e --amendment docs/architecture/decisions/issue-542-cli-inputs-amendment.json > "$RUNNER_TEMP/cli-final.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cli-final.json").read_text())
          assert data["exit_code"] == 0 and data["amendment_status"] == "valid", data
          assert not data["diagnostics"] and not data["failures"], data
          print("FINAL_CLI=" + json.dumps({key: data.get(key) for key in ("exit_code", "amendment_status", "measurements", "diagnostics", "failures")}, separators=(",", ":")))
          PY
          git diff --exit-code -- architecture-baseline.json docs/architecture/decisions/issue-542-cli-inputs-amendment.json
