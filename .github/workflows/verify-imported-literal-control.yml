name: Imported literal control proof
on:
  push:
    branches: ["verify/542-imported-literal-control"]
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b88b9ccb77ac95c174da0dd9d326fbabeeb5802
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Affected native detector and target regressions
        run: uv run --locked pytest -q tests/test_string_comparison_observation.py tests/test_string_predicate_observation.py tests/test_python_string_predicate_target.py tests/test_analyzer.py
      - name: Actual frozen HostEvent mutation
        if: always()
        run: |
          uv run --locked python - <<'PY'
          import json, subprocess, tempfile
          from hashlib import sha256
          from pathlib import Path
          from archkeel.cli.observe import observe
          from archkeel.ir.trace import trace_valid_violations
          source = "f051e6deee7de905984c1e648376fb88a07cc8a2"
          files = {}
          for name in ("ir/host_records.py", "check/ordering.py"):
              blob = subprocess.check_output(["git", "show", f"{source}:src/archkeel/{name}"])
              print("IMMUTABLE_HOST_BLOB", source, name, sha256(blob).hexdigest())
              files[name] = blob.decode()
          original = "if event is HostEvent.EXPECTATION_PUBLISHED:"
          assert files["check/ordering.py"].count(original) == 1
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              (root / "pyproject.toml").write_text('[project]\nrequires-python = ">=3.11"\n')
              components = [{"id": "COMP-"+name.upper(), "label": name, "role": "component",
                  "packages": ["archkeel."+name], "responsibilities": [], "forbidden_responsibilities": [],
                  "provenance": ["docs/probe.md"]} for name in ("ir", "check")]
              contract = {"schema_version": "2.1.0", "components": components, "rules": [{
                  "id": "HOST-IMPORTED-VALUE", "kind": "forbidden_construct",
                  "source": "archkeel.check.ordering", "constructs": ["string_literal_compare"],
                  "rationale": "Observe actual host ordering dispatch.", "decided_by": "agent",
                  "provenance": ["docs/probe.md"]}]}
              (root / "contract.json").write_text(json.dumps(contract))
              for name, text in files.items():
                  path = root / "archkeel" / name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text)
              for mutation in (False, True):
                  text = files["check/ordering.py"]
                  if mutation:
                      text = text.replace(original, "if record.event == HostEvent.EXPECTATION_PUBLISHED.value:")
                  (root / "archkeel/check/ordering.py").write_text(text)
                  result = observe(root, roots=(".",), namespace="archkeel", contract="contract.json",
                      git_head="a"*40, dirty=False, contract_root=root)
                  assert result.diagnostics == () and result.observation is not None, result.diagnostics
                  violations = trace_valid_violations(result.observation)
                  print("ACTUAL_HOST_MUTATION", mutation, [(r.kind, r.rule_ids, r.subjects) for r in violations])
                  if mutation:
                      assert [(r.kind, r.rule_ids, r.subjects) for r in violations] == [
                          ("forbidden_construct", ("HOST-IMPORTED-VALUE",), ("archkeel.check.ordering.check_order",))]
                  else:
                      assert violations == ()
          
          PY
      - name: Strict affected source
        if: always()
        run: uv run --locked mypy --strict src/archkeel/analyzer/python/constructs.py src/archkeel/analyzer/python/collect.py
      - name: Ruff affected source and tests
        if: always()
        run: uv run --locked ruff check src/archkeel/analyzer/python/constructs.py src/archkeel/analyzer/python/collect.py tests/test_string_comparison_observation.py tests/test_python_string_predicate_target.py
      - name: Show formatter output for review
        if: always()
        run: |
          uv run --locked ruff format --check --diff src/archkeel/analyzer/python/constructs.py src/archkeel/analyzer/python/collect.py tests/test_string_comparison_observation.py tests/test_python_string_predicate_target.py
      - name: Exact source cleanliness
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "5b88b9ccb77ac95c174da0dd9d326fbabeeb5802"
          test -z "$(git status --porcelain)"
  ordinary-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b88b9ccb77ac95c174da0dd9d326fbabeeb5802
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Ordinary baseline and amendment writers followed by no-write validation
        run: |
          uv run --locked python - <<'PY'
          import json, subprocess
          from pathlib import Path
          common = ["uv","run","--locked","archkeel","validate","--root",".","--baseline","architecture-baseline.json"]
          against = ["--against","5937445491094abc00a4076dd4628a03f08e9064","--amendment","docs/architecture/decisions/issue-542-imported-literals-amendment.json"]
          commands = [
              ("BASELINE", common + ["--write-baseline","--json"]),
              ("AMENDMENT", common + against + ["--write-amendment","--decided-by","ake2l","--rationale","Observe scanned imported literal control values through canonical import origins.","--json"]),
              ("NO_WRITE", common + against + ["--json"]),
          ]
          for label, command in commands:
              result = subprocess.run(command,capture_output=True,text=True)
              if result.stderr:
                  print(result.stderr,flush=True)
              value = json.loads(result.stdout)
              print("IMPORTED_"+label+"="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status","widenings")},separators=(",",":")),flush=True)
              assert result.returncode == 0 and value["exit_code"] == 0
              assert not value["failures"] and not value["diagnostics"] and not value["widenings"]
              scalars = value["measurements"]["scalars"]
              assert scalars["typing_positions"] == 52 and scalars["unknown_positions"] == 58 and scalars["violations"] == 0
              if label == "NO_WRITE":
                  assert value["amendment_status"] == "valid"
          for path in ("architecture-baseline.json","docs/architecture/decisions/issue-542-imported-literals-amendment.json"):
              print("GENERATED_FILE="+json.dumps({"path":path,"content":Path(path).read_text()},separators=(",",":")),flush=True)
          print("METADATA_DIFF="+subprocess.check_output(["git","status","--porcelain"],text=True),flush=True)
          PY
