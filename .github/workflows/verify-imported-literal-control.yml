name: Imported literal control proof
on:
  push:
    branches: ["verify/542-imported-literal-control"]
permissions:
  contents: read
jobs:
  actual-call-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 95e62022c8f0a023798d83dc8212bbfca2a25293
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Read actual ordinary delta without any writer or budget edit
        run: |
          uv run --locked python - <<'PY'
          import json, subprocess
          command = ["uv","run","--locked","archkeel","validate","--root",".","--baseline","architecture-baseline.json","--against","5937445491094abc00a4076dd4628a03f08e9064","--json"]
          result = subprocess.run(command,capture_output=True,text=True)
          value = json.loads(result.stdout)
          print("ACTUAL_DELTA_KEYS="+json.dumps(list(value)),flush=True)
          print("ACTUAL_DELTA="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","widenings","delta","budget_changes","unresolved_call_changes","unresolved_call_note","filtered_calls")},separators=(",",":")),flush=True)
          print(result.stderr,flush=True)
          assert subprocess.check_output(["git","status","--porcelain"],text=True) == ""
          PY
