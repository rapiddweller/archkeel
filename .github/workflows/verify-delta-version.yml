name: Verify Delta version boundaries
on:
  push:
    branches: [fix/issue-542-delta-version-controls]
permissions:
  contents: read
jobs:
  delta-version-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_delta_version_types.py --tb=short
  delta-version-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: |
          uv run --locked ruff check --select I --fix tests/test_delta_version_types.py src/archkeel/ir/model.py src/archkeel/ir/codec_delta.py src/archkeel/check/delta.py src/archkeel/check/expectation.py
          uv run --locked ruff format tests/test_delta_version_types.py src/archkeel/ir/model.py src/archkeel/ir/codec_delta.py src/archkeel/check/delta.py src/archkeel/check/expectation.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","src","tests/test_delta_version_types.py"])).decode())
          PY
          uv run --locked ruff check tests/test_delta_version_types.py src/archkeel/ir/model.py src/archkeel/ir/codec_delta.py src/archkeel/check/delta.py src/archkeel/check/expectation.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  delta-version-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_delta.py tests/test_delta_parity.py tests/test_runtime_delta.py tests/test_profile_comparison.py tests/test_profile_comparison_commits.py tests/test_nullable_profile_measurements.py tests/test_snapshot_check.py tests/test_initial_pr_check.py tests/test_configured_collector_check.py tests/test_check_diagnostics.py tests/test_expectation.py --tb=short
