name: Prove explicit UML edge spacing API RED
on:
  push:
    branches: [verify/542-own-uml-spacing-red]
permissions:
  contents: read
jobs:
  expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - run: make browser-install
      - name: Existing global spacing cannot preserve the caller-owned default
        run: |
          set +e
          uv run --locked --with playwright==1.62.0 python -m pytest -q tests/test_report_renderer_units.py::test_uml_layout_request_has_an_explicit_edge_clearance_without_changing_input
          red_status=$?
          test "$red_status" -eq 1
