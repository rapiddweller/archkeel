name: Dart input grammar native GREEN
on:
  push:
    branches: [verify/542-dart-input-grammar-green]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Format actual candidate and publish exact changes
        run: |
          uv run --locked ruff format src/archkeel/analyzer/dart tests/test_dart_input_grammar.py tests/test_dart_typed_controls.py
          uv run --locked python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          paths = subprocess.run(["git", "diff", "--name-only"], check=True, capture_output=True, text=True).stdout.splitlines()
          for path in paths:
              print("DART_FORMATTED_FILE=" + json.dumps(dict(path=path, content=Path(path).read_text())), flush=True)
          PY
      - name: Ruff
        if: ${{ always() }}
        run: uv run --locked ruff check src/archkeel tests/test_dart_input_grammar.py tests/test_dart_typed_controls.py
      - name: Strict mypy
        if: ${{ always() }}
        run: uv run --locked mypy src/archkeel
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Real Dart behavior, public API, unchanged intent and source mutation controls
        run: uv run --locked python -m pytest -n 2 --dist=loadfile --max-worker-restart=0 -q tests/test_dart*.py --tb=short --junitxml="$RUNNER_TEMP/dart-input-green.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: dart-input-grammar-native-junit
          path: ${{ runner.temp }}/dart-input-green.xml
