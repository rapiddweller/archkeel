name: TS construct explicit API native gate
on:
  push:
    branches: [verify/542-typescript-construct-api-native]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py tests/test_typescript_control_target.py -k 'not native_source_type_widening and not native_parser_and_protocol_strings and not native_syntax_field_widening and not native_typescript_api and not native_configuration_crossing and not native_parser_and_collector_guards and not own_observation' --tb=short
      - name: Ruff and format
        if: ${{ always() }}
        run: |
          uv run --locked ruff check src/archkeel tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py tests/test_typescript_control_target.py
          uv run --locked ruff format --diff src/archkeel/analyzer/typescript/parse.py src/archkeel/ir/codec_observation.py tests/test_typescript_control_target.py
      - name: Strict mypy
        if: ${{ always() }}
        run: uv run --locked mypy src/archkeel
  exact-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual before and after sites and semantic UNKNOWN records
        run: |
          uv run --locked python - <<'PY'
          import json
          from collections import Counter
          from dataclasses import asdict
          from pathlib import Path
          from archkeel.cli.config import parse_config
          from archkeel.cli.observe import observer_for
          from archkeel.check.run import observe_revision, inspect_observation
          from archkeel.check.ratchets import unresolved_call_changes
          from archkeel.ir.facts_codec import raw_record
          root = Path.cwd()
          config = parse_config((root / "archkeel.toml").read_bytes())
          analyzer = observer_for(config.language)
          models = []
          semantics = []
          for revision in ("fa37f59600cfae64ba0528cb56e609c6bbd756e4", "a0ea98d96251cced749e31e6f79538137e952c3e"):
              result = observe_revision(analyzer, root, revision, config, declared_at=revision)
              assert result.observation is not None, result.diagnostics
              model = result.observation
              measured, verdict = inspect_observation(model)
              print("MEASURED", revision, measured, verdict, flush=True)
              assert measured.scalars.calls_unresolved <= 913
              assert measured.scalars.violations == 0
              assert measured.scalars.typing_positions == 52
              assert measured.scalars.unknown_positions == 58
              selected = []
              for row in model.records("unknowns"):
                  if row.kind not in {"boundary_type_position", "boundary_type_route", "uml_conformance"}:
                      continue
                  if row.kind == "boundary_type_position" and row.data.get("reason") == "external_type":
                      continue
                  value = raw_record(row)
                  selected.append({key: value[key] for key in ("kind", "subjects", "rule_ids", "data")})
              selected.sort(key=lambda row: json.dumps(row, sort_keys=True))
              print("SEMANTIC_KINDS", revision, dict(Counter(row["kind"] for row in selected)), flush=True)
              semantics.append(selected)
              models.append(model)
          assert semantics[0] == semantics[1], {"before_only": [row for row in semantics[0] if row not in semantics[1]], "after_only": [row for row in semantics[1] if row not in semantics[0]]}
          print("EXACT_SEMANTIC_UNKNOWN_UNCHANGED", len(semantics[0]), flush=True)
          changes = unresolved_call_changes(*models)
          for change in changes:
              print("CALL_DELTA=" + json.dumps(asdict(change)), flush=True)
          PY
