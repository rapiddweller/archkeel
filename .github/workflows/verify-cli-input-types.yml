name: Diagnose CLI native call changes
on:
  push:
    branches: [verify/542-cli-final-wire]
permissions:
  contents: read
jobs:
  cli-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Inspect exact-parent native call evidence
        env:
          CLI_BASE: 1852a1b49a740861c7b5229a79011e6457aedc67
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against "$CLI_BASE" > "$RUNNER_TEMP/cli-against.json"
          cli_status=$?
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cli-against.json").read_text())
          print("CLI_EXACT_NATIVE=" + json.dumps({k: result.get(k) for k in ("exit_code", "diagnostics", "failures", "measurements", "unresolved_call_changes", "unresolved_call_note")}))
          PY
          exit "$cli_status"
