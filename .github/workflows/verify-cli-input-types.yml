name: Verify CLI ingress simplification

on:
  push:
    branches: [verify/542-cli-final-wire]

permissions:
  contents: read

jobs:
  cli-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Format and export exact changes
        run: |
          uv run --locked ruff check --fix --select I src/archkeel/cli tests/test_cli_typed_inputs.py tests/test_cli_input_target.py
          uv run --locked ruff format src tests
          python - <<'PY'
          import base64, subprocess
          patch = subprocess.run(["git", "diff", "--", "src", "tests"], capture_output=True, check=True).stdout
          print("FORMAT_PATCH=" + base64.b64encode(patch).decode())
          PY
      - name: CLI and installer compatibility
        run: uv run --locked python -m pytest -q tests/test_cli_typed_inputs.py tests/test_cli.py tests/test_skill.py tests/test_config.py
      - name: Lint and types
        run: make lint typecheck
      - name: Repository hygiene
        run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py

      - name: Compare every command help text with the original parser
        env:
          NO_COLOR: "1"
          COLUMNS: "100"
        run: |
          uv run --locked python - <<'PY'
          import argparse, subprocess
          from archkeel.cli import build_parser
          source = subprocess.run(["git", "show", "1852a1b49a740861c7b5229a79011e6457aedc67:src/archkeel/cli/__init__.py"], capture_output=True, check=True, text=True).stdout
          context = {"__name__": "archkeel.cli._legacy_help", "__package__": "archkeel.cli"}
          exec(compile(source, "<original-cli>", "exec"), context)
          before, after = context["build_parser"](), build_parser()
          assert before.format_help() == after.format_help()
          old = next(a for a in before._actions if isinstance(a, argparse._SubParsersAction))
          new = next(a for a in after._actions if isinstance(a, argparse._SubParsersAction))
          for command in old.choices:
              assert old.choices[command].format_help() == new.choices[command].format_help(), command
          print("ALL_COMMAND_HELP_BYTES_UNCHANGED")
          PY
      - name: Native own baseline
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/cli-own-baseline.json"
          native_status=$?
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cli-own-baseline.json").read_text())
          print("CLI_NATIVE_RESULT=" + json.dumps({k: result.get(k) for k in ("exit_code", "observation_complete", "declared_rules", "diagnostics", "failures", "measurements")}, ensure_ascii=True))
          PY
          exit "$native_status"
      - name: Generate and verify exact-parent normal amendment
        if: ${{ !cancelled() }}
        env:
          CLI_BASE: 1852a1b49a740861c7b5229a79011e6457aedc67
        run: |
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against "$CLI_BASE" --amendment docs/architecture/decisions/issue-542-cli-inputs-amendment.json --write-amendment --decided-by ake2l --rationale "Give CLI argument and installer protocols nominal owners, pin the bounded input API and forbid literal control dispatch without extra allowances." > "$RUNNER_TEMP/cli-amendment-write.json"
          cat docs/architecture/decisions/issue-542-cli-inputs-amendment.json
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against "$CLI_BASE" --amendment docs/architecture/decisions/issue-542-cli-inputs-amendment.json > "$RUNNER_TEMP/cli-amendment-verify.json"
          cat "$RUNNER_TEMP/cli-amendment-verify.json"
