name: Dart input owner actual evidence
on:
  push:
    branches: [verify/542-dart-input-grammar-evidence]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_dart_input_grammar.py tests/test_dart_typed_controls.py -k 'not own_dart_module_guards' --tb=short
      - name: Exact source quality
        if: ${{ always() }}
        run: |
          uv run --locked ruff check src/archkeel tests/test_dart_input_grammar.py tests/test_dart_typed_controls.py
          uv run --locked ruff format --check src/archkeel/analyzer/dart tests/test_dart_input_grammar.py tests/test_dart_typed_controls.py
          uv run --locked mypy src/archkeel
  native-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Two real source revisions under the same frozen predicate observer
        run: |
          uv run --locked python - <<'PY'
          import gzip
          import json
          import os
          from collections import Counter
          from pathlib import Path
          from archkeel.cli.config import parse_config
          from archkeel.cli.observe import observer_for
          from archkeel.check.run import observe_revision, inspect_observation
          from archkeel.ir.codec import observation_payload
          from archkeel.ir.decisions import rule_assessments
          from archkeel.ir.facts_codec import raw_record
          from archkeel.ir.trace import trace_valid_violations
          root = Path.cwd()
          config = parse_config((root / "archkeel.toml").read_bytes())
          observer = observer_for(config.language)
          folder = Path(os.environ["RUNNER_TEMP"]) / "dart-input-native-evidence"
          folder.mkdir()
          observations = []
          measurements = []
          unknowns = []
          for label, revision in (("before", "0e3b8a7f62b9b13417cda78e11b52d0de82986cd"), ("after", "47633d6cbb50aebc21cd7f90cc0830076930e039")):
              result = observe_revision(observer, root, revision, config, declared_at=revision)
              assert result.observation is not None, result.diagnostics
              model = result.observation
              measured, verdict = inspect_observation(model)
              measurements.append(measured)
              observations.append(model)
              print("DART_ACTUAL_MEASUREMENT", label, revision, measured, verdict, flush=True)
              guards = [row for row in rule_assessments(model, undecided_by_rule={}) if "DART-" in row.id and row.id.endswith("-TYPED-CONTROL")]
              print("DART_ACTUAL_GUARDS=" + json.dumps(dict(label=label, rows=[dict(id=row.id, status=row.status, proven=row.evaluation_proven) for row in guards])), flush=True)
              if label == "after":
                  assert len(guards) == 5 and all(row.status == "PASS" and row.evaluation_proven for row in guards), guards
              selected = []
              for row in model.records("unknowns"):
                  if row.kind not in {"boundary_type_position", "boundary_type_route", "uml_conformance"} or (row.kind == "boundary_type_position" and row.data.get("reason") == "external_type"):
                      continue
                  raw = raw_record(row)
                  selected.append({key: raw[key] for key in ("kind", "subjects", "rule_ids", "data")})
              selected.sort(key=lambda row: json.dumps(row, sort_keys=True))
              unknowns.append(selected)
              print("DART_ACTUAL_UNKNOWN_KINDS", label, dict(Counter(row["kind"] for row in selected)), flush=True)
              (folder / f"{label}.json.gz").write_bytes(gzip.compress(json.dumps(observation_payload(model), sort_keys=True).encode(), mtime=0))
          assert measurements[1].scalars.calls_unresolved <= measurements[0].scalars.calls_unresolved
          assert measurements[1].scalars.typing_positions <= measurements[0].scalars.typing_positions
          assert measurements[1].scalars.unknown_positions <= measurements[0].scalars.unknown_positions
          assert unknowns[0] == unknowns[1]
          print("DART_EXACT_UNKNOWN_SEMANTICS_UNCHANGED", len(unknowns[0]), flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: dart-input-owner-native-evidence
          path: ${{ runner.temp }}/dart-input-native-evidence
  compass-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual prior parser/resolver/producer and complete canonical wire comparison
        run: |
          uv run --locked python - <<'PY'
          import importlib
          import json
          import statistics
          import subprocess
          import sys
          import time
          from dataclasses import asdict
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from archkeel.analyzer.dart.collect import collect
          from archkeel.analyzer.dart.parse import parse
          from archkeel.cli.config import parse_config
          from archkeel.ir.facts_codec import encode_response
          from archkeel.ir.protocol import CollectionRequest, CollectionResponse, DartSettings, SnapshotInput, SourceScope
          repository = Path.cwd()
          base = "0e3b8a7f62b9b13417cda78e11b52d0de82986cd"
          with TemporaryDirectory(prefix="prior-dart-input-") as temporary:
              package_root = Path(temporary) / "prior_dart"
              package_root.mkdir()
              for name in ("__init__", "collect", "parse", "resolve", "snapshot", "syntax"):
                  payload = subprocess.run(["git", "show", f"{base}:src/archkeel/analyzer/dart/{name}.py"], check=True, capture_output=True).stdout
                  (package_root / f"{name}.py").write_bytes(payload)
              sys.path.insert(0, temporary)
              prior_collect = importlib.import_module("prior_dart.collect").collect
              prior_parse = importlib.import_module("prior_dart.parse").parse
              for fixture in ("H-uml-dart", "J-compass"):
                  root = repository / "fixtures" / fixture
                  config = parse_config((root / "archkeel.toml").read_bytes())
                  request = CollectionRequest(SnapshotInput(str(root), "a" * 40, False), SourceScope(config.roots, config.namespace), DartSettings())
                  before = encode_response(CollectionResponse(prior_collect(request)))
                  after = encode_response(CollectionResponse(collect(request)))
                  print("DART_COMMON_RUNTIME_WIRE", fixture, len(before), len(after), before == after, flush=True)
                  assert before == after, fixture
                  sources = [(path.relative_to(root).as_posix(), path.read_bytes()) for path in sorted(root.rglob("*.dart"))]
                  changes = []
                  for path, data in sources:
                      old, new = asdict(prior_parse(data)), asdict(parse(data))
                      if old != new:
                          changes.append(dict(path=path, before=old, after=new))
                  print("DART_COMPLETE_SYNTAX", fixture, "files", len(sources), "changes", json.dumps(changes, sort_keys=True), flush=True)
                  assert not changes, fixture
                  functions = dict(before=prior_collect, after=collect)
                  samples = {key: [] for key in functions}
                  for repeat in range(3):
                      for label in (("before", "after") if repeat % 2 == 0 else ("after", "before")):
                          started = time.perf_counter()
                          functions[label](request)
                          samples[label].append(time.perf_counter() - started)
                  medians = {key: statistics.median(value) for key, value in samples.items()}
                  print("DART_COLLECTION_COST=" + json.dumps(dict(fixture=fixture, samples=3, medians=medians, delta_percent=(medians["after"]/medians["before"]-1)*100)), flush=True)
          PY
