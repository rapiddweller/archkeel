name: Read-only typed union actual call delta
on:
  push:
    branches: [verify/542-union-shape-call-delta]
permissions:
  contents: read
jobs:
  actual-typed-union-call-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e92cf8d8d0205da0f126fea90ae56dd1d9c66b93
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual typed-union unresolved call changes
        run: |
          uv run --locked python - <<'PY'
          import json,subprocess
          from pathlib import Path
          protected=("architecture-contract.json","architecture-baseline.json","architecture-accepted.json")
          before={p:Path(p).read_bytes() for p in protected}
          run=subprocess.run(["uv","run","--locked","archkeel","validate","--root",".","--baseline","architecture-baseline.json","--json","--against","aa84fab9c5bb6833b9ab58bcccbbbb443dc0a114"],capture_output=True,text=True,check=False)
          value=json.loads(run.stdout)
          Path("union-shape-call-changes.json").write_text(run.stdout)
          print("UNION_SHAPE_ACTUAL_CALLS="+json.dumps({"base":"aa84fab9c5bb6833b9ab58bcccbbbb443dc0a114","head":"e92cf8d8d0205da0f126fea90ae56dd1d9c66b93","exit":run.returncode,"failures":value.get("failures"),"diagnostics":value.get("diagnostics"),"measurements":value.get("measurements"),"unresolved_call_changes":value.get("unresolved_call_changes")},sort_keys=True),flush=True)
          assert all(Path(p).read_bytes()==original for p,original in before.items())
          assert not subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: union-shape-call-changes
          path: union-shape-call-changes.json
