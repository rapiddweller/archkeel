name: Actual visible Evidence button regression
on:
  push:
    branches: [verify/542-scene-evidence-view-fix]
permissions:
  contents: read
jobs:
  actual-visible-evidence-buttons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - run: make browser-install
      - name: Existing visible report buttons exercise real Flow and Scene
        run: uv run --locked --with playwright==1.62.0 python -m pytest -q tests/test_graph_scene_protocol.py::test_visible_evidence_views_keep_the_observed_scene
