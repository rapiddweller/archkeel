name: Native Compass Nest proof regression comparison
on:
  push:
    branches: [verify/542-native-demo-proof]
permissions:
  contents: read
jobs:
  native-demos:
    name: native-demos-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: wire-baseline
            ref: 7b2a14de58eb18be716c8eadef5c43928ec464a5
          - label: graph-version
            ref: 5933ffbbfd588ac96e36748de937cb1f6e739655
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Unchanged native full-source Compass and Nest reports
        run: |
          mkdir -p test-artifacts
          uv run --locked python -m pytest -q --tb=short --durations=5 --basetemp=test-artifacts/native-demo-proof --junitxml=test-artifacts/native-demo-proof.xml \
            tests/test_compass_project_report.py::test_compass_reports_keep_target_comparison_and_partial_coverage_distinct \
            tests/test_nest_realworld_project_report.py::test_nest_realworld_catalog_and_reports_preserve_full_target_with_partial_coverage
      - name: Keep the actual native reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-demo-proof-${{ matrix.label }}
          path: test-artifacts/native-demo-proof*
          retention-days: 3
