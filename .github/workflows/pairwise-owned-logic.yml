name: Pairwise owned logic verification
on:
  push:
    branches: [aux/issue-542-pairwise-owned-logic]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.13
          python-version: 3.11.12
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - run: make lint typecheck
      - run: uv run --locked pytest -q tests/test_repository_hygiene.py
      - name: Show actual formatter corrections if needed
        if: failure()
        run: |
          uv run --locked ruff format src/archkeel/ir/duplication.py tests/test_duplication_call_evidence.py
          git diff -- src/archkeel/ir/duplication.py tests/test_duplication_call_evidence.py
  native-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.13
          python-version: 3.11.12
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Actual scanner facts and advisory review controls
        run: uv run --locked pytest -n 2 --dist=loadfile --max-worker-restart=0 -q tests/test_duplication.py tests/test_duplication_call_evidence.py --tb=short
  native-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.13
          python-version: 3.11.12
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Compare actual type IDs and unresolved or partial call identities
        run: |
          git worktree add "$RUNNER_TEMP/pairwise-before" 5d38b66ade5ce0fa4c3ce2f2523712b7454aa987
          uv run --locked archkeel report --root "$RUNNER_TEMP/pairwise-before" --output "$RUNNER_TEMP/pairwise-before.json" --json > "$RUNNER_TEMP/pairwise-before-result.json"
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/pairwise-after.json" --json > "$RUNNER_TEMP/pairwise-after-result.json"
          uv run --locked python - <<'PY'
          import json,os,re
          from collections import Counter,defaultdict
          from dataclasses import asdict
          from pathlib import Path
          from archkeel.check.ratchets import call_rows,unknown_positions_by_rule
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.ir.facts_codec import thaw_data
          directory=Path(os.environ["RUNNER_TEMP"])
          models=[parse_observation(decode_canonical_model(json.loads((directory/name).read_text()))) for name in ("pairwise-before.json","pairwise-after.json")]
          def positions(model):
              return {row.id:{"kind":row.kind,"rule_ids":row.rule_ids,"data":thaw_data(row.data)} for row in model.records("unknowns") or () if row.kind in {"boundary_type_position","boundary_type_route"}}
          old,new=map(positions,models)
          added={key:new[key] for key in new.keys()-old.keys()}
          removed={key:old[key] for key in old.keys()-new.keys()}
          changed={key:{"before":old[key],"after":new[key]} for key in old.keys()&new.keys() if old[key]!=new[key]}
          print("PAIRWISE_TYPE_DELTA",json.dumps({"added":added,"resolved":removed,"changed_existing":changed},sort_keys=True))
          def calls(model):
              counts=Counter()
              rows=defaultdict(list)
              for row in call_rows(model):
                  caller=re.sub(r"<(genexpr|listcomp|setcomp|dictcomp):[0-9]+:[0-9]+>",r"<\1>",row.caller)
                  key=(row.status,row.path,caller,row.expression,row.reason,row.component)
                  counts[key]+=1
                  rows[key].append(asdict(row))
              assert sum(count for key,count in counts.items() if key[0]=="unresolved")==model.coverage.calls_unresolved
              assert sum(count for key,count in counts.items() if key[0]=="partially_resolved")==model.coverage.calls_partially_resolved
              return counts,rows
          (old_calls,old_rows),(new_calls,new_rows)=map(calls,models)
          call_added=[{"identity":key,"count":count,"actual_rows":new_rows[key]} for key,count in (new_calls-old_calls).items()]
          call_removed=[{"identity":key,"count":count,"actual_rows":old_rows[key]} for key,count in (old_calls-new_calls).items()]
          print("PAIRWISE_CALL_DELTA",json.dumps({"added":call_added,"removed":call_removed},sort_keys=True))
          print("PAIRWISE_SITE_COUNTS",json.dumps([{"unknown_positions":dict(unknown_positions_by_rule(model)),"unresolved":model.coverage.calls_unresolved,"partial":model.coverage.calls_partially_resolved} for model in models]))
          def shapes(model):
              return {row.data.get("qualified_name"):(row.data.get("shape"),row.data.get("shape_nodes")) for row in model.records("symbols") or () if row.data.get("shape") and row.data.get("module")!="archkeel.ir.duplication"}
          assert shapes(models[0])==shapes(models[1]),"unchanged-source structural facts changed"
          print("PAIRWISE_UNCHANGED_SHAPES",len(shapes(models[0])))
          assert not added and not changed, "new or changed unproven boundary API positions/routes"
          unresolved_added=[row for row in call_added if row["identity"][0]=="unresolved"]
          print("PAIRWISE_NEW_PARTIAL_OPERATIONS",json.dumps([row for row in call_added if row["identity"][0]=="partially_resolved"],sort_keys=True))
          assert not unresolved_added, "new unresolved call identities"
          PY
      - name: Strict actual own baseline
        if: always()
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/pairwise-own.json"
          status=$?
          set -e
          uv run --locked python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"pairwise-own.json").read_text())
          print("PAIRWISE_OWN",json.dumps({key:result[key] for key in ("exit_code","failures","diagnostics","measurements")}))
          PY
          exit "$status"
