name: Pairwise owned logic verification
on:
  push:
    branches: [aux/issue-542-pairwise-owned-logic]
permissions:
  contents: read
jobs:
  native-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.13
          python-version: 3.11.12
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Actual scanner facts and advisory review controls
        run: uv run --locked pytest -n 2 --dist=loadfile --max-worker-restart=0 -q tests/test_duplication.py tests/test_duplication_call_evidence.py --tb=short
      - name: Existing nominal resolution and wire status authorities
        if: always()
        run: git grep -n -E 'class .*Resolution|CallStatus.*TypeAlias|def _source_resolution' -- src/archkeel
