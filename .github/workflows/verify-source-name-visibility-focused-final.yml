name: Final source visibility focused proof
on:
  push:
    branches: [verify/542-source-name-visibility-focused-final]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bcd0951665735a1f00c85b3a0cb6b88887bd8683
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint typecheck
      - run: uv run --locked pytest -q tests/test_repository_hygiene.py
      - run: git diff --exit-code
  actual-ports-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bcd0951665735a1f00c85b3a0cb6b88887bd8683
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked pytest -n 2 --dist=loadfile -q tests/test_source_name_visibility.py tests/test_typed_symbol_class_kinds.py tests/test_interfaces.py tests/test_onboarding.py tests/test_dart_directives.py
