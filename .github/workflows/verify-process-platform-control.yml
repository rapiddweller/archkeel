name: Process platform control proof
on:
  push:
    branches: ["verify/542-process-platform-control"]
permissions:
  contents: read
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Use native ref storage for Windows-reserved remote ref namespaces
        run: git config --global init.defaultRefFormat reftable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 990e41b7b48031c7cd9d7306a669db83a3b798c3
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Real Windows collector and owned platform probes
        run: uv run --locked pytest -q tests/test_collection_process.py
      - name: Exact source and native ref storage
        shell: bash
        run: |
          test "$(git rev-parse --show-ref-format)" = reftable
          test "$(git rev-parse HEAD)" = "990e41b7b48031c7cd9d7306a669db83a3b798c3"
          test -z "$(git status --porcelain)"
