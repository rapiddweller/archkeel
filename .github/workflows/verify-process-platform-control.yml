name: Process platform control proof
on:
  push:
    branches: ["verify/542-process-platform-control"]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: af6a976d45b5ef93bb5e7e67eced1ef598045366
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual existing cleanup guard and original OS native RED
        run: |
          uv run --locked python - <<'PY'
          import json,tempfile,sys,hashlib
          from pathlib import Path
          sys.path.insert(0,str(Path("tests").resolve()))
          from test_collection_process import _platform_repository,_comparison_sites,_PLATFORM_GUARD,_CLEANUP_GUARD
          from archkeel.check.report import run_report
          from archkeel.cli.observe import observe
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.ir.decisions import rule_assessments
          from archkeel.ir.trace import trace_valid_violations
          with tempfile.TemporaryDirectory() as directory:
              root,config=_platform_repository(Path(directory))
              path=root/"contract.json"
              contract=json.loads(path.read_text())
              contract["rules"]=[row for row in contract["rules"] if row["id"]!=_PLATFORM_GUARD]
              path.write_text(json.dumps(contract))
              print("RED_SCOPE_SELECTION=Existing actual cleanup guard; missing converter guard remains required in permanent fixture")
              print("ORIGINAL_PROCESS_SHA256="+hashlib.sha256((root/"archkeel/analyzer/process.py").read_bytes()).hexdigest())
              result,encoded=run_report(root,config=config,analyzer=observe)
              assert result.exit_code==0 and encoded is not None,result.diagnostics
              model=parse_observation(decode_canonical_model(json.loads(encoded)))
              sites=[(row.data.get("owner"),excerpt) for owner in ("archkeel.analyzer.process.ProcessCollector.collect","archkeel.analyzer.process._terminate_process_tree") for row,excerpt in _comparison_sites(model,owner)]
              print("ACTUAL_ORIGINAL_PROCESS_CONTROL_SITES="+json.dumps(sites))
              guard=next(row for row in rule_assessments(model,undecided_by_rule={}) if row.id==_CLEANUP_GUARD)
              violations=[(row.kind,row.rule_ids,row.subjects,row.fact_ids) for row in trace_valid_violations(model) if _CLEANUP_GUARD in row.rule_ids]
              print("ACTUAL_CLEANUP_GUARD_RED="+json.dumps({"status":guard.status,"proven":guard.evaluation_proven,"violations":violations}))
              assert guard.status=="PASS" and not violations
          PY
      - name: Actual process platform port and native control RED
        if: always()
        run: uv run --locked pytest -q -s tests/test_collection_process.py::test_process_platform_port_owns_only_known_os_names tests/test_collection_process.py::test_native_actual_process_target_and_os_control_sites
