name: Python source evidence native GREEN
on:
  push:
    branches: [fix/issue-542-python-source-evidence-lines]
permissions:
  contents: read
jobs:
  physical-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Export formatting
        run: |
          uv run --locked ruff check --select I --fix src/archkeel/analyzer/python/source.py tests/test_python_source_evidence_lines.py
          uv run --locked ruff format src/archkeel/analyzer/python/source.py tests/test_python_source_evidence_lines.py
          python - <<'PY'
          import base64, subprocess
          print("FORMAT_PATCH=" + base64.b64encode(subprocess.check_output(["git", "diff"])).decode())
          PY
      - name: Native physical-line matrix and existing Python source checks
        run: uv run --locked python -m pytest -q tests/test_python_source_evidence_lines.py tests/test_analyzer.py
      - name: Lint and typecheck
        if: always()
        run: make lint typecheck
      - name: Unchanged native baseline
        if: always()
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/pyev-native.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "pyev-native.json").read_text())
          print("NATIVE_RESULT=" + json.dumps({key: result.get(key) for key in ("exit_code", "failures", "diagnostics", "measurements")}))
          PY
          exit "$task_status"
      - name: Replay the original four TypeScript Collector mutations with exact syntax source
        if: always()
        run: |
          git fetch --no-tags origin be25d6152ab6f1ddc14cd6514c3c8d825d8d6124
          python - <<'PY'
          import pathlib, subprocess
          paths = [
              "src/archkeel/analyzer/typescript/parse.py",
              "src/archkeel/analyzer/typescript/collect.py",
              "src/archkeel/analyzer/typescript/syntax.py",
              "tests/test_typescript_control_target.py",
              "docs/architecture/contracts/typescript.json",
              "docs/architecture/typescript-syntax-types.md",
          ]
          for path in paths:
              pathlib.Path(path).write_bytes(subprocess.check_output(["git", "show", "be25d6152ab6f1ddc14cd6514c3c8d825d8d6124:" + path]))
          PY
          uv run --locked python -m pytest -q 'tests/test_typescript_control_target.py::test_native_parser_and_protocol_strings_fail_without_exceptions[equality-collect]' 'tests/test_typescript_control_target.py::test_native_parser_and_protocol_strings_fail_without_exceptions[membership-collect]' 'tests/test_typescript_control_target.py::test_native_parser_and_protocol_strings_fail_without_exceptions[literal-left-membership-collect]' 'tests/test_typescript_control_target.py::test_native_parser_and_protocol_strings_fail_without_exceptions[match-collect]'

