name: Python physical evidence final exact no-write
on:
  push:
    branches: [fix/issue-542-python-source-evidence-lines]
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8ebc1da53b3ac7290f78978d5e69e4f3c59185c3
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify clean source and hygiene
        run: |
          git rev-parse HEAD
          make lint typecheck
          uv run --locked python -m pytest -q tests/test_python_source_evidence_lines.py tests/test_repository_hygiene.py
      - name: Validate committed v2 receipt against the final Wire parent without writes
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against ff4cae52451f43550639959b6f87a77f96375597 --amendment docs/architecture/decisions/issue-542-python-evidence-lines-amendment.json --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Correct physical Python source evidence after Unicode line separators in literals; original bytes and digest stay unchanged. Lower calls_unresolved from918 to measured917; no increased limit, allowance or accepted debt.' > "$RUNNER_TEMP/pyev-amend-result.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "pyev-amend-result.json").read_text())
          print("AMENDMENT_RESULT=" + json.dumps({key: result.get(key) for key in ("exit_code", "failures", "diagnostics", "measurements")}))
          print("AMENDMENT_JSON=" + pathlib.Path("docs/architecture/decisions/issue-542-python-evidence-lines-amendment.json").read_text().replace("\n", ""))
          PY
          exit "$task_status"
