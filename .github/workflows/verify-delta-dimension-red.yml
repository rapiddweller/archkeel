name: Delta dimension genuine RED
on:
  push:
    branches: [verify/542-delta-dimension-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Missing current API and native intent with existing future wire controls
        run: uv run --locked pytest -q tests/test_delta_dimension_types.py -k 'actual_owner_identity or native_actual_delta_ports or future_public_dimensions' --tb=short
