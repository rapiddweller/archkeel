name: Verify direct version feature policy port
on:
  push:
    branches: [verify/542-version-feature-port]
permissions:
  contents: read
jobs:
  feature-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Verify type owner, all feature gates and fixed-intent native controls
        run: |
          make lint typecheck
          uv run --locked python -m pytest -q tests/test_contract_version_types.py tests/test_codec.py tests/test_codec_compatibility.py tests/test_module_object_grants.py tests/test_contract_model.py tests/test_schema_drift.py tests/test_repository_hygiene.py
      - name: Write actual normal amendment against graph predecessor
        run: |
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --write-baseline --json > "$RUNNER_TEMP/version-baseline.json"
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 6c0083535d34ba84c8bd648474e87b7142ab0653 --amendment docs/architecture/decisions/2026-10-16-contract-version-types.json --write-amendment --decided-by ake2l --rationale "Own nominal contract versions and feature policy in one pure component; expose one direct typed policy port, preserve all supported encodings and feature boundaries, and enforce the authored version API without increased evidence debt." > "$RUNNER_TEMP/version-result.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          for label, path in (
              ("VERSION_BASELINE", Path("architecture-baseline.json")),
              ("VERSION_AMENDMENT", Path("docs/architecture/decisions/2026-10-16-contract-version-types.json")),
              ("VERSION_VALIDATION", Path(os.environ["RUNNER_TEMP"]) / "version-result.json"),
          ):
              print(label + "=" + json.dumps(json.loads(path.read_text()), separators=(",", ":")))
          PY
  actual-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Observe both actual source trees
        run: |
          git worktree add --detach "$RUNNER_TEMP/site-before" 6c0083535d34ba84c8bd648474e87b7142ab0653
          uv run --locked python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          for label, source in (("before", str(temp / "site-before")), ("after", ".")):
              result = subprocess.run([sys.executable, "-m", "archkeel.cli", "report", "--root", source, "--output", str(temp / ("site-" + label + ".json")), "--json"], capture_output=True, text=True)
              data = json.loads(result.stdout)
              print("SITE_REPORT_RESULT=" + json.dumps({"label": label, "exit": result.returncode, "diagnostics": data.get("diagnostics"), "failures": data.get("failures")}))
              assert result.returncode == 0, result.stderr
          PY
      - name: Compare semantic call and UNKNOWN sites
        run: |
          uv run --locked python - <<'PY'
          from collections import Counter
          from dataclasses import asdict
          import json, os, pathlib, re
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          from archkeel.check.ratchets import call_rows, unknown_positions_by_rule
          from archkeel.ir.references import unreferenced_symbols
          def read(name):
              data = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / name).read_text())
              return parse_observation(decode_canonical_model(data))
          before, after = read("site-before.json"), read("site-after.json")
          def calls(model):
              return Counter(
                  (row.path, re.sub(r'<(genexpr|listcomp|dictcomp|setcomp|lambda):\d+:\d+>', r'<\1>', row.caller), row.expression, row.status, row.reason)
                  for row in call_rows(model)
              )
          old_calls, new_calls = calls(before), calls(after)
          def positions(model):
              return {
                  row.id: {"id": row.id, "kind": row.kind, "rule_ids": list(row.rule_ids),
                           **{key: row.data.get(key) for key in ("qualified_name", "position", "path", "annotation", "nested_annotation", "reason")}}
                  for row in model.records("unknowns") or ()
                  if row.kind in {"boundary_type_position", "boundary_type_route"}
              }
          old, new = positions(before), positions(after)
          evidence = {
              "before_ref": "6c0083535d34ba84c8bd648474e87b7142ab0653", "after_ref": "38bd2f734f326d94a3533d81d5ab25d886386519",
              "before_calls": before.coverage.calls_unresolved,
              "after_calls": after.coverage.calls_unresolved,
              "new_unresolved_calls": [{"site": key, "count": count} for key, count in sorted((new_calls-old_calls).items())],
              "removed_unresolved_calls": [{"site": key, "count": count} for key, count in sorted((old_calls-new_calls).items())],
              "before_unknown": unknown_positions_by_rule(before),
              "after_unknown": unknown_positions_by_rule(after),
              "new_type_positions": [new[key] for key in sorted(new.keys()-old.keys())],
              "resolved_type_positions": [old[key] for key in sorted(old.keys()-new.keys())],
              "changed_type_positions": [{"before": old[key], "after": new[key]} for key in sorted(old.keys() & new.keys()) if old[key] != new[key]],
          }
          print("ACTUAL_SITE_EVIDENCE=" + json.dumps(evidence, separators=(",", ":")))
          assert not evidence["new_unresolved_calls"], evidence["new_unresolved_calls"]
          assert not evidence["new_type_positions"], evidence["new_type_positions"]
          PY
