name: Verify Git blob kind
on:
  push:
    branches: [fix/issue-542-git-blob-kind]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_git_blob_types.py -q --tb=short
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_snapshot.py tests/test_snapshot_check.py tests/test_snapshot_language_types.py tests/test_git_lock.py tests/test_dart_snapshot.py --tb=short -q
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked ruff format --check src/archkeel/check/git.py src/archkeel/check/snapshot.py tests/test_git_blob_types.py
          uv run --locked ruff check src/archkeel/check/git.py src/archkeel/check/snapshot.py tests/test_git_blob_types.py
          make typecheck
          uv run --locked pytest tests/test_repository_hygiene.py -q
  baseline:
    if: ${{ contains(github.event.head_commit.message, '[writer]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Normal own baseline and receipt
        run: |
          git diff --exit-code bb3e498b9c43afc954ef9fe7078595983e0b3c2f -- architecture-baseline.json schema
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against bb3e498b9c43afc954ef9fe7078595983e0b3c2f --amendment docs/architecture/decisions/issue-542-git-blob-kind-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent final Astra review on union' --rationale 'Own the two supported regular Git blob protocol pairs in the existing snapshot owner and share its nominal optional port with read_blob; author exact API Target and function-scoped native controls without changing wire grammar, error policy, budgets or allowances; docs/superpowers/plans/2026-10-17-git-blob-kind.md.' > "$RUNNER_TEMP/git-blob-native.json"
          actual_status=$?
          set -e
          python - "$RUNNER_TEMP/git-blob-native.json" <<'PY'
          import json,pathlib,sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("GIT_BLOB_NATIVE="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          path=pathlib.Path("docs/architecture/decisions/issue-542-git-blob-kind-amendment.json")
          if path.exists(): print("GIT_BLOB_RECEIPT="+json.dumps(json.loads(path.read_text()),separators=(",",":")))
          PY
          exit "$actual_status"
  site-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Compare actual type and call sites with multiplicity and targets
        run: |
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/amend-after.json" > "$RUNNER_TEMP/amend-after-result.json"
          git worktree add --detach "$RUNNER_TEMP/amend-before" bb3e498b9c43afc954ef9fe7078595983e0b3c2f
          uv run --locked archkeel report --root "$RUNNER_TEMP/amend-before" --output "$RUNNER_TEMP/amend-before.json" > "$RUNNER_TEMP/amend-before-result.json"
          uv run --locked python - "$RUNNER_TEMP/amend-before.json" "$RUNNER_TEMP/amend-after.json" "$RUNNER_TEMP/amend-before" . <<'PY'
          import ast,copy,json,pathlib,re,sys
          from collections import Counter
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.check.ratchets import unknown_positions_by_rule,call_rows
          from archkeel.ir.decisions import _unknown_evidence_and_counts
          from archkeel.ir.codec_wire import _raw_value
          def read(path): return parse_observation(decode_canonical_model(json.loads(pathlib.Path(path).read_text())))
          before,after=(read(path) for path in sys.argv[1:3])
          before_root,after_root=(pathlib.Path(path) for path in sys.argv[3:5])
          def types(model):
              return {row.id:{"id":row.id,"kind":row.kind,"rule_ids":row.rule_ids,**{key:row.data.get(key) for key in ("qualified_name","position","path","annotation","nested_annotation","reason")}} for row in model.records("unknowns") or () if row.kind in {"boundary_type_position","boundary_type_route"}}
          def calls(model,source_root):
              asts={}
              def call_ast(site,expression,caller):
                  if site.file not in asts:
                      index={}
                      for node in ast.walk(ast.parse((source_root/site.file).read_text())):
                          if isinstance(node,ast.Call):
                              key=(node.lineno,node.col_offset,ast.unparse(node.func))
                              index.setdefault(key,[]).append(node)
                      asts[site.file]=index
                  index=asts[site.file]
                  matches=(index.get((site.line,site.column,expression),[]) if site.column is not None else [value for (line,column,name),values in index.items() if line==site.line and name==expression for value in values])
                  assert len(matches)==1,(site,expression,matches)
                  written=matches[0]
                  associated=copy.deepcopy(written)
                  return ast.dump(written,include_attributes=False),ast.dump(associated,include_attributes=False)
              evidence={row.id:row for row in model.evidence}
              result={}
              for row in model.records("calls") or ():
                  data=row.data
                  status=data.get("status")
                  if status not in {"unresolved","partially_resolved"}: continue
                  sites=[evidence[identity] for identity in row.evidence_ids if identity in evidence]
                  assert len(sites)==1
                  site=sites[0]
                  caller=re.sub(r"<(genexpr|listcomp|dictcomp|setcomp):[0-9]+:[0-9]+>",r"<\1>",str(data.get("source_scope")))
                  key=(status,site.file,caller,data.get("expression"))
                  written,associated=call_ast(site,data.get("expression"),caller)
                  result.setdefault(key,[]).append({"record_id":row.id,"status":status,"path":site.file,"line":site.line,"caller":caller,"expression":data.get("expression"),"reason":data.get("reason"),"targets":_raw_value(data.get("targets")),"candidate_count":data.get("candidate_count"),"call_ast":written,"associated_call_ast":associated})
              assert sum(len(rows) for rows in result.values())==len(call_rows(model))
              return result
          def selected(model):
              return {rule:[{"id":row.id,"kind":row.kind,"subjects":row.subjects,"rule_ids":row.rule_ids,"data":_raw_value(row.data)} for row in records] for rule,records in _unknown_evidence_and_counts(model)[2].items()}
          old_selected,new_selected=selected(before),selected(after)
          print("GIT_BLOB_ALL_UNKNOWN="+json.dumps({"before":old_selected,"after":new_selected},separators=(",",":")))
          old,new=types(before),types(after)
          old_calls,new_calls=calls(before,before_root),calls(after,after_root)
          added=[{"before":old_calls.get(key,[]),"after":new_calls[key]} for key in new_calls if len(new_calls[key])>len(old_calls.get(key,[]))]
          removed=[{"before":old_calls[key],"after":new_calls.get(key,[])} for key in old_calls if len(old_calls[key])>len(new_calls.get(key,[]))]
          def payload(row):
              return json.dumps({key:row[key] for key in ("status","expression","reason","targets","candidate_count")} | {"call_ast":row["associated_call_ast"]},sort_keys=True)
          new_debt=[]
          removed_debt=[]
          target_changed=[]
          for key in old_calls.keys()|new_calls.keys():
              old_rows,new_rows=old_calls.get(key,[]),new_calls.get(key,[])
              old_counts,new_counts=Counter(map(payload,old_rows)),Counter(map(payload,new_rows))
              positive=new_counts-old_counts
              negative=old_counts-new_counts
              if positive:
                  new_debt.append({"key":key,"added_payload_counts":dict(positive),"before":old_rows,"after":new_rows})
              if negative:
                  removed_debt.append({"key":key,"removed_payload_counts":dict(negative),"before":old_rows,"after":new_rows})
              common_asts={row["call_ast"] for row in old_rows}&{row["call_ast"] for row in new_rows}
              for expression_ast in common_asts:
                  old_targets={json.dumps(row["targets"],sort_keys=True) for row in old_rows if row["call_ast"]==expression_ast}
                  new_targets={json.dumps(row["targets"],sort_keys=True) for row in new_rows if row["call_ast"]==expression_ast}
                  if old_targets!=new_targets:
                      target_changed.append({"key":key,"call_ast":expression_ast,"before":sorted(old_targets),"after":sorted(new_targets)})
          unknown_changes=[]
          for rule in old_selected.keys()|new_selected.keys():
              old_rows={row["id"]:row for row in old_selected.get(rule,[])}
              new_rows={row["id"]:row for row in new_selected.get(rule,[])}
              unknown_changes.extend({"rule":rule,"id":identity,"before":old_rows.get(identity),"after":new_rows.get(identity)} for identity in old_rows.keys()|new_rows.keys() if old_rows.get(identity)!=new_rows.get(identity))
          print("GIT_BLOB_ALL_UNKNOWN_PROOF="+json.dumps({"before_ref":"bb3e498b9c43afc954ef9fe7078595983e0b3c2f","before_counts":unknown_positions_by_rule(before),"after_counts":unknown_positions_by_rule(after),"changed_selected_records":unknown_changes,"selected_record_counts":{rule:len(rows) for rule,rows in new_selected.items()}},separators=(",",":")))
          assert not unknown_changes
          summary={"before_ref":"bb3e498b9c43afc954ef9fe7078595983e0b3c2f","before_unknown":unknown_positions_by_rule(before),"after_unknown":unknown_positions_by_rule(after),"new_type_positions":[new[key] for key in sorted(new.keys()-old.keys())],"removed_type_positions":[old[key] for key in sorted(old.keys()-new.keys())],"changed_type_positions":[{"before":old[key],"after":new[key]} for key in sorted(old.keys()&new.keys()) if old[key]!=new[key]],"added_call_sites":added,"removed_call_sites":removed,"changed_call_targets":target_changed,"new_or_changed_debt":new_debt,"removed_debt":removed_debt,"before_unresolved":before.coverage.calls_unresolved,"after_unresolved":after.coverage.calls_unresolved,"before_partial":before.coverage.calls_partially_resolved,"after_partial":after.coverage.calls_partially_resolved}
          print("GIT_BLOB_SITE_EVIDENCE="+json.dumps(summary,separators=(",",":")))
          assert not summary["new_type_positions"]
          assert not new_debt,new_debt
          assert not removed_debt,removed_debt
          assert after.coverage.calls_unresolved==before.coverage.calls_unresolved
          assert after.coverage.calls_partially_resolved==before.coverage.calls_partially_resolved
          assert not target_changed
          PY
  wire-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Replay actual Git fixtures through both source versions
        run: |
          uv run --locked python - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,"tests")
          from test_snapshot import _committed_repository,_git,_write
          base="bb3e498b9c43afc954ef9fe7078595983e0b3c2f"
          with tempfile.TemporaryDirectory() as directory:
              temporary=Path(directory)
              root,initial=_committed_repository(temporary)
              path="example/tasks/sample.py"
              payload=b"print('exact')\r\n# \xc3\xa4\n"
              (root/path).write_bytes(payload)
              _git(root,"add",path)
              _git(root,"commit","-qm","byte payload")
              blob=_git(root,"rev-parse",":example/tasks/sample.py")
              cases=[]
              for mode,oid in (("100644",blob),("100755",blob),("120000",blob),("160000",initial)):
                  _git(root,"update-index","--cacheinfo",f"{mode},{oid},{path}")
                  tree=_git(root,"write-tree")
                  revision=_git(root,"commit-tree",tree,"-p",initial,"-m",mode)
                  cases.append([mode,revision])
              script=r'''
          import hashlib,json,pathlib,subprocess,sys
          from types import SimpleNamespace
          from unittest.mock import patch
          source,root,cases=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2]),json.loads(sys.argv[3])
          sys.path.insert(0,str(source))
          from archkeel.check import git,snapshot
          assert pathlib.Path(git.__file__).is_relative_to(source)
          assert pathlib.Path(snapshot.__file__).is_relative_to(source)
          def outcome(operation):
              try:
                  value=operation()
                  return {"bytes":value.hex()}
              except Exception as error:
                  return {"error":type(error).__name__,"text":str(error)}
          values={}
          path="example/tasks/sample.py"
          for mode,revision in cases:
              values[mode]={
                  "read":outcome(lambda:git.read_blob(root,revision,path)),
                  "archive":outcome(lambda:snapshot._git_archive_bytes(root,revision,roots=(pathlib.PurePosixPath("example"),))),
                  "missing":outcome(lambda:git.read_blob(root,revision,"absent.py")),
              }
          revision=cases[0][1]
          original_git,original_run=git.git_bytes,subprocess.run
          malformed=[b"100600 blob "+b"0"*40,b"100644 tree "+b"0"*40,b"broken",b"100644 blob"]
          for index,metadata in enumerate(malformed):
              raw=metadata+b"\t"+path.encode()+b"\0"
              def fake_git(where,*args):
                  return raw if args[0]=="ls-tree" else original_git(where,*args)
              def fake_run(args,*a,**kw):
                  return SimpleNamespace(stdout=raw) if args[1]=="ls-tree" else original_run(args,*a,**kw)
              with patch.object(git,"git_bytes",fake_git):
                  read=outcome(lambda:git.read_blob(root,revision,path))
              with patch.object(subprocess,"run",fake_run):
                  archive=outcome(lambda:snapshot._git_archive_bytes(root,revision,roots=(pathlib.PurePosixPath("example"),)))
              values["malformed-"+str(index)]={"read":read,"archive":archive}
          print(json.dumps({"values":values,"loaded":{name:{"path":str(module.__file__),"sha256":hashlib.sha256(pathlib.Path(module.__file__).read_bytes()).hexdigest()} for name,module in (("git",git),("snapshot",snapshot))}},sort_keys=True))
          '''
              outputs=[]
              for name in ("before","after"):
                  runtime=temporary/name
                  shutil.copytree("src",runtime)
                  if name=="before":
                      for module in ("git","snapshot"):
                          (runtime/f"archkeel/check/{module}.py").write_bytes(subprocess.check_output(["git","show",f"{base}:src/archkeel/check/{module}.py"]))
                  output=json.loads(subprocess.check_output([sys.executable,"-I","-B","-c",script,str(runtime),str(root),json.dumps(cases)],text=True))
                  outputs.append(output)
              assert outputs[0]["values"]==outputs[1]["values"]
              assert all(outputs[0]["loaded"][name]["sha256"]!=outputs[1]["loaded"][name]["sha256"] for name in ("git","snapshot"))
              for mode in ("100644","100755"):
                  assert bytes.fromhex(outputs[1]["values"][mode]["read"]["bytes"])==payload
              print("GIT_BLOB_WIRE_PARITY="+json.dumps({"base":base,"cases":list(outputs[1]["values"]),"loaded":[item["loaded"] for item in outputs],"canonical_results_sha256":hashlib.sha256(json.dumps(outputs[1]["values"],sort_keys=True).encode()).hexdigest()},separators=(",",":")))
          PY
