name: Write Git blob owner baseline and receipt
on:
  push:
    branches: [fix/issue-542-git-blob-kind]
permissions:
  contents: read
jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Generate normal baseline and matching amendment
        run: |
          git diff --exit-code bb3e498b9c43afc954ef9fe7078595983e0b3c2f -- architecture-baseline.json schema
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --write-baseline --json --against bb3e498b9c43afc954ef9fe7078595983e0b3c2f --amendment docs/architecture/decisions/issue-542-git-blob-kind-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent final Astra review on union' --rationale 'Own the two supported regular Git blob protocol pairs in the existing snapshot owner and share its nominal optional port with read_blob; authorize only that domain owner and author exact API Target plus function-scoped native controls; normal ratchet records the inherited bb3e836 call count without any new Git call/UNKNOWN debt; docs/superpowers/specs/2026-10-17-git-blob-kind.md.' > "$RUNNER_TEMP/git-blob-writer.json"
          actual_status=$?
          set -e
          uv run --locked python - "$RUNNER_TEMP/git-blob-writer.json" <<'PY'
          import copy,json,pathlib,subprocess,sys
          from archkeel.ir.amendment_codec import amendment_bytes,parse_amendment
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("GIT_BLOB_FINAL_WRITER="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          baseline=pathlib.Path("architecture-baseline.json")
          before=json.loads(subprocess.check_output(["git","show","bb3e498b9c43afc954ef9fe7078595983e0b3c2f:architecture-baseline.json"]))
          after=json.loads(baseline.read_bytes())
          expected=copy.deepcopy(before)
          assert value["measurements"]["scalars"]["calls_unresolved"]==836
          expected["budgets"]["calls_unresolved"]=836
          assert after==expected,(before,after)
          assert value["measurements"]["scalars"]["violations"]==0
          assert value["measurements"]["scalars"]["typing_positions"]==52
          assert value["measurements"]["scalars"]["unknown_positions"]==58
          assert value["exit_code"]==0 and not value["failures"] and not value["diagnostics"]
          path=pathlib.Path("docs/architecture/decisions/issue-542-git-blob-kind-amendment.json")
          raw=json.loads(path.read_bytes())
          assert amendment_bytes(parse_amendment(raw))==path.read_bytes()
          print("GIT_BLOB_BASELINE="+json.dumps(after,separators=(",",":")))
          print("GIT_BLOB_FINAL_RECEIPT="+json.dumps(raw,separators=(",",":")))
          PY
          exit "$actual_status"
