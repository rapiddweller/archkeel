name: Verify own UML route separation
on:
  push:
    branches: [verify/542-own-uml-scoped-green]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - run: make browser-install
      - name: Real own UML routes, member previews, focus and exact method identities
        run: |
          uv run --locked --with playwright==1.62.0 python -m pytest -q -s \
            tests/test_own_uml_target.py::test_own_type_dependencies_have_visible_endpoints_and_connected_focus \
            tests/test_own_uml_target.py::test_member_previews_do_not_squeeze_the_overview_or_change_its_evidence \
            tests/test_own_uml_target.py::test_own_class_overview_keeps_distinct_routes_and_type_cues \
            tests/test_own_uml_target.py::test_own_graph_observes_the_normalizer_and_classifier_relationship_validator \
            tests/test_report_renderer_units.py \
            tests/test_uml_rendering.py::test_standard_uml_ignores_stale_layout_and_retries_rejected_layout
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Verify the clean product tests and export only actual formatting changes
        run: |
          git show df0985713d57fa103c03b6659a34a863d322a39d:tests/test_own_uml_target.py > tests/test_own_uml_target.py
          uv run --locked python - <<'PY'
          import base64, difflib, subprocess
          from pathlib import Path
          files = ("tests/test_own_uml_target.py", "tests/test_report_renderer_units.py")
          before = {path: Path(path).read_text() for path in files}
          subprocess.run(["uv", "run", "--locked", "ruff", "format", *files], check=True)
          patch = "".join("".join(difflib.unified_diff(before[path].splitlines(keepends=True), Path(path).read_text().splitlines(keepends=True), fromfile="a/" + path, tofile="b/" + path)) for path in files)
          print("FORMAT_PATCH=" + base64.b64encode(patch.encode()).decode())
          PY
      - run: make lint typecheck
      - run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py
