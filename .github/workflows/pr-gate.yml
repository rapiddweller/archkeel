name: PR gate

# The PR gate runs the main-tier tests of the selected areas before merge.
on:
  pull_request:
    branches: [main, "ci/**"]
    # AD-1061: only a push or a reopen starts the gate. A label or an edit must not start it.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# AD-754: the gate builds its core with the fast profile of the Makefile (no LTO, 16 codegen units).
env:
  ARCHKEEL_CORE_PROFILE: gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: PR base checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # AD-1222: the gate reads the merge base and `origin/main`, not every branch. The tool deepens the
      # fetch until the merge base is exact, and fails when it cannot.
      - name: Fetch the history that the gate reads
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/fetch_history.py "$PR_BASE"

      # The hash is taken right after the checkout, before any build writes into native/.
      - name: Hash the native tree
        id: native
        run: echo "hash=${{ hashFiles('native/**', '!native/target/**', 'tools/rustc-facts/**', '!tools/rustc-facts/target/**', '!**/__pycache__/**') }}" >> "$GITHUB_OUTPUT"

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install the Dart SDK for the oracle tests
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: "3.12.2"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10 3.14.7

      - name: Install locked dependencies
        run: uv sync --locked --extra mcp

      # AD-1047: the self-check reads native/ with compiler facts, so the toolchain needs rustc-dev and llvm-tools.
      - name: Install the pinned Rust toolchain
        run: make type-reach-setup

      # AD-674: when native/ is the same as on a main run that saved its core, the PR downloads
      # that core and builds nothing. When native/ changed, it restores the target directory of
      # main and builds the core incrementally (this case takes longer).
      - name: Restore the core of main for this native tree
        id: core
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/target/CACHEDIR.TAG
            native/target/release/archkeel-core
            native/target/release/archkeel-rust-collector
            native/target/release/archkeel-typescript-collector
            native/target/release/archkeel-core.tree
          key: core-gate-${{ runner.os }}-${{ steps.native.outputs.hash }}

      - name: Restore the Rust build cache of main
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-gate-pr-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-
            rust-gate-pr-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-

      # AD-1380: the one system run reads native/ with compiler facts. A pull request only reads the work
      # that main saved (AD-1350); without it the run starts cold and meets the 600 s limit of the core.
      - name: Restore the compiler facts work of main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/archkeel/rustc-facts
          key: rustc-facts-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml', 'tools/rustc-facts/**', '!tools/rustc-facts/target/**') }}
          restore-keys: |
            rustc-facts-main-${{ runner.os }}-

      # AD-732: the core is built in its own step. `make core` reuses a restored binary only when its
      # stamp names this native tree, and a core is saved only after this step succeeded.
      - name: Build the core
        id: build
        env:
          ARCHKEEL_NATIVE_TREE: ${{ steps.native.outputs.hash }}
          ARCHKEEL_CORE_SOURCE: ${{ steps.core.outputs.cache-hit == 'true' && 'cache' || 'build' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # AD-754: the static checks and, AD-756, the Rust format and lint of the touched crates
          # run beside the core build (they need no release core); their result is checked next. PR_HOSTED=1:
          # the `native` job and the area jobs run the checks that this call would repeat.
          { make ci-pr-static && make pr-native-lint PR_BASE="$PR_BASE" PR_HOSTED=1; } \
            > "$RUNNER_TEMP/static.log" 2>&1 &
          static=$!
          make core
          if wait "$static"; then echo "static=0"; else echo "static=1"; fi >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/static.log"

      - name: Require the static and the Rust checks
        if: steps.build.outcome == 'success'
        run: test "${{ steps.build.outputs.static }}" = 0

      - name: Run the PR gate
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          ARCHKEEL_NATIVE_TREE: ${{ steps.native.outputs.hash }}
          ARCHKEEL_CORE_SOURCE: ${{ steps.core.outputs.cache-hit == 'true' && 'cache' || 'build' }}
          PR_PARALLEL: "1"
          NATIVE_SELFCHECK_TIMINGS: ${{ runner.temp }}/native-selfcheck-timings.json
        run: make pr-gate PR_BASE="$PR_BASE" SKIP_STATIC=1

      - name: Record native self-check phase timings
        if: always()
        run: |
          {
            echo '### Native self-check phase timings'
            if [ -f "$RUNNER_TEMP/native-selfcheck-timings.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/native-selfcheck-timings.json"
              echo '```'
            else
              echo 'No timing file was produced.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the Rust build cache
        if: always() && steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-gate-pr-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-${{ github.sha }}

      - name: Save the core for this native tree
        if: always() && steps.build.outcome == 'success' && steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/target/CACHEDIR.TAG
            native/target/release/archkeel-core
            native/target/release/archkeel-rust-collector
            native/target/release/archkeel-typescript-collector
            native/target/release/archkeel-core.tree
          key: core-gate-${{ runner.os }}-${{ steps.native.outputs.hash }}

  area-checks:
    uses: ./.github/workflows/area-checks.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}

  windows-native:
    name: Windows native type check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select Windows native check
        id: select
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          changed="$(git diff --name-only "$BASE" HEAD -- native/ tools/rustc-facts/)"
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi

      # AD-1390: a pull request only reads the cache. `windows-cache.yml` saves it on main when the lock
      # or the toolchain changes, so each pushed commit no longer adds an entry of 458 MB.
      - name: Restore Rust cache
        if: steps.select.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-windows-check-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}
          restore-keys: |
            rust-windows-check-

      - name: Check Windows native tests
        if: steps.select.outputs.run == 'true'
        working-directory: native
        run: cargo check --locked --tests

  pr-gate:
    name: PR gate
    needs: [base, area-checks, windows-native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "A check did not succeed: $result" >&2; exit 1; }
          done
          [[ -n "$RESULTS" ]] || { echo "No check results" >&2; exit 1; }
