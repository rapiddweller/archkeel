name: Verify typed diagnostic owner
on:
  push:
    branches: [fix/issue-542-typed-diagnostic-owner]
permissions:
  contents: read
jobs:
  diagnostic-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Exercise real diagnostic wire and independent native intent
        run: uv run --locked python -m pytest -q tests/test_typed_diagnostic_owner.py --tb=short
  diagnostic-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inventory actual diagnostic call sites
        run: |
          python - <<'PY'
          import ast, json, pathlib
          rows=[]
          for root in (pathlib.Path("src"), pathlib.Path("tools")):
              for path in sorted(root.rglob("*.py")):
                  source=path.read_text()
                  tree=ast.parse(source)
                  calls=[]
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in {"Diagnostic","_diagnostic"}:
                          calls.append({"line":node.lineno,"call":node.func.id,"first":ast.unparse(node.args[0]) if node.args else None,"code":[ast.unparse(x.value) for x in node.keywords if x.arg=="code"]})
                  if calls: rows.append({"path":str(path),"calls":calls})
          print("DIAGNOSTIC_CALL_INVENTORY="+json.dumps(rows,separators=(",",":")))
          PY
