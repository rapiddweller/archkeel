name: Verify typed diagnostic owner
on:
  push:
    branches: [fix/issue-542-typed-diagnostic-owner]
permissions:
  contents: read
jobs:
  diagnostic-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Prove exact consumer-route regression by reverting only its fix
        run: |
          uv run --locked python - <<'PY'
          import pathlib,subprocess,sys
          paths=("src/archkeel/check/report.py","src/archkeel/render/html.py","src/archkeel/render/terminal.py")
          saved={path:pathlib.Path(path).read_bytes() for path in paths}
          try:
              for path in paths:
                  pathlib.Path(path).write_bytes(subprocess.check_output(["git","show","3152affc0158829d66f2f18ccf0a1afac0a05580:"+path]))
              result=subprocess.run([sys.executable,"-m","pytest","-q","tests/test_typed_diagnostic_owner.py::test_existing_public_diagnostic_reexports_reach_the_canonical_owner","--tb=short"],capture_output=True,text=True)
              print("ROUTE_REVERSION_EXIT="+str(result.returncode))
              print(result.stdout)
              if result.stderr: print(result.stderr)
              assert result.returncode==1 and "unresolved_reexport_route" in result.stdout, "The exact current route control must fail when only its source fix is reverted"
          finally:
              for path,source in saved.items(): pathlib.Path(path).write_bytes(source)
          PY
      - name: Exercise real diagnostic wire and independent native intent
        run: uv run --locked python -m pytest -q tests/test_typed_diagnostic_owner.py --tb=short
  diagnostic-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inventory actual diagnostic call sites
        run: |
          python - <<'PY'
          import ast, json, pathlib
          rows=[]
          for root in (pathlib.Path("src"), pathlib.Path("tools")):
              for path in sorted(root.rglob("*.py")):
                  source=path.read_text()
                  tree=ast.parse(source)
                  calls=[]
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in {"Diagnostic","_diagnostic"}:
                          calls.append({"line":node.lineno,"call":node.func.id,"first":ast.unparse(node.args[0]) if node.args else None,"code":[ast.unparse(x.value) for x in node.keywords if x.arg=="code"]})
                  if calls: rows.append({"path":str(path),"calls":calls})
          print("DIAGNOSTIC_CALL_INVENTORY="+json.dumps(rows,separators=(",",":")))
          PY
  diagnostic-producer-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Propose precise producer edits from actual AST parameter ownership
        run: |
          uv run --locked python - <<'PY'
          import ast, base64, difflib, json, pathlib
          from archkeel.ir.diagnostics import DiagnosticKind, DiagnosticCode
          domains={"DiagnosticKind":DiagnosticKind,"DiagnosticCode":DiagnosticCode}
          patches=[]
          summary=[]
          candidates=[]
          for path in sorted([*pathlib.Path("src").rglob("*.py"), *pathlib.Path("tools").rglob("*.py")]):
              if path.as_posix() in {"src/archkeel/ir/model.py","src/archkeel/ir/diagnostics.py"}:
                  continue
              source=path.read_text()
              tree=ast.parse(source)
              lines=source.splitlines(keepends=True)
              offsets=[0]
              for line in lines: offsets.append(offsets[-1]+len(line))
              def offset(line,col):
                  return offsets[line-1]+len(lines[line-1].encode()[:col].decode())
              aliases={}
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module in {"archkeel.ir.model","archkeel.ir.diagnostics"}:
                      for alias in node.names:
                          if alias.name in domains: aliases[alias.name]=alias.asname or alias.name
              needed=set()
              edits={}
              def local(domain):
                  if domain in aliases: return aliases[domain]
                  needed.add(domain)
                  return "_"+domain
              def replace_values(expr, domain):
                  values={member.value:member.name for member in domains[domain]}
                  for leaf in ast.walk(expr):
                      if isinstance(leaf,ast.Constant) and isinstance(leaf.value,str) and leaf.value in values:
                          key=(offset(leaf.lineno,leaf.col_offset),offset(leaf.end_lineno,leaf.end_col_offset))
                          replacement=local(domain)+"."+values[leaf.value]
                          if key in edits: assert edits[key]==replacement
                          edits[key]=replacement
              functions={}
              for node in ast.walk(tree):
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      params=[*node.args.posonlyargs,*node.args.args]
                      typed={i:arg.annotation.id for i,arg in enumerate(params) if isinstance(arg.annotation,ast.Name) and arg.annotation.id in domains}
                      typed_keywords={arg.arg:arg.annotation.id for arg in [*params,*node.args.kwonlyargs] if isinstance(arg.annotation,ast.Name) and arg.annotation.id in domains}
                      if typed or typed_keywords: functions[node.name]=(typed,typed_keywords)
              functions["Diagnostic"]=({0:"DiagnosticKind",5:"DiagnosticCode"},{"kind":"DiagnosticKind","code":"DiagnosticCode"})
              if path.as_posix().startswith("src/archkeel/check/validation/"):
                  functions["_diagnostic"]=({0:"DiagnosticCode"},{"code":"DiagnosticCode"})
              for node in ast.walk(tree):
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Name) and node.func.id in functions:
                      positions, keywords=functions[node.func.id]
                      for index, domain in positions.items():
                          if len(node.args)>index: replace_values(node.args[index],domain)
                      for item in node.keywords:
                          if item.arg in keywords: replace_values(item.value,keywords[item.arg])
                  if isinstance(node,ast.AnnAssign):
                      annotation=ast.unparse(node.annotation)
                      if isinstance(node.annotation,ast.Name) and node.annotation.id in domains and node.value is not None:
                          replace_values(node.value,node.annotation.id)
                      elif isinstance(node.target,ast.Name) and node.target.id=="_RULE_FAILURES" and "DiagnosticKind" in annotation and isinstance(node.value,ast.Dict):
                          for value in node.value.values:
                              assert isinstance(value,ast.Tuple)
                              replace_values(value.elts[0],"DiagnosticKind")
                  if isinstance(node,ast.Compare):
                      literals=[leaf.value for leaf in ast.walk(node) if isinstance(leaf,ast.Constant) and isinstance(leaf.value,str)]
                      if any(value in {member.value for enum in domains.values() for member in enum} for value in literals):
                          candidates.append({"path":str(path),"line":node.lineno,"source":ast.unparse(node)})
                          if path.as_posix()=="src/archkeel/check/report.py" and isinstance(node.left,ast.Attribute) and node.left.attr=="kind":
                              replace_values(node,"DiagnosticKind")
                          if path.as_posix()=="src/archkeel/check/uml.py" and isinstance(node.left,ast.Attribute) and node.left.attr=="code":
                              replace_values(node,"DiagnosticCode")
              scopes=[tree,*[node for node in ast.walk(tree) if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef))]]
              for scope in scopes:
                  body=scope.body
                  owned={}
                  def visit_body(nodes):
                      for node in nodes:
                          if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)): continue
                          yield node
                          for child in ast.iter_child_nodes(node):
                              if isinstance(child,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)): continue
                              yield from visit_body([child])
                  nodes=list(visit_body(body))
                  for node in nodes:
                      if isinstance(node,ast.AnnAssign) and isinstance(node.target,ast.Name) and isinstance(node.annotation,ast.Name) and node.annotation.id in domains:
                          owned[node.target.id]=node.annotation.id
                  for node in nodes:
                      if isinstance(node,ast.Assign):
                          for target in node.targets:
                              if isinstance(target,ast.Name) and target.id in owned:
                                  replace_values(node.value,owned[target.id])
              if not edits: continue
              result=source
              for (start,end),replacement in sorted(edits.items(),reverse=True):
                  result=result[:start]+replacement+result[end:]
              if needed:
                  new_imports="".join("from archkeel.ir.model import "+name+" as _"+name+"\n" for name in sorted(needed))
                  future=next((node for node in tree.body if isinstance(node,ast.ImportFrom) and node.module=="__future__"),None)
                  if future is not None:
                      original_point=offsets[future.end_lineno]
                      shift=sum(len(replacement)-(end-start) for (start,end),replacement in edits.items() if start<original_point)
                      point=original_point+shift
                      result=result[:point]+"\n"+new_imports+result[point:]
                  else:
                      first_import=next(node for node in tree.body if isinstance(node,(ast.Import,ast.ImportFrom)))
                      original_point=offset(first_import.lineno,0)
                      shift=sum(len(replacement)-(end-start) for (start,end),replacement in edits.items() if start<original_point)
                      point=original_point+shift
                      result=result[:point]+new_imports+result[point:]
              ast.parse(result)
              patch="".join(difflib.unified_diff(source.splitlines(keepends=True),result.splitlines(keepends=True),fromfile="a/"+str(path),tofile="b/"+str(path)))
              patches.append("diff --git a/"+str(path)+" b/"+str(path)+"\n"+patch)
              summary.append({"path":str(path),"typed_literal_sites":len(edits),"new_private_imports":sorted(needed)})
          print("PRODUCER_EDIT_SUMMARY="+json.dumps(summary,separators=(",",":")))
          print("DIAGNOSTIC_DISPATCH_CANDIDATES="+json.dumps(candidates,separators=(",",":")))
          print("PRODUCER_PATCH="+base64.b64encode("".join(patches).encode()).decode())
          
          PY
  diagnostic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Check actual source formatting, typing and hygiene
        run: |
          uv run --locked ruff check --select I --fix tests/test_typed_diagnostic_owner.py src/archkeel/ir/model.py src/archkeel/ir/diagnostics.py tests/test_diagnostics.py tests/test_result_schema.py src/archkeel/check/delta.py src/archkeel/check/observe.py src/archkeel/check/onboarding.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/runtime.py src/archkeel/check/uml.py src/archkeel/check/uml_evaluation.py src/archkeel/check/validation/__init__.py src/archkeel/check/validation/closed_world.py src/archkeel/check/validation/diagnostics.py src/archkeel/check/validation/graphs.py src/archkeel/check/validation/inside.py src/archkeel/check/validation/observation.py src/archkeel/check/validation/public_api.py src/archkeel/check/validation/rationale.py src/archkeel/check/validation/references.py src/archkeel/ir/baseline.py src/archkeel/ir/lock.py src/archkeel/ir/report_projection.py tools/github_pr_report.py src/archkeel/render/html.py src/archkeel/render/terminal.py
          uv run --locked ruff format tests/test_typed_diagnostic_owner.py src/archkeel/ir/model.py src/archkeel/ir/diagnostics.py tests/test_diagnostics.py tests/test_result_schema.py src/archkeel/check/delta.py src/archkeel/check/observe.py src/archkeel/check/onboarding.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/runtime.py src/archkeel/check/uml.py src/archkeel/check/uml_evaluation.py src/archkeel/check/validation/__init__.py src/archkeel/check/validation/closed_world.py src/archkeel/check/validation/diagnostics.py src/archkeel/check/validation/graphs.py src/archkeel/check/validation/inside.py src/archkeel/check/validation/observation.py src/archkeel/check/validation/public_api.py src/archkeel/check/validation/rationale.py src/archkeel/check/validation/references.py src/archkeel/ir/baseline.py src/archkeel/ir/lock.py src/archkeel/ir/report_projection.py tools/github_pr_report.py src/archkeel/render/html.py src/archkeel/render/terminal.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","tests/test_typed_diagnostic_owner.py","src/archkeel/ir/model.py","src/archkeel/ir/diagnostics.py","tests/test_diagnostics.py","tests/test_result_schema.py","src/archkeel/check/delta.py","src/archkeel/check/observe.py","src/archkeel/check/onboarding.py","src/archkeel/check/report.py","src/archkeel/check/run.py","src/archkeel/check/runtime.py","src/archkeel/check/uml.py","src/archkeel/check/uml_evaluation.py","src/archkeel/check/validation/__init__.py","src/archkeel/check/validation/closed_world.py","src/archkeel/check/validation/diagnostics.py","src/archkeel/check/validation/graphs.py","src/archkeel/check/validation/inside.py","src/archkeel/check/validation/observation.py","src/archkeel/check/validation/public_api.py","src/archkeel/check/validation/rationale.py","src/archkeel/check/validation/references.py","src/archkeel/ir/baseline.py","src/archkeel/ir/lock.py","src/archkeel/ir/report_projection.py","tools/github_pr_report.py","src/archkeel/render/html.py","src/archkeel/render/terminal.py"])).decode())
          PY
          uv run --locked ruff check tests/test_typed_diagnostic_owner.py src/archkeel/ir/model.py src/archkeel/ir/diagnostics.py tests/test_diagnostics.py tests/test_result_schema.py src/archkeel/check/delta.py src/archkeel/check/observe.py src/archkeel/check/onboarding.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/runtime.py src/archkeel/check/uml.py src/archkeel/check/uml_evaluation.py src/archkeel/check/validation/__init__.py src/archkeel/check/validation/closed_world.py src/archkeel/check/validation/diagnostics.py src/archkeel/check/validation/graphs.py src/archkeel/check/validation/inside.py src/archkeel/check/validation/observation.py src/archkeel/check/validation/public_api.py src/archkeel/check/validation/rationale.py src/archkeel/check/validation/references.py src/archkeel/ir/baseline.py src/archkeel/ir/lock.py src/archkeel/ir/report_projection.py tools/github_pr_report.py src/archkeel/render/html.py src/archkeel/render/terminal.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  diagnostic-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify diagnostic, schema, validation and report behavior
        run: |
          uv run --locked python -m pytest -q tests/test_diagnostics.py tests/test_result_schema.py tests/test_check_diagnostics.py tests/test_lock_diagnostics.py tests/test_report_diagnostics.py tests/test_contract_model.py tests/test_validation.py tests/test_onboarding.py tests/test_saved_report.py tests/test_report_filter.py tests/test_uml_evaluation.py tests/test_boundary_type_unknown_verdict.py tests/test_schema_drift.py
  diagnostic-native-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify native authority and actual position/call deltas
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 5933ffbbfd588ac96e36748de937cb1f6e739655 --amendment docs/architecture/decisions/issue-542-diagnostic-owner-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Extract one nominal diagnostic owner with identical model facades, existing wire vocabulary, actual typed producers and independent API Target. Whole diagnostic module has no string-control exception. No baseline/cap/allowance increase. See docs/architecture/typed-diagnostic-owner.md.' > "$RUNNER_TEMP/diagnostic-native.json"
          diagnostic_status=$?
          set -e
          python - "$RUNNER_TEMP/diagnostic-native.json" <<'PY'
          import json,pathlib,sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("DIAGNOSTIC_NATIVE_RESULT="+json.dumps({key:result.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status","unresolved_call_changes")},separators=(",",":")))
          path=pathlib.Path("docs/architecture/decisions/issue-542-diagnostic-owner-amendment.json")
          if path.exists(): print("AMENDMENT_JSON="+json.dumps(json.loads(path.read_text()),separators=(",",":")))
          PY
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/diagnostic-after.json" > "$RUNNER_TEMP/diagnostic-after-result.json"
          git worktree add --detach "$RUNNER_TEMP/diagnostic-before" 5933ffbbfd588ac96e36748de937cb1f6e739655
          uv run --locked archkeel report --root "$RUNNER_TEMP/diagnostic-before" --output "$RUNNER_TEMP/diagnostic-before.json" > "$RUNNER_TEMP/diagnostic-before-result.json"
          uv run --locked python - "$RUNNER_TEMP/diagnostic-before.json" "$RUNNER_TEMP/diagnostic-after.json" <<'PY'
          import json,pathlib,sys
          from dataclasses import asdict
          import ast,os,re
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.check.ratchets import unknown_positions_by_rule,call_rows
          from archkeel.ir.trace import trace_valid_violations
          from archkeel.ir.report_graph import architecture_report
          def read(path): return parse_observation(decode_canonical_model(json.loads(pathlib.Path(path).read_text())))
          before,after=(read(path) for path in sys.argv[1:])
          def types(model):
              return {
                  row.id: {"id":row.id,"kind":row.kind,"rule_ids":row.rule_ids,**{key:row.data.get(key) for key in ("qualified_name","position","path","annotation","nested_annotation","reason")}}
                  for row in model.records("unknowns") or ()
                  if row.kind in {"boundary_type_position","boundary_type_route"}
              }
          def stable_caller(caller):
              return re.sub(r"<(genexpr|listcomp|dictcomp|setcomp):[0-9]+:[0-9]+>",r"<\1>",caller)
          def unresolved(model):
              result={}
              for row in call_rows(model):
                  if row.status=="unresolved":
                      result.setdefault((row.path,stable_caller(row.caller),row.expression),[]).append(asdict(row))
              return result
          old,new=types(before),types(after)
          old_calls,new_calls=unresolved(before),unresolved(after)
          before_root=pathlib.Path(os.environ["RUNNER_TEMP"])/"diagnostic-before"
          def class_method(path,classname,methodname):
              tree=ast.parse(path.read_text())
              cls=next(node for node in tree.body if isinstance(node,ast.ClassDef) and node.name==classname)
              return next(node for node in cls.body if isinstance(node,ast.FunctionDef) and node.name==methodname)
          old_diagnostic=class_method(before_root/"src/archkeel/ir/model.py","Diagnostic","__post_init__")
          new_diagnostic=class_method(pathlib.Path("src/archkeel/ir/diagnostics.py"),"Diagnostic","__post_init__")
          old_generators=[ast.dump(node,include_attributes=False) for node in ast.walk(old_diagnostic) if isinstance(node,ast.GeneratorExp)]
          new_generators=[ast.dump(node,include_attributes=False) for node in ast.walk(new_diagnostic) if isinstance(node,ast.GeneratorExp)]
          assert old_generators==new_generators,"Existing diagnostic strip generator changed"
          old_error=class_method(before_root/"src/archkeel/ir/model.py","DiagnosticError","__init__")
          new_error=class_method(pathlib.Path("src/archkeel/ir/diagnostics.py"),"DiagnosticError","__init__")
          assert ast.dump(old_error,include_attributes=False)==ast.dump(new_error,include_attributes=False),"Existing diagnostic exception constructor changed"
          growing_sites=[{"before":old_calls[key],"after":new_calls[key]} for key in old_calls.keys()&new_calls.keys() if len(new_calls[key])>len(old_calls[key])]
          assert not growing_sites,growing_sites
          new_sites=new_calls.keys()-old_calls.keys()
          removed_sites=old_calls.keys()-new_calls.keys()
          relocation_pairs=[]
          for key in sorted(new_sites):
              old_key=(key[0].replace("src/archkeel/ir/diagnostics.py","src/archkeel/ir/model.py"),key[1].replace("archkeel.ir.diagnostics.Diagnostic","archkeel.ir.model.Diagnostic"),key[2])
              assert old_key in removed_sites,(key,old_key)
              assert key[2] in {"value.strip","super().__init__"},key
              assert len(old_calls[old_key])==len(new_calls[key]),(old_calls[old_key],new_calls[key])
              relocation_pairs.append({"before":old_calls[old_key],"after":new_calls[key]})
          assert len(relocation_pairs)==len(removed_sites),"Unexplained removed unresolved site"
          summary={
              "before_ref":"5933ffbbfd588ac96e36748de937cb1f6e739655",
              "before_calls":before.coverage.calls_unresolved,
              "after_calls":after.coverage.calls_unresolved,
              "before_unknown":unknown_positions_by_rule(before),
              "after_unknown":unknown_positions_by_rule(after),
              "new_type_positions":[new[key] for key in sorted(new.keys()-old.keys())],
              "resolved_type_positions":[old[key] for key in sorted(old.keys()-new.keys())],
              "changed_existing_type_positions":[{"before":old[key],"after":new[key]} for key in sorted(old.keys()&new.keys()) if old[key]!=new[key]],
              "new_unresolved_sites":[row for key in sorted(new_calls.keys()-old_calls.keys()) for row in new_calls[key]],
              "removed_unresolved_sites":[row for key in sorted(old_calls.keys()-new_calls.keys()) for row in old_calls[key]],
              "proved_call_relocations":relocation_pairs,
              "growing_existing_unresolved_sites":growing_sites,
              "unchanged_strip_generator_and_exception_constructor":True,
              "all_after_type_positions":[new[key] for key in sorted(new)],
          }
          comparison=architecture_report(after).comparison
          summary["graph_failures"]=[asdict(row) for row in comparison.assessments if row.status=="FAIL"] if comparison else None
          summary["violations"]=repr(trace_valid_violations(after))
          print("DIAGNOSTIC_POSITION_EVIDENCE="+json.dumps(summary,separators=(",",":")))
          assert not summary["new_type_positions"],summary
          assert summary["after_calls"]<=summary["before_calls"],summary
          assert not trace_valid_violations(after),summary
          assert summary["graph_failures"]==[],summary
          PY
          exit "$diagnostic_status"
