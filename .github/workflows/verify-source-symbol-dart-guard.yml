name: Verify canonical source tags preserve Dart module intent
on:
  push:
    branches: ['verify/542-source-symbol-dart-guard']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a3696da9a0c71825d1df2df47c1cce990c28c1af
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.11.12'
          version: '0.12.13'
      - run: uv sync --locked
      - run: uv run --locked pytest -q tests/test_dart_typed_controls.py tests/test_typescript_control_target.py
      - run: git diff --exit-code
