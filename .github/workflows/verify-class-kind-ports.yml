name: Python classifier fixed-intent port guards
on:
  push:
    branches: ["verify/542-class-kind-ports"]
permissions:
  contents: read
jobs:
  fixed-intent-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0bbe7e39e6ce8c0da90cfba08b4f8168b55251ad
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked ruff format --check tests/test_typed_symbol_class_kinds.py
          uv run --locked ruff check tests/test_typed_symbol_class_kinds.py
          uv run --locked pytest tests/test_typed_symbol_class_kinds.py -q
          git diff --exit-code
