name: Source binding facets RED
on:
  push:
    branches: [verify/542-source-binding-facets-red]
permissions:
  contents: read
jobs:
  actual-producer-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ccaa4df77f0a2404782a6b9b403c06a655cad8e
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked pytest -q tests/test_source_binding_facets.py
