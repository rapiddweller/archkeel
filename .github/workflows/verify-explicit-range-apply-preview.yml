name: Verify frozen existing backlog report and real demos
on:
  push:
    branches: [verify/542-explicit-range-apply-preview]
permissions:
  contents: read
jobs:
  report-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1d03bb49b881ceb3e88abc43664ca27d86be710c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make ci-pr-report-check
      - run: git diff --exit-code
  compass-and-nest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1d03bb49b881ceb3e88abc43664ca27d86be710c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make browser-install browser-runtime-install
      - run: uv run --locked --with playwright==1.62.0 python -m pytest -n 2 --dist=loadfile --max-worker-restart=0 -q --durations=20 --junitxml=test-artifacts/pytest/frozen-real-demos.xml tests/test_compass_project_report.py tests/test_compass_project_target.py tests/test_nest_realworld_project_report.py tests/test_nest_realworld_project_target.py
      - run: git diff --exit-code
