name: Explain actual Main unresolved call cohorts without netting new sites
on:
  push:
    branches: [verify/542-explicit-range-apply-preview]
permissions:
  contents: read
jobs:
  actual-main-signed-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b4b3621dc73ea8fe6ade5c9edb5dc2ff8efd3243
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Apply the actual production AD100 comparison under each revision's own contract
        run: |
          uv run --locked python - <<'PY'
          import dataclasses,json,subprocess
          from pathlib import Path
          from archkeel.check.ratchets import call_rows, measure_python_ratchets, unresolved_call_changes
          from archkeel.check.run import observe_revision
          from archkeel.cli.config import load_config
          from archkeel.cli.observe import observe
          from archkeel.ir.facts import SourceResolution
          root=Path.cwd()
          config=load_config(root)
          before=observe_revision(observe,root,"113318809036cfa4550b2b8598dab63c0b548878",config,declared_at="113318809036cfa4550b2b8598dab63c0b548878")
          after=observe_revision(observe,root,"b4b3621dc73ea8fe6ade5c9edb5dc2ff8efd3243",config,declared_at="b4b3621dc73ea8fe6ade5c9edb5dc2ff8efd3243")
          assert not before.diagnostics and before.observation is not None,before.diagnostics
          assert not after.diagnostics and after.observation is not None,after.diagnostics
          old=tuple(row for row in call_rows(before.observation) if row.status is SourceResolution.UNRESOLVED)
          new=tuple(row for row in call_rows(after.observation) if row.status is SourceResolution.UNRESOLVED)
          rows=tuple(unresolved_call_changes(before.observation,after.observation))
          added=sum(row.after-row.before for row in rows if row.after>row.before)
          removed=sum(row.before-row.after for row in rows if row.before>row.after)
          assert len(old)==865 and len(new)==837,(len(old),len(new))
          assert added-removed==len(new)-len(old),(added,removed)
          summary={"before_revision":"113318809036cfa4550b2b8598dab63c0b548878","after_revision":"b4b3621dc73ea8fe6ade5c9edb5dc2ff8efd3243","before_unresolved":len(old),"after_unresolved":len(new),"added_multiplicity":added,"removed_multiplicity":removed,"signed_net":added-removed,"changed_logical_groups":len(rows),"logical_identity":["path","caller","expression"]}
          print("ACTUAL_MAIN_SIGNED_CALL_SUMMARY="+json.dumps(summary),flush=True)
          for row in rows:print("ACTUAL_MAIN_SIGNED_CALL_GROUP="+json.dumps(dataclasses.asdict(row)),flush=True)
          for name,model in (("before",before.observation),("after",after.observation)):
              print("SIGNED_MEASUREMENTS_"+name.upper()+"="+json.dumps(dataclasses.asdict(measure_python_ratchets(model))),flush=True)
          assert subprocess.check_output(["git","status","--porcelain"])==b""
          
          PY
