          assert ast.dump(NoDocs().visit(ast.parse(before)))==ast.dump(NoDocs().visit(ast.parse(after)))
          print("COLLECTION_PRODUCT_AST_IDENTICAL_EXCEPT_DOCSTRING=True",flush=True)
