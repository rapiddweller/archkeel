name: Architecture declaration control proof
on:
  push:
    branches: ["verify/542-architecture-declaration-kinds"]
permissions:
  contents: read
jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aeed50e9edb39196c0edcaa013d7ff6f655eb320
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual native and runtime RED to GREEN
        run: uv run --locked pytest -q -s tests/test_typed_contract_rule_grammar.py::test_authored_declaration_readers_share_owned_kinds_and_keep_extensions_open tests/test_typed_contract_rule_native.py::test_native_actual_rule_and_declaration_selectors_use_the_owned_api
      - name: Strict affected production
        if: always()
        run: uv run --locked mypy --strict src/archkeel/ir/architecture_graph.py src/archkeel/ir/interfaces.py src/archkeel/ir/levels.py src/archkeel/ir/decisions.py src/archkeel/ir/module_explore.py src/archkeel/check/uml.py src/archkeel/check/observation.py src/archkeel/check/report.py src/archkeel/check/validation/public_api.py src/archkeel/check/validation/observation.py src/archkeel/ir/report_projection.py src/archkeel/ir/codec_result.py src/archkeel/render/atlas.py src/archkeel/check/declarations.py src/archkeel/ir/duplication.py src/archkeel/render/html.py src/archkeel/ir/baseline.py src/archkeel/ir/widening.py src/archkeel/ir/source_graph.py src/archkeel/check/uml_evaluation.py src/archkeel/ir/report_graph.py src/archkeel/ir/model.py
  format-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aeed50e9edb39196c0edcaa013d7ff6f655eb320
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Observe authoritative formatting changes without publishing them
        run: |
          uv run --locked python - <<'PY'
          import json,subprocess
          paths=["src/archkeel/ir/architecture_graph.py","src/archkeel/ir/interfaces.py","src/archkeel/ir/levels.py","src/archkeel/ir/decisions.py","src/archkeel/ir/module_explore.py","src/archkeel/check/uml.py","src/archkeel/check/observation.py","src/archkeel/check/report.py","src/archkeel/check/validation/public_api.py","src/archkeel/check/validation/observation.py","src/archkeel/ir/report_projection.py","src/archkeel/ir/codec_result.py","src/archkeel/render/atlas.py","src/archkeel/check/declarations.py","src/archkeel/ir/duplication.py","src/archkeel/render/html.py","src/archkeel/ir/baseline.py","src/archkeel/ir/widening.py","src/archkeel/ir/source_graph.py","tools/rule_yield.py","src/archkeel/check/uml_evaluation.py","src/archkeel/ir/report_graph.py","src/archkeel/ir/model.py","tests/test_typed_contract_rule_grammar.py","tests/test_typed_contract_rule_native.py"]
          for args in (["ruff","check","--fix",*paths],["ruff","format",*paths],["ruff","check",*paths]):
              result=subprocess.run(["uv","run","--locked",*args],capture_output=True,text=True)
              print("QUALITY_COMMAND="+json.dumps({"command":args,"exit_code":result.returncode}))
              print(result.stdout)
              print(result.stderr)
          patch=subprocess.check_output(["git","diff","--no-ext-diff","--",*paths],text=True)
          print("AUTHORITATIVE_FORMAT_DIFF="+json.dumps(patch))
          PY
