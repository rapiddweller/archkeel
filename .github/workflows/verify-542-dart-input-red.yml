name: Dart owned input grammar native RED
on:
  push:
    branches: [verify/542-dart-input-grammar-red]
permissions:
  contents: read
jobs:
  api-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Real unchanged-source API and behavior RED
        run: uv run --locked python -m pytest -q tests/test_dart_input_grammar.py --tb=short
      - name: Actual public constructors and documented consumers
        if: ${{ always() }}
        run: git grep -n -E 'ResolvedBinding|Site\(' -- src tests docs
  native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual guarded Dart sources with fixed Target and real f624 predicate observer
        run: |
          PYTHONPATH=tests uv run --locked python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from test_dart_typed_controls import _model, _repository
          from archkeel.ir.trace import trace_valid_violations
          with TemporaryDirectory(prefix="dart-grammar-native-red-") as directory:
              root, config = _repository(Path(directory))
              intent = (root / "contract.json").read_bytes()
              model = _model(root, config)
              violations = trace_valid_violations(model)
              constructs = {row.id: row for row in model.records("constructs")}
              evidence = {row.id: row for row in model.evidence}
              rows = []
              for violation in violations:
                  for identity in violation.fact_ids:
                      record = constructs.get(identity)
                      if record is None:
                          continue
                      for site_id in record.evidence_ids:
                          site = evidence[site_id]
                          row = dict(violation=violation.id, construct=identity, rules=violation.rule_ids, owner=record.data.get("owner"), form=record.data.get("form"), path=site.file, line=site.line, column=site.column, excerpt=site.excerpt)
                          rows.append(row)
                          print("DART_INPUT_NATIVE_RED=" + json.dumps(row, sort_keys=True), flush=True)
              print("DART_INPUT_NATIVE_COUNTS=" + json.dumps(dict(Counter(row["path"] for row in rows)), sort_keys=True), flush=True)
              assert (root / "contract.json").read_bytes() == intent
              assert not violations, "unchanged guarded Dart implementation still dispatches on written literal grammar"
          PY
