name: Compare actual sites and reference candidates
on:
  push:
    branches: [verify/542-sites-and-candidates]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5933ffbbfd588ac96e36748de937cb1f6e739655
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Observe both exact source trees with the same native engine
        run: |
          git worktree add --detach "$RUNNER_TEMP/site-before" 6c0083535d34ba84c8bd648474e87b7142ab0653
          uv run --locked archkeel report --root "$RUNNER_TEMP/site-before" --output "$RUNNER_TEMP/site-before.json" > "$RUNNER_TEMP/site-before-result.json"
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/site-after.json" > "$RUNNER_TEMP/site-after-result.json"
      - name: Compare actual position and call multisets
        run: |
          uv run --locked python - <<'PY'
          from collections import Counter
          from dataclasses import asdict
          import json, os, pathlib
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          from archkeel.check.ratchets import call_rows, unknown_positions_by_rule
          from archkeel.ir.references import unreferenced_symbols
          def read(name):
              data = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / name).read_text())
              return parse_observation(decode_canonical_model(data))
          before, after = read("site-before.json"), read("site-after.json")
          def calls(model):
              return Counter(
                  (row.path, row.caller, row.expression, row.status, row.reason)
                  for row in call_rows(model)
              )
          old_calls, new_calls = calls(before), calls(after)
          def positions(model):
              return {
                  row.id: {"id": row.id, "kind": row.kind, "rule_ids": list(row.rule_ids),
                           **{key: row.data.get(key) for key in ("qualified_name", "position", "path", "annotation", "nested_annotation", "reason")}}
                  for row in model.records("unknowns") or ()
                  if row.kind in {"boundary_type_position", "boundary_type_route"}
              }
          old, new = positions(before), positions(after)
          evidence = {
              "before_ref": "6c0083535d34ba84c8bd648474e87b7142ab0653", "after_ref": "5933ffbbfd588ac96e36748de937cb1f6e739655",
              "before_calls": before.coverage.calls_unresolved,
              "after_calls": after.coverage.calls_unresolved,
              "new_unresolved_calls": [{"site": key, "count": count} for key, count in sorted((new_calls-old_calls).items())],
              "removed_unresolved_calls": [{"site": key, "count": count} for key, count in sorted((old_calls-new_calls).items())],
              "before_unknown": unknown_positions_by_rule(before),
              "after_unknown": unknown_positions_by_rule(after),
              "new_type_positions": [new[key] for key in sorted(new.keys()-old.keys())],
              "resolved_type_positions": [old[key] for key in sorted(old.keys()-new.keys())],
              "changed_type_positions": [{"before": old[key], "after": new[key]} for key in sorted(old.keys() & new.keys()) if old[key] != new[key]],
              "all_before_positions": list(old.values()), "all_after_positions": list(new.values()),
          }
          print("ACTUAL_SITE_EVIDENCE=" + json.dumps(evidence, separators=(",", ":")))
          before_refs = unreferenced_symbols(before)
          after_refs = unreferenced_symbols(after)
          old_names = {row.name for row in before_refs.candidates}
          new_names = {row.name for row in after_refs.candidates}
          print("REFERENCE_CANDIDATE_EVIDENCE=" + json.dumps({
              "before": [asdict(row) for row in before_refs.candidates],
              "after": [asdict(row) for row in after_refs.candidates],
              "new_candidates": sorted(new_names-old_names),
              "removed_candidates": sorted(old_names-new_names),
          }, separators=(",", ":")))
          assert not evidence["new_unresolved_calls"], evidence
          assert not evidence["new_type_positions"], evidence
          PY
