name: Verify bounded string comparison observation

on:
  push:
    branches: [verify/542-string-comparison-observation]

permissions:
  contents: read

jobs:
  detector:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Native source controls
        run: |
          PYTHONPATH=src uv run --locked python - <<'PY'
          from pathlib import Path
          from archkeel.cli.observe import observe
          root = Path.cwd()
          result = observe(root, roots=("src/archkeel",), namespace="archkeel",
              contract="architecture-contract.json", git_head="c7a8cdaa4011c0e787f3aa41bf959bd23ef4e3e9",
              dirty=False, contract_root=root)
          assert result.observation is not None, result.diagnostics
          for row in result.observation.records("calls") or ():
              if row.data.get("module") == "archkeel.analyzer.python.constructs":
                  print("CALL_DIAGNOSTIC=" + repr(dict(row.data.entries)))
          PY
