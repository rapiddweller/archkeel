name: Generate normal host event integration metadata
on:
  push:
    branches: [verify/542-host-order-metadata]
permissions:
  contents: read
jobs:
  affected-and-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7db534347cd6a60f7a109af216e55b1169c981ac
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked pytest -q tests/test_typed_host_events.py tests/test_ordering.py tests/test_host_gitlab.py tests/test_make_gate.py tests/test_enum_graph.py tests/test_repository_hygiene.py
      - run: |
          uv run --locked ruff check src/archkeel/ir/host_records.py src/archkeel/check/ordering.py tests/test_typed_host_events.py
          uv run --locked ruff format --check src/archkeel/ir/host_records.py src/archkeel/check/ordering.py tests/test_typed_host_events.py
          make typecheck
          git diff --exit-code
  normal-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7db534347cd6a60f7a109af216e55b1169c981ac
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Generate exact normal baseline and receipt, then validate without writes
        run: |
          uv run --locked python - <<'PY'
          import json,subprocess
          from pathlib import Path
          base=["uv","run","--locked","archkeel","validate","--root",".","--baseline","architecture-baseline.json"]
          receipt="docs/architecture/decisions/issue-542-host-events-amendment.json"
          against=["--against","68b656668a3fdbbbe482881d0dab41ff89a21ca3","--amendment",receipt]
          for label,args in [
              ("WRITE_BASELINE",["--write-baseline","--json"]),
              ("WRITE_RECEIPT",against+["--write-amendment","--decided-by","ake2l","--rationale","Own host ordering events and enforce their typed API.","--json"]),
              ("NORMAL_NO_WRITE",against+["--json"]),
          ]:
              result=subprocess.run(base+args,capture_output=True,text=True)
              print("HOST_"+label+"_EXIT="+str(result.returncode),flush=True)
              if result.stderr:
                  print(result.stderr,flush=True)
              print("HOST_"+label+"_JSON="+result.stdout,flush=True)
              assert result.returncode==0
              value=json.loads(result.stdout)
              assert value["exit_code"]==0 and not value["failures"] and not value["diagnostics"]
              if label=="NORMAL_NO_WRITE":
                  assert value["amendment_status"]=="valid"
          for path in ["architecture-baseline.json",receipt]:
              print("HOST_GENERATED_FILE_JSON="+json.dumps({"path":path,"content":Path(path).read_text()},separators=(",",":")),flush=True)
          subprocess.run(["git","diff","--stat"],check=True)
          
          PY
