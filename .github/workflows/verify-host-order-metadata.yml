name: Read-only host test formatting and strict proof
on:
  push:
    branches: [verify/542-host-order-metadata]
permissions:
  contents: read
jobs:
  format-and-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7db534347cd6a60f7a109af216e55b1169c981ac
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Export exact formatter output without modifying Source
        run: |
          uv run --locked ruff format --stdin-filename tests/test_typed_host_events.py < tests/test_typed_host_events.py > "$RUNNER_TEMP/host-events-formatted.py"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"host-events-formatted.py"
          print("HOST_FORMATTED_TEST_JSON="+json.dumps(path.read_text()))
          PY
          make typecheck
          git diff --exit-code
