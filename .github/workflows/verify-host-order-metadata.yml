name: RED for the host converter accepted input domain
on:
  push:
    branches: [verify/542-host-order-metadata]
permissions:
  contents: read
jobs:
  accepted-input-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bbd0c410eee543012cafb9e3a172e22dfcaa7686
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked pytest -q tests/test_typed_host_events.py::test_actual_ordering_port_returns_the_owned_nominal_event
