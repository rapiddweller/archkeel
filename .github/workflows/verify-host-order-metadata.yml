name: Verify frozen committed host event integration
on:
  push:
    branches: [verify/542-host-order-metadata]
permissions:
  contents: read
jobs:
  frozen-committed-no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f051e6deee7de905984c1e648376fb88a07cc8a2
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Pin the previously verified product source and unchanged baseline
        run: |
          test "$(git rev-parse HEAD)" = "f051e6deee7de905984c1e648376fb88a07cc8a2"
          git diff --exit-code 27775d6f2c5c22a846a9c1dfbe06d573fbbbe966 -- src schema architecture-baseline.json architecture-contract.json docs/architecture/contracts Makefile tests
          git diff --exit-code 68b656668a3fdbbbe482881d0dab41ff89a21ca3 -- architecture-baseline.json
      - name: Verify actual committed receipt without any writer
        run: |
          uv run --locked python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          command=["uv","run","--locked","archkeel","validate","--root",".","--baseline","architecture-baseline.json","--against","68b656668a3fdbbbe482881d0dab41ff89a21ca3","--amendment","docs/architecture/decisions/issue-542-host-events-amendment.json","--json"]
          result=subprocess.run(command,capture_output=True,text=True)
          if result.stderr:
              print(result.stderr,flush=True)
          value=json.loads(result.stdout)
          print("HOST_COMMITTED_NO_WRITE="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status","widenings")},separators=(",",":")),flush=True)
          placement=next(row for row in value["rule_assessments"] if row["id"]=="TYPES-ENUM-IN-MODEL")
          print("HOST_COMMITTED_PLACEMENT="+json.dumps(placement,separators=(",",":")),flush=True)
          assert result.returncode==0 and value["exit_code"]==0 and value["amendment_status"]=="valid"
          assert not value["failures"] and not value["diagnostics"] and not value["widenings"]
          assert placement["status"]=="PASS" and placement["evaluation_proven"]
          scalars=value["measurements"]["scalars"]
          assert scalars["typing_positions"]==52 and scalars["unknown_positions"]==58 and scalars["violations"]==0
          assert subprocess.check_output(["git","status","--porcelain","--untracked-files=all"],text=True)==""
          subprocess.run(["git","diff","--exit-code"],check=True)
          
          PY
