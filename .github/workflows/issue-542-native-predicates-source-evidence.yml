name: Native predicates exact source and call evidence
on:
  push:
    branches: [verify/542-native-predicates-source-evidence]
permissions:
  contents: read
jobs:
  native-self-and-call-deltas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f624d99286983fa0e26aff5e87835c359ba63d55
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Observe exact predecessor and candidate source with fixed engine
        run: |
          git worktree add --detach "$RUNNER_TEMP/predicate-before" de6f57f4f49b368373d40e8584e48761ab4b19b1
          uv run --locked archkeel report --root "$RUNNER_TEMP/predicate-before" --output "$RUNNER_TEMP/predicate-before.json" > "$RUNNER_TEMP/predicate-before.stdout"
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/predicate-after.json" > "$RUNNER_TEMP/predicate-after.stdout"
      - name: Verify complete UNKNOWN and call-site multisets and canonical metadata bytes
        run: |
          uv run --locked python - <<'PY'
          import ast,collections,dataclasses,gzip,hashlib,json,os,re,subprocess,sys,tempfile
          from pathlib import Path
          from archkeel.check.ratchets import call_rows,measure_python_ratchets,unresolved_call_changes
          from archkeel.ir.codec import canonical_report_bytes,decode_canonical_model,parse_observation,value_bytes
          from archkeel.ir.decisions import rule_uncertainty_evidence,rule_assessments,unknown_positions_by_rule
          from archkeel.ir.report_graph import architecture_report
          temporary=Path(os.environ["RUNNER_TEMP"])
          directory=temporary/"predicate-native-evidence"
          directory.mkdir()
          models={label:parse_observation(decode_canonical_model(json.loads((temporary/("predicate-"+label+".json")).read_bytes()))) for label in ("before","after")}
          def emit(marker,value): print(marker+"="+json.dumps(value,sort_keys=True),flush=True)
          def fingerprint(model):
              values={kind:collections.Counter() for kind in ("positions","routes","other")}
              for rule,uncertainty in rule_uncertainty_evidence(model).items():
                  for record in uncertainty.evidence:
                      row={"rule":rule,"id":record.id,"kind":record.kind,"data":json.loads(value_bytes(record.data))}
                      kind=None
                      if record.kind=="boundary_type_position":
                          if record.data.get("reason")!="external_type": kind="positions"
                      elif record.kind=="boundary_type_route": kind="routes"
                      elif record.kind!="boundary_type_limit": kind="other"
                      if kind: values[kind][json.dumps(row,sort_keys=True)]+=1
              return values
          fp={label:fingerprint(model) for label,model in models.items()}
          for label,model in models.items():
              measured=measure_python_ratchets(model)
              call_rows(model)
              emit("NATIVE_SNAPSHOT",{"label":label,"head":model.source.git_head,"digest":model.source.source_digest,"scalars":dict(measured.scalars.items()),"calls_total":measured.calls_total,"partial":model.coverage.calls_partially_resolved,"unknown_by_rule":unknown_positions_by_rule(model)})
          for kind in ("positions","routes","other"):
              old,new=fp["before"][kind],fp["after"][kind]
              emit("UNKNOWN_DIFF",{"kind":kind,"before":sum(old.values()),"after":sum(new.values()),"added":[json.loads(row) for row in sorted((new-old).elements())],"removed":[json.loads(row) for row in sorted((old-new).elements())]})
          path="src/archkeel/analyzer/python/constructs.py"
          sources={"before":subprocess.check_output(["git","show","de6f57f4f49b368373d40e8584e48761ab4b19b1:"+path]).decode(),"after":Path(path).read_text()}
          indexes={}
          for label,source in sources.items():
              tree=ast.parse(source)
              parents={child:parent for parent in ast.walk(tree) for child in ast.iter_child_nodes(parent)}
              calls=collections.defaultdict(list)
              for node in ast.walk(tree):
                  if isinstance(node,ast.Call): calls[node.lineno,node.col_offset].append(node)
              indexes[label]=(parents,calls)
          proofs=[]
          unmatched=[]
          def normalize(label,data,site):
              caller=data["source_scope"]
              if site.file!=path: return caller
              parents,calls=indexes[label]
              candidates=[node for node in calls[site.line,site.column] if ast.unparse(node.func)==data["expression"]]
              if len(candidates)!=1:
                  unmatched.append({"label":label,"caller":caller,"line":site.line,"column":site.column,"expression":data["expression"]})
                  return caller
              named=re.sub(r"\.<(?:genexpr|listcomp|setcomp|dictcomp|lambda):\d+:\d+>","",caller)
              if named==caller: return caller
              call=candidates[0]
              bindings=[]
              parent=parents.get(call)
              while parent is not None:
                  if isinstance(parent,(ast.ClassDef,ast.FunctionDef,ast.AsyncFunctionDef)): break
                  if isinstance(parent,(ast.GeneratorExp,ast.ListComp,ast.SetComp,ast.DictComp)):
                      bindings.append({"kind":type(parent).__name__,"generators":[{"target":ast.dump(g.target,include_attributes=False),"iter":ast.dump(g.iter,include_attributes=False),"is_async":g.is_async} for g in parent.generators]})
                  elif isinstance(parent,ast.Lambda):
                      bindings.append({"kind":"Lambda","arguments":ast.dump(parent.args,include_attributes=False)})
                  parent=parents.get(parent)
              body=ast.dump(call,include_attributes=False)
              anchor=json.dumps({"call":body,"bindings":bindings},sort_keys=True)
              normalized=named+".<operation:"+hashlib.sha256(anchor.encode()).hexdigest()[:24]+">"
              proofs.append({"label":label,"path":path,"raw_caller":caller,"normalized_caller":normalized,"line":site.line,"column":site.column,"call_ast":body,"closure_bindings":bindings})
              return normalized
          counters={label:collections.Counter() for label in models}
          full=[]
          focused=[]
          for label,model in models.items():
              evidence={item.id:item for item in model.evidence}
              for record in model.records("calls"):
                  data=json.loads(value_bytes(record.data))
                  [site]=[evidence[identity] for identity in record.evidence_ids]
                  if site.file==path:
                      focused.append({"label":label,"id":record.id,"line":site.line,"column":site.column,"excerpt":site.excerpt,"data":data})
                  if data["status"] not in {"unresolved","partially_resolved"}: continue
                  row={"path":site.file,"caller":normalize(label,data,site),"status":data["status"],"expression":data["expression"],"reason":data["reason"],"targets":sorted(data["targets"])}
                  counters[label][json.dumps(row,sort_keys=True)]+=1
                  full.append({"label":label,"id":record.id,"line":site.line,"column":site.column,"raw_caller":data["source_scope"],"normalized":row})
          emit("AST_JOIN",{"unmatched":unmatched,"scope":"changed constructs.py calls; exact AST call/arguments and comprehension target/iterables; no complete-body/filter identity claim"})
          deltas=[]
          for key in sorted(counters["before"].keys()|counters["after"].keys()):
              old,new=counters["before"][key],counters["after"][key]
              if old!=new:
                  item={**json.loads(key),"before":old,"after":new}
                  deltas.append(item)
                  emit("CALL_MULTISET_DIFF",item)
          for status in ("unresolved","partially_resolved"):
              chosen=[item for item in deltas if item["status"]==status]
              emit("CALL_MULTISET_COUNTS",{"status":status,"before":sum(count for key,count in counters["before"].items() if json.loads(key)["status"]==status),"after":sum(count for key,count in counters["after"].items() if json.loads(key)["status"]==status),"added":sum(max(item["after"]-item["before"],0) for item in chosen),"removed":sum(max(item["before"]-item["after"],0) for item in chosen)})
          emit("RAW_UNRESOLVED_CHANGES",[dataclasses.asdict(item) for item in unresolved_call_changes(models["before"],models["after"])])
          for row in focused:
              if row["label"]=="after" and any(value in row["data"]["source_scope"] for value in ("_string_predicate","._LiteralComparisons.predicate","._literal_collections","ConstructCollector.visit_Call")):
                  emit("PREDICATE_CALL",row)
          target=architecture_report(models["after"]).comparison
          emit("NATIVE_TARGET",dataclasses.asdict(target) if target is not None else None)
          for row in rule_assessments(models["after"],undecided_by_rule={}):
              if row.kind=="uml_target": emit("TARGET_RULE",dataclasses.asdict(row))
          # Actual native process and canonical result bytes, including both new form strings.
          sys.path.insert(0,"tests")
          from test_analyzer import _observe,_observe_one_rule
          from test_string_comparison_observation import RULE
          source='from enum import Enum\nclass Token(Enum):\n    VALUE="x"\ndef parse(value):\n    return value.startswith(b"x") or value.endswith(("y", Token.VALUE))\n'
          with tempfile.TemporaryDirectory() as folder:
              root=Path(folder)
              first=_observe_one_rule(root,RULE,{"core.py":source})
              second=_observe(root)
              assert not first.diagnostics and not second.diagnostics
              assert first.observation is not None and second.observation is not None
              forms=sorted(row.data.get("form") for row in first.observation.records("constructs"))
              assert forms==["endswith","startswith"],forms
              before_bytes,after_bytes=canonical_report_bytes(first.observation),canonical_report_bytes(second.observation)
              assert before_bytes==after_bytes
              emit("CANONICAL_PREDICATE_BYTES",{"forms":forms,"bytes":len(before_bytes),"sha256":hashlib.sha256(before_bytes).hexdigest(),"repeated_native_reports_identical":True})
          archive={"calls":full,"focused_source_calls":focused,"counters":{label:[{"row":json.loads(key),"multiplicity":count} for key,count in sorted(counter.items())] for label,counter in counters.items()},"deltas":deltas,"normalization_proofs":proofs,"unknown_fingerprints":{label:{kind:[{"row":json.loads(key),"multiplicity":count} for key,count in sorted(counter.items())] for kind,counter in values.items()} for label,values in fp.items()}}
          payload=json.dumps(archive,sort_keys=True,separators=(",",":")).encode()
          (directory/"complete-call-unknown-proof.json.gz").write_bytes(gzip.compress(payload,mtime=0))
          emit("COMPLETE_PROOF",{"json_bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest(),"gzip_bytes":(directory/"complete-call-unknown-proof.json.gz").stat().st_size})
          emit("EXACT_HEAD",{"head":subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip(),"dirty":subprocess.check_output(["git","status","--porcelain"]).decode()})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-predicate-call-unknown-proof
          path: ${{ runner.temp }}/predicate-native-evidence
          retention-days: 14
