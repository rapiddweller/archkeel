name: Delta dimension RED diagnostic
on:
  push:
    branches: [verify/542-delta-dimension-red-diagnostic]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Read actual native preflight diagnostic before production
        run: |
          uv run --locked python - <<'PY'
          import json,sys,tempfile,pathlib
          sys.path.insert(0,"tests")
          from test_delta_dimension_types import _repository
          from archkeel.check.report import run_report
          from archkeel.cli.observe import observe
          with tempfile.TemporaryDirectory() as directory:
              root,config=_repository(pathlib.Path(directory))
              result,encoded=run_report(root,config=config,analyzer=observe)
              print("DELTA_DIMENSION_RED_DIAGNOSTIC="+json.dumps({"exit_code":result.exit_code,"diagnostics":[{"kind":str(x.kind),"subject":x.subject,"message":x.message} for x in result.diagnostics]},sort_keys=True))
              assert result.exit_code==2
          PY
