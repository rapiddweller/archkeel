name: Verify integrated module-object grants
on:
  push:
    branches: [verify/544-integrated-checks]
permissions:
  contents: read
jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Lint and types
        run: make lint typecheck
      - name: Integrated native feature controls
        run: |
          uv run --locked python -m pytest -q tests/test_module_object_grants.py tests/test_typed_state_protocol.py tests/test_state_facts.py tests/test_dependency_api_target.py tests/test_dependency_typed_control.py tests/test_string_comparison_observation.py tests/test_contract_model.py tests/test_codec_compatibility.py tests/test_repository_hygiene.py --maxfail=5
      - name: Schema regeneration
        run: |
          make architecture-graph-schema
          git diff --exit-code -- schema
