name: Native TypeScript written-string GREEN
on:
  push:
    branches: [verify/542-typescript-construct-green]
permissions:
  contents: read
jobs:
  native-green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Native TS JS evidence and independent optional receipts
        run: uv run --locked python -m pytest -q tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py --tb=short
      - name: TypeScript regressions and native API Target
        if: ${{ always() }}
        run: uv run --locked python -m pytest -q tests/test_typescript*.py tests/test_collection_capabilities.py tests/test_collection_boundary_regressions.py tests/test_source_trust_boundary.py tests/test_typed_collector_protocol.py tests/test_typed_collector_native.py tests/test_repository_hygiene.py --tb=short
      - name: Ruff check
        if: ${{ always() }}
        run: uv run --locked ruff check src/archkeel tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py tests/test_typescript_control_target.py
      - name: Ruff format diff
        if: ${{ always() }}
        run: uv run --locked ruff format --diff src/archkeel/analyzer/typescript/parse.py src/archkeel/analyzer/typescript/collect.py src/archkeel/analyzer/typescript/syntax.py src/archkeel/ir/profiles.py src/archkeel/ir/codec_observation.py tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py tests/test_typescript_control_target.py
      - name: Strict type check
        if: ${{ always() }}
        run: uv run --locked mypy src/archkeel
      - name: Pinned compiler reference
        if: ${{ always() }}
        run: make typescript-compiler-check
