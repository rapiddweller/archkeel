name: Full TS compatibility on actual 838 metadata and nominal catalog
on:
  push:
    branches: [verify/542-wrapper-838-full-typescript]
permissions:
  contents: read
jobs:
  complete-ts-compiler-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1ff6cef335117fcb35cc86a555ee2ab9db074e1f
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Apply only actual wrapper four paths and separate Measurement API catalog correction
        id: apply
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          temporary=Path(os.environ["RUNNER_TEMP"])
          paths=[
          "src/archkeel/analyzer/typescript/parse.py",
          "tests/test_typescript_string_constructs.py",
          "docs/architecture/typescript-written-string-controls.md",
          "docs/superpowers/plans/2026-10-17-typescript-literal-wrappers.md",
          ]
          basis="a25c37c564c82c1b42457f0528c931c769ee9362"
          feature="11173d0125f0e70b6ef592ae7eec70ec37665e73"
          accepted="1ff6cef335117fcb35cc86a555ee2ab9db074e1f"
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==accepted
          assert not subprocess.check_output(["git","status","--porcelain"],text=True)
          patch=subprocess.check_output(["git","diff","--binary",basis,feature,"--",*paths])
          (temporary/"wrapper-only.patch").write_bytes(patch)
          subprocess.run(["git","apply","--3way","--index",str(temporary/"wrapper-only.patch")],check=True)
          catalog="3e50a1764bffa24100892bf231e208e15919dacc"
          catalog_path="tests/test_typescript_demo.py"
          catalog_patch=subprocess.check_output(["git","diff","--binary",basis,catalog,"--",catalog_path])
          subprocess.run(["git","apply","--3way","--index","-"],input=catalog_patch,check=True)
          paths.append(catalog_path)
          def staged():
              names=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
              assert sorted(names)==sorted(paths),names
              assert not subprocess.check_output(["git","diff","--name-only"],text=True)
              return hashlib.sha256(subprocess.check_output(["git","diff","--cached","--binary"])).hexdigest()
          before=staged()
          for path in paths:
              assert Path(path).read_bytes()==subprocess.check_output(["git","show",(catalog if path==catalog_path else feature)+":"+path]),path
          tree=subprocess.check_output(["git","write-tree"],text=True).strip()
          unchanged=subprocess.check_output(["git","diff","--name-only",feature,tree,"--","src","docs/architecture/contracts","architecture-contract.json"],text=True).strip()
          assert not unchanged,unchanged
          baseline=json.loads(Path("architecture-baseline.json").read_text())
          print("EXACT_FIVE_PATHS_BEFORE="+json.dumps({"accepted_checkout":accepted,"feature":feature,"paths":sorted(paths),"staged_diff_sha256":before,"production_and_target_match_feature":True,"accepted_unresolved_limit":baseline["budgets"]["calls_unresolved"]}),flush=True)
          (temporary/"wrapper-patch-proof.json").write_text(json.dumps({"paths":sorted(paths),"staged_diff_sha256":before,"tree":tree}))
          
          PY
      - run: make lint
      - run: make typecheck
      - name: Complete pinned TypeScript compiler gate
        if: always() && steps.apply.outcome == 'success'
        run: make typescript-compiler-check
      - name: Complete actual TypeScript native Target differential and demo suite
        if: always() && steps.apply.outcome == 'success'
        run: uv run --locked python -m pytest -n 4 --max-worker-restart=0 -q tests/test_typescript*.py tests/test_repository_hygiene.py --junitxml="$RUNNER_TEMP/wrapper-838-full-typescript.xml"
      - name: Applied five paths remain exact and no other files changed
        if: always() && steps.apply.outcome == 'success'
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          before=json.loads((Path(os.environ["RUNNER_TEMP"])/"wrapper-patch-proof.json").read_text())
          names=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          after=hashlib.sha256(subprocess.check_output(["git","diff","--cached","--binary"])).hexdigest()
          assert sorted(names)==before["paths"],names
          assert after==before["staged_diff_sha256"],(before["staged_diff_sha256"],after)
          assert not subprocess.check_output(["git","diff","--name-only"],text=True)
          print("EXACT_FIVE_PATHS_AFTER="+json.dumps({"paths":sorted(names),"staged_diff_sha256":after,"unchanged":True}),flush=True)
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-wrapper-838-typescript-replay
          path: |
            ${{ runner.temp }}/wrapper-838-full-typescript.xml
            ${{ runner.temp }}/wrapper-patch-proof.json
          retention-days: 10
