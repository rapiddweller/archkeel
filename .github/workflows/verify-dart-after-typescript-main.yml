name: Verify reviewed Dart nominal carry on actual Main
on:
  push:
    branches: [verify/542-dart-after-typescript-main]
permissions:
  contents: read
jobs:
  normal-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 40d279d64ee2fc0826c00cc0792dd57d88a2df78
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Verify exact source and immutable reviewed product blobs
        run: |
          test "$(git rev-parse HEAD)" = "40d279d64ee2fc0826c00cc0792dd57d88a2df78"
          uv run --locked python - <<'PY'
          import subprocess
          feature="cd54501a8bd95facfd7e3e71929595c920fc2360"
          reviewed="cd54501a8bd95facfd7e3e71929595c920fc2360"
          def blob(ref,path):return subprocess.check_output(["git","show",ref+":"+path])
          for path in ("src/archkeel/analyzer/dart/parse.py","src/archkeel/analyzer/dart/collect.py","src/archkeel/analyzer/dart/resolve.py","src/archkeel/analyzer/dart/snapshot.py","src/archkeel/analyzer/dart/syntax.py"):
              assert blob("HEAD",path)==blob(feature,path)==blob(reviewed,path),path
          for path in ("src/archkeel/analyzer/python/source.py","architecture-baseline.json"):
              assert blob("HEAD",path)==blob("e26b73764089f06138c2829045660a74047f5c20",path),path
          print("DART_SCOPED_CARRY=True")
          PY
      - name: Normal measured baseline, amendment and exact replay
        run: |
          uv run --locked python - <<'PY'
          import base64,json,subprocess
          from pathlib import Path
          base="e26b73764089f06138c2829045660a74047f5c20"
          path="docs/architecture/decisions/issue-542-dart-vocabulary-amendment.json"
          common=["uv","run","--locked","python","-m","archkeel.cli","validate","--root",".","--baseline","architecture-baseline.json","--json"]
          stages=[
              ("baseline",["--write-baseline"]),
              ("amendment",["--against",base,"--amendment",path,"--write-amendment","--decided-by","ake2l","--rationale","Publish the reviewed Dart nominal syntax, resolver, snapshot and collection controls with their actual named ports while preserving valid legacy DTO APIs, conservative evidence, keyword fixes and actual merged Main governance without additional allowances or ceiling increases."]),
              ("replay",["--against",base,"--amendment",path]),
          ]
          original_baseline=json.loads(Path("architecture-baseline.json").read_bytes())
          codes=[]
          for stage,extra in stages:
              result=subprocess.run(common+extra,text=True,capture_output=True)
              codes.append(result.returncode)
              data=json.loads(result.stdout)
              print("DART_RESULT="+json.dumps({"stage":stage,**{k:data.get(k) for k in ("exit_code","diagnostics","failures","widenings","amendment_status","measurements")}},separators=(",",":")))
              if result.stderr:print("DART_STDERR="+result.stderr[-3000:])
          for marker,filename in (("DART_BASELINE","architecture-baseline.json"),("DART_AMENDMENT",path)):
              file=Path(filename)
              if file.exists():print(marker+"="+base64.b64encode(file.read_bytes()).decode())
          assert codes==[0,0,0],codes
          generated=json.loads(Path("architecture-baseline.json").read_bytes())
          before=original_baseline["budgets"]["calls_unresolved"]
          after=generated["budgets"]["calls_unresolved"]
          assert after<=before,(before,after)
          restored=json.loads(json.dumps(generated))
          restored["budgets"]["calls_unresolved"]=before
          assert restored==original_baseline, "ordinary writer changed another existing baseline budget or allowance"
          print("DART_BASELINE_RATCHET="+json.dumps({"before":before,"after":after,"other_fields_unchanged":True}))
          PY
  dart-native-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 40d279d64ee2fc0826c00cc0792dd57d88a2df78
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint typecheck
      - name: Actual Dart Target, parser, resolver, snapshot and behavior controls
        run: uv run --locked python -m pytest -q tests/test_dart_parse.py tests/test_dart_snapshot.py tests/test_dart_resolve.py tests/test_dart_typed_controls.py tests/test_dart_directives.py tests/test_dart_false_positives.py tests/test_dart_inner_collect.py tests/test_dart_partial_uml.py tests/test_dart_rules.py tests/test_dart_sdk_free.py tests/test_dart_target.py tests/test_dart_unknowns.py tests/test_dart_uml_acceptance.py tests/test_dart_demo.py --tb=short
      - run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  native-identities-and-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 40d279d64ee2fc0826c00cc0792dd57d88a2df78
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Compare exact actual predecessor and direct source with one fixed native observer
        run: |
          git worktree add --detach "$RUNNER_TEMP/dart-review-before" e26b73764089f06138c2829045660a74047f5c20
          uv run --locked archkeel report --root "$RUNNER_TEMP/dart-review-before" --output "$RUNNER_TEMP/dart-review-before.json" > "$RUNNER_TEMP/dart-review-before.stdout"
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/dart-review-after.json" > "$RUNNER_TEMP/dart-review-after.stdout"
          uv run --locked python - <<'PY'
          import collections, dataclasses, hashlib, json, os
          from pathlib import Path
          from archkeel.check.ratchets import measure_python_ratchets, unresolved_call_changes
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          from archkeel.ir.codec_wire import value_bytes
          from archkeel.ir.decisions import rule_uncertainty_evidence, unknown_positions_by_rule
          
          def read(label):
              path = Path(os.environ["RUNNER_TEMP"]) / ("dart-review-" + label + ".json")
              return parse_observation(decode_canonical_model(json.loads(path.read_bytes())))
          
          def fingerprints(model):
              positions, routes, other = [], [], []
              for rule, uncertainty in rule_uncertainty_evidence(model).items():
                  for record in uncertainty.evidence:
                      row = {"rule": rule, "id":record.id, "kind": record.kind, "data": json.loads(value_bytes(record.data))}
                      if record.kind == "boundary_type_position":
                          if record.data.get("reason") != "external_type":
                              positions.append(row)
                      elif record.kind == "boundary_type_route":
                          routes.append(row)
                      elif record.kind != "boundary_type_limit":
                          other.append(row)
              return [collections.Counter(json.dumps(row, sort_keys=True) for row in rows) for rows in (positions, routes, other)]
          
          before, after = read("before"), read("after")
          for label, model in (("before", before), ("after", after)):
              measured = measure_python_ratchets(model)
              print("REVIEW_SNAPSHOT=" + json.dumps({"label": label, "git_head": model.source.git_head, "digest": model.source.source_digest, "scalars": dict(measured.scalars.items()), "calls_total": measured.calls_total, "unknown_by_rule": unknown_positions_by_rule(model)}, sort_keys=True))
          a, b = fingerprints(before), fingerprints(after)
          for label, old, new in zip(("positions", "routes", "other"), a, b, strict=True):
              added, removed = list((new-old).elements()), list((old-new).elements())
              print("REVIEW_UNKNOWN_DIFF=" + json.dumps({"kind": label, "before": sum(old.values()), "after": sum(new.values()), "added": [json.loads(item) for item in sorted(added)], "removed": [json.loads(item) for item in sorted(removed)]}, sort_keys=True))
              assert not added and not removed, (label, added, removed)
          changes = [dataclasses.asdict(item) for item in unresolved_call_changes(before, after)]
          print("REVIEW_UNRESOLVED_CHANGES=" + json.dumps(changes, sort_keys=True))
          print("REVIEW_UNRESOLVED_CHANGE_COUNTS=" + json.dumps({"added_groups": sum(row["change"]=="added" for row in changes), "removed_groups": sum(row["change"]=="removed" for row in changes), "added_sites": sum(row["after"]-row["before"] for row in changes if row["change"]=="added"), "removed_sites": sum(row["before"]-row["after"] for row in changes if row["change"]=="removed")}, sort_keys=True))
          
          PY
  actual-compass-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 40d279d64ee2fc0826c00cc0792dd57d88a2df78
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Compare every actual Compass syntax projection against actual Main
        run: |
          uv run --locked python - <<'PY'
          import importlib.util,json,os,subprocess,sys
          from dataclasses import asdict
          from pathlib import Path
          from archkeel.analyzer.dart.parse import parse
          path=Path(os.environ["RUNNER_TEMP"])/"actual_before_dart_parse.py"
          path.write_bytes(subprocess.check_output(["git","show","e26b73764089f06138c2829045660a74047f5c20:src/archkeel/analyzer/dart/parse.py"]))
          spec=importlib.util.spec_from_file_location("actual_before_dart_parse",path)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          samples=[(path,path.read_bytes()) for path in sorted(Path("fixtures/J-compass/lib").rglob("*.dart"))]
          assert samples
          for path,data in samples:
              assert json.dumps(asdict(module.parse(data)),sort_keys=True)==json.dumps(asdict(parse(data)),sort_keys=True),path
          print("DART_ACTUAL_COMPASS_PARITY="+json.dumps({"files":len(samples),"equal":True}))
          PY
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 40d279d64ee2fc0826c00cc0792dd57d88a2df78
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make browser-install
      - name: Prove real Compass reports, browser navigation and Flutter mutations
        run: uv run --locked --with playwright==1.62.0 python -m pytest -q tests/test_compass_project_report.py tests/test_compass_project_target.py tests/test_flutter_demo.py tests/test_project_demo_snapshots.py --tb=short
