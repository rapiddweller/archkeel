name: Verify exact receipt union types native controls and real wire
on:
  push:
    branches: [verify/542-rule-evaluation-receipt-green]
permissions:
  contents: read
jobs:
  native-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c4814addf48f31f563dc1b393f50adabcb38580
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          make lint typecheck
          uv run --locked python -m pytest -q tests/test_rule_evaluation_receipts.py
          git diff --exit-code
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c4814addf48f31f563dc1b393f50adabcb38580
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          git worktree add --detach "$RUNNER_TEMP/receipt-before" 5b8a603274b2330b85fc6fe62c8d7f6fb15da8f1
          export GIT_AUTHOR_DATE=2026-10-17T00:00:00Z
          export GIT_COMMITTER_DATE=2026-10-17T00:00:00Z
          cat > "$RUNNER_TEMP/receipt-wire.py" <<'PY'
          import hashlib, json, os, shutil, sys
          from dataclasses import asdict
          from pathlib import Path
          from test_module_explore import _sample
          from test_uml_evaluation import _contract, _repository, _model
          from archkeel.ir.codec_observation import canonical_report_bytes
          from archkeel.ir.module_explore import module_exploration
          from archkeel.ir.report_graph import architecture_report
          out = Path(sys.argv[1]); out.mkdir(parents=True,exist_ok=True)
          fixture = Path(os.environ["RUNNER_TEMP"])/"receipt-wire-input"
          for name in ("requires-denied", "requires-permitted", "requires-absent", "requires-incomplete", "uml-pass", "uml-visibility-fail", "uml-signature-fail", "uml-unresolved"):
              shutil.rmtree(fixture, ignore_errors=True); fixture.mkdir()
              if name.startswith("requires"):
                  options = {"permitted": name == "requires-permitted", "complete_requires": name != "requires-absent"}
                  if name == "requires-incomplete":
                      options["rule_include_type_checking"] = False
                      options["extra_files"] = {"sample/peer.py":"from typing import TYPE_CHECKING\nif TYPE_CHECKING:\n    import sample.core\n"}
                  observation = _sample(fixture, **options)
              else:
                  target = _contract(); source = None
                  if name == "uml-visibility-fail": target["declarations"]["uml"]["entities"][1]["visibility"]["kind"]="private"
                  if name == "uml-signature-fail": target["declarations"]["uml"]["entities"][1]["signature"]["parameters"][0]["name"]="request"
                  if name == "uml-unresolved": source="def helper(value):\n    return value\n\ndef run(value):\n    return unknown(value)\n"
                  root, config = _repository(fixture,contract=target,source=source)
                  observation = _model(root,config)
              encoded=canonical_report_bytes(observation)
              (out/(name+".wire")).write_bytes(encoded)
              projections=json.dumps({"report":asdict(architecture_report(observation)),"module_exploration":[asdict(row) for row in module_exploration(observation)]},sort_keys=True,default=str).encode()
              (out/(name+".projections")).write_bytes(projections)
              print("RECEIPT_WIRE="+json.dumps({"scenario":name,"bytes":len(encoded),"sha256":hashlib.sha256(encoded).hexdigest(),"projection_bytes":len(projections),"projection_sha256":hashlib.sha256(projections).hexdigest()}))
          
          PY
          PYTHONPATH="$RUNNER_TEMP/receipt-before/src:$RUNNER_TEMP/receipt-before/tests:$RUNNER_TEMP/receipt-before" .venv/bin/python "$RUNNER_TEMP/receipt-wire.py" "$RUNNER_TEMP/receipt-wire-before"
          PYTHONPATH="$PWD/src:$PWD/tests:$PWD" .venv/bin/python "$RUNNER_TEMP/receipt-wire.py" "$RUNNER_TEMP/receipt-wire-after"
          uv run --locked python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from archkeel.ir.codec import decode_canonical_model
          from archkeel.ir.codec_wire import canonical_json_bytes
          root=Path(os.environ["RUNNER_TEMP"]);before=root/"receipt-wire-before";after=root/"receipt-wire-after"
          def differences(a,b,path=""):
              if type(a) is not type(b): return [(path,a,b)]
              if isinstance(a,dict):
                  return [(path+"/"+str(k),a.get(k),b.get(k)) for k in a.keys()^b.keys()]+[d for k in a.keys()&b.keys() for d in differences(a[k],b[k],path+"/"+str(k))]
              if isinstance(a,list):
                  if len(a)!=len(b): return [(path+"/length",len(a),len(b))]
                  return [d for i,(x,y) in enumerate(zip(a,b)) for d in differences(x,y,path+"/"+str(i))]
              return [] if a==b else [(path,a,b)]
          names=sorted(p.name for p in before.iterdir());assert len(names)==16,names
          for name in names:
              a=(before/name).read_bytes();b=(after/name).read_bytes()
              if name.endswith(".projections"):
                  assert a==b,name
                  print("RECEIPT_PROJECTIONS_EQUAL="+json.dumps({"file":name,"bytes":len(a),"sha256":hashlib.sha256(a).hexdigest()}))
                  continue
              x=decode_canonical_model(json.loads(a));y=decode_canonical_model(json.loads(b))
              diffs=differences(x,y)
              assert len(diffs)==1 and diffs[0][0]=="/analyzer/code_digest",(name,diffs[:30])
              assert all(isinstance(v,str) and len(v)==64 for v in diffs[0][1:])
              print("RECEIPT_REPORT_ONLY_CODE_IDENTITY_DIFFERENCE="+json.dumps({"file":name,"difference":diffs[0],"before_sha256":hashlib.sha256(a).hexdigest(),"after_sha256":hashlib.sha256(b).hexdigest()}))
              before_receipts=canonical_json_bytes({"scope_observations":x["scope_observations"]})
              after_receipts=canonical_json_bytes({"scope_observations":y["scope_observations"]})
              assert before_receipts==after_receipts,name
              print("RECEIPT_WIRE_EQUAL="+json.dumps({"file":name,"bytes":len(before_receipts),"sha256":hashlib.sha256(before_receipts).hexdigest()}))
          print("RECEIPT_WIRE_PAIRS=8 actual Core receipt streams and 8 complete projections byte-identical; whole raw reports differ only in actual analyzer code_digest")
          PY
          git diff --exit-code
  native-cost:
    needs: native-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c4814addf48f31f563dc1b393f50adabcb38580
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          PYTHONPATH="$PWD/src" .venv/bin/archkeel report --root "$PWD" --output "$RUNNER_TEMP/receipt-final.json" > "$RUNNER_TEMP/receipt-final-result.json"
          uv run --locked python - <<'PY'
          import json, os
          from collections import Counter
          from dataclasses import asdict
          from pathlib import Path
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          o=parse_observation(decode_canonical_model(json.loads((Path(os.environ["RUNNER_TEMP"])/"receipt-final.json").read_text())))
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"receipt-final-result.json").read_text())
          assert result["exit_code"]==0 and not result["diagnostics"],result
          print("RECEIPT_FINAL_NATIVE_MEASUREMENTS="+json.dumps(result["measurements"]))
          print("RECEIPT_FINAL_NATIVE_COVERAGE="+json.dumps(asdict(o.coverage),default=str))
          print("RECEIPT_FINAL_NATIVE_UNKNOWNS="+json.dumps(dict(Counter(r.kind for r in o.records("unknowns") or ())),default=str))
          PY
          git diff --exit-code
