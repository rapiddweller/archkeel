name: Verify final bounded receipt governance and quality
on:
  push:
    branches: [verify/542-rule-evaluation-receipt-green]
permissions:
  contents: read
jobs:
  native-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 45fac4ac9431587aa701d170698abf55eee04a8a
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint typecheck
      - run: uv run --locked python -m pytest -q tests/test_rule_evaluation_receipts.py
      - run: git diff --exit-code
