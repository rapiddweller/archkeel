name: Inspect receipt ownership evidence and quality
on:
  push:
    branches: [verify/542-rule-evaluation-receipt-green]
permissions:
  contents: read
jobs:
  owner-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db2fbe643f90a11cdec954ecf48633ad4b6f7d42
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tests/test_rule_evaluation_receipts.py")
          s=p.read_text()
          old='    comparison = architecture_report(_model(root, config)).comparison\n'
          start=s.index("def test_actual_marker_owner_relocation")
          a=s[:start]; b=s[start:]
          assert b.count(old)==1
          b=b.replace(old, '    observation = _model(root, config)\n    comparison = architecture_report(observation).comparison\n    from dataclasses import asdict\n    print("OWNER_COMPARISON="+json.dumps(asdict(comparison),default=str))\n    print("OWNER_COVERAGE="+json.dumps(asdict(observation.coverage),default=str))\n    print("OWNER_SYMBOLS="+json.dumps([asdict(x) for x in observation.records("symbols") if "_RuleEvaluationTag" in str(x)],default=str))\n',1)
          p.write_text(a+b)
          PY
          uv run --locked python -m pytest -q -s tests/test_rule_evaluation_receipts.py::test_actual_marker_owner_relocation_fails_the_fixed_native_target
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db2fbe643f90a11cdec954ecf48633ad4b6f7d42
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint typecheck
      - run: git diff --exit-code
