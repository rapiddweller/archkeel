name: Verify bounded evaluator receipt source
on:
  push:
    branches: [verify/542-rule-evaluation-receipt-green]
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1dcd46556940782f79d44df18b5faae8462783e7
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Format and prove actual typed ports
        run: |
          uv run --locked ruff check --select I --fix src/archkeel/ir/model.py src/archkeel/check/evaluation/rule_support.py src/archkeel/check/observation.py src/archkeel/ir/decisions.py src/archkeel/ir/module_explore.py src/archkeel/ir/report_graph.py src/archkeel/check/uml_evaluation.py tests/test_rule_evaluation_receipts.py
          uv run --locked ruff format src/archkeel/ir/model.py src/archkeel/check/evaluation/rule_support.py src/archkeel/check/observation.py src/archkeel/ir/decisions.py src/archkeel/ir/module_explore.py src/archkeel/ir/report_graph.py src/archkeel/check/uml_evaluation.py tests/test_rule_evaluation_receipts.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          for path in subprocess.check_output(["git","diff","--name-only"], text=True).splitlines():
              print("RECEIPT_FORMAT_FILE="+json.dumps({"path":path,"content":Path(path).read_text()},ensure_ascii=True))
          PY
          uv run --locked python -m pytest -q tests/test_rule_evaluation_receipts.py
          make lint typecheck
