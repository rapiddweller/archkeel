name: Context canonical Graph fixture final regression
on:
  push:
    branches: [verify/542-context-graph-fixture-final]
permissions:
  contents: read
jobs:
  canonical-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typed_graph_vocabulary.py tests/test_definition_context_types.py --tb=short
      - name: Source and both actual test consumers stay formatted
        if: ${{ always() }}
        run: |
          uv run --locked ruff check src/archkeel tests/test_definition_context_types.py tests/test_typed_graph_vocabulary.py
          uv run --locked ruff format --check --diff tests/test_definition_context_types.py tests/test_typed_graph_vocabulary.py
