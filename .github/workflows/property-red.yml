name: Property proof RED
on:
  push:
    branches: [verify/542-property-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Actual RED and existing proof control
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_typed_python_properties.py
          result=$?
          echo "PROPERTY_RED_EXIT=$result"
          test "$result" -eq 1
