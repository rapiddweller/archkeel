name: Verify exact final Dart carry without writes
on:
  push:
    branches: [verify/542-dart-final-current-main]
permissions:
  contents: read
jobs:
  final-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d2c2e3daf0cbb441c1fb7d3d786b469ed94be453
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Strict formatting and typing on unchanged final source
        run: |
          uv run --locked ruff check src/archkeel/analyzer/dart tests/test_dart_typed_controls.py tests/test_dart_target.py
          uv run --locked ruff format --check src/archkeel/analyzer/dart tests/test_dart_typed_controls.py tests/test_dart_target.py
          uv run --locked mypy src/archkeel
      - name: Validate the actual committed baseline and ordinary amendment
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against e26b73764089f06138c2829045660a74047f5c20 --amendment docs/architecture/decisions/issue-542-dart-vocabulary-amendment.json > "$RUNNER_TEMP/task-dart-final.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib, subprocess
          result = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "task-dart-final.json").read_text())
          print("DART_FINAL_HEAD="+subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip())
          print("DART_FINAL_PRODUCT=" + json.dumps({key: result.get(key) for key in ("exit_code", "amendment_status", "failures", "diagnostics", "widenings", "measurements")}))
          dirty=subprocess.check_output(["git","status","--porcelain"]).decode()
          print("DART_FINAL_DIRTY="+dirty)
          assert dirty=="",dirty
          assert result["exit_code"]==0 and result["amendment_status"]=="valid",result["exit_code"]
          PY
          test "$task_status" -eq 0
      - name: Repository hygiene
        if: ${{ always() }}
        run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py tests/test_dart_typed_controls.py::test_parser_keywords_do_not_misclassify_identifier_substrings
