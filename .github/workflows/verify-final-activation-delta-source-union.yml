name: Prepare Delta and final typed predicate source union
on:
  push:
    branches: [verify/542-final-activation-delta-source-union]
permissions:
  contents: read
jobs:
  source-union:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c06b8db48ede0e12e1e10563dea17a334862608
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact bounded reviewed source patches
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          
          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout.decode()
          
          stages = [{"name":"reviewed-delta-versions-existing-owner","base":"af9f0f708142bf0529992f4f7147c7d37e3b1a99","head":"6452149d33186dc56d78f7072d73b5dbb988d35a","paths":["docs/architecture/delta-version-types.md","docs/superpowers/plans/2026-10-16-delta-version-types.md","src/archkeel/check/delta.py","src/archkeel/check/expectation.py","src/archkeel/ir/codec_delta.py","src/archkeel/ir/model.py","tests/test_delta_version_types.py"]},{"name":"measured-direct-predicate-and-compatibility-corrections","base":"15f1fa127c37399541e09b16ccf23ebe246f3709","head":"4a01cf7925db9f64295ef3a0f52292cb30f8bfb1","paths":["docs/architecture/python-string-predicates.md","src/archkeel/analyzer/dart/collect.py","src/archkeel/analyzer/python/constructs.py","tests/test_python_string_predicate_target.py","tests/test_references.py"]}]
          for stage in stages:
              patch = subprocess.run(["git", "diff", "--binary", stage["base"], stage["head"], "--", *stage["paths"]], check=True, capture_output=True).stdout
              if patch:
                  applied = subprocess.run(["git", "apply", "--3way", "--index", "-"], input=patch, capture_output=True)
                  if applied.returncode:
                      print("MERGE_CONFLICT=" + stage["name"])
                      print(applied.stderr.decode()[-6000:])
                      print(git("diff", "--name-only", "--diff-filter=U"))
                      raise SystemExit(1)
              print("SOURCE_STAGE=" + stage["name"])
          
          paths = []
          for line in git("diff", "--cached", "--name-status", "--no-renames", "HEAD").splitlines():
              status, path = line.split("\t")
              if status == "D":
                  paths.append({"path": path, "deleted": True})
                  continue
              mode = git("ls-files", "--stage", "--", path).split()[0]
              content = Path(path).read_text()
              parts = [content[index:index + 12000] for index in range(0, len(content), 12000)] or [""]
              paths.append({"path": path, "mode": mode, "parts": len(parts), "index_sha": git("ls-files", "--stage", "--", path).split()[1], "text_sha": subprocess.run(["git", "hash-object", "--stdin"], input=content.encode(), capture_output=True, check=True).stdout.decode().strip()})
              for index, part in enumerate(parts):
                  print("SOURCE_UNION_CHUNK=" + json.dumps({"path": path, "index": index, "content": part}, separators=(",", ":")))
          print("SOURCE_UNION_PATHS=" + json.dumps(paths, separators=(",", ":")))
          print("SOURCE_UNION_TREE=" + git("write-tree").strip())
          
          PY
