name: Source resolution RED proof
on:
  push:
    branches: [verify/542-source-resolution-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 99ada0c2a70affde8033a802c388f7cadba2ad7c
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual producer and narrow port fail before implementation
        run: |
          uv run --locked python - <<'PY'
          import subprocess
          result=subprocess.run(["uv","run","--locked","pytest","-q","tests/test_source_resolution_types.py"])
          assert result.returncode==1,result.returncode
          print("SOURCE_RESOLUTION_RED_EXPECTED_FAILURE=PASS")
          PY
      - name: Formatted test source for review
        if: always()
        run: |
          uv run --locked ruff check --select I --fix tests/test_source_resolution_types.py
          uv run --locked ruff format tests/test_source_resolution_types.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          print("FORMATTED_TEST_SOURCE="+json.dumps(Path("tests/test_source_resolution_types.py").read_text()))
          PY
