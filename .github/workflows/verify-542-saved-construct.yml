name: Saved TypeScript constructs receipt causal proof
on:
  push:
    branches: [verify/542-typescript-saved-construct-receipt]
permissions:
  contents: read
jobs:
  native-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: legacy-control
            ref: fa37f59600cfae64ba0528cb56e609c6bbd756e4
          - stage: before-correction
            ref: ccd28126663a6ed11891d6d512b4f95c263c8ddc
          - stage: after-correction
            ref: 97615e831e15b2fceb5a6b09743601042b9552c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Real live CLI, repository removal, saved replay and exact bytes
        run: uv run --locked python -m pytest -q tests/test_saved_report.py::test_saved_typescript_query_matches_native_cli_without_collector_or_repository --tb=short
      - name: Current test quality
        if: ${{ matrix.stage == 'after-correction' }}
        run: |
          uv run --locked ruff check tests/test_saved_report.py
          uv run --locked ruff format --check tests/test_saved_report.py
      - name: Current exact committed no-write replay
        if: ${{ matrix.stage == 'after-correction' }}
        run: |
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against fa37f59600cfae64ba0528cb56e609c6bbd756e4 --amendment docs/architecture/decisions/issue-542-typescript-written-controls-amendment.json > "$RUNNER_TEMP/saved-receipt-nowrite.json"
          uv run --locked python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "saved-receipt-nowrite.json").read_text())
          print("SAVED_RECEIPT_EXACT_NO_WRITE=" + json.dumps({key: result.get(key) for key in ("exit_code", "amendment_status", "failures", "diagnostics", "measurements")}), flush=True)
          assert result["exit_code"] == 0 and result["amendment_status"] == "valid"
          assert result["measurements"]["scalars"]["calls_unresolved"] == 913
          assert result["measurements"]["scalars"]["typing_positions"] == 52
          assert result["measurements"]["scalars"]["unknown_positions"] == 58
          assert result["measurements"]["scalars"]["violations"] == 0
          assert not subprocess.run(["git", "status", "--porcelain"], check=True, capture_output=True, text=True).stdout
          print("SAVED_RECEIPT_GIT_CLEAN", flush=True)
          PY
