name: Verify nominal wire compatibility
on:
  push:
    branches: [fix/issue-542-wire-enum-compatibility]
permissions:
  contents: read
jobs:
  legacy-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Inspect actual in-memory and JSON-replayed proof values
        run: |
          uv run --locked python - <<'PY'
          import json,pathlib,sys,tempfile
          sys.path.insert(0,"tests")
          from test_scoped_dependency_proof import _dependency_model_from_core
          from archkeel.ir.codec import observation_payload,parse_observation
          from archkeel.ir.decisions import dependency_binding_id
          with tempfile.TemporaryDirectory() as root:
              initial=_dependency_model_from_core(pathlib.Path(root)/"project")
              replay=parse_observation(json.loads(json.dumps(observation_payload(initial))))
              def binding(value): return dependency_binding_id(value.sections,value.coverage.failures,value.evidence)
              previous={record.id:record for section in initial.sections for record in section.records}
              diffs=[{"id":record.id,"initial":repr(previous[record.id]),"replay":repr(record)} for section in replay.sections for record in section.records if record.id in previous and repr(previous[record.id])!=repr(record)]
              receipt=next(record for record in replay.records("scope_observations") if record.data.get("dependency_scope_proof"))
              print("REAL_WIRE_PROOF="+json.dumps({"initial":binding(initial),"replay":binding(replay),"issued":receipt.data.get("dependency_scope_proof").get("binding_id"),"record_repr_differences":diffs},separators=(",",":")))
          PY
      - name: Preserve native scoped proof, untouched PASS and rename behavior
        run: uv run --locked python -m pytest -q tests/test_scoped_dependency_proof.py tests/test_renames.py tests/test_widening.py::test_string_field_text_preserves_characters_when_str_is_decorated --tb=short
  causal-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ref: [7b2a14de58eb18be716c8eadef5c43928ec464a5,a4a8c964ed3ddc29756a37794b60c76fd52109f0,5933ffbbfd588ac96e36748de937cb1f6e739655]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Observe original historical proof and prose expectations
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_scoped_dependency_proof.py::test_dependency_binding_matches_core_issued_proof tests/test_scoped_dependency_proof.py::test_unaffected_nested_requires_passes_with_partial_global_coverage tests/test_renames.py::test_a_rename_leaves_every_value_that_names_no_module_alone --tb=short > "$RUNNER_TEMP/causal.txt"
          causal_status=$?
          set -e
          cat "$RUNNER_TEMP/causal.txt"
          if [ "${{ matrix.ref }}" = "7b2a14de58eb18be716c8eadef5c43928ec464a5" ]; then
            test "$causal_status" -eq 0
            grep '3 passed' "$RUNNER_TEMP/causal.txt"
          else
            test "$causal_status" -eq 1
            grep '3 failed' "$RUNNER_TEMP/causal.txt"
          fi
  wire-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify formatting, type contracts and hygiene
        run: |
          uv run --locked ruff check --select I --fix src/archkeel/ir/facts_codec.py src/archkeel/ir/widening.py tests/test_scoped_dependency_proof.py tests/test_widening.py
          uv run --locked ruff format src/archkeel/ir/facts_codec.py src/archkeel/ir/widening.py tests/test_scoped_dependency_proof.py tests/test_widening.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","src/archkeel/ir/facts_codec.py","src/archkeel/ir/widening.py","tests/test_scoped_dependency_proof.py","tests/test_widening.py"])).decode())
          PY
          uv run --locked ruff check src/archkeel/ir/facts_codec.py src/archkeel/ir/widening.py tests/test_scoped_dependency_proof.py tests/test_widening.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  wire-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Preserve record codecs, graph behavior and widening classifications
        run: uv run --locked python -m pytest -q tests/test_codec.py tests/test_codec_compatibility.py tests/test_collection_protocol.py tests/test_typed_collector_protocol.py tests/test_widening.py tests/test_architecture_graph.py tests/test_graph_comparison_codec.py tests/test_source_graph.py tests/test_target_graph.py tests/test_typed_graph_vocabulary.py --tb=short
  wire-native-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Validate unchanged contract and inspect individual type and call positions
        run: |
          git diff --exit-code 5933ffbbfd588ac96e36748de937cb1f6e739655 -- architecture-contract.json architecture-baseline.json docs/architecture/contracts schema docs/architecture/decisions src/archkeel/ir/decisions.py src/archkeel/check/observation.py
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 5933ffbbfd588ac96e36748de937cb1f6e739655 > "$RUNNER_TEMP/wire-native.json"
          wire_status=$?
          set -e
          python - "$RUNNER_TEMP/wire-native.json" <<'PY'
          import json,pathlib,sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("WIRE_COMPAT_NATIVE="+json.dumps({key:result.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          PY
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/wire-after.json" > "$RUNNER_TEMP/wire-after-result.json"
          git worktree add --detach "$RUNNER_TEMP/wire-before" 5933ffbbfd588ac96e36748de937cb1f6e739655
          uv run --locked archkeel report --root "$RUNNER_TEMP/wire-before" --output "$RUNNER_TEMP/wire-before.json" > "$RUNNER_TEMP/wire-before-result.json"
          uv run --locked python - "$RUNNER_TEMP/wire-before.json" "$RUNNER_TEMP/wire-after.json" <<'PY'
          import json,pathlib,re,sys
          from dataclasses import asdict
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.check.ratchets import unknown_positions_by_rule,call_rows
          def read(path): return parse_observation(decode_canonical_model(json.loads(pathlib.Path(path).read_text())))
          before,after=(read(path) for path in sys.argv[1:])
          def types(model):
              return {row.id:{"id":row.id,"kind":row.kind,"rule_ids":row.rule_ids,**{key:row.data.get(key) for key in ("qualified_name","position","path","annotation","nested_annotation","reason")}} for row in model.records("unknowns") or () if row.kind in {"boundary_type_position","boundary_type_route"}}
          def calls(model):
              result={}
              for row in call_rows(model):
                  caller=re.sub(r"<(genexpr|listcomp|dictcomp|setcomp):[0-9]+:[0-9]+>",r"<\1>",row.caller)
                  result.setdefault((row.status,row.path,caller,row.expression),[]).append(asdict(row))
              return result
          old,new=types(before),types(after)
          old_calls,new_calls=calls(before),calls(after)
          added=[{"before":old_calls.get(key,[]),"after":new_calls[key]} for key in new_calls if len(new_calls[key])>len(old_calls.get(key,[]))]
          removed=[{"before":old_calls[key],"after":new_calls.get(key,[])} for key in old_calls if len(old_calls[key])>len(new_calls.get(key,[]))]
          summary={"before_ref":"5933ffbbfd588ac96e36748de937cb1f6e739655","before_unknown":unknown_positions_by_rule(before),"after_unknown":unknown_positions_by_rule(after),"new_type_positions":[new[key] for key in sorted(new.keys()-old.keys())],"removed_type_positions":[old[key] for key in sorted(old.keys()-new.keys())],"changed_type_positions":[{"before":old[key],"after":new[key]} for key in sorted(old.keys()&new.keys()) if old[key]!=new[key]],"added_call_sites":added,"removed_call_sites":removed,"before_unresolved":before.coverage.calls_unresolved,"after_unresolved":after.coverage.calls_unresolved,"before_partial":before.coverage.calls_partially_resolved,"after_partial":after.coverage.calls_partially_resolved}
          print("WIRE_COMPAT_SITE_EVIDENCE="+json.dumps(summary,separators=(",",":")))
          assert not summary["new_type_positions"] and not summary["changed_type_positions"],summary
          assert not added,summary
          PY
          exit "$wire_status"
