name: Diagnose exact predicate fixture integration
on:
  push:
    branches: [verify/542-predicate-fixture-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff885e1c7f66afb2ede2e60eb4334a824deb9c81
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual unchanged fixture diagnostics
        run: |
          uv run --locked python - <<'PY'
          import json, sys, tempfile
          from dataclasses import asdict
          from pathlib import Path
          sys.path.insert(0,str(Path("tests").resolve()))
          import test_python_string_predicate_target as fixture
          import test_uml_evaluation as suite
          with tempfile.TemporaryDirectory() as directory:
              root, config = fixture._repository(Path(directory))
              result, encoded = suite.run_report(root,config=config,analyzer=suite.observe)
              print("PREDICATE_FIXTURE_DIAGNOSTICS_JSON",json.dumps({"exit_code":result.exit_code,"diagnostics":[asdict(d) for d in result.diagnostics],"encoded":encoded is not None}))
          PY
