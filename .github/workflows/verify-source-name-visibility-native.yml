name: Source name visibility actual native sites
on:
  push:
    branches: [verify/542-source-name-visibility-gates]
permissions:
  contents: read
jobs:
  native-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ae65ac3dc6c619e60561d54964b764e176254d19
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked python - <<'PY'
          import ast, collections, gzip, hashlib, json, subprocess
          from dataclasses import asdict
          from pathlib import Path
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          artifact=Path("/tmp/archkeel-native-current-controls")
          artifact.mkdir()
          report=artifact/"actual-report.json"
          run=subprocess.run(["uv","run","--locked","archkeel","report","--root",".","--output",str(report)],capture_output=True,text=True)
          (artifact/"actual-result.json").write_text(run.stdout)
          print(run.stderr[-4000:],flush=True)
          assert run.returncode==0,(run.returncode,run.stdout[-5000:])
          result=json.loads(run.stdout)
          assert not result["diagnostics"],result["diagnostics"]
          assert result["observation_complete"]=="PASS",result
          model=parse_observation(decode_canonical_model(json.loads(report.read_bytes())))
          assert not model.records("violations"),model.records("violations")
          scopes={"archkeel.check.onboarding.public_top_level_names","archkeel.check.evaluation.rules._interface_verdict","archkeel.ir.interfaces._public_symbol_names","archkeel.ir.facts.parse_source_name_visibility"}
          controls=[row for row in model.records("constructs") if row.kind=="string_literal_compare" and row.data.get("owner") in scopes]
          owners={row.data.get("qualified_name") for row in model.records("symbols")}
          assert scopes <= owners,(scopes-owners)
          assert len(controls)==1,controls
          item=controls[0]
          assert item.data.get("owner")=="archkeel.check.evaluation.rules._interface_verdict",item
          loc=next(row for row in model.evidence if row.id in item.evidence_ids)
          expr=next(node for node in ast.walk(ast.parse(Path(loc.file).read_text())) if isinstance(node,ast.Compare) and node.lineno==loc.line and node.col_offset==loc.column)
          assert ast.unparse(expr)=="'reexport_candidates' in data",ast.unparse(expr)
          print("RETAINED_JSON_KEY_DATA_COMPARISON="+json.dumps({"record":asdict(item),"evidence":asdict(loc),"expression":ast.unparse(expr)},sort_keys=True),flush=True)
          print("SOURCE_NAME_VISIBILITY_PRECISE_OWNERS_ONLY_UNCHANGED_JSON_KEY_MEMBERSHIP="+json.dumps(sorted(scopes)),flush=True)
          evidence={row.id:row for row in model.evidence}
          rows=[]
          for item in model.records("constructs"):
              if item.kind!="string_literal_compare": continue
              locations=[asdict(evidence[key]) for key in item.evidence_ids]
              rows.append({"record":asdict(item),"locations":locations,"owner":item.data.get("owner"),"form":item.data.get("form")})
          raw=(json.dumps(rows,sort_keys=True,indent=2)+"\n").encode()
          (artifact/"native-control-sites.json").write_bytes(raw)
          module_counts=collections.Counter()
          forms=collections.Counter()
          for row in rows:
              assert row["locations"]
              module_counts.update({row["locations"][0]["file"]:1})
              forms.update({row["form"]:1})
          summary={"source":"ae65ac3dc6c619e60561d54964b764e176254d19","scope":"actual own Python native observation; supported syntax only, not semantic whole-program or defect count","constructs":len(rows),"by_file":dict(module_counts.most_common()),"forms":dict(forms),"site_payload_sha256":hashlib.sha256(raw).hexdigest(),"calls_unresolved":model.coverage.calls_unresolved}
          (artifact/"summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          print("ACTUAL_NATIVE_CURRENT_CONTROL_AUDIT="+json.dumps(summary,sort_keys=True),flush=True)
          print("ACTUAL_NATIVE_CONTROL_SAMPLES="+json.dumps(rows[:3],sort_keys=True),flush=True)
          for file in list(artifact.glob("*.json")):
              packed=file.with_suffix(file.suffix+".gz")
              packed.write_bytes(gzip.compress(file.read_bytes(),compresslevel=1,mtime=0))
              file.unlink()
          subprocess.run(["git","diff","--exit-code"],check=True)
          
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: actual-native-current-control-sites
          path: /tmp/archkeel-native-current-controls/*.gz
