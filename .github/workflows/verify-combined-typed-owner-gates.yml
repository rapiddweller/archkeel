name: Verify combined typed owner integration
on:
  push:
    branches: [verify/542-combined-typed-owner-gates]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b06fd806ae0e76d340cba44eb7b5e84c887384d6
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint typecheck
      - run: make browser-graph-check browser-runtime-check
      - run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py tests/test_ci_changes.py tests/test_make_gate.py
      - run: git diff --exit-code
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b06fd806ae0e76d340cba44eb7b5e84c887384d6
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make browser-install browser-runtime-install
      - run: uv run --locked --with playwright==1.62.0 python -m pytest -n 2 --dist=loadfile --max-worker-restart=0 -q --durations=20 --junitxml=test-artifacts/pytest/typed-owner-full.xml
      - run: git diff --exit-code
  required-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b06fd806ae0e76d340cba44eb7b5e84c887384d6
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make ci-pr-report-check
      - run: git diff --exit-code
  normal-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b06fd806ae0e76d340cba44eb7b5e84c887384d6
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Normal baseline and owned amendment without accepted debt
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          def run(args,label):
              result=subprocess.run(["uv","run","--locked","archkeel","validate","--root",".","--baseline","architecture-baseline.json","--json",*args],capture_output=True,text=True)
              Path("/tmp/"+label+".json").write_text(result.stdout)
              if result.stderr:print(result.stderr[-6000:])
              data=json.loads(result.stdout)
              print("COMBINED_NATIVE_STAGE="+json.dumps({"stage":label,"exit":result.returncode,"valid":data.get("valid"),"measurements":data.get("measurements"),"failures":data.get("failures"),"diagnostics":data.get("diagnostics"),"widenings":data.get("widenings")}),flush=True)
              assert result.returncode==0,(label,result.stdout[-12000:])
              return data
          run(["--write-baseline"],"baseline")
          args=["--against","f63840b5c912ae40eff42fa7b12fd41240566d46","--amendment","docs/architecture/decisions/2026-10-17-combined-typed-owner-amendment.json"]
          run([*args,"--write-amendment","--decided-by","ake2l","--rationale","Own parser and protocol vocabularies at existing API boundaries; preserve wire compatibility, conservative uncertainty and precise native source evidence across independently reviewed increments."],"amendment")
          run(args,"ordinary-replay")
          for label,path in (("COMBINED_BASELINE","architecture-baseline.json"),("COMBINED_AMENDMENT","docs/architecture/decisions/2026-10-17-combined-typed-owner-amendment.json")):
              print(label+"="+json.dumps(json.loads(Path(path).read_text()),separators=(",",":")),flush=True)
          
          PY
