name: Dart local callable shadowing native GREEN
on:
  push:
    branches: [verify/570-dart-shadowing-green]
permissions:
  contents: read
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_dart_local_callable_shadowing.py --tb=short
      - name: Quality and unchanged source
        if: ${{ always() }}
        run: |
          uv run --locked ruff check src/archkeel tests/test_dart_local_callable_shadowing.py
          uv run --locked ruff format --check --diff src/archkeel/analyzer/dart tests/test_dart_local_callable_shadowing.py
          uv run --locked mypy src/archkeel
      - name: No product changes
        if: ${{ always() }}
        run: git diff --exit-code -- src docs/architecture/contracts
  existing-dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_dart_parse.py tests/test_dart_resolve.py tests/test_dart_false_positives.py tests/test_dart_snapshot.py tests/test_dart_inner_collect.py tests/test_dart_directives.py tests/test_dart_sdk_free.py tests/test_dart_partial_uml.py tests/test_dart_uml_acceptance.py tests/test_dart_target.py tests/test_dart_rules.py tests/test_dart_demo.py tests/test_dart_unknowns.py tests/test_dart_profile.py --tb=short
