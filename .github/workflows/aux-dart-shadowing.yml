name: Dart local callable shadowing native RED
on:
  push:
    branches: [verify/570-dart-shadowing-red]
permissions:
  contents: read
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual pinned grammar and binding inventory
        run: |
          uv run --locked python - <<'PY'
          from dataclasses import asdict
          import json
          from archkeel.analyzer.dart import parse
          source = b"class Box { Box(); void work() {} } void plain() { Box().work(); } void run() { void Box() {} Box().work(); var callback = () { void Box() {} Box().work(); }; }"
          tree = parse._PARSER.parse(source)
          def walk(node, depth=0):
              if depth < 10:
                  print("ACTUAL_RAW_NODE", depth, node.type, node.start_byte, node.end_byte, source[node.start_byte:node.end_byte].decode()[:100])
              for child in node.named_children:
                  walk(child, depth+1)
          walk(tree.root_node)
          syntax = parse.parse(source)
          print("ACTUAL_SITE_INVENTORY=" + json.dumps([asdict(site) for site in syntax.sites], sort_keys=True))
          PY
      - run: uv run --locked python -m pytest -q tests/test_dart_local_callable_shadowing.py --tb=short
      - name: No product changes
        if: ${{ always() }}
        run: git diff --exit-code -- src docs/architecture/contracts
