name: Verify construct receiver API evidence
on:
  push:
    branches: [verify/542-construct-receiver]
permissions:
  contents: read
jobs:
  native-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Prove actual receiver references and unchanged construct behavior
        run: |
          make lint typecheck
          uv run --locked python -m pytest -q tests/test_references.py tests/test_string_comparison_observation.py tests/test_repository_hygiene.py
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/receiver-native.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "receiver-native.json").read_text())
          print("RECEIVER_NATIVE=" + json.dumps(data, separators=(",", ":")))
          PY
