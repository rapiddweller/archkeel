name: Diagnose exact render direction fixture regression
on:
  push:
    branches: [verify/542-render-direction-fixture]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c1ca9d98595af1d09f619cc0a135eae155b25ee6
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Exercise unchanged direction assertions with the actual guarded source
        run: |
          uv run --locked python -m pytest -q tests/test_target_navigation_graph.py tests/test_summary_badge_target.py tests/test_repository_hygiene.py
          uv run --locked ruff check tests/test_target_navigation_graph.py
          uv run --locked ruff format --check tests/test_target_navigation_graph.py
