name: Property normal amendment replay
on:
  push:
    branches: [verify/542-property-replay]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Replay the already normally generated amendment with full failure evidence
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --against 0e3b8a7f62b9b13417cda78e11b52d0de82986cd --amendment docs/architecture/decisions/issue-542-properties-amendment.json --json > "$RUNNER_TEMP/property-replay.json"
          result=$?
          echo "PROPERTY_REPLAY_EXIT=$result"
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"])/"property-replay.json").read_text())
          for key in ("exit_code","failures","widenings","amendment_status","baseline_comparisons","baseline_new","baseline_resolved","diagnostics","measurements","renames","expectation_fulfilled","git_predicate"):
              print("PROPERTY_REPLAY",key,json.dumps(value.get(key),sort_keys=True))
          PY
          exit "$result"
