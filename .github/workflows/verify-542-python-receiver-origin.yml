name: Verify typed Python receiver origins
on:
  push:
    branches: [verify/542-python-receiver-origin]
permissions:
  contents: read
jobs:
  receiver-origins:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Actual receiver origin RED
        run: >-
          uv run --locked python -m pytest -q tests/test_typed_python_receivers.py
          -k 'field_and_existing or normalizes_valid or invalid_origin or actual_receiver_producers or actual_receiver_merge or fulfils_owned'
