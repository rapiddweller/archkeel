name: Verify core command result controls
on:
  push:
    branches: [fix/issue-542-core-command-integrated]
permissions:
  contents: read
jobs:
  native-core-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_core_command_result.py --tb=short
  command-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Inspect actual constructor labels before closing the Core vocabulary
        run: |
          uv run --locked python - <<'PY'
          import ast,collections,json,pathlib
          labels=collections.defaultdict(list)
          for base in ("src","tests"):
              for path in pathlib.Path(base).rglob("*.py"):
                  tree=ast.parse(path.read_text())
                  for node in ast.walk(tree):
                      if isinstance(node,ast.Call) and ast.unparse(node.func).endswith("RunResult") and node.args and isinstance(node.args[0],ast.Constant):
                          labels[str(node.args[0].value)].append(str(path)+":"+str(node.lineno))
          print("ACTUAL_RESULT_COMMAND_LABELS="+json.dumps(labels,sort_keys=True))
          PY
  result-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_cli_input_target.py tests/test_cli_typed_inputs.py tests/test_cli.py tests/test_command_view.py tests/test_result_schema.py tests/test_terminal.py tests/test_summary_badge_types.py tests/test_summary_badge_target.py tests/test_review_surface.py tests/test_html_report.py tests/test_typed_amendment_artifact.py tests/test_typed_python_properties.py tests/test_typed_contract_rule_grammar.py tests/test_typed_contract_rule_native.py tests/test_requires_symbol_ports.py --tb=short
  result-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked ruff check --select I --fix tests/test_core_command_result.py src/archkeel/ir/model.py src/archkeel/cli/arguments.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/onboarding.py src/archkeel/check/validation/__init__.py src/archkeel/ir/command_view.py src/archkeel/ir/codec_result.py src/archkeel/render/summary.py tests/test_cli_input_target.py tools/github_pr_report.py
          uv run --locked ruff format tests/test_core_command_result.py src/archkeel/ir/model.py src/archkeel/cli/arguments.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/onboarding.py src/archkeel/check/validation/__init__.py src/archkeel/ir/command_view.py src/archkeel/ir/codec_result.py src/archkeel/render/summary.py tests/test_cli_input_target.py tools/github_pr_report.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","tests/test_core_command_result.py","src/archkeel/ir/model.py","src/archkeel/cli/arguments.py","src/archkeel/check/report.py","src/archkeel/check/run.py","src/archkeel/check/onboarding.py","src/archkeel/check/validation/__init__.py","src/archkeel/ir/command_view.py","src/archkeel/ir/codec_result.py","src/archkeel/render/summary.py","tests/test_cli_input_target.py"])).decode())
          PY
          uv run --locked ruff check tests/test_core_command_result.py src/archkeel/ir/model.py src/archkeel/cli/arguments.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/onboarding.py src/archkeel/check/validation/__init__.py src/archkeel/ir/command_view.py src/archkeel/ir/codec_result.py src/archkeel/render/summary.py tests/test_cli_input_target.py tools/github_pr_report.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  result-own-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Validate exact native budget and normal amendment
        run: |
          git diff --exit-code 61cfede2ad8f04031cde71013f35f225038a87fd -- architecture-baseline.json schema src/archkeel/ir/decisions.py src/archkeel/ir/facts_codec.py
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 61cfede2ad8f04031cde71013f35f225038a87fd --amendment docs/architecture/decisions/issue-542-core-command-result-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Own six Core Command tags and two precise RunResult outcome fields through existing model/CLI facades, independent Target and actual native source controls; preserve the four-valued published wire schema, free shell-command data and all budgets; docs/architecture/core-command-result-types.md.' > "$RUNNER_TEMP/amend-native.json"
          native_status=$?
          set -e
          python - "$RUNNER_TEMP/amend-native.json" <<'PY'
          import json,pathlib,sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("RESULT_NATIVE="+json.dumps({key:result.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          receipt=pathlib.Path("docs/architecture/decisions/issue-542-core-command-result-amendment.json")
          if receipt.exists(): print("RESULT_AMENDMENT_JSON="+json.dumps(json.loads(receipt.read_text()),separators=(",",":")))
          PY
          exit "$native_status"
  result-site-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Compare actual type and call sites with multiplicity and targets
        run: |
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/amend-after.json" > "$RUNNER_TEMP/amend-after-result.json"
          git worktree add --detach "$RUNNER_TEMP/amend-before" 61cfede2ad8f04031cde71013f35f225038a87fd
          uv run --locked archkeel report --root "$RUNNER_TEMP/amend-before" --output "$RUNNER_TEMP/amend-before.json" > "$RUNNER_TEMP/amend-before-result.json"
          uv run --locked python - "$RUNNER_TEMP/amend-before.json" "$RUNNER_TEMP/amend-after.json" "$RUNNER_TEMP/amend-before" . <<'PY'
          import ast,json,pathlib,re,sys
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.check.ratchets import unknown_positions_by_rule,call_rows
          from archkeel.ir.codec_wire import _raw_value
          def read(path): return parse_observation(decode_canonical_model(json.loads(pathlib.Path(path).read_text())))
          before,after=(read(path) for path in sys.argv[1:3])
          before_root,after_root=(pathlib.Path(path) for path in sys.argv[3:5])
          def types(model):
              return {row.id:{"id":row.id,"kind":row.kind,"rule_ids":row.rule_ids,**{key:row.data.get(key) for key in ("qualified_name","position","path","annotation","nested_annotation","reason")}} for row in model.records("unknowns") or () if row.kind in {"boundary_type_position","boundary_type_route"}}
          def calls(model,source_root):
              asts={}
              def call_ast(site,expression):
                  if site.file not in asts:
                      index={}
                      for node in ast.walk(ast.parse((source_root/site.file).read_text())):
                          if isinstance(node,ast.Call):
                              key=(node.lineno,node.col_offset,ast.unparse(node.func))
                              index.setdefault(key,[]).append(ast.dump(node,include_attributes=False))
                      asts[site.file]=index
                  index=asts[site.file]
                  matches=(index.get((site.line,site.column,expression),[]) if site.column is not None else [value for (line,column,name),values in index.items() if line==site.line and name==expression for value in values])
                  assert len(matches)==1,(site,expression,matches)
                  return matches[0]
              evidence={row.id:row for row in model.evidence}
              result={}
              for row in model.records("calls") or ():
                  data=row.data
                  status=data.get("status")
                  if status not in {"unresolved","partially_resolved"}: continue
                  sites=[evidence[identity] for identity in row.evidence_ids if identity in evidence]
                  assert len(sites)==1
                  site=sites[0]
                  caller=re.sub(r"<(genexpr|listcomp|dictcomp|setcomp):[0-9]+:[0-9]+>",r"<\1>",str(data.get("source_scope")))
                  key=(status,site.file,caller,data.get("expression"))
                  result.setdefault(key,[]).append({"record_id":row.id,"status":status,"path":site.file,"line":site.line,"caller":caller,"expression":data.get("expression"),"reason":data.get("reason"),"targets":_raw_value(data.get("targets")),"candidate_count":data.get("candidate_count"),"call_ast":call_ast(site,data.get("expression"))})
              assert sum(len(rows) for rows in result.values())==len(call_rows(model))
              return result
          old,new=types(before),types(after)
          old_calls,new_calls=calls(before,before_root),calls(after,after_root)
          added=[{"before":old_calls.get(key,[]),"after":new_calls[key]} for key in new_calls if len(new_calls[key])>len(old_calls.get(key,[]))]
          removed=[{"before":old_calls[key],"after":new_calls.get(key,[])} for key in old_calls if len(old_calls[key])>len(new_calls.get(key,[]))]
          target_changed=[{"before":old_calls[key],"after":new_calls[key]} for key in old_calls.keys()&new_calls.keys() if sorted(json.dumps(row["targets"],sort_keys=True) for row in old_calls[key])!=sorted(json.dumps(row["targets"],sort_keys=True) for row in new_calls[key])]
          def payloads(rows):
              return sorted(json.dumps({key:row[key] for key in ("status","expression","reason","targets","candidate_count","call_ast")},sort_keys=True) for row in rows)
          new_debt=[{"before":old_calls.get(key,[]),"after":rows} for key,rows in new_calls.items() if payloads(rows)!=payloads(old_calls.get(key,[]))]
          summary={"before_ref":"61cfede2ad8f04031cde71013f35f225038a87fd","before_unknown":unknown_positions_by_rule(before),"after_unknown":unknown_positions_by_rule(after),"new_type_positions":[new[key] for key in sorted(new.keys()-old.keys())],"removed_type_positions":[old[key] for key in sorted(old.keys()-new.keys())],"changed_type_positions":[{"before":old[key],"after":new[key]} for key in sorted(old.keys()&new.keys()) if old[key]!=new[key]],"added_call_sites":added,"removed_call_sites":removed,"changed_call_targets":target_changed,"new_or_changed_debt":new_debt,"before_unresolved":before.coverage.calls_unresolved,"after_unresolved":after.coverage.calls_unresolved,"before_partial":before.coverage.calls_partially_resolved,"after_partial":after.coverage.calls_partially_resolved}
          print("RESULT_SITE_EVIDENCE="+json.dumps(summary,separators=(",",":")))
          assert not summary["new_type_positions"]
          assert not new_debt
          assert not target_changed
          PY
