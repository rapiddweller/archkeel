name: Verify core command result controls
on:
  push:
    branches: [fix/issue-542-core-command-result]
permissions:
  contents: read
jobs:
  native-core-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_core_command_result.py --tb=short
  command-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Inspect actual constructor labels before closing the Core vocabulary
        run: |
          uv run --locked python - <<'PY'
          import ast,collections,json,pathlib
          labels=collections.defaultdict(list)
          for base in ("src","tests"):
              for path in pathlib.Path(base).rglob("*.py"):
                  tree=ast.parse(path.read_text())
                  for node in ast.walk(tree):
                      if isinstance(node,ast.Call) and ast.unparse(node.func).endswith("RunResult") and node.args and isinstance(node.args[0],ast.Constant):
                          labels[str(node.args[0].value)].append(str(path)+":"+str(node.lineno))
          print("ACTUAL_RESULT_COMMAND_LABELS="+json.dumps(labels,sort_keys=True))
          PY
  result-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_cli_input_target.py tests/test_cli_typed_inputs.py tests/test_cli.py tests/test_command_view.py tests/test_result_schema.py tests/test_terminal.py tests/test_summary_badge_types.py tests/test_summary_badge_target.py tests/test_review_surface.py tests/test_html_report.py --tb=short
  result-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked ruff check --select I --fix tests/test_core_command_result.py src/archkeel/ir/model.py src/archkeel/cli/arguments.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/onboarding.py src/archkeel/check/validation/__init__.py src/archkeel/ir/command_view.py src/archkeel/ir/codec_result.py src/archkeel/render/summary.py tests/test_cli_input_target.py
          uv run --locked ruff format tests/test_core_command_result.py src/archkeel/ir/model.py src/archkeel/cli/arguments.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/onboarding.py src/archkeel/check/validation/__init__.py src/archkeel/ir/command_view.py src/archkeel/ir/codec_result.py src/archkeel/render/summary.py tests/test_cli_input_target.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","tests/test_core_command_result.py","src/archkeel/ir/model.py","src/archkeel/cli/arguments.py","src/archkeel/check/report.py","src/archkeel/check/run.py","src/archkeel/check/onboarding.py","src/archkeel/check/validation/__init__.py","src/archkeel/ir/command_view.py","src/archkeel/ir/codec_result.py","src/archkeel/render/summary.py","tests/test_cli_input_target.py"])).decode())
          PY
          uv run --locked ruff check tests/test_core_command_result.py src/archkeel/ir/model.py src/archkeel/cli/arguments.py src/archkeel/check/report.py src/archkeel/check/run.py src/archkeel/check/onboarding.py src/archkeel/check/validation/__init__.py src/archkeel/ir/command_view.py src/archkeel/ir/codec_result.py src/archkeel/render/summary.py tests/test_cli_input_target.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
