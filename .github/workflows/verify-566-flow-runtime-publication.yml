name: Flow publication TDD and locked compiler preparation
on:
  push:
    branches: [verify/566-flow-runtime-publication]
permissions:
  contents: read
jobs:
  real-report-publication-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Actual HTML lacks provenance and exceeds unchanged budgets
        run: uv run --locked python -m pytest -q tests/test_flow_runtime_publication.py tests/test_atlas_report.py::test_default_report_is_one_authentic_repository_with_sparse_native_cells
  locked-compiler-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: npm install --prefix tools/browser-runtime --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools/browser-runtime --ignore-scripts --no-audit --no-fund
      - name: Actual pinned CLI stdin printing and semantic AST parity
        run: |
          node tools/browser-runtime/node_modules/terser/bin/terser --config-file tools/browser-runtime/options.json < src/archkeel/render/assets/flow.js > "$RUNNER_TEMP/flow.candidate.js"
          node tests/browser_runtime_ast.cjs tools/browser-runtime/node_modules src/archkeel/render/assets/flow.js "$RUNNER_TEMP/flow.candidate.js"
      - name: Export actual lockfile and compiler metadata
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = "tools/browser-runtime/package-lock.json"
          print("FLOW_LOCKFILE=" + json.dumps({path:Path(path).read_text()}))
          PY
