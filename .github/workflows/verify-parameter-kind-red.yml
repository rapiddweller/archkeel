name: Prove shared parameter owner RED on unchanged source
on:
  push:
    branches: [verify/542-shared-parameter-kind-red]
permissions:
  contents: read
jobs:
  native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 767fcd603addeec035ae55e8fb165c5d5555f0bb
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked
      - name: Require actual missing owner and untyped producer failures
        run: |
          python - <<'PY'
          import json, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          result = subprocess.run(["uv", "run", "--locked", "python", "-m", "pytest", "-q", "tests/test_typed_parameter_kinds.py", "--tb=short", "--junitxml=/tmp/parameter-red.xml"])
          tree = ET.parse("/tmp/parameter-red.xml")
          cases = list(tree.iter("testcase"))
          failed = [case.attrib["name"] for case in cases if case.find("failure") is not None]
          errors = [case.attrib["name"] for case in cases if case.find("error") is not None]
          print("PARAMETER_REAL_RED=" + json.dumps({"exit": result.returncode, "failed": failed, "errors": errors, "passed": len(cases)-len(failed)-len(errors)}))
          assert result.returncode == 1 and failed and not errors
          assert subprocess.run(["git","diff","--exit-code","--","src/archkeel"],check=False).returncode == 0
          
          PY
