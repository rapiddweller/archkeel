name: Verify combined browser owner required gates
on:
  push:
    branches: [verify/542-browser-required-on-owner-union]
permissions:
  contents: read
jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bd1c136e94affda8c970e1ef0d37bbac33ff256f
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked
      - run: uv run --locked ruff format --check src tests tools/browser_runtime.py tools/browser_graph_protocol.py tools/ci_changes.py
      - run: uv run --locked ruff check src tests tools/browser_runtime.py tools/browser_graph_protocol.py tools/ci_changes.py
      - run: uv run --locked mypy src/archkeel tools/browser_runtime.py tools/browser_graph_protocol.py tools/ci_changes.py
      - run: uv run --locked python -m pytest -q tests/test_ci_changes.py tests/test_make_gate.py tests/test_flow_runtime_publication.py
  required-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bd1c136e94affda8c970e1ef0d37bbac33ff256f
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked
      - run: make ci-pr-report-check
      - run: git diff --exit-code
