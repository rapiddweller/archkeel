name: Prove inherited canonical fixture dependencies
on:
  push:
    branches: [verify/542-permission-fixture-dependencies]
permissions:
  contents: read
jobs:
  unchanged-predecessor-red-and-narrow-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Four actual stale fixtures fail on exact unchanged predecessor
        run: |
          fixture_status=0
          uv run --locked python -m pytest -q tests/test_typescript_demo.py::test_catalog_exhausts_rule_and_measurement_vocabulary tests/test_target_navigation_graph.py::test_own_render_contract_enforces_output_direction --junitxml="$RUNNER_TEMP/fixture-red.xml" || fixture_status=$?
          test "$fixture_status" -eq 1
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suite = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "fixture-red.xml").getroot()
          failures = suite.findall(".//failure")
          cases = suite.findall(".//testcase")
          assert len(cases) == 4 and len(failures) == 4, (len(cases), len(failures))
          assert not suite.findall(".//error")
          print("EXACT_PREDECESSOR_FOUR_ASSERTION_REDS=4")
          PY
      - name: Supply actual canonical enum and guarded-module fixture dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contents = json.loads("{\"tests/test_typescript_demo.py\":\"# Archkeel\\n# Copyright (c) 2026 Rapiddweller Asia Co., Ltd.\\n# SPDX-License-Identifier: MIT\\n\\\"\\\"\\\"Independent acceptance: every rule and measurement has visible TypeScript evidence.\\\"\\\"\\\"\\n\\nimport json\\nfrom dataclasses import fields\\nfrom pathlib import Path\\n\\nimport pytest\\nfrom jsonschema import Draft202012Validator\\nfrom referencing import Registry, Resource\\n\\nfrom archkeel.ir.codec import decode_canonical_model, observation_payload, parse_observation\\nfrom archkeel.ir.measurements import (\\n    SCALARS,\\n    Measurements,\\n    NameBudgetKind,\\n    RatchetScalars,\\n    compare_measurements,\\n)\\nfrom archkeel.ir.model import RULE_KINDS\\nfrom archkeel.ir.source_graph import observed_graph\\nfrom archkeel.ir.structure import StructureMetric, module_edges, structure_metrics\\nfrom archkeel.ir.trace import trace_valid_violations\\nfrom fixtures.demo_catalog_typescript import (\\n    MEASUREMENT_EXAMPLES,\\n    NAME_BUDGET_EXAMPLES,\\n    RULE_EXAMPLES,\\n    STRUCTURE_EXAMPLES,\\n    UNMEASURED,\\n    VARIANTS,\\n)\\nfrom fixtures.reproduce_typescript import Outcome, check_revisions, run_variant\\n\\n\\ndef test_catalog_exhausts_rule_and_measurement_vocabulary() -> None:\\n    assert set(RULE_EXAMPLES) == RULE_KINDS\\n    assert set(NAME_BUDGET_EXAMPLES) == {kind.value for kind in NameBudgetKind}\\n    assert set(MEASUREMENT_EXAMPLES) == set(SCALARS)\\n    assert set(MEASUREMENT_EXAMPLES) == {field.name for field in fields(RatchetScalars)}\\n    assert {field.name for field in fields(Measurements)} == {\\n        \\\"scalars\\\",\\n        \\\"calls_total\\\",\\n        \\\"resolution\\\",\\n    }\\n    assert set(STRUCTURE_EXAMPLES) == {field.name for field in fields(StructureMetric)}\\n    ids = {variant.id for variant in VARIANTS}\\n    assert len(ids) == len(VARIANTS)\\n    for examples in (\\n        *RULE_EXAMPLES.values(),\\n        *MEASUREMENT_EXAMPLES.values(),\\n        *STRUCTURE_EXAMPLES.values(),\\n        *NAME_BUDGET_EXAMPLES.values(),\\n    ):\\n        assert examples\\n        assert {f\\\"typescript-{name}\\\" for name in examples} <= ids\\n\\n\\n@pytest.fixture(scope=\\\"module\\\")\\ndef outcomes(tmp_path_factory: pytest.TempPathFactory) -> dict[str, Outcome]:\\n    workspace = tmp_path_factory.mktemp(\\\"typescript-demo\\\")\\n    return {variant.id: run_variant(workspace, variant) for variant in VARIANTS}\\n\\n\\n@pytest.mark.parametrize(\\\"variant\\\", VARIANTS, ids=lambda variant: variant.id)\\ndef test_each_demo_matches_independent_expectation(variant, outcomes: dict[str, Outcome]) -> None:\\n    outcome = outcomes[variant.id]\\n    if variant.expected_kinds:\\n        for result in (outcome.validation, outcome.report):\\n            assert result.exit_code == 2\\n            assert {item.kind for item in result.diagnostics} >= set(variant.expected_kinds)\\n            assert result.measurements is None\\n        return\\n    assert outcome.observation is not None\\n    assert outcome.report.declared_rules == variant.expected_declared_rules\\n    violations = trace_valid_violations(outcome.observation)\\n    assert sorted(rule for record in violations for rule in record.rule_ids) == sorted(\\n        variant.expected_violations\\n    )\\n    assert outcome.report.measurements is not None\\n    assert outcome.report.measurements.scalars.violations == len(violations)\\n    assert sorted(item.code for item in outcome.validation.diagnostics if item.code) == sorted(\\n        variant.expected_codes\\n    )\\n    for name in UNMEASURED:\\n        assert dict(outcome.report.measurements.scalars.items())[name] is None\\n    assert outcome.report.measurements.calls_total is None\\n    assert outcome.report.measurements.resolution == \\\"n/a\\\"\\n    assert outcome.observation.records(\\\"calls\\\") is not None\\n    assert outcome.observation.records(\\\"symbols\\\") is not None\\n\\n\\ndef test_clean_graph_has_independently_counted_modules_and_edges(\\n    outcomes: dict[str, Outcome],\\n) -> None:\\n    outcome = outcomes[\\\"typescript-clean\\\"]\\n    observation = outcome.observation\\n    assert observation is not None\\n    assert len(observation.records(\\\"modules\\\") or ()) == 7\\n    assert len(module_edges(observation)) == 8\\n    graph = observed_graph(observation)\\n    assert {entity.language for entity in graph.entities} == {\\\"typescript\\\"}\\n    assert sum(entity.kind == \\\"module\\\" for entity in graph.entities) == 7\\n    names = {entity.qualified_name for entity in graph.entities}\\n    assert {\\n        \\\"shop.src.domain.order_x2e_ts.Order\\\",\\n        \\\"shop.src.domain.order_x2e_ts.Order.id\\\",\\n        \\\"shop.src.domain.repository_x2e_ts.OrderRepository\\\",\\n        \\\"shop.src.domain.repository_x2e_ts.OrderRepository.load\\\",\\n        \\\"shop.src.presentation.page_x2e_ts.page\\\",\\n    } <= names\\n    calls = [edge for edge in graph.relationships if edge.kind == \\\"calls\\\"]\\n    assert len(calls) == 4\\n    assert all(edge.target_id is None and edge.resolution == \\\"unresolved\\\" for edge in calls)\\n    metrics = {\\n        metric.scope: (metric.modules, metric.inner_edges, metric.fan_in, metric.fan_out)\\n        for metric in structure_metrics(observation)\\n        if metric.level == \\\"component\\\"\\n    }\\n    assert metrics == {\\n        \\\"app\\\": (1, 0, 0, 2),\\n        \\\"data\\\": (2, 0, 1, 2),\\n        \\\"presentation\\\": (1, 0, 1, 1),\\n        \\\"domain\\\": (3, 3, 3, 0),\\n    }\\n    assert outcome.report.measurements is not None\\n    scalars = dict(outcome.report.measurements.scalars.items())\\n    assert {\\n        name: scalars[name]\\n        for name in (\\\"violations\\\", \\\"cycle_edges\\\", \\\"coverage_failures\\\", \\\"unknown_positions\\\")\\n    } == {\\\"violations\\\": 0, \\\"cycle_edges\\\": 0, \\\"coverage_failures\\\": 0, \\\"unknown_positions\\\": 9}\\n    target_assessment = next(\\n        item for item in outcome.report.rule_assessments or () if item.kind == \\\"uml_target\\\"\\n    )\\n    assert target_assessment.status == \\\"UNKNOWN\\\"\\n    assert target_assessment.undecided > 0\\n\\n\\ndef test_main_typescript_target_is_explicit_and_independent(\\n    outcomes: dict[str, Outcome],\\n) -> None:\\n    import json\\n\\n    from archkeel.ir.codec import parse_contract\\n    from archkeel.ir.target_graph import declared_graph\\n    from fixtures.demo_catalog_typescript import TYPESCRIPT_FIXTURE_DIR\\n\\n    contract = parse_contract(\\n        json.loads((TYPESCRIPT_FIXTURE_DIR / \\\"architecture-contract.json\\\").read_text())\\n    )\\n    target = declared_graph(contract)\\n    outcome = outcomes[\\\"typescript-clean\\\"]\\n    assert outcome.observation is not None\\n    assert target.origin == \\\"declared\\\"\\n    entities = {entity.id: entity for entity in target.entities}\\n    names = {identity: entity.qualified_name for identity, entity in entities.items()}\\n    assert {\\n        \\\"shop.src.main_x2e_ts\\\",\\n        \\\"shop.src.domain.order_x2e_ts\\\",\\n        \\\"shop.src.domain.repository_x2e_ts\\\",\\n        \\\"shop.src.domain.index_x2e_ts\\\",\\n        \\\"shop.src.data.local_x2e_ts\\\",\\n        \\\"shop.src.data.remote_x2e_ts\\\",\\n        \\\"shop.src.presentation.page_x2e_ts\\\",\\n        \\\"shop.src.domain.order_x2e_ts.Order\\\",\\n        \\\"shop.src.domain.order_x2e_ts.Order.id\\\",\\n        \\\"shop.src.domain.repository_x2e_ts.OrderRepository\\\",\\n        \\\"shop.src.domain.repository_x2e_ts.OrderRepository.load\\\",\\n        \\\"shop.src.data.local_x2e_ts.local\\\",\\n        \\\"shop.src.data.local_x2e_ts.local.load\\\",\\n        \\\"shop.src.data.remote_x2e_ts.remote\\\",\\n        \\\"shop.src.data.remote_x2e_ts.remote.load\\\",\\n        \\\"shop.src.presentation.page_x2e_ts.page\\\",\\n        \\\"shop.src.main_x2e_ts.main\\\",\\n    } <= set(names.values())\\n    target_relationships = {\\n        (\\n            edge.kind,\\n            names[edge.source_id],\\n            names[edge.target_id],\\n        )\\n        for edge in target.relationships\\n        if edge.kind != \\\"requires\\\"\\n    }\\n    target_imports = {\\n        (names[edge.source_id], names[edge.target_id])\\n        for edge in target.relationships\\n        if edge.kind == \\\"imports\\\"\\n    }\\n    assert target_imports == {\\n        (\\\"shop.src.main_x2e_ts\\\", \\\"shop.src.data.local_x2e_ts\\\"),\\n        (\\\"shop.src.main_x2e_ts\\\", \\\"shop.src.presentation.page_x2e_ts\\\"),\\n        (\\\"shop.src.domain.repository_x2e_ts\\\", \\\"shop.src.domain.order_x2e_ts\\\"),\\n        (\\\"shop.src.domain.index_x2e_ts\\\", \\\"shop.src.domain.order_x2e_ts\\\"),\\n        (\\\"shop.src.domain.index_x2e_ts\\\", \\\"shop.src.domain.repository_x2e_ts\\\"),\\n        (\\\"shop.src.data.local_x2e_ts\\\", \\\"shop.src.domain.repository_x2e_ts\\\"),\\n        (\\\"shop.src.data.remote_x2e_ts\\\", \\\"shop.src.domain.repository_x2e_ts\\\"),\\n        (\\\"shop.src.presentation.page_x2e_ts\\\", \\\"shop.src.domain.index_x2e_ts\\\"),\\n    }\\n    assert target_relationships - {\\n        (\\\"imports\\\", source, target_name) for source, target_name in target_imports\\n    } == {\\n        (\\n            \\\"references\\\",\\n            \\\"shop.src.data.local_x2e_ts\\\",\\n            \\\"shop.src.domain.repository_x2e_ts.OrderRepository\\\",\\n        ),\\n        (\\n            \\\"references\\\",\\n            \\\"shop.src.data.remote_x2e_ts\\\",\\n            \\\"shop.src.domain.repository_x2e_ts.OrderRepository\\\",\\n        ),\\n        (\\n            \\\"calls\\\",\\n            \\\"shop.src.presentation.page_x2e_ts.page\\\",\\n            \\\"shop.src.domain.repository_x2e_ts.OrderRepository.load\\\",\\n        ),\\n        (\\n            \\\"references\\\",\\n            \\\"shop.src.presentation.page_x2e_ts.page\\\",\\n            \\\"shop.src.domain.order_x2e_ts.Order.id\\\",\\n        ),\\n        (\\n            \\\"calls\\\",\\n            \\\"shop.src.main_x2e_ts.main\\\",\\n            \\\"shop.src.presentation.page_x2e_ts.page\\\",\\n        ),\\n        (\\n            \\\"references\\\",\\n            \\\"shop.src.main_x2e_ts.main\\\",\\n            \\\"shop.src.data.local_x2e_ts.local\\\",\\n        ),\\n    }\\n    assert entities[\\\"order-id\\\"].annotation == \\\"string\\\"\\n    assert entities[\\\"repository-load\\\"].signature.returns == \\\"Promise<Order[]>\\\"\\n    assert entities[\\\"local-load\\\"].modifiers == (\\\"async\\\",)\\n    assert entities[\\\"main\\\"].annotation == \\\"() => Promise<string>\\\"\\n    observed = observed_graph(outcome.observation)\\n    observed_page = next(\\n        entity\\n        for entity in observed.entities\\n        if entity.qualified_name == \\\"shop.src.presentation.page_x2e_ts.page\\\"\\n    )\\n    assert observed_page.modifiers == (\\\"async\\\",)\\n    observed_names = {entity.id: entity.qualified_name for entity in observed.entities}\\n    observed_imports = {\\n        (observed_names[edge.source_id], observed_names[edge.target_id])\\n        for edge in observed.relationships\\n        if edge.kind == \\\"imports\\\" and edge.target_id is not None\\n    }\\n    assert observed_imports == target_imports\\n    assessment = next(\\n        item for item in outcome.report.rule_assessments or () if item.kind == \\\"uml_target\\\"\\n    )\\n    assert assessment.status == \\\"UNKNOWN\\\"\\n    assert assessment.undecided > 0\\n\\n\\ndef test_layer_order_judges_declared_permissions_without_changing_imports(\\n    outcomes: dict[str, Outcome],\\n) -> None:\\n    positive = outcomes[\\\"typescript-layer-order-positive\\\"]\\n    negative = outcomes[\\\"typescript-layer-order-forbidden-permission\\\"]\\n    assert positive.observation is not None and negative.observation is not None\\n    assert module_edges(positive.observation) == module_edges(negative.observation)\\n    for outcome, status in ((positive, \\\"PASS\\\"), (negative, \\\"FAIL\\\")):\\n        assessment = next(item for item in outcome.report.rule_assessments if item.id == \\\"PROBE\\\")\\n        assert assessment.kind == \\\"layer_order\\\" and assessment.status == status\\n        assert assessment.evaluation_proven and assessment.undecided == 0\\n    [violation] = trace_valid_violations(negative.observation)\\n    assert violation.kind == \\\"layer_order\\\" and violation.rule_ids == (\\\"PROBE\\\",)\\n    assert violation.subjects == (\\\"domain\\\", \\\"presentation\\\")\\n\\n\\ndef _decoded_validator():\\n    root = Path(__file__).parents[1]\\n    schemas = [json.loads(path.read_bytes()) for path in (root / \\\"schema\\\").glob(\\\"*.json\\\")]\\n    registry = Registry().with_resources(\\n        (schema[\\\"$id\\\"], Resource.from_contents(schema)) for schema in schemas\\n    )\\n    schema = json.loads((root / \\\"schema/architecture-ir-decoded.schema.json\\\").read_bytes())\\n    return Draft202012Validator(schema, registry=registry)\\n\\n\\ndef test_real_typescript_demo_matches_decoded_profile_schema(outcomes: dict[str, Outcome]) -> None:\\n    observation = outcomes[\\\"typescript-clean\\\"].observation\\n    assert observation is not None\\n    assert not list(_decoded_validator().iter_errors(observation_payload(observation)))\\n\\n\\n@pytest.mark.parametrize(\\\"inner\\\", [False, True], ids=[\\\"legacy-imports\\\", \\\"inner-uml\\\"])\\n@pytest.mark.parametrize(\\\"constructs\\\", [False, True], ids=[\\\"legacy-null\\\", \\\"construct-array\\\"])\\ndef test_decoded_schema_and_codec_keep_independent_receipt_groups(outcomes, inner, constructs):\\n    observation = outcomes[\\\"typescript-clean\\\"].observation\\n    assert observation is not None\\n    payload = observation_payload(observation)\\n    if not inner:\\n        for section in (\\\"symbols\\\", \\\"calls\\\", \\\"references\\\", \\\"bindings\\\"):\\n            payload[section] = None\\n        for field in (\\n            \\\"calls_analyzed\\\",\\n            \\\"calls_resolved\\\",\\n            \\\"calls_partially_resolved\\\",\\n            \\\"calls_unresolved\\\",\\n            \\\"call_resolution_percent\\\",\\n        ):\\n            payload[\\\"coverage\\\"][field] = None\\n    payload[\\\"constructs\\\"] = [] if constructs else None\\n    assert not list(_decoded_validator().iter_errors(payload))\\n    replay = observation_payload(parse_observation(payload))\\n    assert replay[\\\"constructs\\\"] == payload[\\\"constructs\\\"]\\n    assert all(\\n        replay[section] == payload[section]\\n        for section in (\\\"symbols\\\", \\\"calls\\\", \\\"references\\\", \\\"bindings\\\")\\n    )\\n\\n\\ndef test_module_cycle_is_not_a_component_cycle(outcomes: dict[str, Outcome]) -> None:\\n    outcome = outcomes[\\\"typescript-module-cycle\\\"]\\n    assert outcome.observation is not None\\n    cycles = outcome.observation.records(\\\"cycles\\\") or ()\\n    assert any(record.kind == \\\"module_scc\\\" for record in cycles)\\n    assert not any(record.kind == \\\"component_scc\\\" for record in cycles)\\n    assert outcome.report.measurements is not None\\n    assert outcome.report.measurements.scalars.cycle_edges == 2\\n\\n\\n@pytest.mark.parametrize(\\\"case\\\", [\\\"computed-import\\\", \\\"indirect-require\\\"])\\ndef test_unobserved_loader_preserves_unknown(outcomes: dict[str, Outcome], case: str) -> None:\\n    outcome = outcomes[f\\\"typescript-{case}\\\"]\\n    assert outcome.report.declared_rules == \\\"UNKNOWN\\\"\\n    assert outcome.report.exit_code == 2\\n    assert outcome.report.measurements is None\\n    assert outcome.observation is not None\\n    assert outcome.observation.records(\\\"unknowns\\\")\\n    assert outcome.observation.coverage.failures\\n\\n\\n@pytest.mark.parametrize(\\n    (\\\"case\\\", \\\"rule\\\"),\\n    ((\\\"unsupported-symbol-interface\\\", \\\"PROBE\\\"), (\\\"unsupported-symbol-requires\\\", \\\"REQUIRES\\\")),\\n)\\ndef test_unsupported_symbol_declaration_does_not_prove_a_violation(\\n    outcomes: dict[str, Outcome],\\n    case: str,\\n    rule: str,\\n) -> None:\\n    outcome = outcomes[f\\\"typescript-{case}\\\"]\\n    assert outcome.report.exit_code == 2\\n    if outcome.observation is not None:\\n        assert not any(\\n            rule in record.rule_ids for record in trace_valid_violations(outcome.observation)\\n        )\\n\\n\\ndef test_demo_retains_normal_artifacts(tmp_path: Path) -> None:\\n    outcome = run_variant(tmp_path, VARIANTS[0])\\n    root = tmp_path / outcome.variant.id\\n    for name in (\\\"validation-result.json\\\", \\\"report-result.json\\\", \\\"architecture.json\\\"):\\n        assert (root / name).is_file()\\n    measurements = json.loads((root / \\\"report-result.json\\\").read_bytes())[\\\"measurements\\\"]\\n    assert measurements[\\\"calls_total\\\"] is None\\n    assert measurements[\\\"scalars\\\"][\\\"calls_unresolved\\\"] is None\\n    assert measurements[\\\"resolution\\\"] == \\\"n/a\\\"\\n\\n\\n@pytest.mark.parametrize(\\n    \\\"statement\\\",\\n    (\\n        'import { local } from \\\"../data/local\\\";',\\n        'export { local } from \\\"../data/local\\\";',\\n        'export * from \\\"../data/local\\\";',\\n        'export type { local } from \\\"../data/local\\\";',\\n        'export type Local = typeof import(\\\"../data/local\\\").local;',\\n        'export const load = () => import(\\\"../data/local\\\");',\\n        'const local = require(\\\"../data/local\\\");',\\n    ),\\n)\\ndef test_supported_import_forms_enforce_direction(tmp_path: Path, statement: str) -> None:\\n    from dataclasses import replace\\n\\n    from fixtures.demo_catalog_typescript import appended\\n\\n    variant = replace(\\n        VARIANTS[0],\\n        id=\\\"typescript-import-form\\\",\\n        files={\\\"src/domain/order.ts\\\": appended(\\\"src/domain/order.ts\\\", statement + \\\"\\\\n\\\")},\\n    )\\n    outcome = run_variant(tmp_path, variant)\\n    assert outcome.observation is not None\\n    assert \\\"DOMAIN-NO-DATA\\\" in {\\n        rule for record in trace_valid_violations(outcome.observation) for rule in record.rule_ids\\n    }\\n\\n\\ndef test_supported_absence_requires_observed_runtime_closure(tmp_path: Path) -> None:\\n    from dataclasses import replace\\n\\n    from fixtures.demo_catalog_typescript import appended\\n\\n    variant = replace(\\n        VARIANTS[0],\\n        id=\\\"typescript-runtime-closure\\\",\\n        files={\\n            \\\"src/main.ts\\\": appended(\\\"src/main.ts\\\", 'import { value } from \\\"../runtime.cjs\\\";\\\\n'),\\n            \\\"runtime.d.cts\\\": \\\"export declare const value: string;\\\\n\\\",\\n            \\\"runtime.cjs\\\": 'module.exports = require(\\\"./missing-runtime.cjs\\\");\\\\n',\\n        },\\n    )\\n    outcome = run_variant(tmp_path, variant)\\n    assert outcome.report.exit_code == 2 or outcome.report.declared_rules == \\\"UNKNOWN\\\"\\n    assert outcome.report.declared_rules != \\\"PASS\\\"\\n\\n\\ndef test_structure_does_not_turn_unmeasured_calls_into_zero(outcomes: dict[str, Outcome]) -> None:\\n    observation = outcomes[\\\"typescript-clean\\\"].observation\\n    assert observation is not None\\n    for metric in structure_metrics(observation):\\n        assert metric.calls is None\\n        assert metric.unresolved is None\\n\\n\\ndef test_path_identity_preserves_extension_index_and_literal_escape(tmp_path: Path) -> None:\\n    from dataclasses import replace\\n\\n    variant = replace(\\n        VARIANTS[0],\\n        id=\\\"typescript-path-identities\\\",\\n        files={\\n            \\\"src/domain/foo.ts\\\": \\\"export const value = 1;\\\\n\\\",\\n            \\\"src/domain/foo/index.ts\\\": \\\"export const value = 2;\\\\n\\\",\\n            \\\"src/domain/foo_x2e_ts.ts\\\": \\\"export const value = 3;\\\\n\\\",\\n            \\\"src/domain/order-id.ts\\\": \\\"export const value = 4;\\\\n\\\",\\n            \\\"src/domain/foo.test.ts\\\": \\\"export const test = 5;\\\\n\\\",\\n        },\\n    )\\n    outcome = run_variant(tmp_path, variant)\\n    assert outcome.observation is not None\\n    modules = {\\n        record.data.get(\\\"qualified_name\\\") for record in outcome.observation.records(\\\"modules\\\") or ()\\n    }\\n    assert modules >= {\\n        \\\"shop.src.domain.foo_x2e_ts\\\",\\n        \\\"shop.src.domain.foo.index_x2e_ts\\\",\\n        \\\"shop.src.domain.foo_x5f_x2e_x5f_ts_x2e_ts\\\",\\n        \\\"shop.src.domain.order_x2d_id_x2e_ts\\\",\\n    }\\n    assert \\\"shop.src.domain.foo_x2e_test_x2e_ts\\\" not in modules\\n    assert len(modules) == 11\\n\\n\\ndef test_project_scripts_and_tsconfig_plugins_are_not_executed(tmp_path: Path) -> None:\\n    import json\\n    from dataclasses import replace\\n\\n    from fixtures.demo_catalog_typescript import TYPESCRIPT_FIXTURE_DIR\\n\\n    config = json.loads((TYPESCRIPT_FIXTURE_DIR / \\\"tsconfig.json\\\").read_text())\\n    config[\\\"compilerOptions\\\"][\\\"plugins\\\"] = [{\\\"name\\\": \\\"./plugin.cjs\\\"}]\\n    variant = replace(\\n        VARIANTS[0],\\n        id=\\\"typescript-no-project-execution\\\",\\n        files={\\n            \\\"tsconfig.json\\\": json.dumps(config),\\n            \\\"package.json\\\": json.dumps(\\n                {\\n                    \\\"name\\\": \\\"shop\\\",\\n                    \\\"scripts\\\": {\\\"prepare\\\": \\\"node plugin.cjs\\\", \\\"postinstall\\\": \\\"node plugin.cjs\\\"},\\n                }\\n            ),\\n            \\\"plugin.cjs\\\": 'require(\\\"node:fs\\\").writeFileSync(\\\"EXECUTED\\\", \\\"bad\\\");\\\\n',\\n        },\\n    )\\n    outcome = run_variant(tmp_path, variant)\\n    assert outcome.report.exit_code == 0\\n    assert not (tmp_path / variant.id / \\\"EXECUTED\\\").exists()\\n\\n\\ndef test_measurement_regressions_preserve_unmeasured_state(outcomes: dict[str, Outcome]) -> None:\\n    accepted = outcomes[\\\"typescript-clean\\\"].report.measurements\\n    candidate = outcomes[\\\"typescript-module-cycle\\\"].report.measurements\\n    assert accepted is not None and candidate is not None\\n    comparisons = {\\n        name: verdict for name, _, _, verdict in compare_measurements(accepted, candidate)\\n    }\\n    assert comparisons == {\\n        \\\"violations\\\": \\\"FAIL\\\",\\n        \\\"cycle_edges\\\": \\\"FAIL\\\",\\n        \\\"coverage_failures\\\": \\\"PASS\\\",\\n        \\\"unknown_positions\\\": \\\"PASS\\\",\\n        \\\"private_crossings\\\": \\\"n/a\\\",\\n        \\\"typing_positions\\\": \\\"n/a\\\",\\n        \\\"calls_unresolved\\\": \\\"n/a\\\",\\n        \\\"untyped_private_accesses\\\": \\\"n/a\\\",\\n        \\\"unresolved_ratio\\\": \\\"n/a\\\",\\n    }\\n    assert outcomes[\\\"typescript-computed-import\\\"].report.measurements is None\\n\\n\\ndef test_missing_configured_process_has_no_language_fallback(tmp_path: Path) -> None:\\n    from archkeel.check.report import run_report\\n    from archkeel.cli.config import load_config\\n    from archkeel.cli.observe import observer_for\\n    from fixtures.reproduce_typescript import repository\\n\\n    root = repository(tmp_path, VARIANTS[0])\\n    config = load_config(root)\\n    configured = observer_for(\\n        config.language,\\n        collector_argv=(str(tmp_path / \\\"missing-collector\\\"),),\\n        tsconfig=config.tsconfig or \\\"tsconfig.json\\\",\\n    )\\n    result, artifact = run_report(root, config=config, analyzer=configured)\\n    assert result.exit_code == 2\\n    assert {item.kind for item in result.diagnostics} == {\\\"missing_tool\\\"}\\n    assert result.measurements is None\\n    assert artifact is None\\n\\n\\ndef test_replacement_executable_is_actually_called(tmp_path: Path) -> None:\\n    import json\\n    import sys\\n\\n    from archkeel.check.report import run_report\\n    from archkeel.cli.config import load_config\\n    from archkeel.cli.observe import observer_for\\n    from fixtures.reproduce_typescript import repository\\n\\n    marker = tmp_path / \\\"collector-called\\\"\\n    replacement = tmp_path / \\\"collector.py\\\"\\n    replacement.write_text(\\n        \\\"from pathlib import Path\\\\n\\\"\\n        \\\"from archkeel.analyzer.typescript.entry import main\\\\n\\\"\\n        f\\\"Path({str(marker)!r}).write_text('called')\\\\n\\\"\\n        \\\"raise SystemExit(main())\\\\n\\\",\\n        encoding=\\\"utf-8\\\",\\n    )\\n    root = repository(tmp_path, VARIANTS[0])\\n    config_path = root / \\\"archkeel.toml\\\"\\n    config_path.write_text(\\n        \\\"\\\\n\\\".join(\\n            line\\n            for line in config_path.read_text().splitlines()\\n            if not line.startswith(\\\"collector_argv\\\")\\n        )\\n        + \\\"\\\\ncollector_argv = \\\"\\n        + json.dumps([sys.executable, str(replacement)])\\n        + \\\"\\\\n\\\"\\n    )\\n    config = load_config(root)\\n    configured = observer_for(\\n        config.language,\\n        collector_argv=config.collector_argv,\\n        tsconfig=config.tsconfig or \\\"tsconfig.json\\\",\\n    )\\n    result, artifact = run_report(root, config=config, analyzer=configured)\\n    assert marker.read_text() == \\\"called\\\"\\n    assert result.declared_rules == \\\"UNKNOWN\\\", result.diagnostics\\n    assert artifact is not None\\n\\n\\ndef test_same_snapshot_produces_identical_observation(tmp_path: Path) -> None:\\n    from archkeel.check.report import run_report\\n    from archkeel.cli.config import load_config\\n    from archkeel.cli.observe import observer_for\\n    from fixtures.reproduce_typescript import repository\\n\\n    root = repository(tmp_path, VARIANTS[0])\\n    config = load_config(root)\\n    configured = observer_for(\\n        config.language,\\n        collector_argv=config.collector_argv,\\n        tsconfig=config.tsconfig or \\\"tsconfig.json\\\",\\n    )\\n    first, first_artifact = run_report(root, config=config, analyzer=configured)\\n    second, second_artifact = run_report(root, config=config, analyzer=configured)\\n    assert first_artifact is not None\\n    assert first_artifact == second_artifact\\n    assert first.measurements == second.measurements\\n\\n\\ndef test_package_cycles_follow_typescript_directories(outcomes: dict[str, Outcome]) -> None:\\n    observation = outcomes[\\\"typescript-component-cycle\\\"].observation\\n    assert observation is not None\\n    packages = [\\n        record for record in observation.records(\\\"cycles\\\") or () if record.kind == \\\"package_scc\\\"\\n    ]\\n    assert len(packages) == 1\\n    assert set(packages[0].subjects) == {\\\"shop.src.data\\\", \\\"shop.src.domain\\\"}\\n    assert packages[0].data.get(\\\"backed_by\\\")\\n    measurements = outcomes[\\\"typescript-component-cycle\\\"].report.measurements\\n    assert measurements is not None\\n    assert measurements.scalars.cycle_edges == 4\\n\\n\\ndef test_incomplete_scan_keeps_known_violations_and_unknown_evidence(\\n    outcomes: dict[str, Outcome],\\n) -> None:\\n    outcome = outcomes[\\\"typescript-mixed-known-and-unknown\\\"]\\n    assert outcome.observation is not None\\n    assert outcome.observation.records(\\\"unknowns\\\")\\n    assert {\\n        rule for record in trace_valid_violations(outcome.observation) for rule in record.rule_ids\\n    } == {\\\"COMPONENT-CYCLES\\\", \\\"DOMAIN-NO-DATA\\\", \\\"MODULE-CYCLES\\\", \\\"REQUIRES\\\"}\\n    assert outcome.report.exit_code == 2\\n    assert outcome.report.measurements is None\\n\\n\\ndef test_committed_js_only_revision_check(tmp_path: Path) -> None:\\n    output = tmp_path\\n    checked = check_revisions(output, output)\\n    assert checked[\\\"git_predicate\\\"] == checked[\\\"host_order\\\"] == \\\"PASS\\\"\\n    assert checked[\\\"observation_complete\\\"] == checked[\\\"expectation_fulfilled\\\"] == \\\"PASS\\\"\\n    assert checked[\\\"measurements\\\"][\\\"calls_total\\\"] is None\\n    assert checked[\\\"measurements\\\"][\\\"scalars\\\"][\\\"calls_unresolved\\\"] is None\\n    assert checked[\\\"measurements\\\"][\\\"scalars\\\"][\\\"typing_positions\\\"] is None\\n    assert checked[\\\"measurements\\\"][\\\"scalars\\\"][\\\"private_crossings\\\"] is None\\n    assert (\\n        checked[\\\"delta\\\"][\\\"baseline\\\"][\\\"source_digest\\\"] != checked[\\\"delta\\\"][\\\"head\\\"][\\\"source_digest\\\"]\\n    )\\n    dimensions = {name: item[\\\"status\\\"] for name, item in checked[\\\"delta\\\"][\\\"dimensions\\\"].items()}\\n    assert dimensions[\\\"dependency_edges\\\"] == dimensions[\\\"cycles\\\"] == \\\"SUPPORTED\\\"\\n    assert dimensions[\\\"private_crossings\\\"] == dimensions[\\\"typing_signals\\\"] == \\\"UNKNOWN\\\"\\n    accepted = parse_observation(\\n        decode_canonical_model(json.loads((output / \\\"accepted.json\\\").read_bytes()))\\n    )\\n    assert accepted.coverage.calls_analyzed == 6\\n    # The current native collector measures supported occurrences; legacy null still replays.\\n    assert accepted.records(\\\"constructs\\\") == ()\\n    assert accepted.records(\\\"symbols\\\") is not None\\n    assert json.loads((output / \\\"revisions-check.stdout.json\\\").read_bytes()) == json.loads(\\n        (output / \\\"revisions-repeat.stdout.json\\\").read_bytes()\\n    )\\n\",\"tests/test_target_navigation_graph.py\":\"# Archkeel\\n# Copyright (c) 2026 Rapiddweller Asia Co., Ltd.\\n# SPDX-License-Identifier: MIT\\n\\\"\\\"\\\"The standard Target preserves independent intent and render direction.\\\"\\\"\\\"\\n\\nimport json\\nfrom dataclasses import replace\\nfrom pathlib import Path\\n\\nimport pytest\\nfrom test_architecture_demo import _prepare_repo\\nfrom test_target_graph import _nested_repository\\n\\nfrom archkeel.check.ports import ScanConfig\\nfrom archkeel.check.report import run_report\\nfrom archkeel.cli.observe import observe\\nfrom archkeel.ir.codec import decode_canonical_model, parse_observation\\nfrom archkeel.ir.graph_codec import parse_report, report_bytes\\nfrom archkeel.ir.report_graph import architecture_report\\nfrom archkeel.ir.target_records import recorded_target_graph\\nfrom archkeel.render.html import render_html\\n\\n\\n@pytest.mark.parametrize(\\\"version\\\", [\\\"2.1.0\\\", \\\"2.2.0\\\"])\\ndef test_target_navigation_receives_only_the_authenticated_graph(tmp_path, version):\\n    root, config = _nested_repository(tmp_path, root_version=version)\\n    result, encoded = run_report(root, config=config, analyzer=observe)\\n    assert encoded is not None and not result.diagnostics\\n    model = parse_observation(decode_canonical_model(json.loads(encoded)))\\n    descriptor = next(item for item in model.records(\\\"declarations\\\") if item.kind == \\\"uml_target\\\")\\n    graph = recorded_target_graph(model, descriptor)\\n    html = render_html(result, model, repository=\\\"sample\\\", architecture_href=None).decode()\\n    start = html.index(\\\">\\\", html.index('id=\\\"flow-data\\\"')) + 1\\n    report = parse_report(json.loads(html[start : html.index(\\\"</script>\\\", start)]))\\n    expected = json.loads(report_bytes(architecture_report(model)))\\n    for side in (\\\"observed\\\", \\\"target\\\"):\\n        for collection in (\\\"entities\\\", \\\"relationships\\\"):\\n            for item in expected[side][collection]:\\n                del item[\\\"record_ids\\\"]\\n    assert report == parse_report(expected)\\n    assert report.target == replace(\\n        graph,\\n        entities=tuple(replace(item, record_ids=()) for item in graph.entities),\\n        relationships=tuple(replace(item, record_ids=()) for item in graph.relationships),\\n    )\\n    assert graph.component_intents and graph.layout_rules and graph.module_inventories\\n    assert '\\\"explorers\\\"' not in html and '\\\"target_diagrams\\\"' not in html\\n\\n\\n@pytest.mark.parametrize(\\\"backward_importer\\\", [None, \\\"summary\\\", \\\"atlas\\\"])\\ndef test_own_render_contract_enforces_output_direction(tmp_path, backward_importer):\\n    root_path = Path(__file__).parents[1]\\n    contract_path = \\\"docs/architecture/contracts/render.json\\\"\\n    inside = json.loads((root_path / contract_path).read_bytes())\\n    provenance = \\\"docs/architecture/decisions/ad-179-reports-render-one-graph-boundary.md\\\"\\n    files = {\\n        \\\"pyproject.toml\\\": '[project]\\\\nrequires-python = \\\">=3.11\\\"\\\\n',\\n        \\\"src/archkeel/__init__.py\\\": \\\"\\\",\\n        \\\"src/archkeel/render/__init__.py\\\": \\\"\\\",\\n        \\\"src/archkeel/render/atlas.py\\\": (\\n            \\\"def atlas_payload(): return {}\\\\n\\\"\\n            + (\\\"from . import html\\\\n\\\" if backward_importer == \\\"atlas\\\" else \\\"\\\")\\n        ),\\n        \\\"src/archkeel/render/summary.py\\\": (\\n            \\\"def report_summary(): return None\\\\n\\\"\\n            + (\\\"from . import html\\\\n\\\" if backward_importer == \\\"summary\\\" else \\\"\\\")\\n        ),\\n        # The full render contract also guards this real pure display owner.\\n        \\\"src/archkeel/render/summary_badges.py\\\": (\\n            root_path / \\\"src/archkeel/render/summary_badges.py\\\"\\n        ).read_text(),\\n        # Keep the real guarded Atlas owner and its declared provenance in this fixture.\\n        \\\"src/archkeel/render/atlas_deviations.py\\\": (\\n            root_path / \\\"src/archkeel/render/atlas_deviations.py\\\"\\n        ).read_text(),\\n        \\\"docs/superpowers/specs/2026-10-16-atlas-deviation-boundary.md\\\": (\\n            root_path / \\\"docs/superpowers/specs/2026-10-16-atlas-deviation-boundary.md\\\"\\n        ).read_text(),\\n        \\\"src/archkeel/render/terminal.py\\\": \\\"from . import summary\\\\n\\\",\\n        \\\"src/archkeel/render/html.py\\\": (\\n            \\\"from .atlas import atlas_payload\\\\n\\\"\\n            \\\"from .summary import report_summary\\\\n\\\"\\n            \\\"def _flow_section(observation):\\\\n    return ''\\\\n\\\"\\n        ),\\n        provenance: \\\"One report input; summary has no output dependency.\\\\n\\\",\\n        \\\"docs/architecture/render-target.md\\\": \\\"Payload and summary do not depend on HTML.\\\\n\\\",\\n        \\\"docs/architecture/decisions/ad-213-renderer-responsibility-boundaries.md\\\": (\\n            \\\"Separate payload construction from HTML composition.\\\\n\\\"\\n        ),\\n        contract_path: json.dumps(inside),\\n        \\\"architecture-contract.json\\\": json.dumps(\\n            {\\n                \\\"schema_version\\\": \\\"2.2.0\\\",\\n                \\\"rules\\\": [],\\n                \\\"components\\\": [\\n                    {\\n                        \\\"id\\\": \\\"RENDER\\\",\\n                        \\\"label\\\": \\\"render\\\",\\n                        \\\"role\\\": \\\"projection\\\",\\n                        \\\"packages\\\": [\\\"archkeel.render\\\"],\\n                        \\\"public\\\": [\\\"archkeel.render.html\\\"],\\n                        \\\"responsibilities\\\": [\\\"Render Core evidence.\\\"],\\n                        \\\"forbidden_responsibilities\\\": [],\\n                        \\\"provenance\\\": [provenance],\\n                        \\\"inside\\\": contract_path,\\n                    }\\n                ],\\n            }\\n        ),\\n    }\\n    root = _prepare_repo(tmp_path, files)\\n    config = ScanConfig((\\\"src/archkeel\\\",), \\\"archkeel\\\", \\\"architecture-contract.json\\\", \\\"0\\\" * 64)\\n    result, encoded = run_report(root, config=config, analyzer=observe)\\n    assert encoded is not None and result.observation_complete == \\\"PASS\\\" and not result.diagnostics\\n    assessments = {item.id: item for item in result.rule_assessments}\\n    for rule in (\\\"RENDER-COMPLETE-REQUIRES\\\", \\\"RENDER-NO-CYCLES\\\"):\\n        assessment = assessments[f\\\"render:{rule}\\\"]\\n        assert assessment.status == (\\\"FAIL\\\" if backward_importer else \\\"PASS\\\")\\n        assert assessment.count == (1 if backward_importer else 0)\\n    interface = assessments[\\\"render:RENDER-INTERFACE\\\"]\\n    assert (interface.status, interface.count) == (\\\"PASS\\\", 0)\\n\"}")
