name: Required publication gate regression
on:
  push:
    branches: [verify/566-permanent-publication-gate]
permissions:
  contents: read
jobs:
  actual-required-publication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Permanent required-gate regression controls
        run: uv run --locked python -m pytest -q tests/test_make_gate.py
      - name: Actual locked compiler and five publication tests, no preinstall
        run: |
          test ! -d tools/browser-runtime/node_modules
          make browser-runtime-check
      - name: Required report entry after actual publisher gate
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("/tmp/flow-report-gate-override.mk").write_text('browser-install pr-report-test:\n\t@echo bounded-required-report-consumer\n')
          PY
          make -f Makefile -f /tmp/flow-report-gate-override.mk ci-pr-report-check
      - run: make lint typecheck
