name: Verify reviewed graph and physical source correction on current main
on:
  push:
    branches: [verify/542-graph-on-current-main]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f31f5cb216411a0f43882d0b4e97442b1951c5f2
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Derive measured baseline and normal source-change receipt
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --write-baseline --json > "$RUNNER_TEMP/graph-baseline.json"
          task_baseline=$?
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against d3d68a2f9fcace12dba6b0fe54963274c94edca4 --amendment docs/architecture/decisions/issue-542-graph-vocabulary-amendment.json --write-amendment --decided-by ake2l --rationale "Use shared graph vocabularies with the reviewed proof, layout and repetition corrections while preserving merged physical source evidence and measured debt." > "$RUNNER_TEMP/graph-amendment.json"
          task_amendment=$?
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against d3d68a2f9fcace12dba6b0fe54963274c94edca4 --amendment docs/architecture/decisions/issue-542-graph-vocabulary-amendment.json > "$RUNNER_TEMP/graph-replay.json"
          task_replay=$?
          python - <<'PY'
          import json,os,pathlib
          for stage in ("baseline","amendment","replay"):
              data=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/f"graph-{stage}.json").read_text())
              print("GRAPH_RESULT="+json.dumps({"stage":stage,**{key:data.get(key) for key in ("exit_code","failures","widenings","diagnostics","measurements","amendment_status")}},separators=(",",":")))
          print("GRAPH_BASELINE="+pathlib.Path("architecture-baseline.json").read_text().replace("\n",""))
          receipt=pathlib.Path("docs/architecture/decisions/issue-542-graph-vocabulary-amendment.json")
          if receipt.exists():
              print("GRAPH_AMENDMENT="+receipt.read_text().replace("\n",""))
          PY
          test "$task_baseline" -eq 0 && test "$task_amendment" -eq 0 && test "$task_replay" -eq 0
      - name: Actual source evidence and collector regressions
        run: uv run --locked python -m pytest -q tests/test_typed_graph_vocabulary.py tests/test_duplication_call_evidence.py tests/test_codec_compatibility.py tests/test_scoped_dependency_proof.py tests/test_python_source_evidence_lines.py tests/test_repository_hygiene.py
