name: PermissionStatus native and behavior RED
on:
  push:
    branches: [verify/542-permission-status-red]
permissions:
  contents: read
jobs:
  unchanged-source-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Watch actual unchanged source fail the new authored obligation
        run: |
          uv run --locked ruff format tests/test_permission_status_types.py
          permission_red_status=0
          uv run --locked python -m pytest -q tests/test_permission_status_types.py -k 'not widening and not raw_control' > "$RUNNER_TEMP/permission-red.log" 2>&1 || permission_red_status=$?
          cat "$RUNNER_TEMP/permission-red.log"
          test "$permission_red_status" -eq 1
          git diff --exit-code -- src/archkeel
      - name: Export authored formatted test
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          print("PERMISSION_RED_TEST=" + json.dumps({"tests/test_permission_status_types.py":Path("tests/test_permission_status_types.py").read_text()}))
          PY
