name: Verify final integration history native replay
on:
  push:
    branches: [verify/542-final-owned-controls-gates]
permissions:
  contents: read
jobs:
  normal-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eb65d2f1e271c5ad7e3e87c1eb30760f1ea4b9b2
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Exact committed normal Main-bound NoWrite
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          protected=["architecture-baseline.json","docs/architecture/decisions/2026-10-17-existing-pr-backlog-amendment.json"]
          before={p:Path(p).read_bytes() for p in protected}
          args=["uv","run","--locked","archkeel","validate","--root",".","--baseline","architecture-baseline.json","--json","--against","113318809036cfa4550b2b8598dab63c0b548878","--amendment",protected[1]]
          r=subprocess.run(args,capture_output=True,text=True)
          data=json.loads(r.stdout)
          print("FINAL_NOWRITE="+json.dumps({"exit":r.returncode,"valid":data.get("valid"),"measurements":data.get("measurements"),"failures":data.get("failures"),"diagnostics":data.get("diagnostics"),"widenings":data.get("widenings")}),flush=True)
          if r.stderr:print(r.stderr)
          assert r.returncode==0,r.stdout[-20000:]
          assert all(Path(p).read_bytes()==content for p,content in before.items())
          assert subprocess.check_output(["git","status","--porcelain"])==b""
          print("FINAL_PROTECTED_DIGESTS="+json.dumps({p:hashlib.sha256(content).hexdigest() for p,content in before.items()}),flush=True)
          PY
