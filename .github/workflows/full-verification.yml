name: Full verification

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  full-suite-and-reports:
    name: Architecture, build and report checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check architecture, lint, types, build, installed CLI and generated assets
        run: make ci-core-check SKIP_TESTS=1

      - name: Measure architecture report
        run: make report-timing

      - name: Check documentation diagrams
        run: make mermaid

      - name: Upload latest report evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-check-evidence
          path: |
            test-artifacts/pytest/*.xml
            test-artifacts/report-timing/architecture.timing.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload the current report for Pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-report
          path: |
            test-artifacts/report-timing/architecture.json
            test-artifacts/report-timing/architecture.report.html
            test-artifacts/report-timing/architecture.detail*.html
          if-no-files-found: error
          retention-days: 1

  demos:
    name: Demos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run every gallery demo and check its expected result
        run: make demos

      - name: Upload the demo gallery for Pages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-gallery
          path: test-artifacts/pages/
          if-no-files-found: warn
          retention-days: 1

  tests:
    name: "Tests: ${{ matrix.area }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One entry for each area in tests/areas.py.
        area:
          - demo catalog
          - TypeScript collector target
          - boundary types
          - Python analysis
          - CLI, contracts and dependency rules
          - type and wire guards
          - collectors
          - call and catalog rules
          - reports
          - self-check and CI
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run every test of this area
        env:
          AREA: ${{ matrix.area }}
        run: make full-test AREA="$AREA"

      - name: Upload full suite JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-full-${{ matrix.area }}
          path: test-artifacts/pytest/results.xml
          if-no-files-found: warn
          retention-days: 1

  python-compat:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The analyzer reads source with the `ast` of the running interpreter (#724). The files in
    # `make python-compat` cover what differs between versions; the full suite runs on 3.11.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.10", "3.14.7"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          version: "0.12.13"

      - name: Install locked package
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Run the Python compatibility tests
        run: make python-compat TEST_WORKERS=4

  collector-safety-windows:
    name: "Windows: collector safety"
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full-history fetches create unrelated refs that Windows cannot store.
          fetch-depth: 1
          persist-credentials: false

      - name: Install Make
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes and locked package
        run: |
          uv python install 3.11.12 3.12.10
          uv sync --locked --python 3.11.12

      - name: Verify native collector safety
        shell: bash
        run: make collector-safety SHELL=bash

  language-collectors:
    name: "Linux: source collectors"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Python 3.11 is covered by the full Linux suite; repeat compatibility on 3.12 only.
    env:
      UV_PYTHON: "3.12.10"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.10"
          version: "0.12.13"

      - name: Install locked package
        run: uv sync --locked --python 3.12.10

      - name: Verify TypeScript collector compatibility
        shell: bash
        run: make typescript-native TEST_WORKERS=4 SHELL=bash

      - name: Verify Dart collector compatibility
        shell: bash
        run: make dart-test TEST_WORKERS=4 SHELL=bash

      - name: Verify package build and installed CLI
        shell: bash
        run: make build smoke SHELL=bash

  verified:
    name: All Full checks passed
    needs:
      - full-suite-and-reports
      - tests
      - demos
      - python-compat
      - collector-safety-windows
      - language-collectors
    # always(): a skipped aggregate would count as passed, so it must also run when a job fails.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Full job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "A Full job did not succeed: $result" >&2; exit 1; }
          done
          [[ $(wc -w <<< "$RESULTS") -eq 6 ]] || { echo "Expected 6 job results: $RESULTS" >&2; exit 1; }
