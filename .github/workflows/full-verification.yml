name: Full verification

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  full-suite-and-reports:
    name: Architecture, build and report checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Remove old local build outputs
        run: make ci-artifacts-clean

      - name: Check architecture, lint, types, package build and installed CLI
        run: make gate SHARDED_TESTS=1

      - name: Check TypeScript fixture and generated browser assets
        # The preceding gate already installs the browser runtime.
        run: make -o browser-runtime-install typescript-compiler-check browser-graph-check ci-typescript browser-runtime-check typescript-libs-check

      - name: Measure architecture report
        if: ${{ !((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
        run: make report-timing

      - name: Measure report and build gallery for Pages
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: make report-pages

      - name: Check documentation diagrams
        run: make mermaid

      - name: Upload latest report evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-check-evidence
          path: |
            test-artifacts/pytest/*.xml
            test-artifacts/report-timing/architecture.timing.json
            test-artifacts/validation/result.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload report site for deployment
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: test-artifacts/pages/
          retention-days: 1

  demos:
    name: Demo analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Install locked dependencies
        id: install
        run: uv sync --locked
      - name: Demo / uml-match
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-match" OUTPUT="test-artifacts/demos/uml-match"
      - name: Demo / uml-complete
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-complete" OUTPUT="test-artifacts/demos/uml-complete"
      - name: Demo / uml-dart-match
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-dart-match" OUTPUT="test-artifacts/demos/uml-dart-match"
      - name: Demo / uml-dart-signature-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-dart-signature-fail" OUTPUT="test-artifacts/demos/uml-dart-signature-fail"
      - name: Demo / uml-dart-missing-member-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-dart-missing-member-fail" OUTPUT="test-artifacts/demos/uml-dart-missing-member-fail"
      - name: Demo / uml-dart-forbidden-dependency-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-dart-forbidden-dependency-fail" OUTPUT="test-artifacts/demos/uml-dart-forbidden-dependency-fail"
      - name: Demo / uml-dart-partial-unknown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-dart-partial-unknown" OUTPUT="test-artifacts/demos/uml-dart-partial-unknown"
      - name: Demo / uml-flutter-shop
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-flutter-shop" OUTPUT="test-artifacts/demos/uml-flutter-shop"
      - name: Demo / uml-flutter-signature-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-flutter-signature-fail" OUTPUT="test-artifacts/demos/uml-flutter-signature-fail"
      - name: Demo / uml-flutter-missing-member-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-flutter-missing-member-fail" OUTPUT="test-artifacts/demos/uml-flutter-missing-member-fail"
      - name: Demo / uml-flutter-forbidden-dependency-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-flutter-forbidden-dependency-fail" OUTPUT="test-artifacts/demos/uml-flutter-forbidden-dependency-fail"
      - name: Demo / uml-flutter-dynamic-unknown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-flutter-dynamic-unknown" OUTPUT="test-artifacts/demos/uml-flutter-dynamic-unknown"
      - name: Demo / uml-flutter-unsupported-declaration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-flutter-unsupported-declaration" OUTPUT="test-artifacts/demos/uml-flutter-unsupported-declaration"
      - name: Demo / uml-compass-project
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-compass-project" OUTPUT="test-artifacts/demos/uml-compass-project"
      - name: Demo / uml-compass-forbidden-edge
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-compass-forbidden-edge" OUTPUT="test-artifacts/demos/uml-compass-forbidden-edge"
      - name: Demo / uml-compass-signature-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-compass-signature-fail" OUTPUT="test-artifacts/demos/uml-compass-signature-fail"
      - name: Demo / uml-compass-dynamic-unknown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-compass-dynamic-unknown" OUTPUT="test-artifacts/demos/uml-compass-dynamic-unknown"
      - name: Demo / uml-python-realworld-project
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-python-realworld-project" OUTPUT="test-artifacts/demos/uml-python-realworld-project"
      - name: Demo / uml-python-realworld-forbidden-edge
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-python-realworld-forbidden-edge" OUTPUT="test-artifacts/demos/uml-python-realworld-forbidden-edge"
      - name: Demo / uml-python-realworld-signature-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-python-realworld-signature-fail" OUTPUT="test-artifacts/demos/uml-python-realworld-signature-fail"
      - name: Demo / uml-python-realworld-dynamic-unknown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-python-realworld-dynamic-unknown" OUTPUT="test-artifacts/demos/uml-python-realworld-dynamic-unknown"
      - name: Demo / uml-nest-realworld-project
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-nest-realworld-project" OUTPUT="test-artifacts/demos/uml-nest-realworld-project"
      - name: Demo / uml-nest-realworld-forbidden-edge
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-nest-realworld-forbidden-edge" OUTPUT="test-artifacts/demos/uml-nest-realworld-forbidden-edge"
      - name: Demo / uml-nest-realworld-signature-fail
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-nest-realworld-signature-fail" OUTPUT="test-artifacts/demos/uml-nest-realworld-signature-fail"
      - name: Demo / uml-nest-realworld-dynamic-unknown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-nest-realworld-dynamic-unknown" OUTPUT="test-artifacts/demos/uml-nest-realworld-dynamic-unknown"
      - name: Demo / uml-typescript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-typescript" OUTPUT="test-artifacts/demos/uml-typescript"
      - name: Demo / uml-typescript-match
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-typescript-match" OUTPUT="test-artifacts/demos/uml-typescript-match"
      - name: Demo / uml-typescript-mismatch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-typescript-mismatch" OUTPUT="test-artifacts/demos/uml-typescript-mismatch"
      - name: Demo / uml-typescript-partial
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-typescript-partial" OUTPUT="test-artifacts/demos/uml-typescript-partial"
      - name: Demo / uml-mismatch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-mismatch" OUTPUT="test-artifacts/demos/uml-mismatch"
      - name: Demo / uml-partial
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="uml-partial" OUTPUT="test-artifacts/demos/uml-partial"
      - name: Demo / tour
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="tour" OUTPUT="test-artifacts/demos/tour"
      - name: Demo / clean
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="clean" OUTPUT="test-artifacts/demos/clean"
      - name: Demo / open
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="open" OUTPUT="test-artifacts/demos/open"
      - name: Demo / wide
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="wide" OUTPUT="test-artifacts/demos/wide"
      - name: Demo / deep
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="deep" OUTPUT="test-artifacts/demos/deep"
      - name: Demo / mixed
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="mixed" OUTPUT="test-artifacts/demos/mixed"
      - name: Demo / unknown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="unknown" OUTPUT="test-artifacts/demos/unknown"
      - name: Demo / known
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="known" OUTPUT="test-artifacts/demos/known"
      - name: Demo / target-present
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="target-present" OUTPUT="test-artifacts/demos/target-present"
      - name: Demo / target-absent
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="target-absent" OUTPUT="test-artifacts/demos/target-absent"
      - name: Demo / target-store
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="target-store" OUTPUT="test-artifacts/demos/target-store"
      - name: Demo / empty-responsibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="empty-responsibility" OUTPUT="test-artifacts/demos/empty-responsibility"
      - name: Demo / dart-clean
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="dart-clean" OUTPUT="test-artifacts/demos/dart-clean"
      - name: Demo / dart-tour
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="dart-tour" OUTPUT="test-artifacts/demos/dart-tour"
      - name: Demo / typescript-clean
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make demo-ci CASE="typescript-clean" OUTPUT="test-artifacts/demos/typescript-clean"
      - name: Upload demo results and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-results
          path: test-artifacts/demos/
          if-no-files-found: warn
          retention-days: 7

  full-suite-shards:
    name: All Python tests / part ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run full suite shard
        run: make full-test-shard TEST_SHARD=${{ strategy.job-index }}/${{ strategy.job-total }}

      - name: Upload full suite JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-full-${{ matrix.shard }}
          path: test-artifacts/pytest/results.xml
          if-no-files-found: warn
          retention-days: 1

  python-compat:
    name: Python compatibility / Python ${{ matrix.python }}
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The analyzer reads source with the `ast` of the running interpreter (#724). The files in
    # `make python-compat` cover what differs between versions; the full suite runs on 3.11.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.10", "3.14.7"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          version: "0.12.13"

      - name: Install locked package
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Run the Python compatibility tests
        run: make python-compat TEST_WORKERS=4

  collector-safety-windows:
    name: Collector safety / Windows / Python 3.11.12
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full-history fetches create unrelated refs that Windows cannot store.
          fetch-depth: 1
          persist-credentials: false

      - name: Install Make
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes and locked package
        run: |
          uv python install 3.11.12 3.12.10
          uv sync --locked --python 3.11.12

      - name: Verify native collector safety
        shell: bash
        run: make collector-safety SHELL=bash

  language-collectors:
    name: Source collectors / Linux / Python 3.12.10
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Python 3.11 is covered by the full Linux suite; repeat compatibility on 3.12 only.
    env:
      UV_PYTHON: "3.12.10"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.10"
          version: "0.12.13"

      - name: Install locked package
        run: uv sync --locked --python 3.12.10

      - name: Verify TypeScript collector compatibility
        shell: bash
        run: make typescript-native TEST_WORKERS=4 SHELL=bash

      - name: Verify Dart collector compatibility
        shell: bash
        run: make dart-test TEST_WORKERS=4 SHELL=bash

      - name: Verify package build and installed CLI
        shell: bash
        run: make build smoke SHELL=bash

  verified:
    name: Full verification aggregate
    if: always()
    needs:
      - full-suite-and-reports
      - full-suite-shards
      - demos
      - python-compat
      - collector-safety-windows
      - language-collectors
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected verification jobs
        env:
          EVENT: ${{ github.event_name }}
          FULL_RESULT: ${{ needs.full-suite-and-reports.result }}
          SHARDS_RESULT: ${{ needs.full-suite-shards.result }}
          DEMOS_RESULT: ${{ needs.demos.result }}
          COMPAT_RESULT: ${{ needs.python-compat.result }}
          SAFETY_RESULT: ${{ needs.collector-safety-windows.result }}
          COLLECTORS_RESULT: ${{ needs.language-collectors.result }}
        run: |
          set -euo pipefail
          for result in "$FULL_RESULT" "$SHARDS_RESULT" "$SAFETY_RESULT" "$DEMOS_RESULT"; do
          [[ "$result" == success ]] || { echo "A required full-verification job did not succeed: $result" >&2; exit 1; }
          done
          expected=success
          if [[ "$EVENT" == pull_request ]]; then expected=skipped; fi
          [[ "$COMPAT_RESULT" == "$expected" ]] || { echo "Unexpected Python compatibility result: $COMPAT_RESULT (expected $expected)" >&2; exit 1; }
          [[ "$COLLECTORS_RESULT" == "$expected" ]] || { echo "Unexpected collector compatibility result: $COLLECTORS_RESULT (expected $expected)" >&2; exit 1; }

  prune-report-artifacts:
    name: Maintain Actions and report artifacts
    needs: [verified, deploy-report-pages]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    concurrency:
      group: actions-maintenance
      cancel-in-progress: false
    steps:
      - name: Check out trusted main workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Disable obsolete workflow registrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: make prune-workflows DISABLE=true WORKFLOW_PRUNE_DIR="$RUNNER_TEMP/workflow-prune"

      - name: Prune old report artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: make prune-report-artifacts DELETE=true REPORT_ARTIFACT_PRUNE_DIR="$RUNNER_TEMP/report-artifact-prune"

      - name: Upload workflow maintenance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-maintenance-${{ github.job }}
          path: ${{ runner.temp }}/workflow-prune/plan.json
          if-no-files-found: warn
          retention-days: 7

  deploy-report-pages:
    name: Publish the verified report gallery
    needs: [full-suite-and-reports, verified]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # An older rerun must not replace a newer Main report.
      - name: Read current Main revision
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - name: Deploy report
        if: steps.main.outputs.sha == github.sha
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
