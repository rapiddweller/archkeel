name: Full verification

# Full runs nightly on main, by dispatch, and when a release calls it (AD-348). No PR runs it.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite-and-reports:
    name: Architecture, build and report checks
    runs-on: ubuntu-24.04
    # A hang guard, not a budget (AD-341): about twice the slowest measured job. A slow job never fails a PR.
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check architecture, lint, types, build, installed CLI and generated assets
        run: make ci-core-check SKIP_TESTS=1

      - name: Check the Rust of native/ with the core against its pinned result
        run: make self-validate-native

      - name: Check documentation diagrams
        run: make mermaid

      - name: Upload latest report evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-check-evidence
          path: |
            test-artifacts/pytest/*.xml
            test-artifacts/validation-native/result.json
          if-no-files-found: warn
          retention-days: 1

  tests:
    name: "Tests: ${{ matrix.area }}"
    runs-on: ubuntu-24.04
    # A hang guard, not a budget (AD-341): about twice the slowest measured job. A slow job never fails a PR.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # One entry for each area in tests/areas.py.
        area:
          - CLI and core
          - native collectors
          - collectors
          - reports
          - self-check and CI
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10 3.13.15 3.14.7

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Show the runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'

      - name: Run every test of this area
        env:
          AREA: ${{ matrix.area }}
        run: make full-test AREA="$AREA"

      - name: Upload full suite JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-full-${{ matrix.area }}
          path: test-artifacts/pytest/results.xml
          if-no-files-found: warn
          retention-days: 1

  shell-compat:
    name: "Linux: shell and package on Python 3.12"
    runs-on: ubuntu-24.04
    # A hang guard, not a budget (AD-341): about twice the slowest measured job. A slow job never fails a PR.
    timeout-minutes: 40
    # Python 3.11 is covered by the full Linux suite; repeat the shell tests on 3.12 only.
    env:
      UV_PYTHON: "3.12.10"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.10"
          version: "0.12.13"

      - name: Install locked package
        run: uv sync --locked --python 3.12.10

      - name: Verify the shell of the core on this Python
        shell: bash
        run: make shell-compat TEST_WORKERS=4 SHELL=bash

      - name: Verify package build and installed CLI
        shell: bash
        run: make build smoke SHELL=bash

  # AD-317, AD-436: build each platform wheel on its own target, then install it alone and read
  # the verdicts of its core.
  native-wheel-linux:
    name: "Native wheel: ${{ matrix.target }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manylinux x86_64
            artifact: manylinux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64:2026.11.07-1@sha256:62eeff30ef134a85ec0f97109e008a319b0315ca5e8a6d754ee771556c02622a
            tag: py3-none-manylinux_2_17_x86_64
          - target: manylinux aarch64
            artifact: manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64:2026.11.07-1@sha256:101d2292840109c9d329fcfcd7b89b46f59e19ca23cbfdcf059fb389994665fc
            tag: py3-none-manylinux_2_17_aarch64
          - target: musllinux x86_64
            artifact: musllinux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/musllinux_1_2_x86_64:2026.11.07-1@sha256:cf82db9d8dc8c5c2cb27f422208baf266ebc8ad70be4ab1bc79bcc8807a6432d
            tag: py3-none-musllinux_1_2_x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs reads the version from the tags.
          fetch-depth: 0
          persist-credentials: false

      # The image sets the oldest glibc or musl of the wheel. JavaScript actions cannot run in it.
      - name: Build, check, install and run the wheel in the pinned image
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
        run: |
          docker run --rm -e TAG -v "$PWD:/io" -w /io "$IMAGE" bash -euo pipefail -c '
            git config --global --add safe.directory /io
            # The core runs Git only from /usr/bin/git, and the image has it in /usr/local/bin.
            ln -s /usr/local/bin/git /usr/bin/git
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.97.0
            . "$HOME/.cargo/env"
            python=/opt/python/cp311-cp311/bin/python
            "$python" -m pip install --disable-pip-version-check --quiet uv==0.12.13
            export PATH="$(dirname "$python"):$PATH" UV_PYTHON="$python"
            make native-wheel NATIVE_TAG="$TAG"
          '

      - name: Upload the platform wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wheel-${{ matrix.artifact }}
          path: dist/native/*.whl
          if-no-files-found: error
          retention-days: 7

  native-wheel-macos:
    name: "Native wheel: ${{ matrix.target }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS x86_64
            artifact: macos-x86_64
            runner: macos-15-intel
            tag: py3-none-macosx_10_12_x86_64
          - target: macOS arm64
            artifact: macos-arm64
            runner: macos-15
            tag: py3-none-macosx_11_0_arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Build, check, install and run the wheel
        env:
          TAG: ${{ matrix.tag }}
        run: make native-wheel NATIVE_TAG="$TAG"

      - name: Upload the platform wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wheel-${{ matrix.artifact }}
          path: dist/native/*.whl
          if-no-files-found: error
          retention-days: 7

  native-wheel-windows:
    name: "Native wheel: Windows x86_64"
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full-history fetches create unrelated refs that Windows cannot store. The tags give
          # the version when the commit has a release tag.
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Install Make
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Build, check, install and run the wheel
        shell: bash
        run: make native-wheel NATIVE_TAG=py3-none-win_amd64 SHELL=bash

      - name: Upload the platform wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wheel-windows-x86_64
          path: dist/native/*.whl
          if-no-files-found: error
          retention-days: 7

  verified:
    name: All Full checks passed
    needs:
      - full-suite-and-reports
      - tests
      - shell-compat
      - native-wheel-linux
      - native-wheel-macos
      - native-wheel-windows
    # always(): a skipped aggregate would count as passed, so it must also run when a job fails.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # AD-341: a warning for each job over the time budget. A failed report does not fail the run.
      - name: Report each job time against the time budget
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[]' | python3 tools/ci_budget.py --job-minutes 15 --path-minutes 30 --summary "$GITHUB_STEP_SUMMARY"

      - name: Require every Full job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "A Full job did not succeed: $result" >&2; exit 1; }
          done
          [[ -n "$RESULTS" ]] || { echo "No job results" >&2; exit 1; }
