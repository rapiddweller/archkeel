name: Full verification

# Full runs nightly on main, by dispatch, and when a release calls it (AD-348). No PR runs it.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the wheels (not used by Full)"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-suite-and-reports:
    name: Architecture, build and report checks
    runs-on: ubuntu-24.04
    # A hang guard, not a budget (AD-341): about twice the slowest measured job. A slow job never fails a PR.
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install the pinned Rust toolchain once, before any parallel step
        working-directory: native
        run: rustup toolchain install

      - name: Check architecture, lint, types, build, installed CLI and generated assets
        run: make ci-core-check SKIP_TESTS=1

      - name: Remove any self-check result that the checkout holds
        run: rm -f test-artifacts/selfcheck/result.json test-artifacts/selfcheck/base.json

      # AD-1061: the release core must give the result that the gate profile gave on main CI for this
      # commit (AD-754). The base comparison is not run here: it is for the PR gate.
      - name: Restore the gate-profile self-check result of this commit
        id: gate_result
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-artifacts/selfcheck/base.json
          key: selfcheck-v1-${{ runner.os }}-${{ github.sha }}

      - name: Check native/ and the Python shell with the core against their pinned results
        run: make self-validate SELFCHECK_ARGS=--no-compare

      - name: Compare the release result with the gate-profile result of this commit
        run: |
          if [ ! -f test-artifacts/selfcheck/base.json ]; then
            echo "No gate-profile result is cached for ${GITHUB_SHA} (a main CI run did not finish for it): not compared." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            uv run --locked python tools/self_check_diff.py same test-artifacts/selfcheck/base.json test-artifacts/selfcheck/result.json
          fi

      - name: Check documentation diagrams
        run: make mermaid

      - name: Upload latest report evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-check-evidence
          path: |
            test-artifacts/pytest/*.xml
            test-artifacts/validation-native/result.json
          if-no-files-found: warn
          retention-days: 1

  tests:
    name: "Tests: ${{ matrix.area }}"
    runs-on: ubuntu-24.04
    # A hang guard, not a budget (AD-341): about twice the slowest measured job. A slow job never fails a PR.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # One entry for each area in tests/areas.py.
        area:
          - CLI and core
          - native collectors
          - collectors
          - reports
          - self-check and CI
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install the Dart SDK for the oracle tests
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: "3.12.2"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10 3.13.15 3.14.7

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install the pinned Rust toolchain once, before any parallel step
        working-directory: native
        run: rustup toolchain install

      - name: Show the runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'

      - name: Run every test of this area
        env:
          AREA: ${{ matrix.area }}
          # The nightly run fetches the pinned sources of the real-project fixtures (the PR gate
          # does not touch the network); the fixture matrix pins their result.
          ARCHKEEL_FETCH_SOURCES: "1"
        run: make full-test AREA="$AREA"

      - name: Name the first failing test in the job summary
        if: failure()
        env:
          AREA: ${{ matrix.area }}
        run: >-
          python3 tools/ci_failure_summary.py --job "$AREA"
          --junit test-artifacts/pytest/results.xml
          --reproduce "make full-test AREA=\"$AREA\""
          --artifact "pytest-results-full-$AREA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full suite JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-full-${{ matrix.area }}
          path: test-artifacts/pytest/results.xml
          if-no-files-found: warn
          retention-days: 1

      # #659, AD-878: the phase seconds of the core on a pinned public project. Only the area
      # "CLI and core" writes them. The table is in the job summary; no limit is set, because the
      # spread of many nights is needed first (tests/timing_reference/README.md).
      - name: Upload phase timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-timings-${{ matrix.area }}
          path: test-artifacts/phase-timings/
          if-no-files-found: ignore
          retention-days: 30

  shell-compat:
    name: "Linux: shell and package on Python 3.12"
    runs-on: ubuntu-24.04
    # A hang guard, not a budget (AD-341): about twice the slowest measured job. A slow job never fails a PR.
    timeout-minutes: 40
    # Python 3.11 is covered by the full Linux suite; repeat the shell tests on 3.12 only.
    env:
      UV_PYTHON: "3.12.10"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.10"
          version: "0.12.13"

      - name: Install locked package
        run: uv sync --locked --python 3.12.10

      - name: Install the pinned Rust toolchain once, before any parallel step
        working-directory: native
        run: rustup toolchain install

      - name: Verify the shell of the core on this Python
        shell: bash
        run: make shell-compat TEST_WORKERS=4 SHELL=bash

      - name: Verify package build and installed CLI
        shell: bash
        run: make sdist smoke SHELL=bash

      # #1756, #1757: the classifiers name 3.13 and 3.14, so the installed CLI runs on them too.
      - name: Verify the installed CLI on Python 3.13
        shell: bash
        env:
          UV_PYTHON: "3.13.15"
        run: uv python install 3.13.15 && make smoke SHELL=bash

      - name: Verify the installed CLI on Python 3.14
        shell: bash
        env:
          UV_PYTHON: "3.14.7"
        run: uv python install 3.14.7 && make smoke SHELL=bash

  native-wheels:
    uses: ./.github/workflows/native-wheels.yml

  verified:
    name: All Full checks passed
    needs:
      - full-suite-and-reports
      - tests
      - shell-compat
      - native-wheels
    # always(): a skipped aggregate would count as passed, so it must also run when a job fails.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # AD-341: a warning for each job over the time budget. A failed report does not fail the run.
      - name: Report each job time against the time budget
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[]' | python3 tools/ci_budget.py --job-minutes 15 --path-minutes 30 --summary "$GITHUB_STEP_SUMMARY"

      - name: Require every Full job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              cancelled) echo "A Full job was cancelled (a newer push or a person cancelled the run): run it again; this is not a failure of the code" >&2; exit 1 ;;
              skipped) echo "A Full job was skipped: GitHub counts a skipped required job as passed, so this gate refuses it" >&2; exit 1 ;;
              *) echo "A Full job failed: $result" >&2; exit 1 ;;
            esac
          done
          [[ -n "$RESULTS" ]] || { echo "No job results" >&2; exit 1; }
