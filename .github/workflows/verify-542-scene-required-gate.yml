name: Required native Scene gate regression
on:
  push:
    branches: [verify/542-scene-required-gate]
permissions:
  contents: read
jobs:
  actual-scene-required-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Actual path selection, required compiler ordering, permanent runtime sample
        run: uv run --locked python -m pytest -q tests/test_ci_changes.py tests/test_make_gate.py
