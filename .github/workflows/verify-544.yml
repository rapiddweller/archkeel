name: Verify exact module-object grants
on:
  push:
    branches: [verify/544-module-object-grants-tests]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Native and lifecycle GREEN
        run: uv run --locked python -m pytest -q tests/test_module_object_grants.py --maxfail=8
      - name: Format and lint
        if: always()
        run: |
          uv run --locked ruff format src/archkeel/ir/model.py src/archkeel/ir/codec_contract.py src/archkeel/check/declarations.py src/archkeel/check/evaluation/rules.py src/archkeel/ir/widening.py tools/architecture_graph_schema.py tests/test_contract_model.py tests/test_module_object_grants.py
          uv run --locked ruff check src/archkeel/ir/model.py src/archkeel/ir/codec_contract.py src/archkeel/check/declarations.py src/archkeel/check/evaluation/rules.py src/archkeel/ir/widening.py tools/architecture_graph_schema.py tests/test_contract_model.py tests/test_module_object_grants.py
      - name: Capture formatted files and version maps
        if: always()
        run: |
          rg -n '3\\.5\\.0|architecture-contract-3\\.5' src tools tests docs README.md Makefile
          python - <<'PY'
          import json,pathlib,base64
          paths=["src/archkeel/ir/model.py","src/archkeel/ir/codec_contract.py","src/archkeel/check/declarations.py","src/archkeel/check/evaluation/rules.py","src/archkeel/ir/widening.py","tools/architecture_graph_schema.py","tests/test_contract_model.py","tests/test_module_object_grants.py"]
          print("FILES="+base64.b64encode(json.dumps({p:pathlib.Path(p).read_text() for p in paths}).encode()).decode())
          PY
