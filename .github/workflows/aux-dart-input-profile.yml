name: Dart path ingress concrete cost comparison
on:
  push:
    branches: [verify/542-dart-input-profile]
permissions:
  contents: read
jobs:
  actual-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked python - <<'PY'
          import importlib
          import json
          import statistics
          import subprocess
          import sys
          import time
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from archkeel.analyzer.dart.collect import collect
          from archkeel.cli.config import parse_config
          from archkeel.ir.facts_codec import encode_response
          from archkeel.ir.protocol import CollectionRequest, CollectionResponse, DartSettings, SnapshotInput, SourceScope
          root = Path.cwd() / "fixtures/J-compass"
          config = parse_config((root / "archkeel.toml").read_bytes())
          request = CollectionRequest(SnapshotInput(str(root), "a"*40, False), SourceScope(config.roots, config.namespace), DartSettings())
          with TemporaryDirectory(prefix="dart-path-ingress-cost-") as temporary:
              functions = {}
              for label, ref in (("original", "0e3b8a7f62b9b13417cda78e11b52d0de82986cd"), ("uncached", "252040d6d03eaa5303fa2c0a23a9c447ff6d465f"), ("cached", "f31b4c1bdabbf81ec47aed71ac0f91cdb869909d")):
                  package = Path(temporary) / (label + "_dart")
                  package.mkdir()
                  for name in ("__init__", "collect", "parse", "resolve", "snapshot", "syntax"):
                      raw = subprocess.run(["git", "show", ref + ":src/archkeel/analyzer/dart/" + name + ".py"], check=True, capture_output=True).stdout
                      (package / (name + ".py")).write_bytes(raw)
                  sys.path.insert(0, temporary)
                  functions[label] = importlib.import_module(label + "_dart.collect").collect
              wires = {label: encode_response(CollectionResponse(function(request))) for label, function in functions.items()}
              assert wires["original"] == wires["uncached"] == wires["cached"]
              print("DART_THREE_VARIANT_WIRE", len(wires["cached"]), flush=True)
              labels = tuple(functions)
              samples = {label: [] for label in labels}
              for repeat in range(6):
                  order = labels[repeat % 3:] + labels[:repeat % 3]
                  if repeat % 2:
                      order = tuple(reversed(order))
                  for label in order:
                      started = time.perf_counter()
                      functions[label](request)
                      samples[label].append(time.perf_counter() - started)
              medians = {label: statistics.median(values) for label, values in samples.items()}
              print("DART_CONCRETE_PATH_COST=" + json.dumps(dict(fixture="J-compass", samples=samples, medians=medians, cache_vs_uncached_percent=(medians["cached"]/medians["uncached"]-1)*100, cached_vs_original_percent=(medians["cached"]/medians["original"]-1)*100), sort_keys=True), flush=True)
          PY
