name: Dart constructed receiver cost attribution
on:
  push:
    branches: [verify/542-dart-input-profile]
permissions:
  contents: read
jobs:
  actual-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked python - <<'PY'
          import cProfile
          import importlib
          import json
          import pstats
          import subprocess
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from archkeel.analyzer.dart.collect import collect
          from archkeel.cli.config import parse_config
          from archkeel.ir.protocol import CollectionRequest, DartSettings, SnapshotInput, SourceScope
          root = Path.cwd() / "fixtures/J-compass"
          config = parse_config((root / "archkeel.toml").read_bytes())
          request = CollectionRequest(SnapshotInput(str(root), "a"*40, False), SourceScope(config.roots, config.namespace), DartSettings())
          with TemporaryDirectory(prefix="dart-input-cost-") as temporary:
              package = Path(temporary) / "prior_dart"
              package.mkdir()
              for name in ("__init__", "collect", "parse", "resolve", "snapshot", "syntax"):
                  raw = subprocess.run(["git", "show", "0e3b8a7f62b9b13417cda78e11b52d0de82986cd:src/archkeel/analyzer/dart/" + name + ".py"], check=True, capture_output=True).stdout
                  (package / (name + ".py")).write_bytes(raw)
              sys.path.insert(0, temporary)
              prior = importlib.import_module("prior_dart.collect").collect
              for label, function in (("before", prior), ("after", collect)):
                  profile = cProfile.Profile()
                  profile.runcall(function, request)
                  stats = pstats.Stats(profile)
                  rows = []
                  for (filename, line, name), (primitive, calls, own, cumulative, callers) in stats.stats.items():
                      if "/dart/" in filename or "/prior_dart/" in filename:
                          rows.append(dict(file=Path(filename).name, line=line, name=name, calls=calls, own=own, cumulative=cumulative))
                  rows.sort(key=lambda row: row["cumulative"], reverse=True)
                  print("DART_COST_PROFILE=" + json.dumps(dict(label=label, rows=rows[:45]), sort_keys=True), flush=True)
          PY
