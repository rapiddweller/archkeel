name: Native TS JS construct Target and regression GREEN
on:
  push:
    branches: [verify/542-typescript-direct-construct-green]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py tests/test_typescript_syntax_compatibility.py tests/test_repository_hygiene.py --tb=short
      - name: Ruff
        if: ${{ always() }}
        run: uv run --locked ruff check src/archkeel tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py tests/test_typescript_control_target.py
      - name: Formatter diff
        if: ${{ always() }}
        run: uv run --locked ruff format --diff src/archkeel/analyzer/typescript/parse.py src/archkeel/analyzer/typescript/syntax.py src/archkeel/analyzer/typescript/collect.py src/archkeel/ir/profiles.py src/archkeel/ir/codec_observation.py src/archkeel/check/evaluation/evaluate.py tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py tests/test_typescript_control_target.py
      - name: Strict mypy
        if: ${{ always() }}
        run: uv run --locked mypy src/archkeel
  typescript-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: All TypeScript native differential legacy DTO and Target tests
        run: uv run --locked python -m pytest -n 2 --dist=loadfile --max-worker-restart=0 -q tests/test_typescript*.py tests/test_collection_capabilities.py tests/test_collection_boundary_regressions.py tests/test_source_trust_boundary.py --tb=short
      - name: Pinned compiler
        if: ${{ always() }}
        run: make typescript-compiler-check
  own-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual own native budgets before any baseline or receipt rewrite
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/construct-native.json"
          native_status=$?
          set -e
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "construct-native.json").read_text())
          print("ACTUAL_OWN_NATIVE=" + json.dumps({key: value.get(key) for key in ("exit_code", "measurements", "failures", "diagnostics")}), flush=True)
          PY
          exit "$native_status"
