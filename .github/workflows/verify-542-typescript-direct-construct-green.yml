name: Native TS JS direct-kind construct GREEN
on:
  push:
    branches: [verify/542-typescript-direct-construct-green]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual native facts, JS scope/evidence and independent receipt groups
        run: uv run --locked python -m pytest -q tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py --tb=short
      - name: Ruff
        if: ${{ always() }}
        run: uv run --locked ruff check src/archkeel tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py
      - name: Formatter diff
        if: ${{ always() }}
        run: uv run --locked ruff format --diff src/archkeel/analyzer/typescript/parse.py src/archkeel/analyzer/typescript/syntax.py src/archkeel/analyzer/typescript/collect.py src/archkeel/ir/profiles.py src/archkeel/ir/codec_observation.py src/archkeel/check/evaluation/evaluate.py tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py
      - name: Strict mypy
        if: ${{ always() }}
        run: uv run --locked mypy src/archkeel
  lexical-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Existing parser collector and all direct legacy DTO controls
        run: uv run --locked python -m pytest -q tests/test_typescript_parse.py tests/test_typescript_collect.py tests/test_typescript_inner.py tests/test_typescript_syntax_types.py tests/test_typescript_owned_types.py tests/test_typescript_provenance.py tests/test_collection_capabilities.py tests/test_collection_protocol.py --tb=short
