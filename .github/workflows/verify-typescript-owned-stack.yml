name: TypeScript exact final amendment
on:
  push:
    branches: [verify/542-typescript-owned-stack]
permissions:
  contents: read
jobs:
  exact-final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7d16367ceb5561caadbba3d32c2cf66ba38ce63d
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Validate the exact committed final source and generated amendment
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 3901fbd831514e1e019bc1649173cccc52681a06 --amendment docs/architecture/decisions/issue-542-typescript-control-amendment.json > "$RUNNER_TEMP/tsstack-exact.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "tsstack-exact.json").read_text())
          print("EXACT_RESULT=" + json.dumps({key: result.get(key) for key in ("exit_code", "amendment_status", "failures", "diagnostics", "measurements")}))
          PY
          exit "$task_status"
