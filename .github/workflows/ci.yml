name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run the locked CI checks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make ci-check

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: test-artifacts/pytest/results.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload report runtime
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-runtime
          path: test-artifacts/report-timing/architecture.timing.json
          if-no-files-found: warn
          retention-days: 7

      # Only synthetic fixtures/F-architecture reports, never a consumer repository.
      - name: Upload synthetic report browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-browser-evidence
          path: test-artifacts/report-browser/
          if-no-files-found: warn
          retention-days: 7

  collector-safety-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.12", "3.12.10"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Make
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          version: "0.12.13"

      - name: Install supported runtimes and locked package
        run: |
          uv python install 3.11.12 3.12.10
          uv sync --locked --python ${{ matrix.python }}

      - name: Verify native collector safety
        shell: bash
        run: make collector-safety SHELL=bash

  collector-runtimes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22.13.0", "24", "26"]
        include:
          - os: windows-latest
            node: "22.13.0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported Python runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify packaged TypeScript collector
        shell: bash
        working-directory: packages/typescript-adapter
        run: |
          npm ci --ignore-scripts
          npm run verify
          npm run test:pack

      - name: Verify native collection and process cleanup
        shell: bash
        run: make collector-safety SHELL=bash

  github-order-report:
    name: Collect GitHub order evidence (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Save bounded host observations and UNKNOWN report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          make github-pr-report REPOSITORY="$REPOSITORY" PULL_REQUEST="$PULL_REQUEST"
          BASE="$BASE" HEAD="$HEAD" OUTPUT=test-artifacts/github-order/result.json

      - name: Verify report artifacts
        run: |
          uv run --locked python -m json.tool test-artifacts/github-order/result.json >/dev/null
          test -s test-artifacts/github-order/result.check.html

      - name: Upload publication observations and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-order-report
          path: test-artifacts/github-order/
          if-no-files-found: error
          retention-days: 7

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Render every Mermaid block
        run: make mermaid
