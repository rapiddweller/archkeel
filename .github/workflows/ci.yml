name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check source and distributions
        run: make release-check

      - name: Validate Archkeel's own contract
        run: uv run --locked archkeel validate --root . --json

      - name: Observe Archkeel
        run: >-
          uv run --locked archkeel report --root . --json
          --output test-artifacts/architecture/architecture.json

      - name: Upload self-observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archkeel-self-observation
          path: test-artifacts/architecture/
          if-no-files-found: error
