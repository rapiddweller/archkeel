name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      report: ${{ steps.filter.outputs.report }}
      mermaid: ${{ steps.filter.outputs.mermaid }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed files
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "report=true" >> "$GITHUB_OUTPUT"
            echo "mermaid=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          core=false
          report=false
          mermaid=false
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          git cat-file -e "$HEAD^{commit}"
          changed_files=$(git diff --no-renames --name-only "$BASE" "$HEAD")
          while IFS= read -r path; do
            case "$path" in
              *.md|*.MD)
                mermaid=true
                continue
                ;;
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.avif|*.bmp|*.ico|*.svg)
                continue
                ;;
            esac

            case "$path" in
              tools/mermaid_blocks.py|tests/test_mermaid.py)
                mermaid=true
                continue
                ;;
              Makefile|.github/workflows/ci.yml)
                core=true
                report=true
                mermaid=true
                continue
                ;;
            esac

            case "$path" in
              src/archkeel/render/*|src/archkeel/check/report.py|src/archkeel/check/uml*.py|tools/report_*.py|tools/terminal_svg.py|fixtures/architecture_demo.py|fixtures/demo_catalog_*.py|tests/*report*.py|tests/*uml*.py|tests/*flow*.py|tests/test_secondary_table_acceptance.py|tests/test_legacy_graph_rendering.py|tests/test_diff_import_rendering.py|tests/browser_report_support.py|tests/graph_report_support.py)
                report=true
                continue
                ;;
            esac

            case "$path" in
              src/*|tests/*|tools/*|fixtures/*|packages/*|schema/*|plugins/*|.agents/*|.claude-plugin/*|.github/workflows/*|.github/actions/*|Makefile|*/Makefile|pyproject.toml|uv.lock|.python-version|.node-version|architecture-accepted.json|architecture-baseline.json|architecture-contract.json|archkeel.toml|plugin.json)
                core=true
                ;;
            esac

          done <<< "$changed_files"

          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "mermaid=$mermaid" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fail if change detection failed
        if: always() && needs.changes.result != 'success'
        run: exit 1

      - name: Check out source
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        if: needs.changes.outputs.core == 'true'
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        run: uv sync --locked

      - name: Clean previous CI artifacts
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        run: make ci-artifacts-clean

      - name: Run core checks
        if: needs.changes.outputs.core == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make ci-core-check

      - name: Run report checks
        if: needs.changes.outputs.report == 'true'
        run: make ci-report-check

      - name: Upload test timings
        if: always() && (needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: test-artifacts/pytest/results.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload report runtime
        if: always() && (needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-runtime
          path: test-artifacts/report-timing/architecture.timing.json
          if-no-files-found: warn
          retention-days: 7

      # Only synthetic fixtures/F-architecture reports, never a consumer repository.
      - name: Upload synthetic report browser evidence
        if: always() && (needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-browser-evidence
          path: test-artifacts/report-browser/
          if-no-files-found: warn
          retention-days: 7

  collector-safety-windows:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.12", "3.12.10"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Make
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          version: "0.12.13"

      - name: Install supported runtimes and locked package
        run: |
          uv python install 3.11.12 3.12.10
          uv sync --locked --python ${{ matrix.python }}

      - name: Verify native collector safety
        shell: bash
        run: make collector-safety SHELL=bash

  collector-runtimes:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22.13.0", "24", "26"]
        include:
          - os: windows-latest
            node: "22.13.0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported Python runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify packaged TypeScript collector
        shell: bash
        working-directory: packages/typescript-adapter
        run: |
          npm ci --ignore-scripts
          npm run verify
          npm run test:pack

      - name: Verify native collection and process cleanup
        shell: bash
        run: make collector-safety SHELL=bash

  github-order-report:
    name: Collect GitHub order evidence (report only)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Save bounded host observations and UNKNOWN report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          make github-pr-report REPOSITORY="$REPOSITORY" PULL_REQUEST="$PULL_REQUEST"
          BASE="$BASE" HEAD="$HEAD" OUTPUT=test-artifacts/github-order/result.json

      - name: Verify report artifacts
        run: |
          uv run --locked python -m json.tool test-artifacts/github-order/result.json >/dev/null
          test -s test-artifacts/github-order/result.check.html

      - name: Upload publication observations and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-order-report
          path: test-artifacts/github-order/
          if-no-files-found: error
          retention-days: 7

  mermaid:
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.mermaid == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Check Mermaid source labels
        run: uv run --isolated --no-project --with pytest==8.4.2 python -m pytest -q tests/test_mermaid.py

      - name: Render every Mermaid block
        run: make mermaid
