name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  report-pages:
    name: Build architecture report site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Build current report and demo gallery
        run: make report-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload report
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: test-artifacts/pages

  deploy-report-pages:
    name: Publish current architecture report
    needs: report-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # An older rerun must not replace a newer Main report.
      - name: Read current Main revision
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - name: Deploy report
        if: steps.main.outputs.sha == github.sha
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      report: ${{ steps.filter.outputs.report }}
      mermaid: ${{ steps.filter.outputs.mermaid }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test change classifier
        run: python3 -m unittest discover -s tests -p 'test_ci_changes.py'

      - name: Classify changed files
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then
            python3 tools/ci_changes.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          git cat-file -e "$HEAD^{commit}"
          git diff --no-renames --name-only -z "$BASE" "$HEAD" | python3 tools/ci_changes.py >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fail if change detection failed
        if: always() && needs.changes.result != 'success'
        run: exit 1

      - name: Check out source
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        if: needs.changes.outputs.core == 'true'
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        run: uv sync --locked

      - name: Clean previous CI artifacts
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true'
        run: make ci-artifacts-clean

      - name: Run core checks
        if: needs.changes.outputs.core == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make ci-core-check

      - name: Run report checks
        if: needs.changes.outputs.report == 'true'
        run: make ci-report-check

      - name: Upload test timings
        if: always() && (needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: test-artifacts/pytest/results.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload report runtime
        if: always() && (needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-runtime
          path: test-artifacts/report-timing/architecture.timing.json
          if-no-files-found: warn
          retention-days: 7

      # Only synthetic fixtures/F-architecture reports, never a consumer repository.
      - name: Upload synthetic report browser evidence
        if: always() && (needs.changes.outputs.core == 'true' || needs.changes.outputs.report == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-browser-evidence
          path: test-artifacts/report-browser/
          if-no-files-found: warn
          retention-days: 7

  collector-safety-windows:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.12", "3.12.10"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Make
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          version: "0.12.13"

      - name: Install supported runtimes and locked package
        run: |
          uv python install 3.11.12 3.12.10
          uv sync --locked --python ${{ matrix.python }}

      - name: Verify native collector safety
        shell: bash
        run: make collector-safety SHELL=bash

  typescript-native:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11.12", "3.12.10"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          version: "0.12.13"

      - name: Install locked package
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Verify native TypeScript collector
        shell: bash
        run: |
          make typescript-native SHELL=bash
          make build smoke SHELL=bash

  github-order-report:
    name: Collect GitHub order evidence (report only)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Save bounded host observations and UNKNOWN report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          make github-pr-report REPOSITORY="$REPOSITORY" PULL_REQUEST="$PULL_REQUEST"
          BASE="$BASE" HEAD="$HEAD" OUTPUT=test-artifacts/github-order/result.json

      - name: Verify report artifacts
        run: |
          uv run --locked python -m json.tool test-artifacts/github-order/result.json >/dev/null
          test -s test-artifacts/github-order/result.check.html

      - name: Upload publication observations and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-order-report
          path: test-artifacts/github-order/
          if-no-files-found: error
          retention-days: 7

  mermaid:
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.mermaid == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Check Mermaid source labels
        run: PYTHONPATH=src uv run --isolated --no-project --with pytest==8.4.2 --with filelock==4.0.10 python -m pytest -q tests/test_mermaid.py

      - name: Render every Mermaid block
        run: make mermaid
