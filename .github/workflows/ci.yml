name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# AD-754: the main tier builds its core with the fast profile of the Makefile.
env:
  ARCHKEEL_CORE_PROFILE: gate

# AD-674: a run on main finishes. The running run is not cancelled; GitHub keeps only the newest waiting
# run behind it and drops older waiting ones. Pull requests are cancelled by `pr-gate.yml`.
concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  lint:
    name: Lint, types and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hash is taken right after the checkout, before any build writes into native/.
      - name: Hash the native tree
        id: native
        run: echo "hash=${{ hashFiles('native/**', '!native/target/**', 'tools/rustc-facts/**', '!tools/rustc-facts/target/**', '!**/__pycache__/**') }}" >> "$GITHUB_OUTPUT"

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      # AD-1047: the self-check reads native/ with compiler facts, so the toolchain needs rustc-dev and llvm-tools.
      - name: Install the pinned Rust toolchain once, before any parallel step
        run: make type-reach-setup

      - name: Restore the Rust build cache of main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-

      # AD-1350: the self-check builds the workspace of native/ with the compiler driver. Without this
      # cache that build starts cold in each run: 4.5 to 7.5 minutes of the 15 that the job may take.
      - name: Restore the compiler facts work of main
        id: facts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/archkeel/rustc-facts
          key: rustc-facts-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml', 'tools/rustc-facts/**', '!tools/rustc-facts/target/**') }}
          restore-keys: |
            rustc-facts-main-${{ runner.os }}-

      # AD-732: the core is built in its own step and saved only after it succeeded.
      - name: Build the core
        id: build
        env:
          ARCHKEEL_NATIVE_TREE: ${{ steps.native.outputs.hash }}
        run: make core

      - name: Check architecture, format, lint and Python types
        env:
          # A dispatch has no previous push; one squash merge is one commit on main.
          BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD~1' }}
        run: make ci-pr-static BASE="$BASE"

      - id: selfcheck
        name: Check the system with the core, each part once (AD-1064, AD-1380)
        env:
          ARCHKEEL_NATIVE_TREE: ${{ steps.native.outputs.hash }}
          NATIVE_SELFCHECK_TIMINGS: ${{ runner.temp }}/native-selfcheck-timings.json
        run: make self-validate

      # AD-1420: main saves the result of the self-scan under the key of its inputs. Only a run that passed the gate
      # reaches this step, and the tool refuses a result that does not show its inputs covered.
      - id: selfscan
        name: Save the self-scan result under the key of its inputs
        run: |
          key=$(python3 tools/self_scan_cache.py save --result test-artifacts/validation-system/result.json --dir "$RUNNER_TEMP/selfscan") \
            && echo "key=$RUNNER_OS-$key" >> "$GITHUB_OUTPUT" || echo "The self-scan result is not saved: its inputs are not covered."

      - name: Keep the self-scan result for the pull requests
        if: steps.selfscan.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/selfscan
          key: ${{ steps.selfscan.outputs.key }}

      - name: Record native self-check phase timings
        if: always()
        run: |
          {
            echo '### Native self-check phase timings'
            if [ -f "$RUNNER_TEMP/native-selfcheck-timings.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/native-selfcheck-timings.json"
              echo '```'
            else
              echo 'No timing file was produced.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The key holds the lock, the toolchain and the driver, not the native sources: the members are
      # rebuilt after each checkout anyway, so the entry (about 590 MB packed) is saved only when a
      # dependency changes.
      - name: Save the compiler facts work
        if: always() && steps.facts.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/archkeel/rustc-facts
          key: rustc-facts-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml', 'tools/rustc-facts/**', '!tools/rustc-facts/target/**') }}

      - name: Save the Rust build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-${{ github.sha }}

      # AD-674: a PR gate whose native/ tree is the same downloads this core and builds nothing.
      - name: Save the core for this native tree
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/target/CACHEDIR.TAG
            native/target/release/archkeel-core
            native/target/release/archkeel-rust-collector
            native/target/release/archkeel-typescript-collector
            native/target/release/archkeel-core.tree
          key: core-gate-${{ runner.os }}-${{ steps.native.outputs.hash }}

  area-checks:
    uses: ./.github/workflows/area-checks.yml

  check:
    name: All checks passed
    needs: [lint, area-checks]
    # always(): a skipped aggregate would count as passed, so it must also run when a job fails.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # AD-341, AD-1251: the time of each job, as a table. No limit warns or fails.
      - name: Report the time of each job
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[]' | python3 tools/ci_budget.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Require every check job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              cancelled) echo "A check job was cancelled (a newer push or a person cancelled the run): run it again; this is not a failure of the code" >&2; exit 1 ;;
              skipped) echo "A check job was skipped: GitHub counts a skipped required job as passed, so this gate refuses it" >&2; exit 1 ;;
              *) echo "A check job failed: $result" >&2; exit 1 ;;
            esac
          done
          [[ -n "$RESULTS" ]] || { echo "No job results" >&2; exit 1; }
