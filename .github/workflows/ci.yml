name: CI

on:
  push:
    branches: [main]
  # AD-674: a full run of the main tier every two hours, so that a main whose pushes keep coming
  # still shows its breakage; the nightly Full run stays.
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# AD-754: the main tier builds its core with the fast profile of the Makefile.
env:
  ARCHKEEL_CORE_PROFILE: gate

# AD-674: a run on main finishes. The running run is not cancelled; GitHub keeps only the newest waiting
# run behind it and drops older waiting ones. Pull requests are cancelled by `pr-gate.yml`.
concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  lint:
    name: Lint, types and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hash is taken right after the checkout, before any build writes into native/.
      - name: Hash the native tree
        id: native
        run: echo "hash=${{ hashFiles('native/**', '!native/target/**', '!**/__pycache__/**') }}" >> "$GITHUB_OUTPUT"

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install the pinned Rust toolchain once, before any parallel step
        working-directory: native
        run: rustup toolchain install

      - name: Restore the Rust build cache of main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-

      # AD-732: the core is built in its own step and saved only after it succeeded.
      - name: Build the core
        id: build
        env:
          ARCHKEEL_NATIVE_TREE: ${{ steps.native.outputs.hash }}
        run: make core

      - name: Check architecture, format, lint and Python types
        env:
          # A dispatch has no previous push; one squash merge is one commit on main.
          BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD~1' }}
        run: make ci-pr-static BASE="$BASE"

      - name: Check native/ and the Python shell with the core against their pinned results
        env:
          ARCHKEEL_NATIVE_TREE: ${{ steps.native.outputs.hash }}
        run: make self-validate

      - name: Save the Rust build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-${{ github.sha }}

      # AD-674: a PR gate whose native/ tree is the same downloads this core and builds nothing.
      - name: Save the core for this native tree
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/target/release/archkeel-core
            native/target/release/archkeel-rust-collector
            native/target/release/archkeel-core.tree
          key: core-gate-${{ runner.os }}-${{ steps.native.outputs.hash }}

  tests:
    name: "Tests: ${{ matrix.area }}"
    strategy:
      fail-fast: false
      matrix:
        # One entry for each area in tests/areas.py.
        area:
          - CLI and core
          - native collectors
          - collectors
          - reports
          - self-check and CI
    runs-on: ubuntu-24.04
    # A hang guard, not a budget (AD-341): about twice the slowest measured job. A slow job never fails a PR.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        run: uv python install 3.11.12 3.12.10

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install the pinned Rust toolchain once, before any parallel step
        working-directory: native
        run: rustup toolchain install

      - name: Show the runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'

      - name: Run the fast tests of this area
        env:
          AREA: ${{ matrix.area }}
        run: make fast-test AREA="$AREA"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-pr-${{ matrix.area }}
          path: test-artifacts/pytest/pr-core.xml
          if-no-files-found: warn
          retention-days: 7

  mermaid:
    name: Docs diagrams
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Check Mermaid source labels
        run: PYTHONPATH=src uv run --isolated --no-project --with pytest==8.4.2 --with filelock==4.0.10 python -m pytest -q tests/test_mermaid.py

      - name: Render every Mermaid block
        run: make mermaid

  native:
    name: "Native: Rust checks and dependency policy"
    runs-on: ubuntu-24.04
    # The limit only stops a hung job.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install the pinned Rust toolchain once, before any parallel step
        working-directory: native
        run: rustup toolchain install

      - name: Install the pinned cargo-deny and check its SHA-256
        run: make cargo-deny-install

      - name: Check format, lint, dependency policy, tests and build of native/
        run: make native-check

  check:
    name: All checks passed
    needs: [lint, tests, mermaid, native]
    # always(): a skipped aggregate would count as passed, so it must also run when a job fails.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # AD-341: a warning for each job over the time budget. A failed report does not fail the run.
      - name: Report each job time against the time budget
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[]' | python3 tools/ci_budget.py --job-minutes 7 --path-minutes 10 --summary "$GITHUB_STEP_SUMMARY"

      - name: Require every check job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              cancelled) echo "A check job was cancelled (a newer push or a person cancelled the run): run it again; this is not a failure of the code" >&2; exit 1 ;;
              skipped) echo "A check job was skipped: GitHub counts a skipped required job as passed, so this gate refuses it" >&2; exit 1 ;;
              *) echo "A check job failed: $result" >&2; exit 1 ;;
            esac
          done
          [[ -n "$RESULTS" ]] || { echo "No job results" >&2; exit 1; }
