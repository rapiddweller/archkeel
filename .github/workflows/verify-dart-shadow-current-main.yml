name: Verify Dart local shadowing on actual Main
on:
  push:
    branches: [verify/570-dart-shadow-current-main]
permissions:
  contents: read
jobs:
  exact-no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f5e9f38b5671e3f1f8eb1ecd613c78e638e75fe5
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify exact original reviewed source and bounded paths
        run: |
          uv run --locked python - <<'PY'
          import json,subprocess
          def blob(ref,path):return subprocess.check_output(["git","show",ref+":"+path])
          for path in ["docs/superpowers/plans/2026-10-16-dart-local-callable-shadowing.md","src/archkeel/analyzer/dart/parse.py","src/archkeel/analyzer/dart/resolve.py","tests/test_dart_local_callable_shadowing.py"]:
              assert blob("HEAD",path)==blob("620374305b7d45383458f62bccd20a183fdcd82a",path),path
          print("DART_SHADOW_SCOPED_CARRY=True")
          PY
      - name: Verify exact source-only normal replay without redundant receipt
        run: |
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 950520fd126ca05744c19066bb28ccbef5627964 > "$RUNNER_TEMP/dart-shadow-exact.json"
          uv run --locked python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"dart-shadow-exact.json").read_bytes())
          head=subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()
          dirty=subprocess.check_output(["git","status","--porcelain"]).decode()
          for path in ("architecture-baseline.json","architecture-contract.json"):
              assert Path(path).read_bytes()==subprocess.check_output(["git","show","950520fd126ca05744c19066bb28ccbef5627964:"+path]),path
          print("DART_SHADOW_EXACT="+json.dumps({"head":head,"base":"950520fd126ca05744c19066bb28ccbef5627964","dirty":dirty,**{key:result.get(key) for key in ("exit_code","amendment_status","failures","diagnostics","widenings","measurements")}},separators=(",",":")))
          assert head=="f5e9f38b5671e3f1f8eb1ecd613c78e638e75fe5"
          assert dirty=="",dirty
          assert result["exit_code"]==0 and result["amendment_status"] is None
          assert not result["failures"] and not result["diagnostics"] and not result["widenings"]
          PY
  native-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f5e9f38b5671e3f1f8eb1ecd613c78e638e75fe5
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint typecheck
      - run: uv run --locked python -m pytest -q tests/test_dart_local_callable_shadowing.py tests/test_dart_typed_controls.py tests/test_repository_hygiene.py --tb=short
  dart-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f5e9f38b5671e3f1f8eb1ecd613c78e638e75fe5
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_dart_parse.py tests/test_dart_resolve.py tests/test_dart_false_positives.py tests/test_dart_snapshot.py tests/test_dart_inner_collect.py tests/test_dart_directives.py tests/test_dart_sdk_free.py tests/test_dart_partial_uml.py tests/test_dart_uml_acceptance.py tests/test_dart_target.py tests/test_dart_rules.py tests/test_dart_demo.py tests/test_dart_unknowns.py tests/test_dart_profile.py --tb=short
  native-position-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f5e9f38b5671e3f1f8eb1ecd613c78e638e75fe5
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Two real source revisions under the same frozen predicate observer
        run: |
          uv run --locked python - <<'PY'
          import gzip
          import json
          import os
          from collections import Counter
          from pathlib import Path
          from archkeel.cli.config import parse_config
          from archkeel.cli.observe import observer_for
          from archkeel.check.run import observe_revision, inspect_observation
          from archkeel.ir.codec import observation_payload
          from archkeel.ir.decisions import rule_assessments
          from archkeel.ir.facts_codec import raw_record
          from archkeel.ir.trace import trace_valid_violations
          from archkeel.check.ratchets import call_rows
          root = Path.cwd()
          config = parse_config((root / "archkeel.toml").read_bytes())
          observer = observer_for(config.language)
          folder = Path(os.environ["RUNNER_TEMP"]) / "dart-shadow-native-evidence"
          folder.mkdir()
          observations = []
          measurements = []
          unknowns = []
          for label, revision in (("before", "950520fd126ca05744c19066bb28ccbef5627964"), ("after", "f5e9f38b5671e3f1f8eb1ecd613c78e638e75fe5")):
              result = observe_revision(observer, root, revision, config, declared_at=revision)
              assert result.observation is not None, result.diagnostics
              model = result.observation
              measured, verdict = inspect_observation(model)
              measurements.append(measured)
              observations.append(model)
              print("DART_ACTUAL_MEASUREMENT", label, revision, measured, verdict, flush=True)
              print("DART_HOST_CALL_COUNTS="+json.dumps({"label":label,"states":dict(Counter(row.status for row in call_rows(model)))}),flush=True)
              guards = [row for row in rule_assessments(model, undecided_by_rule={}) if "DART-" in row.id and row.id.endswith("-TYPED-CONTROL")]
              print("DART_ACTUAL_GUARDS=" + json.dumps(dict(label=label, rows=[dict(id=row.id, status=row.status, proven=row.evaluation_proven) for row in guards])), flush=True)
              selected = []
              for row in model.records("unknowns"):
                  if row.kind not in {"boundary_type_position", "boundary_type_route", "uml_conformance"} or (row.kind == "boundary_type_position" and row.data.get("reason") == "external_type"):
                      continue
                  raw = raw_record(row)
                  selected.append({key: raw[key] for key in ("kind", "subjects", "rule_ids", "data")})
              selected.sort(key=lambda row: json.dumps(row, sort_keys=True))
              unknowns.append(selected)
              print("DART_ACTUAL_UNKNOWN_KINDS", label, dict(Counter(row["kind"] for row in selected)), flush=True)
              (folder / f"{label}.json.gz").write_bytes(gzip.compress(json.dumps(observation_payload(model), sort_keys=True).encode(), mtime=0))
          assert measurements[1].scalars.calls_unresolved <= measurements[0].scalars.calls_unresolved
          assert measurements[1].scalars.typing_positions <= measurements[0].scalars.typing_positions
          assert measurements[1].scalars.unknown_positions <= measurements[0].scalars.unknown_positions
          assert unknowns[0] == unknowns[1]
          print("DART_EXACT_UNKNOWN_SEMANTICS_UNCHANGED", len(unknowns[0]), flush=True)
          PY
  actual-complete-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f5e9f38b5671e3f1f8eb1ecd613c78e638e75fe5
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual prior parser/resolver/producer and complete canonical wire comparison
        run: |
          uv run --locked python - <<'PY'
          import importlib
          import json
          import statistics
          import subprocess
          import sys
          import time
          from dataclasses import asdict
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from archkeel.analyzer.dart.collect import collect
          from archkeel.analyzer.dart.parse import parse
          from archkeel.cli.config import parse_config
          from archkeel.ir.facts_codec import encode_response
          from archkeel.ir.protocol import CollectionRequest, CollectionResponse, DartSettings, SnapshotInput, SourceScope
          repository = Path.cwd()
          base = "950520fd126ca05744c19066bb28ccbef5627964"
          with TemporaryDirectory(prefix="prior-dart-input-") as temporary:
              package_root = Path(temporary) / "prior_dart"
              package_root.mkdir()
              for name in ("__init__", "collect", "parse", "resolve", "snapshot", "syntax"):
                  payload = subprocess.run(["git", "show", f"{base}:src/archkeel/analyzer/dart/{name}.py"], check=True, capture_output=True).stdout
                  (package_root / f"{name}.py").write_bytes(payload)
              sys.path.insert(0, temporary)
              prior_collect = importlib.import_module("prior_dart.collect").collect
              prior_parse = importlib.import_module("prior_dart.parse").parse
              for fixture in ("H-uml-dart", "J-compass"):
                  root = repository / "fixtures" / fixture
                  config = parse_config((root / "archkeel.toml").read_bytes())
                  request = CollectionRequest(SnapshotInput(str(root), "a" * 40, False), SourceScope(config.roots, config.namespace), DartSettings())
                  before = encode_response(CollectionResponse(prior_collect(request)))
                  after = encode_response(CollectionResponse(collect(request)))
                  print("DART_COMMON_RUNTIME_WIRE", fixture, len(before), len(after), before == after, flush=True)
                  assert before == after, fixture
          PY
