name: Verify nominal amendment artifact
on:
  push:
    branches: [fix/issue-542-amendment-artifact-owner]
permissions:
  contents: read
jobs:
  native-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Inspect independent Target differences
        run: |
          uv run --locked python - <<'PY'
          import json,pathlib,sys,tempfile
          from dataclasses import asdict
          sys.path.insert(0,"tests")
          from test_typed_amendment_artifact import _repository,_observe,_comparison
          with tempfile.TemporaryDirectory() as directory:
              root,config=_repository(pathlib.Path(directory))
              value=_observe(root,config)
              result=_comparison(value)
              print("AMENDMENT_TARGET_DIFFERENCES="+json.dumps([asdict(row) for row in result.assessments if row.status!="PASS"],separators=(",",":")))
          PY
      - run: uv run --locked python -m pytest -q tests/test_typed_amendment_artifact.py --tb=short
  amendment-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Preserve legacy approval, widening, schema and CLI behavior
        run: uv run --locked python -m pytest -q tests/test_bound_amendments.py tests/test_widening.py tests/test_measurement_budgets.py tests/test_result_schema.py tests/test_cli.py tests/test_codec.py tests/test_codec_compatibility.py --tb=short
  amendment-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify types, style and repository hygiene
        run: |
          uv run --locked ruff check --select I --fix tests/test_typed_amendment_artifact.py src/archkeel/ir/amendment.py src/archkeel/ir/widening.py src/archkeel/ir/amendment_codec.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/validation/__init__.py
          uv run --locked ruff format tests/test_typed_amendment_artifact.py src/archkeel/ir/amendment.py src/archkeel/ir/widening.py src/archkeel/ir/amendment_codec.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/validation/__init__.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","tests/test_typed_amendment_artifact.py","src/archkeel/ir/amendment.py","src/archkeel/ir/widening.py","src/archkeel/ir/amendment_codec.py","src/archkeel/ir/codec_governance.py","src/archkeel/ir/model.py","src/archkeel/check/validation/__init__.py"])).decode())
          PY
          uv run --locked ruff check tests/test_typed_amendment_artifact.py src/archkeel/ir/amendment.py src/archkeel/ir/widening.py src/archkeel/ir/amendment_codec.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/validation/__init__.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  amendment-own-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Validate exact native budget and normal amendment
        run: |
          git diff --exit-code b475e027f4384feb8cdf2cc9844b82cdf89185ea -- architecture-baseline.json schema src/archkeel/ir/decisions.py src/archkeel/ir/facts_codec.py
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against b475e027f4384feb8cdf2cc9844b82cdf89185ea --amendment docs/architecture/decisions/issue-542-amendment-artifact-owner-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Own the existing immutable Amendment artifact, supported wire versions, exact binding verification and valid/stale outcome; publish 18 independently authored API Target entities and two complete module controls without changing baseline, caps or allowances; docs/architecture/typed-amendment-artifact.md.' > "$RUNNER_TEMP/amend-native.json"
          native_status=$?
          set -e
          python - "$RUNNER_TEMP/amend-native.json" <<'PY'
          import json,pathlib,sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("AMENDMENT_NATIVE="+json.dumps({key:result.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          receipt=pathlib.Path("docs/architecture/decisions/issue-542-amendment-artifact-owner-amendment.json")
          if receipt.exists(): print("AMENDMENT_JSON="+json.dumps(json.loads(receipt.read_text()),separators=(",",":")))
          PY
          exit "$native_status"
      - name: Compare actual type and call sites with multiplicity and targets
        if: always()
        run: |
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/amend-after.json" > "$RUNNER_TEMP/amend-after-result.json"
          git worktree add --detach "$RUNNER_TEMP/amend-before" b475e027f4384feb8cdf2cc9844b82cdf89185ea
          uv run --locked archkeel report --root "$RUNNER_TEMP/amend-before" --output "$RUNNER_TEMP/amend-before.json" > "$RUNNER_TEMP/amend-before-result.json"
          uv run --locked python - "$RUNNER_TEMP/amend-before.json" "$RUNNER_TEMP/amend-after.json" <<'PY'
          import json,pathlib,re,sys
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.check.ratchets import unknown_positions_by_rule,call_rows
          from archkeel.ir.codec_wire import _raw_value
          def read(path): return parse_observation(decode_canonical_model(json.loads(pathlib.Path(path).read_text())))
          before,after=(read(path) for path in sys.argv[1:])
          def types(model):
              return {row.id:{"id":row.id,"kind":row.kind,"rule_ids":row.rule_ids,**{key:row.data.get(key) for key in ("qualified_name","position","path","annotation","nested_annotation","reason")}} for row in model.records("unknowns") or () if row.kind in {"boundary_type_position","boundary_type_route"}}
          def calls(model):
              evidence={row.id:row for row in model.evidence}
              result={}
              for row in model.records("calls") or ():
                  data=row.data
                  status=data.get("status")
                  if status not in {"unresolved","partially_resolved"}: continue
                  sites=[evidence[identity] for identity in row.evidence_ids if identity in evidence]
                  assert len(sites)==1
                  site=sites[0]
                  caller=re.sub(r"<(genexpr|listcomp|dictcomp|setcomp):[0-9]+:[0-9]+>",r"<\1>",str(data.get("source_scope")))
                  key=(status,site.file,caller,data.get("expression"))
                  result.setdefault(key,[]).append({"record_id":row.id,"status":status,"path":site.file,"line":site.line,"caller":caller,"expression":data.get("expression"),"reason":data.get("reason"),"targets":_raw_value(data.get("targets")),"candidate_count":data.get("candidate_count")})
              assert sum(len(rows) for rows in result.values())==len(call_rows(model))
              return result
          old,new=types(before),types(after)
          old_calls,new_calls=calls(before),calls(after)
          added=[{"before":old_calls.get(key,[]),"after":new_calls[key]} for key in new_calls if len(new_calls[key])>len(old_calls.get(key,[]))]
          removed=[{"before":old_calls[key],"after":new_calls.get(key,[])} for key in old_calls if len(old_calls[key])>len(new_calls.get(key,[]))]
          target_changed=[{"before":old_calls[key],"after":new_calls[key]} for key in old_calls.keys()&new_calls.keys() if sorted(json.dumps(row["targets"],sort_keys=True) for row in old_calls[key])!=sorted(json.dumps(row["targets"],sort_keys=True) for row in new_calls[key])]
          summary={"before_ref":"b475e027f4384feb8cdf2cc9844b82cdf89185ea","before_unknown":unknown_positions_by_rule(before),"after_unknown":unknown_positions_by_rule(after),"new_type_positions":[new[key] for key in sorted(new.keys()-old.keys())],"removed_type_positions":[old[key] for key in sorted(old.keys()-new.keys())],"changed_type_positions":[{"before":old[key],"after":new[key]} for key in sorted(old.keys()&new.keys()) if old[key]!=new[key]],"added_call_sites":added,"removed_call_sites":removed,"changed_call_targets":target_changed,"before_unresolved":before.coverage.calls_unresolved,"after_unresolved":after.coverage.calls_unresolved,"before_partial":before.coverage.calls_partially_resolved,"after_partial":after.coverage.calls_partially_resolved}
          print("AMENDMENT_SITE_EVIDENCE="+json.dumps(summary,separators=(",",":")))
          assert not summary["new_type_positions"]
          assert not added
          assert not target_changed
          PY
