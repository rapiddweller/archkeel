name: Actual Atlas report and offline asset acceptance
on:
  push:
    branches: [verify/542-atlas-report-package]
permissions:
  contents: read
jobs:
  required-report-and-size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Actual required report entry with explicit reviewed Publisher prerequisite
        run: make ci-pr-report-check
      - name: Unchanged authentic-repository HTML budgets
        run: |
          uv run --locked python -m pytest -q tests/test_atlas_report.py::test_default_report_is_one_authentic_repository_with_sparse_native_cells
          git diff --exit-code -- src/archkeel/render/assets/ tests/browser_graph_scene_target.ts tools/browser_graph_protocol.py
  package-assets-without-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Reject Node/npm/npx at actual Python package build and runtime
        run: |
          mkdir "$RUNNER_TEMP/no-node"
          for atlas_node_name in node npm npx; do
            cat > "$RUNNER_TEMP/no-node/$atlas_node_name" <<'SH'
          #!/bin/sh
          echo "Unexpected Node tooling during Python build/runtime" >&2
          exit 91
          SH
            chmod +x "$RUNNER_TEMP/no-node/$atlas_node_name"
          done
          export PATH="$RUNNER_TEMP/no-node:$PATH"
          make build smoke
