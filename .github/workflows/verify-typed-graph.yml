name: Verify typed graph vocabulary
on:
  push:
    branches: [verify/graph-future-green]
permissions:
  contents: read
jobs:
  graph-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Nominal graph and native source controls
        run: uv run --locked python -m pytest -q tests/test_typed_graph_vocabulary.py
