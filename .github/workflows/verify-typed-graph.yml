name: Verify typed graph vocabulary
on:
  push:
    branches: [fix/issue-542-typed-graph-vocabulary]
permissions:
  contents: read
jobs:
  graph-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Format owned graph source and export patch
        run: |
          uv run --locked ruff check --select I --fix src/archkeel/ir/architecture_graph.py tests/test_typed_graph_vocabulary.py src/archkeel/ir/graph_codec.py src/archkeel/check/uml_compare.py src/archkeel/ir/target_graph.py tools/architecture_graph_schema.py src/archkeel/ir/source_graph.py src/archkeel/check/uml_evaluation.py src/archkeel/ir/decisions.py src/archkeel/ir/report_graph.py src/archkeel/ir/codec_contract.py tests/test_uml_demo.py src/archkeel/ir/model.py src/archkeel/check/run.py src/archkeel/ir/architecture_projection.py src/archkeel/ir/report_projection.py src/archkeel/ir/module_explore.py src/archkeel/ir/target_records.py src/archkeel/check/report.py src/archkeel/check/validation/__init__.py fixtures/demo_catalog_uml.py src/archkeel/ir/command_view.py src/archkeel/check/onboarding.py
          uv run --locked ruff format src/archkeel/ir/architecture_graph.py tests/test_typed_graph_vocabulary.py src/archkeel/ir/graph_codec.py src/archkeel/check/uml_compare.py src/archkeel/ir/target_graph.py tools/architecture_graph_schema.py src/archkeel/ir/source_graph.py src/archkeel/check/uml_evaluation.py src/archkeel/ir/decisions.py src/archkeel/ir/report_graph.py src/archkeel/ir/codec_contract.py tests/test_uml_demo.py src/archkeel/ir/model.py src/archkeel/check/run.py src/archkeel/ir/architecture_projection.py src/archkeel/ir/report_projection.py src/archkeel/ir/module_explore.py src/archkeel/ir/target_records.py src/archkeel/check/report.py src/archkeel/check/validation/__init__.py fixtures/demo_catalog_uml.py src/archkeel/ir/command_view.py src/archkeel/check/onboarding.py
          python - <<'PY'
          import base64, subprocess
          print("FORMAT_PATCH=" + base64.b64encode(subprocess.check_output(["git","diff","--","src/archkeel/ir/architecture_graph.py","tests/test_typed_graph_vocabulary.py","src/archkeel/ir/graph_codec.py","src/archkeel/check/uml_compare.py","src/archkeel/ir/target_graph.py","tools/architecture_graph_schema.py","src/archkeel/ir/source_graph.py","src/archkeel/check/uml_evaluation.py","src/archkeel/ir/decisions.py","src/archkeel/ir/report_graph.py","src/archkeel/ir/codec_contract.py","tests/test_uml_demo.py","src/archkeel/ir/model.py","src/archkeel/check/run.py","src/archkeel/ir/architecture_projection.py","src/archkeel/ir/report_projection.py","src/archkeel/ir/module_explore.py","src/archkeel/ir/target_records.py","src/archkeel/check/report.py","src/archkeel/check/validation/__init__.py","fixtures/demo_catalog_uml.py","src/archkeel/ir/command_view.py","src/archkeel/check/onboarding.py"])).decode())
          PY
      - name: Style
        run: uv run --locked ruff check src/archkeel/ir/architecture_graph.py tests/test_typed_graph_vocabulary.py src/archkeel/ir/graph_codec.py src/archkeel/check/uml_compare.py src/archkeel/ir/target_graph.py tools/architecture_graph_schema.py src/archkeel/ir/source_graph.py src/archkeel/check/uml_evaluation.py src/archkeel/ir/decisions.py src/archkeel/ir/report_graph.py src/archkeel/ir/codec_contract.py tests/test_uml_demo.py src/archkeel/ir/model.py src/archkeel/check/run.py src/archkeel/ir/architecture_projection.py src/archkeel/ir/report_projection.py src/archkeel/ir/module_explore.py src/archkeel/ir/target_records.py src/archkeel/check/report.py src/archkeel/check/validation/__init__.py fixtures/demo_catalog_uml.py src/archkeel/ir/command_view.py src/archkeel/check/onboarding.py
      - name: Types
        if: always()
        run: make typecheck
      - name: Hygiene
        if: always()
        run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py
      - name: Diagnose actual graph fixture call evidence
        if: always()
        run: |
          uv run --locked python - <<'PY'
          import json, sys
          from dataclasses import asdict
          from pathlib import Path
          from tempfile import TemporaryDirectory
          sys.path.insert(0, "tests")
          from test_typed_graph_vocabulary import _repository, _model
          from archkeel.check.ratchets import call_rows
          with TemporaryDirectory() as directory:
              root, config = _repository(Path(directory))
              model = _model(root, config)
              print("FIXTURE_UNRESOLVED_GRAPH_CALLS=" + json.dumps([asdict(row) for row in call_rows(model) if row.status == "unresolved" and "architecture_graph" in row.path], separators=(",", ":")))
          PY
  graph-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Graph UML source target and schema regressions
        if: always()
        run: uv run --locked python -m pytest -q tests/test_typed_graph_vocabulary.py tests/test_architecture_graph.py tests/test_enum_graph.py tests/test_graph_comparison_codec.py tests/test_source_graph.py tests/test_target_graph.py tests/test_target_navigation_graph.py tests/test_uml_comparison.py tests/test_uml_evaluation.py tests/test_uml_source_facts.py tests/test_uml_classifier_facts.py tests/test_schema_drift.py tests/test_uml_demo.py tests/test_architecture_projection.py tests/test_architecture_report.py tests/test_module_explore.py tests/test_command_view.py tests/test_report_filter.py tests/test_report_diagnostics.py tests/test_saved_report.py
  native-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify own graph policy and unchanged budgets
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 5022d1d30d867dd028e52b4e96dbc377d2c730a6 --amendment docs/architecture/decisions/issue-542-graph-vocabulary-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Graph and UML control vocabulary has one domain owner, a shared assessment type through the model facade, independently authored API Target and whole migrated module guards. Graph parser has no string-control exception. Historical schemas and valid wire/default behavior remain. No baseline, cap or allowance changes. See docs/architecture/typed-graph-vocabulary.md.' > "$RUNNER_TEMP/graph-native.json"
          graph_status=$?
          set -e
          python - "$RUNNER_TEMP/graph-native.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("NATIVE_RESULT=" + json.dumps({key: data.get(key) for key in ("exit_code", "failures", "diagnostics", "measurements", "amendment_status", "unresolved_call_changes")}, separators=(",", ":")))
          path = pathlib.Path("docs/architecture/decisions/issue-542-graph-vocabulary-amendment.json")
          if path.exists():
              print("AMENDMENT_JSON=" + json.dumps(json.loads(path.read_text()), separators=(",", ":")))
          PY
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/graph-own.json" > "$RUNNER_TEMP/graph-report-result.json"
          uv run --locked python - "$RUNNER_TEMP/graph-own.json" <<'PY'
          import json, pathlib, sys
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          from archkeel.ir.report_graph import architecture_report
          from archkeel.ir.trace import trace_valid_violations
          from archkeel.check.ratchets import unknown_positions_by_rule, call_rows
          from dataclasses import asdict
          model = parse_observation(decode_canonical_model(json.loads(pathlib.Path(sys.argv[1]).read_text())))
          report = architecture_report(model)
          print("OWN_VIOLATIONS=" + repr(trace_valid_violations(model)))
          print("OWN_GRAPH_FAILURES=" + repr(tuple(row for row in report.comparison.assessments if row.status == "FAIL") if report.comparison else ()))
          print("OWN_UNRESOLVED_CHANGED_CALLS=" + json.dumps([asdict(row) for row in call_rows(model) if row.status == "unresolved" and any(part in row.path for part in ("architecture_graph", "graph_codec", "source_graph", "target_graph", "uml_compare", "uml_evaluation", "report_projection", "module_explore", "decisions", "report_graph", "onboarding"))], separators=(",", ":")))
          print("OWN_UNKNOWN_BY_RULE=" + json.dumps(unknown_positions_by_rule(model), separators=(",", ":")))
          print("OWN_UNKNOWN_EVIDENCE=" + repr(tuple(row for row in model.records("unknowns") or ())))
          PY
          exit "$graph_status"
