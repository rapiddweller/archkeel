name: Verify typed graph vocabulary
on:
  push:
    branches: [fix/issue-542-typed-graph-vocabulary]
permissions:
  contents: read
jobs:
  graph-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Format owned graph source and export patch
        run: |
          uv run --locked ruff check --select I --fix src/archkeel/ir/architecture_graph.py tests/test_typed_graph_vocabulary.py src/archkeel/ir/graph_codec.py src/archkeel/check/uml_compare.py src/archkeel/ir/target_graph.py tools/architecture_graph_schema.py src/archkeel/ir/source_graph.py src/archkeel/check/uml_evaluation.py src/archkeel/ir/decisions.py src/archkeel/ir/report_graph.py src/archkeel/ir/codec_contract.py
          uv run --locked ruff format src/archkeel/ir/architecture_graph.py tests/test_typed_graph_vocabulary.py src/archkeel/ir/graph_codec.py src/archkeel/check/uml_compare.py src/archkeel/ir/target_graph.py tools/architecture_graph_schema.py src/archkeel/ir/source_graph.py src/archkeel/check/uml_evaluation.py src/archkeel/ir/decisions.py src/archkeel/ir/report_graph.py src/archkeel/ir/codec_contract.py
          python - <<'PY'
          import base64, subprocess
          print("FORMAT_PATCH=" + base64.b64encode(subprocess.check_output(["git", "diff", "--", "src/archkeel/ir/architecture_graph.py", "tests/test_typed_graph_vocabulary.py", "src/archkeel/ir/graph_codec.py", "src/archkeel/check/uml_compare.py", "src/archkeel/ir/target_graph.py", "tools/architecture_graph_schema.py", "src/archkeel/ir/source_graph.py", "src/archkeel/check/uml_evaluation.py", "src/archkeel/ir/decisions.py", "src/archkeel/ir/report_graph.py", "src/archkeel/ir/codec_contract.py"])).decode())
          PY
      - name: Style and types
        run: |
          uv run --locked ruff check src/archkeel/ir/architecture_graph.py tests/test_typed_graph_vocabulary.py src/archkeel/ir/graph_codec.py src/archkeel/check/uml_compare.py src/archkeel/ir/target_graph.py tools/architecture_graph_schema.py src/archkeel/ir/source_graph.py src/archkeel/check/uml_evaluation.py src/archkeel/ir/decisions.py src/archkeel/ir/report_graph.py src/archkeel/ir/codec_contract.py
          make typecheck
      - name: Nominal graph and native source controls
        if: always()
        run: uv run --locked python -m pytest -q tests/test_typed_graph_vocabulary.py
