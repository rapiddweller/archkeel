name: TypeScript JSON field boundary RED
on:
  push:
    branches: [fix/542-typescript-json-field-boundary]
permissions:
  contents: read
jobs:
  typed-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Test typed compiler and resolver behavior
        run: uv run --locked python -m pytest -q tests/test_typescript_json_fields.py tests/test_typescript_control_target.py::test_native_typescript_api_matches_the_independent_target
