name: Verify frozen Measurement API contract
on:
  push:
    branches: [verify/issue-542-measurement-final]
permissions:
  contents: read
jobs:
  exact-source-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - name: Prove exact production and native source already exercised by the full gates
        run: |
          git diff --exit-code 09ba4634aee8f0497e4cc774aa04187fea1a498a -- src tests architecture-contract.json docs/architecture/contracts/ir.json Makefile
          git diff --exit-code 3dd2efdc54ef99f2b4cb742f3194cfd1f2619a84 -- architecture-baseline.json schema src/archkeel/ir/decisions.py src/archkeel/ir/facts_codec.py
          printf 'EXACT_MEASUREMENT_SOURCE=09ba4634aee8f0497e4cc774aa04187fea1a498a\n'
          uv run --locked python -m pytest -q tests/test_typed_measurement_controls.py --tb=short
  strict-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: |
          uv run --locked ruff check tests/test_typed_measurement_controls.py src/archkeel/ir/measurements.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/ratchets.py src/archkeel/check/validation/__init__.py src/archkeel/ir/interfaces.py src/archkeel/render/summary.py src/archkeel/check/evaluation/rules.py src/archkeel/check/validation/public_api.py src/archkeel/render/html.py src/archkeel/ir/widening.py
          uv run --locked ruff format --check tests/test_typed_measurement_controls.py src/archkeel/ir/measurements.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/ratchets.py src/archkeel/check/validation/__init__.py src/archkeel/ir/interfaces.py src/archkeel/render/summary.py src/archkeel/check/evaluation/rules.py src/archkeel/check/validation/public_api.py src/archkeel/render/html.py src/archkeel/ir/widening.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
          git diff --exit-code
  no-write-amendment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - name: Validate committed normal receipt without any writer
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 3dd2efdc54ef99f2b4cb742f3194cfd1f2619a84 --amendment docs/architecture/decisions/issue-542-measurement-controls-amendment.json > "$RUNNER_TEMP/measurement-no-write.json"
          native_status=$?
          set -e
          python - "$RUNNER_TEMP/measurement-no-write.json" <<'PY'
          import json,pathlib,sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("MEASUREMENT_NO_WRITE="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          assert value["exit_code"]==0 and value["amendment_status"]=="valid"
          assert not value["failures"] and not value["diagnostics"]
          PY
          git diff --exit-code
          exit "$native_status"
