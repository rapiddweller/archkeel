name: TypeScript558 actual cache field proof
on:
  push:
    branches: [verify/issue-542-typescript-cache-field]
permissions:
  contents: read
jobs:
  native-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typescript_syntax_compatibility.py tests/test_typescript_syntax_types.py tests/test_typescript_parse.py
      - run: uv run --locked ruff check src/archkeel/analyzer/typescript tests/test_typescript_control_target.py
      - run: uv run --locked ruff format --check src/archkeel/analyzer/typescript tests/test_typescript_control_target.py
      - run: uv run --locked mypy src/archkeel
      - name: Observe the actual cache call and every unresolved site in the owner
        run: |
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/ts-cache.json" > "$RUNNER_TEMP/ts-cache.stdout"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          from archkeel.check.ratchets import call_rows, measure_python_ratchets
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          from archkeel.ir.codec_wire import value_bytes
          model=parse_observation(decode_canonical_model(json.loads((Path(os.environ["RUNNER_TEMP"])/"ts-cache.json").read_bytes())))
          print("CACHE_MEASUREMENT="+json.dumps(dict(measure_python_ratchets(model).scalars.items())))
          calls=[record for record in model.records("calls") if record.data.get("source_module") in {"archkeel.analyzer.typescript.parse","archkeel.analyzer.typescript.syntax"}]
          for record in calls:
              if record.data.get("expression") in {"tree.clear","nodes.clear","legacy_receivers.get"}:
                  print("CACHE_CALL="+value_bytes(record.data).decode().strip())
          for record in model.records("calls"):
              if record.data.get("source_scope") in {"archkeel.analyzer.dart.parse._named","archkeel.analyzer.dart.parse._is_declaration_name"} and record.data.get("expression") in {"node.child_by_field_name","parent.child_by_field_name"}:
                  print("DART_EXISTING_CALL="+value_bytes(record.data).decode().strip())
          print("CACHE_OWNER_UNRESOLVED="+json.dumps([{"caller":row.caller,"expression":row.expression,"line":row.line,"reason":row.reason} for row in call_rows(model) if row.status=="unresolved" and row.path in {"src/archkeel/analyzer/typescript/parse.py","src/archkeel/analyzer/typescript/syntax.py"}]))
          matching=[record for record in calls if record.data.get("expression") in {"tree.clear","nodes.clear","legacy_receivers.get"}]
          assert len(matching)==3, "all actual cache/receiver boundary calls must be observed"
          for record in matching:
              assert record.data.get("status")!="unresolved", value_bytes(record.data)
              assert record.data.get("reason")!="dynamic receiver with matching internal methods", value_bytes(record.data)
          assert any(record.data.get("expression")=="nodes.clear" and tuple(record.data.get("targets", ()))==("builtins.dict.clear",) for record in matching)
          assert any(record.data.get("expression")=="legacy_receivers.get" and tuple(record.data.get("targets", ()))==("builtins.dict.get",) for record in matching)
          PY
