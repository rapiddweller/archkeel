name: Latest main build

# AD-1223: the nightly Full run builds and publishes the main build. This workflow is the manual path.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # AD-863: a build that has started finishes, and the newest waiting build replaces older waiting ones.
  wheels:
    uses: ./.github/workflows/native-wheels.yml
    concurrency:
      group: main-build-wheels-${{ github.event_name }}
      cancel-in-progress: false

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: wheels
    runs-on: ubuntu-24.04
    # A started publication runs to its end. The newest waiting publication replaces older waiting ones.
    concurrency:
      group: main-build-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the tested wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-wheel-*
          merge-multiple: true
          path: dist/

      - name: Publish the tested wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_main_build.py
