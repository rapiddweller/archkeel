name: Source binding facets native and quality gates
on:
  push:
    branches: [verify/542-source-binding-facets-gates]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fa73e176631b6f87172862e6a4ed9def2973f599
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked ruff format tests/test_source_binding_facets.py src/archkeel/ir/facts.py src/archkeel/ir/source_graph.py src/archkeel/analyzer/python/calls.py src/archkeel/analyzer/python/symbols.py src/archkeel/analyzer/dart/collect.py src/archkeel/analyzer/typescript/collect.py src/archkeel/check/evaluation/evaluate.py
          uv run --locked python - <<'PY'
          import json,subprocess
          from pathlib import Path
          for path in subprocess.check_output(["git","diff","--name-only"],text=True).splitlines():
              content=Path(path).read_text()
              for index in range(0,len(content),12000):
                  print("FORMATTED_SOURCE="+json.dumps({"path":path,"index":index//12000,"content":content[index:index+12000]}))
          PY
      - run: make lint typecheck
      - run: uv run --locked pytest -q tests/test_repository_hygiene.py
      - run: git diff --exit-code
  actual-native-ports-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fa73e176631b6f87172862e6a4ed9def2973f599
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked pytest -n 2 --dist=loadfile -q tests/test_source_binding_facets.py tests/test_source_graph.py tests/test_partial_member_inventory.py tests/test_binding_claim_completeness.py tests/test_binding_proof_reuse.py tests/test_uml_classifier_facts.py tests/test_typed_symbol_class_kinds.py tests/test_member_inventory.py
