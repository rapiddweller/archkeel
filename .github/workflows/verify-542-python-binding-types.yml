name: Verify Python binding control API

on:
  push:
    branches: [verify/542-python-bindings-current]

permissions:
  contents: read

jobs:
  binding-types:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a8e801d4c8da90a5b0e01061c6b65c3f0c09ae51
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Verify exact immutable product ref and committed amendment
        run: |
          test "$(git rev-parse HEAD)" = "a8e801d4c8da90a5b0e01061c6b65c3f0c09ae51"
          set +e
          uv run --locked python -m tools.against --base ff4cae52451f43550639959b6f87a77f96375597 > "$RUNNER_TEMP/542-bindings-exact-native.json"
          native_exit=$?
          uv run --locked python - "$RUNNER_TEMP/542-bindings-exact-native.json" "$native_exit" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          print("EXACT_PRODUCT_NATIVE=" + json.dumps({"head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "exit_code": int(sys.argv[2]), "diagnostics": result.get("diagnostics"), "failures": result.get("failures"), "measurements": result.get("measurements")}))
          PY
          git diff --exit-code
          exit "$native_exit"
