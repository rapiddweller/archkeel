name: Boundary reason owner placement RED
on:
  push:
    branches: [verify/542-boundary-reasons-placement-red]
permissions:
  contents: read
jobs:
  placement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_boundary_reason_types.py -k placement --tb=short
