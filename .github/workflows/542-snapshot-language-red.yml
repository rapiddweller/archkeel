name: Snapshot language RED
on:
  push:
    branches: [verify/542-snapshot-language-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: acd1c3dcd58d617b55a93b6c1a6b7909117802f3
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked pytest -q tests/test_snapshot_language_types.py tests/test_snapshot.py --junitxml=/tmp/snapshot-red.xml
