name: Read-only canonical enum consumer verification
on:
  push:
    branches: [verify/542-canonical-enum-consumers]
permissions:
  contents: read
jobs:
  canonical-enums:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4a58d277f17ff2375a50a92349b58d3b17812124
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Install locked dependencies and supported runtimes
        run: |
          uv python install 3.11.12 3.12.10
          uv sync --locked
      - name: Strict formatting
        run: uv run --locked ruff format --check src/archkeel/ir/report_graph.py src/archkeel/render/atlas.py src/archkeel/render/html.py src/archkeel/ir/source_graph.py src/archkeel/ir/facts_validation.py src/archkeel/check/uml.py src/archkeel/check/observe.py src/archkeel/check/observation.py src/archkeel/check/evaluation/evaluate.py src/archkeel/ir/decisions.py
      - name: Strict lint
        if: ${{ !cancelled() }}
        run: uv run --locked ruff check src/archkeel/ir/report_graph.py src/archkeel/render/atlas.py src/archkeel/render/html.py src/archkeel/ir/source_graph.py src/archkeel/ir/facts_validation.py src/archkeel/check/uml.py src/archkeel/check/observe.py src/archkeel/check/observation.py src/archkeel/check/evaluation/evaluate.py src/archkeel/ir/decisions.py
      - name: Strict typing
        if: ${{ !cancelled() }}
        run: uv run --locked mypy --strict src/archkeel
      - name: Exact native before and after source evidence
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: |
          cat > "$RUNNER_TEMP/enum-native.py" <<'PY'
          import ast, collections, json, subprocess
          from pathlib import Path
          from archkeel.analyzer.python.constructs import collect_constructs
          from test_analyzer import _parsed_module
          from archkeel.ir import architecture_graph as graph, facts, model, module_explore
          
          BASE = "68b656668a3fdbbbe482881d0dab41ff89a21ca3"
          EXPECTED = json.loads("{\"src/archkeel/ir/report_graph.py\":[\"scope.mode == \\\"closed\\\"\",\"a.aspect == \\\"completeness\\\"\",\"relationship.kind != \\\"imports\\\"\",\"item.kind == \\\"module\\\"\",\"item.presence == \\\"defined\\\"\"],\"src/archkeel/render/atlas.py\":[\"level.cells[index].status == \\\"FAIL\\\"\",\"coverage.status == \\\"complete\\\"\",\"item.kind == \\\"module\\\"\",\"item.kind == \\\"module\\\"\",\"item.kind == \\\"module\\\"\",\"item.kind == \\\"module\\\"\",\"entity.kind != \\\"module\\\"\",\"parent.kind != \\\"component\\\"\",\"edge.kind == \\\"requires\\\"\",\"item.status == \\\"UNKNOWN\\\"\",\"entry.status == \\\"complete\\\"\",\"current.kind == \\\"module\\\"\",\"current.kind == \\\"component\\\"\",\"graph.origin == \\\"observed\\\"\",\"entity.kind not in (\\\"module\\\", \\\"component\\\", \\\"package\\\")\"],\"src/archkeel/render/html.py\":[\"item.status != \\\"FAIL\\\"\",\"item.status != \\\"UNKNOWN\\\"\",\"entry.status == \\\"complete\\\"\",\"item.kind == \\\"module\\\"\",\"item.kind == \\\"module\\\"\",\"item.presence == \\\"defined\\\"\"],\"src/archkeel/ir/source_graph.py\":[\"inv.status == \\\"complete\\\"\",\"entity.presence != \\\"defined\\\"\",\"runtime.requirement_state != \\\"declared\\\"\"],\"src/archkeel/ir/facts_validation.py\":[\"inventory.kind == \\\"method\\\"\",\"item.role == \\\"selected\\\"\",\"section.name == \\\"imports\\\"\",\"section.name != \\\"unknowns\\\"\"],\"src/archkeel/check/uml.py\":[\"entity.kind != \\\"component\\\"\",\"edge.kind != \\\"requires\\\"\"],\"src/archkeel/check/observe.py\":[\"item.role == \\\"selected\\\"\"],\"src/archkeel/check/observation.py\":[\"item.role == \\\"selected\\\"\"],\"src/archkeel/check/evaluation/evaluate.py\":[\"item.role == \\\"selected\\\"\"],\"src/archkeel/ir/decisions.py\":[\"runtime.requirement_state != \\\"declared\\\"\"]}")
          assert model.RuleAssessmentStatus is graph.RuleAssessmentStatus
          assert model.AssessmentStatus is graph.AssessmentStatus
          assert module_explore.AssessmentStatus is graph.AssessmentStatus
          assert graph.ParameterKind is facts.ParameterKind
          assert graph.RuleAssessmentStatus is not graph.AssessmentStatus
          paths = sorted(Path("src/archkeel").rglob("*.py"))
          sources = {
              version: {
                  str(path): subprocess.check_output(["git", "show", f"{BASE}:{path}"], text=True)
                  if version == "before" else path.read_text()
                  for path in paths
              }
              for version in ("before", "after")
          }
          semantic, selected, native = {}, {}, {}
          expected = collections.Counter((path, expression) for path, expressions in EXPECTED.items() for expression in expressions)
          for version, source_map in sources.items():
              parsed = [
                  _parsed_module(text, module=path.removeprefix("src/").removesuffix(".py").replace("/", "."),
                                 rel_path=path, package=path.removeprefix("src/").rsplit("/", 1)[0].replace("/", "."))
                  for path, text in source_map.items()
              ]
              trees = {module.rel_path: module.tree for module in parsed}
              evidence = {}
              records = [row for row in collect_constructs(parsed, evidence) if row["kind"] == "string_literal_compare"]
              rows = []
              for row in records:
                  location = evidence[row["evidence_ids"][0]]
                  source, tree = source_map[location["file"]], trees[location["file"]]
                  candidates = [node for node in ast.walk(tree)
                      if ((row["data"]["form"] in {"compare", "membership"} and isinstance(node, ast.Compare))
                          or (row["data"]["form"] in {"startswith", "endswith"} and isinstance(node, ast.Call)
                              and isinstance(node.func, ast.Attribute) and node.func.attr == row["data"]["form"])
                          or (row["data"]["form"] == "match" and isinstance(node, ast.Match)))
                      and (node.lineno, node.end_lineno, node.col_offset)
                          == (location["line"], location["end_line"], location["column"])]
                  assert len(candidates) == 1, (row, location, candidates)
                  expression = ast.get_source_segment(source, candidates[0])
                  rows.append(dict(id=row["id"], file=location["file"], line=location["line"],
                                   expression=expression, owner=row["data"]["owner"], form=row["data"]["form"]))
              native[version] = rows
              semantic[version] = collections.Counter((row["file"], row["expression"], row["owner"], row["form"]) for row in rows)
              selected[version] = [row for row in rows if (row["file"], row["expression"]) in expected]
              print("NATIVE_COUNTS=" + json.dumps(dict(version=version, total=len(rows), selected=len(selected[version]),
                  by_file=dict(collections.Counter(row["file"] for row in selected[version])))), flush=True)
          before = collections.Counter((row["file"], row["expression"]) for row in selected["before"])
          assert before == expected, (before - expected, expected - before)
          assert sum(expected.values()) == 39
          assert not selected["after"], selected["after"]
          removed = semantic["before"] - semantic["after"]
          added = semantic["after"] - semantic["before"]
          assert sum(removed.values()) == 39, removed
          assert not added, added
          assert removed == collections.Counter((row["file"], row["expression"], row["owner"], row["form"]) for row in selected["before"]), removed
          for row in selected["before"]:
              print("REMOVED_NATIVE_SITE=" + json.dumps(row, sort_keys=True), flush=True)
          changed = subprocess.check_output(["git", "diff", "--name-only", BASE, "HEAD"], text=True).splitlines()
          assert sorted(changed) == sorted(EXPECTED), changed
          print("EXACT_NATIVE_DELTA=39_REMOVED_0_ADDED; CANONICAL_FACADE_IDENTITY=PASS; SOURCE_SCOPE=10_FILES", flush=True)
          
          PY
          uv run --locked python "$RUNNER_TEMP/enum-native.py"
      - name: Existing affected regressions on candidate
        if: ${{ !cancelled() }}
        run: uv run --locked python -m pytest -q -n 2 tests/test_typed_graph_vocabulary.py tests/test_architecture_report.py tests/test_atlas_report.py tests/test_atlas_deviation_target.py tests/test_atlas_deviation_boundary.py tests/test_module_explore.py tests/test_uml_rendering.py tests/test_uml_evaluation.py tests/test_source_graph.py tests/test_member_inventory.py tests/test_partial_member_inventory.py tests/test_collection_protocol.py tests/test_collection_boundary_regressions.py tests/test_source_evaluation.py tests/test_decisions.py tests/test_runtime.py tests/test_report_agent_json.py tests/test_saved_report.py
      - name: Source-only diff scope
        if: ${{ !cancelled() }}
        run: |
          git diff --check 68b656668a3fdbbbe482881d0dab41ff89a21ca3 4a58d277f17ff2375a50a92349b58d3b17812124
          git diff --stat 68b656668a3fdbbbe482881d0dab41ff89a21ca3 4a58d277f17ff2375a50a92349b58d3b17812124
          git diff --numstat 68b656668a3fdbbbe482881d0dab41ff89a21ca3 4a58d277f17ff2375a50a92349b58d3b17812124
