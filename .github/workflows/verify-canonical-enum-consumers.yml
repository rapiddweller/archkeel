name: Read-only canonical enum formatting diagnostics
on:
  push:
    branches: [verify/542-canonical-enum-consumers]
permissions:
  contents: read
jobs:
  canonical-enums:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7ccbd83f4e853c3015a33197af9ba6563e067c25
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Install locked dependencies and supported runtimes
        run: |
          uv python install 3.11.12 3.12.10
          uv sync --locked
          git worktree add --detach "$RUNNER_TEMP/enum-base" 68b656668a3fdbbbe482881d0dab41ff89a21ca3
      - name: Strict formatting
        run: uv run --locked ruff format --diff src/archkeel/ir/report_graph.py src/archkeel/render/atlas.py src/archkeel/render/html.py src/archkeel/ir/source_graph.py src/archkeel/ir/facts_validation.py src/archkeel/check/uml.py src/archkeel/check/observe.py src/archkeel/check/observation.py src/archkeel/check/evaluation/evaluate.py src/archkeel/ir/decisions.py
      - name: Strict lint
        if: ${{ !cancelled() }}
        run: uv run --locked ruff check --diff src/archkeel/ir/report_graph.py src/archkeel/render/atlas.py src/archkeel/render/html.py src/archkeel/ir/source_graph.py src/archkeel/ir/facts_validation.py src/archkeel/check/uml.py src/archkeel/check/observe.py src/archkeel/check/observation.py src/archkeel/check/evaluation/evaluate.py src/archkeel/ir/decisions.py
