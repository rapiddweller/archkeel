name: Dart nominal RED proof
on:
  push:
    branches: [verify/542-dart-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify expected nominal control failures against original Dart source
        run: uv run --locked python -m pytest -q tests/test_dart_typed_controls.py
