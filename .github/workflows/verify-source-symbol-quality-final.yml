name: Verify final source symbol quality
on:
  push:
    branches: ['verify/542-source-symbol-quality-final']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 012af555675f6bbc3961bbda51550ad2b53e5281
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.11.12'
          version: '0.12.13'
      - run: uv sync --locked
      - run: make lint typecheck architecture-graph-schema
      - run: uv run --locked pytest -q tests/test_source_symbol_consumers.py tests/test_source_symbol_kind_types.py tests/test_repository_hygiene.py
      - run: git diff --exit-code
