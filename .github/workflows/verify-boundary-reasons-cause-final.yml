name: Boundary reason final authored-owner gates
on:
  push:
    branches: [verify/542-boundary-reasons-final-cause]
permissions:
  contents: read
  actions: read
jobs:
  ports-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_boundary_reason_types.py tests/test_repository_hygiene.py --tb=short
      - name: Exact source quality
        if: ${{ always() }}
        run: |
          uv run --locked ruff check src/archkeel tests/test_boundary_reason_types.py
          uv run --locked ruff format --check --diff src/archkeel/check/evaluation/boundary_types.py tests/test_boundary_reason_types.py
          uv run --locked mypy src/archkeel
  native-final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: boundary-reason-native-sites
          run-id: 38982078572
          github-token: ${{ github.token }}
          path: reason-evidence
      - name: Fresh final observation and full actual AST correspondence
        run: |
          uv run --locked python - <<'PY'
          from dataclasses import asdict
          import gzip,json,time
          from pathlib import Path
          from archkeel.cli.config import parse_config
          from archkeel.cli.observe import observer_for
          from archkeel.check.run import observe_revision,inspect_observation
          from archkeel.ir.codec import observation_payload
          from archkeel.ir.trace import trace_valid_violations
          root=Path.cwd()
          out=root/"reason-evidence"
          head="28938726de24fe8b2df69c61cd92c3f5dfb4cad1"
          config=parse_config((root/"archkeel.toml").read_bytes())
          start=time.perf_counter()
          result=observe_revision(observer_for(config.language),root,head,config,declared_at=head)
          assert result.observation is not None,result.diagnostics
          model=result.observation
          measurements,status=inspect_observation(model)
          payload=observation_payload(model)
          old=json.loads(gzip.decompress((out/"before.json.gz").read_bytes()))
          assert payload["unknowns"]==old["unknowns"],"complete UNKNOWN records including IDs/citations changed"
          assert measurements.scalars.violations==0 and not trace_valid_violations(model)
          assert measurements.scalars.unknown_positions==58
          assert measurements.scalars.calls_unresolved<=865
          assert measurements.scalars.typing_positions<=52
          assert not result.diagnostics,result.diagnostics
          (out/"after.json.gz").write_bytes(gzip.compress(json.dumps(payload,sort_keys=True).encode()))
          print("FINAL_CAUSE_NATIVE="+json.dumps(dict(head=head,status=str(status),seconds=time.perf_counter()-start,measurements=asdict(measurements),full_unknowns_exact=True)),flush=True)
          
          import ast
          from collections import Counter, defaultdict
          from dataclasses import asdict
          import gzip,json,subprocess
          from pathlib import Path
          from archkeel.analyzer.python.source import ParsedModule
          from archkeel.analyzer.python.scopes import LexicalScopes
          ROOT=Path.cwd()
          DIR=ROOT/"reason-evidence"
          BASE="f264c77eb55b1761a37a8083e479c3f1bc45f5cc"
          HEAD="28938726de24fe8b2df69c61cd92c3f5dfb4cad1"
          OWNER="src/archkeel/check/evaluation/boundary_types.py"
          def encode(v):return json.dumps(v,sort_keys=True,separators=(",",":"))
          def source(rev):return subprocess.check_output(["git","show",f"{rev}:{OWNER}"],text=True)
          def index(rev):
              text=source(rev);tree=ast.parse(text)
              module=ParsedModule(ROOT/OWNER,OWNER,"archkeel.check.evaluation.boundary_types","archkeel.check.evaluation",text,text.encode(),text.splitlines(),tree)
              lexical=LexicalScopes(module)
              scopes={id(s):s for s in lexical.by_node.values()}
              scopes[id(lexical.root)]=lexical.root
              groups=defaultdict(list)
              for scope in scopes.values():
                  if scope.parent:
                      token=("named",type(scope.node).__name__,getattr(scope.node,"name",None)) if isinstance(scope.node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)) else ("anonymous",type(scope.node).__name__,ast.dump(scope.node,include_attributes=False))
                      groups[(id(scope.parent),token)].append(scope)
              keys={id(lexical.root):("module",module.module)}
              def sk(scope):
                  if id(scope) in keys:return keys[id(scope)]
                  token=("named",type(scope.node).__name__,getattr(scope.node,"name",None)) if isinstance(scope.node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)) else ("anonymous",type(scope.node).__name__,ast.dump(scope.node,include_attributes=False))
                  peers=sorted(groups[(id(scope.parent),token)],key=lambda s:(s.node.lineno,s.node.col_offset))
                  key=(*sk(scope.parent),token,peers.index(scope))
                  keys[id(scope)]=key
                  return key
              scope_names={s.qualified_name:encode(sk(s)) for s in scopes.values()}
              named_nodes={id(s.node):sk(s) for s in scopes.values() if s is not lexical.root and isinstance(s.node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))}
              paths={}
              def locate(node,path):
                  if id(node) in named_nodes:path=("definition",named_nodes[id(node)])
                  paths[id(node)]=path
                  for field,value in ast.iter_fields(node):
                      if isinstance(value,ast.AST):locate(value,(*path,field))
                      elif isinstance(value,list):
                          for n,child in enumerate(value):
                              if isinstance(child,ast.AST):locate(child,(*path,field,n))
              locate(tree,("module",module.module))
              positions=defaultdict(list);call_positions={}
              for node in ast.walk(tree):
                  if not hasattr(node,"lineno"):continue
                  scope=lexical.by_node.get(node,lexical.root)
                  key=("ast",paths[id(node)])
                  location=(node.lineno,node.end_lineno,node.col_offset)
                  positions[location].append(key)
                  if isinstance(node,ast.Call):
                      call_key=(*location,ast.unparse(node.func))
                      assert call_key not in call_positions,call_key
                      call_positions[call_key]=(key,scope.qualified_name,ast.unparse(node.func))
              return positions,call_positions,scope_names
          def canonical(label,rev):
              model=json.loads(gzip.decompress((DIR/f"{label}.json.gz").read_bytes()))
              positions,call_positions,scope_names=index(rev)
              references={}
              citations={e["id"]:e for e in model["evidence"]}
              def evidence_key(e):
                  if e["file"]!=OWNER:return e["id"]
                  pos=(e["line"],e["end_line"],e["column"])
                  if not positions.get(pos) and pos==(1,1,0):
                      assert e["excerpt"]==source(rev).splitlines()[0],("module_header",label,e)
                      return e["id"]
                  assert positions.get(pos),("missing_ast",label,e)
                  return encode(("source-evidence",OWNER,sorted(positions[pos],key=encode)))
              references.update({e["id"]:evidence_key(e) for e in model["evidence"]})
              for row in model["symbols"]:
                  name=row["data"].get("qualified_name")
                  if row["data"].get("module")== "archkeel.check.evaluation.boundary_types" and name:
                      references[row["id"]]=encode(("symbol",name,row["kind"],[references[e] for e in row["evidence_ids"]]))
              rows=[];proof=[]
              for row in model["calls"]:
                  d=row["data"]
                  if d.get("status") not in {"unresolved","partially_resolved"}:continue
                  if d["source_module"]=="archkeel.check.evaluation.boundary_types":
                      assert len(row["evidence_ids"])==1
                      e=citations[row["evidence_ids"][0]]
                      key,scope,expression=call_positions[(e["line"],e["end_line"],e["column"],d["expression"])]
                      assert scope==d["source_scope"],(scope,d["source_scope"])
                      assert expression==d["expression"],(expression,d["expression"])
                      references[row["id"]]=encode(("call",OWNER,key))
                      for n,binding in enumerate(d["result_bindings"]):
                          references[binding["id"]]=encode(("value-binding",OWNER,key,n))
                      proof.append(dict(record=row,source_citation=e,actual_scope=scope,ast_identity=key))
                  rows.append(row)
              def normalize(v,key=None):
                  if isinstance(v,str):
                      return references.get(v,scope_names.get(v,v))
                  if isinstance(v,list):
                      out=[normalize(x) for x in v]
                      return sorted(out,key=encode) if key and (key.endswith("evidence_ids") or key=="fact_ids") else out
                  if isinstance(v,dict):return {k:normalize(x,k) for k,x in v.items()}
                  return v
              normalized=[normalize(row) for row in rows]
              (DIR/f"{label}-call-ast-proof.json").write_text(json.dumps(proof,sort_keys=True,indent=2))
              return normalized,proof
          old,op=canonical("before",BASE)
          new,np=canonical("after",HEAD)
          a,b=Counter(map(encode,old)),Counter(map(encode,new))
          delta=dict(removed=list((a-b).elements()),added=list((b-a).elements()))
          (DIR/"call-full-data-ast-delta.json").write_text(json.dumps(delta,sort_keys=True,indent=2))
          print("CALL_AST_PROOF="+json.dumps(dict(before_sites=len(old),after_sites=len(new),before_owner_sites=len(op),after_owner_sites=len(np),removed=len(delta["removed"]),added=len(delta["added"]))))
          for side in ("removed","added"):
              for row in delta[side][:8]:
                  value=json.loads(row)
                  print("UNPAIRED_AST_CALL="+json.dumps(dict(side=side,id=value["id"],expression=value["data"]["expression"],scope=value["data"]["source_scope"])))
          assert not delta["removed"] and not delta["added"],"real call data changed after actual AST/provenance correspondence"
          print("ALL_CALL_DATA_AST_PARITY=PASS")
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: boundary-reason-final-cause-native
          path: |
            reason-evidence/after.json.gz
            reason-evidence/*call*proof.json
            reason-evidence/call-full-data-ast-delta.json
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q -n 2 --tb=short

  actual-fixture-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Two real runtimes differ only in existing reason owner
        run: |
          uv run --locked python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          root=Path.cwd()
          target=root/"reason-evidence"/"old-runtime"/"archkeel"
          shutil.copytree(root/"src"/"archkeel",target)
          source=subprocess.check_output(["git","show","f264c77eb55b1761a37a8083e479c3f1bc45f5cc:src/archkeel/check/evaluation/boundary_types.py"])
          (target/"check"/"evaluation"/"boundary_types.py").write_bytes(source)
          PY
          uv run --locked python - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          root=Path.cwd()
          driver="from __future__ import annotations\nimport json\nfrom pathlib import Path\nimport sys\nimport time\nfrom archkeel.cli.config import parse_config\nfrom archkeel.cli.observe import observer_for\nfrom archkeel.check.ports import ScanConfig\nfrom archkeel.check.uml import assemble_uml\nfrom archkeel.check.uml_evaluation import evaluate_uml\nfrom archkeel.ir.codec import canonical_report_bytes, observation_payload\n\nroot=Path(sys.argv[1])\nout=Path(sys.argv[2])\nout.mkdir(parents=True,exist_ok=True)\nfor name in (\"E-runtime\",\"F-architecture\",\"H-uml\",\"K-python-realworld\"):\n    project=root/\"fixtures\"/name\n    c=parse_config((project/\"archkeel.toml\").read_bytes())\n    start=time.perf_counter()\n    result=observer_for(c.language)(\n        project,roots=c.roots,namespace=c.namespace,contract=c.contract,\n        git_head=\"a\"*40,dirty=False,contract_root=project,language=c.language)\n    result=evaluate_uml(assemble_uml(result,project,c.contract))\n    assert result.observation is not None,(name,result.diagnostics)\n    model=observation_payload(result.observation)\n    (out/f\"{name}.json\").write_text(json.dumps(model,sort_keys=True))\n    (out/f\"{name}.canonical.json\").write_bytes(canonical_report_bytes(result.observation))\n    print(\"REAL_FIXTURE_RUNTIME=\"+json.dumps(dict(name=name,seconds=time.perf_counter()-start,diagnostics=[str(x) for x in result.diagnostics],unknowns=len(model.get(\"unknowns\") or ()),violations=len(model.get(\"violations\") or ()))),flush=True)\n"
          for label,source in (("old",root/"reason-evidence"/"old-runtime"),("new",root/"src")):
              env={**os.environ,"PYTHONPATH":str(source)}
              subprocess.run([sys.executable,"-c",driver,str(root),str(root/"reason-evidence"/label)],env=env,check=True)
          PY
      - name: Exact all-field comparison and canonical bytes
        run: |
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          from archkeel.ir.codec import canonical_report_bytes
          root=Path("reason-evidence")
          def diff(a,b,path=()):
              if type(a) is not type(b):
                  return [path]
              if isinstance(a,dict):
                  if a.keys()!=b.keys():return [path]
                  return [q for key in a for q in diff(a[key],b[key],(*path,key))]
              if isinstance(a,list):
                  if len(a)!=len(b):return [path]
                  return [q for i,(x,y) in enumerate(zip(a,b)) for q in diff(x,y,(*path,i))]
              return [] if a==b else [path]
          for name in ("E-runtime","F-architecture","H-uml","K-python-realworld"):
              old=json.loads((root/"old"/f"{name}.json").read_text())
              new=json.loads((root/"new"/f"{name}.json").read_text())
              changes=diff(old,new)
              assert changes==[("analyzer","code_digest")],(name,changes[:30])
              new["analyzer"]["code_digest"]=old["analyzer"]["code_digest"]
              assert canonical_report_bytes(old)==canonical_report_bytes(new),name
              print("REAL_FIXTURE_WIRE_PARITY="+json.dumps(dict(name=name,only_changed_path=changes,bytes=len(canonical_report_bytes(old)),status="PASS")))
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: boundary-reason-real-fixture-wire
          path: |
            reason-evidence/old/*.json
            reason-evidence/new/*.json
