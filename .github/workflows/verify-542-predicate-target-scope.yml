name: Verify isolated actual predicate Target scope
on:
  push:
    branches: [verify/542-predicate-target-scope]
permissions:
  contents: read
jobs:
  actual-target-and-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feec3910bb5a4613f0abde18443c263b3393d196
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_python_string_predicate_target.py
      - run: uv run --locked ruff check tests/test_python_string_predicate_target.py
      - run: uv run --locked ruff format --check tests/test_python_string_predicate_target.py
      - run: git status --porcelain
