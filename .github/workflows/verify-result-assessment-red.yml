name: Result assessment ingress RED
on:
  push:
    branches: [verify/542-result-assessment-red]
permissions:
  contents: read
jobs:
  actual-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 698080b2fe0982a6291107e1946edeac1278010a
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Observe actual unsupported ingress on unchanged production
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(["uv", "run", "--locked", "python", "-m", "pytest", "-q", "tests/test_core_command_result.py", "-k", "result_declared_rules"], text=True, capture_output=True)
          print(result.stdout)
          print(result.stderr)
          assert result.returncode == 1
          assert "7 failed" in result.stdout and "ERROR" not in result.stdout
          PY
