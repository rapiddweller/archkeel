name: Typed collector wire boundaries
on:
  push:
    branches: [verify/542-collector-wire-types]
permissions:
  contents: read
jobs:
  collector-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.13
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Typed collector controls
        run: uv run --locked python -m pytest -q tests/test_typed_collector_protocol.py tests/test_typed_collector_native.py tests/test_collection_protocol.py tests/test_type_shapes.py tests/test_runtime.py tests/test_collection_conformance.py tests/test_codec.py tests/test_protocol_uml_target.py tests/test_collection_process.py tests/test_collection_runtime_gate.py tests/test_source_trust_boundary.py tests/test_collector_safety_acceptance.py tests/test_collection_boundary_regressions.py
      - name: Static typing
        if: always()
        run: uv run --locked mypy src/archkeel
      - name: Ruff
        if: always()
        run: |
          uv run --locked ruff check --fix src tests/test_typed_collector_protocol.py tests/test_typed_collector_native.py || true
          uv run --locked ruff format src tests/test_typed_collector_protocol.py tests/test_typed_collector_native.py
          python - <<'PY'
          import base64, subprocess
          patch = subprocess.check_output(["git", "diff"])
          print("FORMAT_PATCH=" + base64.b64encode(patch).decode())
          PY
          uv run --locked ruff check src tests/test_typed_collector_protocol.py tests/test_typed_collector_native.py
      - name: Native own baseline
        if: always()
        run: uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json
