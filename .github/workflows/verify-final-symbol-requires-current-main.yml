name: Verify final symbol-requires carry without writes
on:
  push:
    branches: [verify/542-symbol-requires-final-current-main]
permissions:
  contents: read
jobs:
  exact-no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 55f416d462a5b9ff44f761ed725eae4c5f9cf05b
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint typecheck
      - run: uv run --locked python -m pytest -q tests/test_requires_symbol_ports.py tests/test_architecture_projection.py::test_native_core_through_enforcement_uses_the_shared_predicate tests/test_module_object_grants.py::test_unknown_names_are_not_converted_to_a_module_object_permission tests/test_repository_hygiene.py
      - name: Verify exact committed receipt and clean repository without writes
        run: |
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 3fdda84e4a58b0ac3ed15a8d28c761568d4d7809 --amendment docs/architecture/decisions/issue-564-symbol-requires-amendment.json > "$RUNNER_TEMP/symbol-requires-exact.json"
          uv run --locked python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"symbol-requires-exact.json").read_bytes())
          head=subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()
          dirty=subprocess.check_output(["git","status","--porcelain"]).decode()
          print("SYMBOL_REQUIRES_EXACT="+json.dumps({"head":head,"dirty":dirty,**{key:result.get(key) for key in ("exit_code","amendment_status","failures","diagnostics","widenings","measurements")}},separators=(",",":")))
          assert head=="55f416d462a5b9ff44f761ed725eae4c5f9cf05b"
          assert dirty=="",dirty
          assert result["exit_code"]==0 and result["amendment_status"]=="valid"
          assert not result["failures"] and not result["diagnostics"] and not result["widenings"]
          PY
