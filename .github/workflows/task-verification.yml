name: Bind nominal typed component intent
on:
  push:
    branches: [verify/typed-contract-amendments]
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b57cbdcd06df9cdf5a05230331e93b8d8fa4b798
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Bind exact intent with unchanged baseline
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 63437df6734275850838ba1026b276c2f930bf2f --amendment docs/architecture/decisions/issue-540-dependency-policy-amendment.json --write-amendment --decided-by "ake2l (requested typed APIs and component responsibilities); Codex implementation, independent Astra review before merge" --rationale "Issue #540 extracts pure dependency-policy with named immutable selectors, selections and DependencyOwner identity/modules. Seven named shared type exports and an inner ownership matcher port make its API explicit. One model adapter preserves legacy ownership tuples and helper signatures; codecs retain input conversion, Core verdicts and reports shared selection. Enum placement permits its vocabulary owner. No baseline entry, measurement ceiling or accepted debt changes. docs/architecture/dependency-selection.md records responsibilities and compatibility limits." > .task-amend-result.json
          task_status=$?
          python - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path(".task-amend-result.json").read_text())
          print("AMENDMENT_RESULT="+json.dumps({key:data.get(key) for key in ("exit_code","failures","diagnostics","measurements")}))
          print("AMENDMENT_JSON="+pathlib.Path("docs/architecture/decisions/issue-540-dependency-policy-amendment.json").read_text().replace("\n",""))
          PY
          exit "$task_status"
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a584bd45bdcecd9b9be7b650389145b622e87127
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Bind exact intent with unchanged baseline
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against b57cbdcd06df9cdf5a05230331e93b8d8fa4b798 --amendment docs/architecture/decisions/issue-541-dependency-api-target-amendment.json --write-amendment --decided-by "ake2l (requested typed APIs and component responsibilities); Codex implementation, independent Astra review before merge" --rationale "Issue #541 adds 38 independently authored dependency API Target entities and a narrow boundary_types rule. Intent requires selector enums and fields, nominal DependencyOwner identity/modules, typed selection APIs, legacy facade and adapter signatures, and record conversion. Native source mutations enforce type/API drift; legacy structural aliases remain outside the narrow deep boundary guarantee. The fail-closed classifier cannot enumerate UML intent changes. No publication, permission, baseline entry, ceiling or exception is widened. docs/architecture/dependency-selector-target.md records evidence and scope." > .task-amend-result.json
          task_status=$?
          python - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path(".task-amend-result.json").read_text())
          print("AMENDMENT_RESULT="+json.dumps({key:data.get(key) for key in ("exit_code","failures","diagnostics","measurements")}))
          print("AMENDMENT_JSON="+pathlib.Path("docs/architecture/decisions/issue-541-dependency-api-target-amendment.json").read_text().replace("\n",""))
          PY
          exit "$task_status"
