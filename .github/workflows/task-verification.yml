name: Bind typed dependency contract change
on:
  push:
    branches: [verify/540-contract-amendment]
permissions:
  contents: read
jobs:
  bind-amendment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Bind the exact intended contract and unchanged baseline
        run: |
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 63437df6734275850838ba1026b276c2f930bf2f --amendment docs/architecture/decisions/issue-540-dependency-policy-amendment.json --write-amendment --decided-by "ake2l (requested typed APIs and component responsibilities); Codex implementation, independent Astra review before merge" --rationale "Issue #540 extracts one pure typed dependency-policy component with six named shared type exports and an inner ownership matcher port. Existing model compatibility exports delegate to this owner; codecs retain raw conversion, Core retains verdicts and reports reuse selection. The enum placement rule explicitly permits this vocabulary owner. Existing budgets and baseline remain unchanged. Native semantic and compatibility regressions and independent final review are required; docs/architecture/dependency-selection.md records the API responsibilities." > .task-amendment-result.json
          python - <<'PY'
          import json,pathlib
          result=json.loads(pathlib.Path(".task-amendment-result.json").read_text())
          print("AMENDMENT_RESULT="+json.dumps({key:result.get(key) for key in ("exit_code","failures","diagnostics")}))
          print("AMENDMENT_JSON="+pathlib.Path("docs/architecture/decisions/issue-540-dependency-policy-amendment.json").read_text().replace("\n",""))
          PY
