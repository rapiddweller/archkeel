name: Temporary issue verification
on:
  push:
    branches: [verify/536-isolated-check]
permissions:
  contents: read
jobs:
  isolated-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Format and lint changed Python files
        run: |
          uv run --locked ruff format src tests tools/architecture_graph_schema.py
          uv run --locked ruff check --fix src tests tools/architecture_graph_schema.py
      - name: Export formatting patch
        if: always()
        run: |
          git diff --no-ext-diff > /tmp/format.patch
          python -c "import base64,pathlib; print('FORMAT_PATCH='+base64.b64encode(pathlib.Path('/tmp/format.patch').read_bytes()).decode())"
      - name: Verify exact policy end to end
        run: uv run --locked python -m pytest -q tests/test_absent_import_namespace.py::test_namespace_policy_requires_only_real_source_subjects --maxfail=1
