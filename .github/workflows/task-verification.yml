name: Verify typed dependency seam
on:
  push:
    branches: [verify/540-typed-dependencies]
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Reproduce typed dependency and real-label applicability gaps
        run: uv run --locked python -m pytest -q tests/test_dependency_selectors.py tests/test_typed_dependency_api.py --maxfail=20
