name: Verify native typed control guard
on:
  push:
    branches: [verify/542-typed-control]
permissions:
  contents: read
jobs:
  native-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Format and lint native guard controls
        run: |
          uv run --locked ruff format tests/test_dependency_typed_control.py
          uv run --locked ruff check --fix tests/test_dependency_typed_control.py
      - name: Export exact formatting patch
        if: always()
        run: |
          git diff --no-ext-diff > .task-format.patch
          python -c "import base64,pathlib; print('FORMAT_PATCH='+base64.b64encode(pathlib.Path('.task-format.patch').read_bytes()).decode())"
      - name: Verify native source enforcement
        run: uv run --locked python -m pytest -q tests/test_dependency_typed_control.py tests/test_dependency_api_target.py --maxfail=8
