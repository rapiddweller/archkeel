name: Bind intended dependency API Target
on:
  push:
    branches: [verify/541-contract-amendment]
permissions:
  contents: read
jobs:
  bind-amendment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Bind the exact intended contract and unchanged baseline
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 5e9fe2e8e2f25cc18292de8bd5b50ebf5c86d987 --amendment docs/architecture/decisions/issue-541-dependency-api-target-amendment.json --write-amendment --decided-by "ake2l (requested enforceable typed APIs); Codex implementation, independent Astra review before merge" --rationale "Issue #541 adds 34 independently authored dependency API Target entities and a narrow native boundary_types rule for the shared dependency-policy module. Enum kinds, closed mode fields, selector/selection methods, legacy wrapper parameters and return types, and record conversion are explicit intent. Actual source mutation controls reject type widening and undeclared helper imports. This strengthens the intended contract; the fail-closed classifier cannot enumerate UML declaration changes. No publication, permission, baseline entry, measurement ceiling, wildcard exception or accepted debt is widened. docs/architecture/dependency-selector-target.md records the guarantee and limits." > .task-amendment-result.json
          python - <<'PY'
          import json,pathlib
          result=json.loads(pathlib.Path(".task-amendment-result.json").read_text())
          print("AMENDMENT_RESULT="+json.dumps({key:result.get(key) for key in ("exit_code","failures","diagnostics")}))
          print("AMENDMENT_JSON="+pathlib.Path("docs/architecture/decisions/issue-541-dependency-api-target-amendment.json").read_text().replace("\n",""))
          PY
