name: Verify physical source evidence on current main
on:
  push:
    branches: [verify/542-physical-current-main]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 60433d23a819fd52d54bef97f12bde388a5b09b5
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Derive measured baseline and normal source-change receipt
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --write-baseline --json > "$RUNNER_TEMP/physical-baseline.json"
          task_baseline=$?
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against ef937c4e61d69e51440abe283461ae6c4134b583 --amendment docs/architecture/decisions/issue-542-physical-lines-amendment.json --write-amendment --decided-by ake2l --rationale "Preserve physical Python source coordinates without changing original source bytes, and tighten the measured unresolved-call baseline." > "$RUNNER_TEMP/physical-amendment.json"
          task_amendment=$?
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against ef937c4e61d69e51440abe283461ae6c4134b583 --amendment docs/architecture/decisions/issue-542-physical-lines-amendment.json > "$RUNNER_TEMP/physical-replay.json"
          task_replay=$?
          python - <<'PY'
          import json,os,pathlib
          for stage in ("baseline","amendment","replay"):
              data=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/f"physical-{stage}.json").read_text())
              print("PHYSICAL_RESULT="+json.dumps({"stage":stage,**{key:data.get(key) for key in ("exit_code","failures","widenings","diagnostics","measurements","amendment_status")}},separators=(",",":")))
          print("PHYSICAL_BASELINE="+pathlib.Path("architecture-baseline.json").read_text().replace("\n",""))
          receipt=pathlib.Path("docs/architecture/decisions/issue-542-physical-lines-amendment.json")
          if receipt.exists():
              print("PHYSICAL_AMENDMENT="+receipt.read_text().replace("\n",""))
          PY
          test "$task_baseline" -eq 0 && test "$task_amendment" -eq 0 && test "$task_replay" -eq 0
      - name: Actual source evidence and collector regressions
        run: uv run --locked python -m pytest -q tests/test_python_source_evidence_lines.py tests/test_analyzer.py tests/test_typed_collector_native.py
