name: Prove absent shared evaluator receipt ports before implementation
on:
  push:
    branches: [verify/542-rule-evaluation-receipt-red]
permissions:
  contents: read
jobs:
  actual-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd4ada62c802301ce8de7c6b9f1e7e82d82cfbd1
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Witness four real missing-port failures without changing product source
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_rule_evaluation_receipts.py::test_omitted_completion_flags_keep_the_distinct_legacy_defaults tests/test_rule_evaluation_receipts.py::test_actual_rule_producer_emits_the_shared_plain_wire_tag tests/test_rule_evaluation_receipts.py::test_actual_native_receipt_ports_and_exact_reader_guard_match_authored_intent > "$RUNNER_TEMP/receipt-red.log" 2>&1
          receipt_red_status=$?
          set -e
          cat "$RUNNER_TEMP/receipt-red.log"
          test "$receipt_red_status" -eq 1
          python - <<'PY'
          import os
          from pathlib import Path
          log=(Path(os.environ["RUNNER_TEMP"])/"receipt-red.log").read_text()
          assert "4 failed" in log,log[-3000:]
          assert "The shared evaluator receipt reader is absent" in log
          assert "ERROR collecting" not in log
          print("RECEIPT_EXPECTED_RED=4 missing real reader/producer/native ports")
          PY
      - run: git diff --exit-code
