name: Save original GitHub event

on:
  workflow_call:

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Save original payload
        run: cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/original-event.json"

      - name: Retain original payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: initial-pr-event
          path: ${{ runner.temp }}/original-event.json
          if-no-files-found: error
          retention-days: 90
