name: TypeScript source input native RED
on:
  push:
    branches: [verify/542-typescript-compound-loader-red]
permissions:
  contents: read
jobs:
  native-source-input-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 17ae72058d0d643c906afb2f58333fad7ab0d771
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typescript_source_input.py::test_declaration_cts_keeps_written_commonjs_loader_semantics
