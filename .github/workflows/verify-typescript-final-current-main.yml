name: TypeScript actual Main final exact no-write gate
on:
  push:
    branches: [verify/542-typescript-final-current-main]
permissions:
  contents: read
jobs:
  exact-no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9b5abc0a990b577a920218678db525937fd390cd
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typescript_syntax_types.py tests/test_typescript_syntax_compatibility.py tests/test_repository_hygiene.py
      - run: uv run --locked ruff check src/archkeel/analyzer/typescript tests/test_typescript_syntax_types.py tests/test_typescript_syntax_compatibility.py tests/test_typescript_control_target.py
      - run: uv run --locked ruff format --check src/archkeel/analyzer/typescript tests/test_typescript_syntax_types.py tests/test_typescript_syntax_compatibility.py tests/test_typescript_control_target.py
      - run: uv run --locked mypy src/archkeel
      - name: Verify the exact committed receipt without generating or mutating it
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against a6515288cbbe3961e8a9aaac2054779dbd7877e3 --amendment docs/architecture/decisions/issue-542-typescript-syntax-amendment.json > "$RUNNER_TEMP/ts-direct-exact.json"
          task_status=$?
          uv run --locked python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"ts-direct-exact.json").read_text())
          print("EXACT_SOURCE="+subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip(),flush=True)
          print("EXACT_RESULT="+json.dumps({key:result.get(key) for key in ("exit_code","amendment_status","failures","diagnostics","measurements")}),flush=True)
          dirty=subprocess.check_output(["git","status","--porcelain"]).decode()
          print("EXACT_DIRTY="+dirty,flush=True)
          assert dirty=="",dirty
          PY
          exit "$task_status"
