name: Verify reviewed contract version owner on actual merged graph
on:
  push:
    branches: [verify/542-version-current-main]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e5d5f2d551c01014d389402bdeaaacaab15ca493
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Derive measured baseline and normal source-change receipt
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --write-baseline --json > "$RUNNER_TEMP/graph-baseline.json"
          task_baseline=$?
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against e7b586c10721007c55339659ed2e29064ff9e3ab --amendment docs/architecture/decisions/2026-10-16-contract-version-types.json --write-amendment --decided-by ake2l --rationale "Own nominal contract versions and one direct typed feature policy while preserving merged graph corrections, wire compatibility and measured debt." > "$RUNNER_TEMP/graph-amendment.json"
          task_amendment=$?
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against e7b586c10721007c55339659ed2e29064ff9e3ab --amendment docs/architecture/decisions/2026-10-16-contract-version-types.json > "$RUNNER_TEMP/graph-replay.json"
          task_replay=$?
          python - <<'PY'
          import json,os,pathlib
          for stage in ("baseline","amendment","replay"):
              data=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/f"graph-{stage}.json").read_text())
              print("VERSION_RESULT="+json.dumps({"stage":stage,**{key:data.get(key) for key in ("exit_code","failures","widenings","diagnostics","measurements","amendment_status")}},separators=(",",":")))
          print("VERSION_BASELINE="+pathlib.Path("architecture-baseline.json").read_text().replace("\n",""))
          receipt=pathlib.Path("docs/architecture/decisions/2026-10-16-contract-version-types.json")
          if receipt.exists():
              print("VERSION_AMENDMENT="+receipt.read_text().replace("\n",""))
          PY
          test "$task_baseline" -eq 0 && test "$task_amendment" -eq 0 && test "$task_replay" -eq 0
      - name: Actual source evidence and collector regressions
        run: uv run --locked python -m pytest -q tests/test_contract_version_types.py tests/test_codec_compatibility.py tests/test_contract_model.py tests/test_codec.py tests/test_repository_hygiene.py
