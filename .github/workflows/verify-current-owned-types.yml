name: Verify current combined owned interfaces
on:
  push:
    branches: [verify/542-owned-types-current]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fad36e2695de7587e09a87dd304fde7e586f009f
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint typecheck
      - run: git diff --exit-code
  native-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fad36e2695de7587e09a87dd304fde7e586f009f
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -n 2 --dist=loadfile -q tests/test_source_resolution_types.py tests/test_typed_symbol_class_kinds.py tests/test_typed_host_events.py tests/test_core_command_result.py tests/test_known_delta_action_types.py tests/test_snapshot_language_types.py tests/test_string_comparison_observation.py tests/test_target_navigation_graph.py tests/test_repository_hygiene.py tests/test_make_gate.py tests/test_validation.py::test_an_inside_may_not_grant_what_requires_never_named
      - run: git diff --exit-code
