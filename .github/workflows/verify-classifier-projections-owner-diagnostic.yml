name: Diagnose classifier owner mutation
on:
  push:
    branches: [verify/542-classifier-projections-owner-diagnostic]
permissions:
  contents: read
jobs:
  owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 403199534888925df327a4b3cb861ac4b8d1bad2
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked python - <<'PY'
          import json,sys,pytest
          from dataclasses import asdict
          sys.path.insert(0,"tests")
          import test_classifier_projections as subject
          from archkeel.check.report import run_report
          from archkeel.cli.observe import observe
          from archkeel.ir.codec import parse_observation,decode_canonical_model
          def debug(root,config):
              result,encoded=run_report(root,config=config,analyzer=observe)
              print("ACTUAL_OWNER_MUTATION_RESULT="+json.dumps({"exit":result.exit_code,"diagnostics":[asdict(item) for item in result.diagnostics]},default=str),flush=True)
              assert result.exit_code==0,result.diagnostics
              return parse_observation(decode_canonical_model(json.loads(encoded)))
          subject._model=debug
          raise SystemExit(pytest.main(["-q","-s","tests/test_classifier_projections.py::test_projection_port_weakening_fails_with_unchanged_authored_intent[owner]"]))
          PY
