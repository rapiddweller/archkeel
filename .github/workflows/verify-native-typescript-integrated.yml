name: Verify reviewed TypeScript native evidence in current owner union
on:
  push:
    branches: [verify/542-native-typescript-integrated]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ad7be0ec26ff4ac0b41db6d4bb8e2b118ecf9596
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Derive measured baseline and normal source-change receipt
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --write-baseline --json > "$RUNNER_TEMP/graph-baseline.json"
          task_baseline=$?
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against c7444205d4fe87eaae0de5e2dc98b70909fd1cc7 --amendment docs/architecture/decisions/issue-542-typescript-written-controls-amendment.json --write-amendment --decided-by ake2l --rationale "Preserve reviewed TypeScript native string observations, compatible profile construction and all existing typed owners without increased measured debt." > "$RUNNER_TEMP/graph-amendment.json"
          task_amendment=$?
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against c7444205d4fe87eaae0de5e2dc98b70909fd1cc7 --amendment docs/architecture/decisions/issue-542-typescript-written-controls-amendment.json > "$RUNNER_TEMP/graph-replay.json"
          task_replay=$?
          python - <<'PY'
          import json,os,pathlib
          for stage in ("baseline","amendment","replay"):
              data=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/f"graph-{stage}.json").read_text())
              print("INTEGRATED_TS_RESULT="+json.dumps({"stage":stage,**{key:data.get(key) for key in ("exit_code","failures","widenings","diagnostics","measurements","amendment_status")}},separators=(",",":")))
          print("INTEGRATED_TS_BASELINE="+pathlib.Path("architecture-baseline.json").read_text().replace("\n",""))
          receipt=pathlib.Path("docs/architecture/decisions/issue-542-typescript-written-controls-amendment.json")
          if receipt.exists():
              print("INTEGRATED_TS_AMENDMENT="+receipt.read_text().replace("\n",""))
          PY
          test "$task_baseline" -eq 0 && test "$task_amendment" -eq 0 && test "$task_replay" -eq 0
      - name: Actual source evidence and collector regressions
        run: uv run --locked python -m pytest -q tests/test_typescript_string_constructs.py tests/test_nullable_profile_measurements.py tests/test_saved_report.py tests/test_schema_drift.py tests/test_typescript_control_target.py tests/test_typescript_demo.py tests/test_repository_hygiene.py
      - name: Lint and type-check current combined source
        run: |
          uv run --locked ruff check src tests tools
          uv run --locked ruff format --check src tests tools
          uv run --locked mypy src/archkeel
