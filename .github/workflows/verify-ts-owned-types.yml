name: TypeScript typed intent amendment
on:
  push:
    branches: [fix/542-typescript-owned-control-types]
permissions:
  contents: read
jobs:
  native-against:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Bind exact typed contract and reduced baseline
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against a82fe0ee484e0b84f28159eed5b8cf5272767ea9 --amendment docs/architecture/decisions/issue-542-typescript-control-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Typed TypeScript compiler options, resolver modes and owned grammar; 17 independent API Target entities, native whole-module guards and named component ports. Lower calls_unresolved from 919 to measured 918; no increased limit, allowance or accepted debt.' > "$RUNNER_TEMP/ts-amend-result.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'ts-amend-result.json').read_text())
          print('AMENDMENT_RESULT=' + json.dumps({key: result.get(key) for key in ('exit_code', 'failures', 'diagnostics', 'measurements')}))
          print('AMENDMENT_JSON=' + pathlib.Path('docs/architecture/decisions/issue-542-typescript-control-amendment.json').read_text().replace('\n', ''))
          PY
          exit "$task_status"
