name: Dart Compass and Flutter compatibility
on:
  push:
    branches: [verify/542-dart-compass]
permissions:
  contents: read
jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make browser-install
      - name: Prove real Compass reports, browser navigation and Flutter mutations
        run: uv run --locked --with playwright==1.62.0 python -m pytest -q tests/test_compass_project_report.py tests/test_compass_project_target.py tests/test_flutter_demo.py tests/test_project_demo_snapshots.py --tb=short
