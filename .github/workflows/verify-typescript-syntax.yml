name: TypeScript syntax initial GREEN
on:
  push:
    branches: [fix/issue-542-typescript-syntax-domains]
permissions:
  contents: read
jobs:
  typed-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Test typed compiler and resolver behavior
        run: uv run --locked python -m pytest -q tests/test_typescript_syntax_types.py tests/test_typescript_collect.py tests/test_typescript_control_target.py::test_native_typescript_api_matches_the_independent_target tests/test_typescript_control_target.py::test_native_parser_and_collector_guards_are_proven_without_exceptions
      - name: Export formatting
        if: always()
        run: |
          uv run --locked ruff check --select I --fix src/archkeel/analyzer/typescript tests/test_typescript_syntax_types.py tests/test_typescript_control_target.py
          uv run --locked ruff format src/archkeel/analyzer/typescript tests/test_typescript_syntax_types.py tests/test_typescript_control_target.py
          python - <<'PY'
          import base64, subprocess
          print("FORMAT_PATCH=" + base64.b64encode(subprocess.check_output(["git", "diff"])).decode())
          PY
      - name: Lint and typecheck
        run: make lint typecheck
      - name: Native baseline
        if: always()
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/tssyn-native.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'tssyn-native.json').read_text())
          print('NATIVE_RESULT=' + json.dumps({key: result.get(key) for key in ('exit_code', 'failures', 'diagnostics', 'measurements')}))
          PY
          exit "$task_status"

