name: TypeScript syntax integrated native proof
on:
  push:
    branches: [fix/issue-542-typescript-syntax-domains]
permissions:
  contents: read
jobs:
  typed-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e87a598e969e7bc5ee7636e8b02caf561a86265d
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Verify frozen parser port, real native mutations, source evidence and hygiene
        run: |
          git rev-parse HEAD
          uv run --locked python -m pytest -q tests/test_typescript_syntax_types.py tests/test_typescript_control_target.py tests/test_python_source_evidence_lines.py tests/test_repository_hygiene.py
      - name: Lint and typecheck
        if: always()
        run: make lint typecheck
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e87a598e969e7bc5ee7636e8b02caf561a86265d
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Measure complete integrated syntax source with inherited limits
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/tssyn-integrated.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "tssyn-integrated.json").read_text())
          print("NATIVE_RESULT=" + json.dumps({key: result.get(key) for key in ("exit_code", "failures", "diagnostics", "measurements")}))
          PY
          exit "$task_status"
