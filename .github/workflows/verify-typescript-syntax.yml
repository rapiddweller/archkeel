name: TypeScript unknown-name syntax RED
on:
  push:
    branches: [fix/issue-542-typescript-syntax-domains]
permissions:
  contents: read
jobs:
  unknown-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typescript_syntax_types.py::test_unknown_member_name_kind_cannot_certify_named_inventory
