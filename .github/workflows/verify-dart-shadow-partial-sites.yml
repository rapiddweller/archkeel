name: Explain conservative Dart host partial sites
on:
  push:
    branches: [verify/570-dart-shadow-partial-sites]
permissions:
  contents: read
jobs:
  partial-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dace9a80e1bdc8419ba64804bfcf97f22970087f
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Print actual added conservative call identities and targets
        run: |
          uv run --locked python - <<'PY'
          import ast,json,re,subprocess
          from collections import Counter
          from dataclasses import asdict
          from pathlib import Path
          from archkeel.cli.config import parse_config
          from archkeel.cli.observe import observer_for
          from archkeel.check.run import observe_revision
          from archkeel.check.ratchets import call_rows
          from archkeel.ir.codec_wire import value_bytes
          root=Path.cwd()
          config=parse_config((root/"archkeel.toml").read_bytes())
          observer=observer_for(config.language)
          models=[]
          def caller(value):return re.sub(r"<(genexpr|listcomp|dictcomp|setcomp):[0-9]+:[0-9]+>",r"<\1>",value)
          def key(row):return (row.path,caller(row.caller),row.expression,row.reason)
          for ref in ("950520fd126ca05744c19066bb28ccbef5627964","dace9a80e1bdc8419ba64804bfcf97f22970087f"):
              result=observe_revision(observer,root,ref,config,declared_at=ref)
              assert not result.diagnostics and result.observation is not None,result.diagnostics
              models.append(result.observation)
          rows=[[row for row in call_rows(model) if row.status=="partially_resolved"] for model in models]
          a,b=(Counter(key(row) for row in items) for items in rows)
          added,removed=b-a,a-b
          summary={"base":"950520fd126ca05744c19066bb28ccbef5627964","head":"dace9a80e1bdc8419ba64804bfcf97f22970087f","before":len(rows[0]),"after":len(rows[1]),"added_groups":[{"key":k,"count":n} for k,n in added.items()],"removed_groups":[{"key":k,"count":n} for k,n in removed.items()],"after_matching_group_sites":[asdict(row) for row in rows[1] if key(row) in added]}
          model=models[1]
          evidence={row.id:row for row in model.evidence}
          selected=[]
          for row in model.records("calls") or ():
              if row.data.get("status")!="partially_resolved":continue
              sites=[evidence[i] for i in row.evidence_ids if i in evidence]
              if len(sites)!=1:continue
              site=sites[0]
              k=(site.file,caller(str(row.data.get("source_scope"))),row.data.get("expression"),row.data.get("reason"))
              if k in added:selected.append({"id":row.id,"data":json.loads(value_bytes(row.data)),"site":asdict(site)})
          summary["after_matching_group_record_evidence"]=selected
          def semantic(model,ref):
              lookup={item.id:item for item in model.evidence}
              caches={}
              output=Counter()
              for record in model.records("calls") or ():
                  if record.data.get("status")!="partially_resolved":continue
                  sites=[lookup[i] for i in record.evidence_ids if i in lookup]
                  if len(sites)!=1:continue
                  site=sites[0]
                  k=(site.file,caller(str(record.data.get("source_scope"))),record.data.get("expression"),record.data.get("reason"))
                  if k not in added:continue
                  if site.file not in caches:
                      source=subprocess.check_output(["git","show",ref+":"+site.file]).decode()
                      caches[site.file]={(node.lineno,node.col_offset,ast.unparse(node.func)):ast.dump(node,include_attributes=False) for node in ast.walk(ast.parse(source)) if isinstance(node,ast.Call)}
                  call_ast=caches[site.file][(site.line,site.column,record.data.get("expression"))]
                  targets=json.loads(value_bytes(record.data)).get("targets")
                  output[(k,json.dumps(targets,sort_keys=True),call_ast)]+=1
              return output
          old_sem=semantic(models[0],"950520fd126ca05744c19066bb28ccbef5627964")
          new_sem=semantic(models[1],"dace9a80e1bdc8419ba64804bfcf97f22970087f")
          delta=new_sem-old_sem
          summary["added_semantic_calls"]=[{"identity":k,"count":n} for k,n in delta.items()]
          summary["removed_semantic_calls"]=[{"identity":k,"count":n} for k,n in (old_sem-new_sem).items()]
          print("DART_PARTIAL_SITE_EVIDENCE="+json.dumps(summary,separators=(",",":")))
          assert sum(added.values())==4 and not removed,summary
          assert all(k[0] in {"src/archkeel/analyzer/dart/parse.py","src/archkeel/analyzer/dart/resolve.py"} for k in added),summary
          assert not old_sem-new_sem,summary
          assert sum(delta.values())==4 and len(delta)==3,summary
          assert all(k[0][2] in {"source.text","source.span"} for k in delta),summary
          PY
