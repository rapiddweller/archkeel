name: Verify frozen known Delta action API
on:
  push:
    branches: [verify/issue-542-known-delta-action-final]
permissions:
  contents: read
jobs:
  exact-source-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Pin actual source, independent intent, receipt and legacy tests
        run: |
          git diff --exit-code 917b8177636c5401a51eecafafee6baf7b3bb35a -- src schema architecture-baseline.json architecture-contract.json docs/architecture/contracts Makefile tests docs/architecture/decisions/issue-542-known-delta-action-amendment.json
          git diff --exit-code a44479a306d746e7874e32a87dd0b107f45badd5 -- src schema architecture-baseline.json architecture-contract.json docs/architecture/contracts Makefile tests
          git diff --exit-code 68b656668a3fdbbbe482881d0dab41ff89a21ca3 -- schema architecture-baseline.json tests ':!tests/test_known_delta_action_types.py'
          git rev-parse 917b8177636c5401a51eecafafee6baf7b3bb35a:docs/architecture/decisions/issue-542-known-delta-action-amendment.json
          uv run --locked python -m pytest -q tests/test_known_delta_action_types.py --tb=short
  strict-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked ruff check tests/test_known_delta_action_types.py src/archkeel/ir/model.py src/archkeel/check/delta.py src/archkeel/check/expectation.py
          uv run --locked ruff format --check tests/test_known_delta_action_types.py src/archkeel/ir/model.py src/archkeel/check/delta.py src/archkeel/check/expectation.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
          git diff --exit-code
  committed-no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Validate committed normal receipt without any writer
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 68b656668a3fdbbbe482881d0dab41ff89a21ca3 --amendment docs/architecture/decisions/issue-542-known-delta-action-amendment.json > "$RUNNER_TEMP/known-action-no-write.json"
          native_status=$?
          set -e
          python - "$RUNNER_TEMP/known-action-no-write.json" <<'PY'
          import json,pathlib,sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("KNOWN_ACTION_NO_WRITE="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          assert value["exit_code"]==0 and value["amendment_status"]=="valid"
          assert not value["failures"] and not value["diagnostics"]
          PY
          git diff --exit-code
          exit "$native_status"
