name: Method descriptor focused verification
on:
  push:
    branches: [verify/542-descriptor-green]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Format and export exact patch
        run: |
          uv run --locked ruff format src/archkeel/ir/facts.py src/archkeel/ir/facts_codec.py src/archkeel/analyzer/python/source.py src/archkeel/check/evaluation/boundary_types.py src/archkeel/ir/source_graph.py src/archkeel/ir/facts_validation.py tests/test_typed_method_descriptors.py
          uv run --locked ruff check --fix src/archkeel/ir/facts.py src/archkeel/ir/facts_codec.py src/archkeel/analyzer/python/source.py src/archkeel/check/evaluation/boundary_types.py src/archkeel/ir/source_graph.py src/archkeel/ir/facts_validation.py tests/test_typed_method_descriptors.py
          python - <<'PY'
          import base64,subprocess
          print("DESCRIPTOR_FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","src","tests"])).decode())
          PY
      - name: Actual native API, mutation and lifecycle checks
        run: uv run --locked python -m pytest -q tests/test_typed_method_descriptors.py tests/test_typed_python_properties.py tests/test_boundary_types_abstract_methods.py tests/test_inherited_properties.py tests/test_local_inherited_methods.py tests/test_inheritance_proof_transport.py tests/test_class_method_publication.py tests/test_source_graph.py tests/test_collection_protocol.py tests/test_typescript_collect.py tests/test_dart_inner_collect.py --tb=short
      - run: make lint typecheck
