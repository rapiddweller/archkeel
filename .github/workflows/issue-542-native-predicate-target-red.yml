name: Native predicate owned Target RED
on:
  push:
    branches: [verify/542-native-predicate-target-red]
permissions:
  contents: read
jobs:
  native-intent-red:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cb2688eb3d399ed5b0ea0280f9c68be63ad873c3
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Demonstrate actual decoder is absent from independently authored Target
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_python_string_predicate_target.py::test_actual_predicate_enum_and_decoder_satisfy_independent_native_target
          probe_status=$?
          test "$probe_status" -eq 1
