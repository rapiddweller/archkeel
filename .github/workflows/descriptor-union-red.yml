name: Method descriptor actual RED
on:
  push:
    branches: [verify/542-descriptor-union-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Expected missing nominal API and actual raw-control RED
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_typed_method_descriptors.py -k "reader_input or native_descriptor_fulfils_authored" --tb=short
          result=$?
          echo "DESCRIPTOR_RED_EXIT=$result"
          test "$result" -eq 1
      - name: Existing proof and graph controls
        run: uv run --locked python -m pytest -q tests/test_typed_method_descriptors.py -k "receiver or wire_transport or nested_json" --tb=short
