name: Verify Shared comparison support boundaries
on:
  push:
    branches: [fix/issue-542-comparison-support-api]
permissions:
  contents: read
jobs:
  comparison-support-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: git diff --exit-code a8f9a4ad8386a18604049aa75c65d49515dfa2ea -- src schema architecture-baseline.json architecture-contract.json docs/architecture/contracts
      - run: uv run --locked python -m pytest -q tests/test_comparison_support_types.py --tb=short
  comparison-support-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: |
          uv run --locked ruff check --select I --fix tests/test_comparison_support_types.py src/archkeel/ir/model.py src/archkeel/ir/codec_delta.py src/archkeel/ir/bindings.py src/archkeel/ir/references.py src/archkeel/ir/type_fanin.py src/archkeel/ir/structure.py src/archkeel/ir/duplication.py src/archkeel/ir/decisions.py src/archkeel/check/delta.py src/archkeel/check/expectation.py src/archkeel/render/summary.py src/archkeel/render/html.py
          uv run --locked ruff format tests/test_comparison_support_types.py src/archkeel/ir/model.py src/archkeel/ir/codec_delta.py src/archkeel/ir/bindings.py src/archkeel/ir/references.py src/archkeel/ir/type_fanin.py src/archkeel/ir/structure.py src/archkeel/ir/duplication.py src/archkeel/ir/decisions.py src/archkeel/check/delta.py src/archkeel/check/expectation.py src/archkeel/render/summary.py src/archkeel/render/html.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","src","tests/test_comparison_support_types.py"])).decode())
          PY
          uv run --locked ruff check tests/test_comparison_support_types.py src/archkeel/ir/model.py src/archkeel/ir/codec_delta.py src/archkeel/ir/bindings.py src/archkeel/ir/references.py src/archkeel/ir/type_fanin.py src/archkeel/ir/structure.py src/archkeel/ir/duplication.py src/archkeel/ir/decisions.py src/archkeel/check/delta.py src/archkeel/check/expectation.py src/archkeel/render/summary.py src/archkeel/render/html.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
