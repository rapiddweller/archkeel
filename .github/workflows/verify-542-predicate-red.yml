name: Verify native string predicate RED
on:
  push:
    branches: [verify/542-native-string-predicates-red]
permissions:
  contents: read
jobs:
  native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a406745809e214b5ea1896e3beb166fb35f6680b
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Prove the actual observer misses six written grammar decisions
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_string_predicate_observation.py > "$RUNNER_TEMP/predicate-red.log" 2>&1
          task_predicate_status=$?
          cat "$RUNNER_TEMP/predicate-red.log"
          test "$task_predicate_status" -eq 1 || exit 1
          python - <<'PY'
          import os
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "predicate-red.log").read_text()
          assert "6 failed, 5 passed" in log, log[-2000:]
          PY
