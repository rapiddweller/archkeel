name: Verify final receiver carry without writes
on:
  push:
    branches: [verify/542-receivers-final-current-main]
permissions:
  contents: read
jobs:
  receiver-origins:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8f9bbeef7bbd4ed2f4cc0b90787ab957be9a293e
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Exact receiver product tests and formatting
        run: |
          test "$(git rev-parse HEAD)" = "8f9bbeef7bbd4ed2f4cc0b90787ab957be9a293e"
          uv run --locked python -m pytest -q tests/test_typed_python_receivers.py
          uv run --locked ruff format --check src/archkeel/analyzer/python/receiver_types.py src/archkeel/analyzer/python/calls.py src/archkeel/analyzer/python/resolve.py tests/test_typed_python_receivers.py
          uv run --locked ruff check src/archkeel/analyzer/python/receiver_types.py src/archkeel/analyzer/python/calls.py src/archkeel/analyzer/python/resolve.py tests/test_typed_python_receivers.py
      - name: Exact product normal no-write amendment gate
        run: |
          set +e
          uv run --locked python -m tools.against --base 8605b8cef0e764c797aa9ffef2367ae7f5420cb7 > "$RUNNER_TEMP/542-receiver-exact.json"
          native_exit=$?
          uv run --locked python - "$RUNNER_TEMP/542-receiver-exact.json" "$native_exit" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_bytes())
          print("EXACT_PRODUCT_NATIVE=" + json.dumps({"head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "exit_code": int(sys.argv[2]), "diagnostics": result.get("diagnostics"), "failures": result.get("failures"), "measurements": result.get("measurements")}))
          PY
          git diff --exit-code
          exit "$native_exit"
