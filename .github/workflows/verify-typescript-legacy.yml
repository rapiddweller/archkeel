name: TypeScript558 final owned DTO and native gates
on:
  push:
    branches: [verify/issue-542-typescript-legacy-dtos]
permissions:
  contents: read
jobs:
  legacy-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typescript_syntax_compatibility.py tests/test_typescript_syntax_types.py tests/test_typescript_parse.py tests/test_typescript_collect.py tests/test_typescript_decorated_inventory.py tests/test_typescript_inner.py tests/test_typescript_parameter_properties.py tests/test_typescript_control_target.py tests/test_python_source_evidence_lines.py tests/test_repository_hygiene.py
      - run: uv run --locked ruff check src/archkeel/analyzer/typescript tests/test_typescript_syntax_compatibility.py tests/test_typescript_control_target.py
      - run: uv run --locked ruff format --check src/archkeel/analyzer/typescript tests/test_typescript_syntax_compatibility.py tests/test_typescript_control_target.py
      - run: uv run --locked mypy src/archkeel
  native-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Measure the actual final source and normal amendment
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 8ebc1da53b3ac7290f78978d5e69e4f3c59185c3 --amendment docs/architecture/decisions/issue-542-typescript-syntax-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Move TypeScript syntax DTOs to one owned nominal source port, preserve valid direct legacy input through frozen DTO boundaries, decode parser kinds once and guard actual parser, collector and DTO owners without exceptions. Independent authored Target fields retain narrow nominal APIs. Lower calls_unresolved from917 to measured864; no increased limit, allowance or accepted debt.' > "$RUNNER_TEMP/tssyn-legacy-final.json"
          task_status=$?
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"tssyn-legacy-final.json").read_text())
          print("AMENDMENT_RESULT="+json.dumps({key:result.get(key) for key in ("exit_code","amendment_status","failures","diagnostics","measurements")}))
          print("AMENDMENT_JSON="+Path("docs/architecture/decisions/issue-542-typescript-syntax-amendment.json").read_text().replace("\n",""))
          PY
          exit "$task_status"
  compiler-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: uv sync --locked
      - run: make typescript-compiler-check typescript-differential
