name: TypeScript558 legacy DTO syntax owner guard RED
on:
  push:
    branches: [verify/issue-542-typescript-legacy-dtos]
permissions:
  contents: read
jobs:
  legacy-input:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typescript_control_target.py -k 'native_parser_and_protocol_strings and syntax'
      - run: uv run --locked ruff check src/archkeel/analyzer/typescript tests/test_typescript_syntax_compatibility.py
      - run: uv run --locked ruff format --check src/archkeel/analyzer/typescript tests/test_typescript_syntax_compatibility.py
      - run: uv run --locked mypy src/archkeel
