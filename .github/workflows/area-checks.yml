name: Shared area checks

on:
  workflow_call:
    inputs:
      base:
        type: string
        default: ""

permissions:
  contents: read

env:
  ARCHKEEL_CORE_PROFILE: gate

jobs:
  tests:
    name: "Tests: ${{ matrix.area }}"
    strategy:
      fail-fast: false
      matrix:
        area:
          - CLI and core
          - native collectors
          - collectors
          - reports
          - self-check and CI
    runs-on: ubuntu-24.04
    # The native collector suite reached 91% before its 15-minute PR cutoff in run 44550424848.
    timeout-minutes: ${{ inputs.base != '' && (matrix.area == 'native collectors' && 20 || 15) || 40 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select this area
        id: select
        env:
          BASE: ${{ inputs.base }}
          AREA: ${{ matrix.area }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then selected=run; else selected="$(python3 tools/select_areas.py --job "$AREA" "$BASE")"; fi
          echo "$selected"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Install Node
        if: steps.select.outputs.selected == 'run'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install the Dart SDK for the oracle tests
        if: steps.select.outputs.selected == 'run'
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: "3.12.2"

      - name: Install uv and Python
        if: steps.select.outputs.selected == 'run'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install supported runtimes
        if: steps.select.outputs.selected == 'run'
        run: uv python install 3.11.12 3.12.10 3.14.7

      - name: Install locked dependencies
        if: steps.select.outputs.selected == 'run'
        # The Explorer MCP tests (tests/test_explorer_mcp_hostile.py) need the fastmcp extra.
        run: uv sync --locked ${{ matrix.area == 'CLI and core' && '--extra mcp' || '' }}

      - name: Install the pinned Rust toolchain
        if: steps.select.outputs.selected == 'run'
        working-directory: native
        run: rustup toolchain install

      - name: Hash the native tree
        id: native_tree
        if: steps.select.outputs.selected == 'run' && matrix.area == 'native collectors'
        run: echo "hash=${{ hashFiles('native/**', '!native/target/**', 'tools/rustc-facts/**', '!tools/rustc-facts/target/**', '!**/__pycache__/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the core of main for this native tree
        id: core
        if: steps.select.outputs.selected == 'run' && matrix.area == 'native collectors'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/target/CACHEDIR.TAG
            native/target/release/archkeel-core
            native/target/release/archkeel-rust-collector
            native/target/release/archkeel-typescript-collector
            native/target/release/archkeel-core.tree
          key: core-gate-${{ runner.os }}-${{ steps.native_tree.outputs.hash }}

      - name: Restore the Rust build cache of main
        if: steps.select.outputs.selected == 'run' && matrix.area == 'native collectors' && steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-gate-pr-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-
            rust-gate-pr-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-

      # AD-1047: the self-check tests of native/ read compiler facts, so this area needs rustc-dev and llvm-tools.
      - name: Install the compiler type-reach components
        if: steps.select.outputs.selected == 'run' && matrix.area == 'CLI and core'
        run: make type-reach-setup

      # AD-1062: the fixture matrix pins the result of two real projects (FastAPI, bazel_worker).
      # A PR that can change such a result fetches their pinned sources, so no PASS to UNKNOWN
      # change reaches the nightly run unseen. Other PRs and each push to main stay offline.
      - name: Decide whether to fetch the pinned sources of the real projects
        id: fetch
        if: steps.select.outputs.selected == 'run' && matrix.area == 'CLI and core' && inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          decision="$(python3 tools/select_areas.py --fetch "$BASE")"
          case "$decision" in
            fetch | skip) ;;
            *) echo "the selector gave '$decision', not fetch or skip" >&2; exit 1 ;;
          esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned sources of the real projects
        if: steps.fetch.outputs.decision == 'fetch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-artifacts/source-cache
          key: gallery-sources-${{ hashFiles('fixtures/*/SOURCE.json') }}

      # A failed fetch of a pin fails the test with its reason; the test never skips it.
      - name: Allow the fetch of the pinned sources
        if: steps.fetch.outputs.decision == 'fetch'
        run: |
          echo "ARCHKEEL_FETCH_SOURCES=1" >> "$GITHUB_ENV"
          echo "ARCHKEEL_SOURCE_CACHE=$GITHUB_WORKSPACE/test-artifacts/source-cache" >> "$GITHUB_ENV"

      - name: Run the fast tests of this area
        if: steps.select.outputs.selected == 'run'
        env:
          AREA: ${{ matrix.area }}
          ARCHKEEL_NATIVE_TREE: ${{ steps.native_tree.outputs.hash }}
          ARCHKEEL_CORE_SOURCE: ${{ steps.core.outputs.cache-hit == 'true' && 'cache' || 'build' }}
        run: make fast-test AREA="$AREA"

      - name: Name the first failing test in the job summary
        if: failure() && steps.select.outputs.selected == 'run'
        env:
          AREA: ${{ matrix.area }}
        run: >-
          python3 tools/ci_failure_summary.py --job "$AREA"
          --junit test-artifacts/pytest/fast.xml
          --reproduce "make fast-test AREA=\"$AREA\""
          --artifact "pytest-results-fast-$AREA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit results
        if: always() && steps.select.outputs.selected == 'run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-fast-${{ matrix.area }}
          path: test-artifacts/pytest/fast.xml
          if-no-files-found: warn
          retention-days: 7

  native:
    name: "Native: Rust checks and dependency policy"
    runs-on: ubuntu-24.04
    # Main keeps its hang guard. PR checks must finish within the 15-minute target.
    timeout-minutes: ${{ inputs.base != '' && 15 || 30 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select native checks
        id: select
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then selected=run; else selected="$(python3 tools/select_areas.py --job native "$BASE")"; fi
          echo "$selected"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        if: steps.select.outputs.selected == 'run'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install locked dependencies
        if: steps.select.outputs.selected == 'run'
        run: uv sync --locked

      - name: Install the pinned Rust toolchain
        if: steps.select.outputs.selected == 'run'
        working-directory: native
        run: rustup toolchain install

      - name: Install the pinned cargo-deny
        if: steps.select.outputs.selected == 'run'
        run: make cargo-deny-install

      - name: Run native checks
        if: steps.select.outputs.selected == 'run'
        run: make native-check
