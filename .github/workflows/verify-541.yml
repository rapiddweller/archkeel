name: Verify native dependency API
on:
  push:
    branches: [verify/541-native-api-tests]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Focused native source controls
        run: uv run --locked python -m pytest -q tests/test_generic_alias_union_proof.py tests/test_dependency_api_target.py --maxfail=10
      - name: Lint and types
        if: always()
        run: |
          uv run --locked ruff format src/archkeel/analyzer/python/source.py src/archkeel/analyzer/python/imports.py tests/test_dependency_api_target.py tests/test_generic_alias_union_proof.py
          uv run --locked ruff check --fix src/archkeel/analyzer/python/source.py src/archkeel/analyzer/python/imports.py tests/test_dependency_api_target.py tests/test_generic_alias_union_proof.py
          uv run --locked mypy src
      - name: Proof and architecture regressions
        if: always()
        run: uv run --locked python -m pytest -q tests/test_boundary_type_bound_aliases.py tests/test_boundary_types_aliases.py tests/test_callable_boundaries.py tests/test_boundary_type_literals_aliases.py tests/test_boundary_types_chain_proof.py tests/test_repository_hygiene.py tests/test_uml_evaluation.py tests/test_target_graph.py tests/test_dependency_selectors.py tests/test_typed_dependency_api.py --maxfail=4
      - name: Own strict baseline
        if: always()
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > .541-validation.json
          status=$?
          uv run --locked python - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path(".541-validation.json").read_text())
          print(json.dumps({key:data.get(key) for key in ("exit_code","failures","measurements","coverage")},indent=2))
          PY
          exit "$status"
      - name: Formatting evidence
        if: always()
        run: |
          python - <<'PY'
          import base64,pathlib
          for path in ("tests/test_dependency_api_target.py","tests/test_generic_alias_union_proof.py","src/archkeel/analyzer/python/source.py","src/archkeel/analyzer/python/imports.py"):
              print("FILE:"+path+":"+base64.b64encode(pathlib.Path(path).read_bytes()).decode())
          PY
