name: Verify native dependency API
on:
  push:
    branches: [verify/541-native-api-tests]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Focused native source controls
        run: uv run --locked python -m pytest -q tests/test_dependency_api_target.py -k 'not own_native' --maxfail=8
      - name: Lint and types
        if: always()
        run: |
          uv run --locked ruff format tests/test_dependency_api_target.py
          uv run --locked ruff check tests/test_dependency_api_target.py
          uv run --locked mypy src
      - name: Formatting evidence
        if: always()
        run: |
          python - <<'PY'
          import base64,pathlib
          print("TEST_FILE="+base64.b64encode(pathlib.Path("tests/test_dependency_api_target.py").read_bytes()).decode())
          PY
