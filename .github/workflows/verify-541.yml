name: Verify native dependency API
on:
  push:
    branches: [verify/541-native-api-tests]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Strict lint and types
        run: |
          uv run --locked ruff format --check tests/test_dependency_api_target.py
          uv run --locked ruff check tests/test_dependency_api_target.py
          uv run --locked mypy src
      - name: Focused native source controls
        run: uv run --locked python -m pytest -q tests/test_dependency_api_target.py --maxfail=8
      - name: Unchanged own baseline
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > own-validation.json
          native_exit=$?
          python - <<'PY'
          import json
          report=json.load(open("own-validation.json"))
          print(json.dumps(report,ensure_ascii=False))
          PY
          exit "$native_exit"
