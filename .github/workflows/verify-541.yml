name: Diagnose bounded API proof
on:
  push:
    branches: [verify/541-native-api-tests]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv run --locked archkeel report --root . --output .541-observation.json --json
      - name: Inspect native proof limits
        run: |
          uv run --locked python - <<'PY'
          import json,pathlib
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.ir.report_graph import architecture_report
          model=parse_observation(decode_canonical_model(json.loads(pathlib.Path(".541-observation.json").read_text())))
          for row in model.records("unknowns"):
              if any("DEPENDENCY" in key for key in row.rule_ids):
                  print("BOUNDARY_UNKNOWN", row)
          comparison=architecture_report(model).comparison
          for row in comparison.assessments:
              if row.status == "UNKNOWN" and "IR-DEPENDENCY-" in row.subject_id:
                  print("TARGET_UNKNOWN",row)
          PY
