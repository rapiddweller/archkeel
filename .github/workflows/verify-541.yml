name: Inspect alias source proof
on:
  push:
    branches: [verify/541-native-api-tests]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Check vocabulary move
        run: uv run --locked ruff check src/archkeel/ir/model.py src/archkeel/ir/dependency.py
      - run: uv run --locked archkeel report --root . --output .541-observation.json --json > .541-summary.json
      - name: Inspect alias bindings
        run: |
          uv run --locked python - <<'PY'
          import json,pathlib
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          model=parse_observation(decode_canonical_model(json.loads(pathlib.Path(".541-observation.json").read_text())))
          print(pathlib.Path(".541-summary.json").read_text())
          for row in model.records("unknowns"):
              if any("DEPENDENCY" in key for key in row.rule_ids): print("BOUNDARY_UNKNOWN",row)
          for section in ("symbols","imports"):
              for row in model.records(section):
                  if "ComponentOwnership" in str(row.data):
                      print(section,row)
          PY
