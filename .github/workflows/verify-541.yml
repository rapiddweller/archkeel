name: Verify native dependency API
on:
  push:
    branches: [verify/541-native-api-tests]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Focused native source controls
        run: uv run --locked python -m pytest -q tests/test_dependency_api_target.py --maxfail=8
      - name: Lint and types
        if: always()
        run: |
          uv run --locked ruff format tests/test_dependency_api_target.py
          uv run --locked ruff check tests/test_dependency_api_target.py
          uv run --locked mypy src
      - name: Native Target and self regressions
        if: always()
        run: uv run --locked python -m pytest -q tests/test_uml_evaluation.py tests/test_target_graph.py tests/test_uml_comparison.py tests/test_boundary_types_facades.py tests/test_boundary_type_native_iterables.py tests/test_dependency_selectors.py tests/test_typed_dependency_api.py tests/test_repository_hygiene.py --maxfail=4
      - name: Own strict contract
        if: always()
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > .541-validation.json
          status=$?
          python - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path('.541-validation.json').read_text())
          print(json.dumps({key:data.get(key) for key in ('exit_code','failures','unresolved_call_changes','measurement_regressions')},indent=2))
          PY
          exit "$status"
      - name: Formatting evidence
        if: always()
        run: |
          python - <<'PY'
          import base64,pathlib
          print("TEST_FILE="+base64.b64encode(pathlib.Path("tests/test_dependency_api_target.py").read_bytes()).decode())
          PY
