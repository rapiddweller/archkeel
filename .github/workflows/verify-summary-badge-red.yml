name: Verify Summary badge boundary RED
on:
  push:
    branches: [verify/542-summary-badge-red]
permissions:
  contents: read
jobs:
  expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Runtime nominal-state assertion RED on unchanged production
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_summary_badge_types.py -k 'not legacy_summary_exports'
          red_status=$?
          test "$red_status" -eq 1
      - name: Native authored intent assertion RED on unchanged production
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_summary_badge_target.py::test_actual_badge_source_fulfills_authored_types_and_complete_module_guard
          red_status=$?
          test "$red_status" -eq 1
