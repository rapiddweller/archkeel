name: Native TS lexical port Target RED
on:
  push:
    branches: [verify/542-typescript-construct-port-red]
permissions:
  contents: read
jobs:
  port-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual new source type mutations against unchanged current Target
        run: uv run --locked python -m pytest -q tests/test_typescript_control_target.py::test_native_syntax_field_widening_fails_against_fixed_port_intent -k 'StringComparison or tuple' --tb=short
