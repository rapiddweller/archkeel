name: Final bounded Atlas type and native proof
on:
  push:
    branches: [verify/542-atlas-final-native]
permissions:
  contents: read
jobs:
  final-type-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Actual checked consumer and fixed native target controls
        run: |
          make browser-graph-check
          uv run --locked python -m pytest -q tests/test_atlas_deviation_target.py tests/test_atlas_deviation_boundary.py::test_real_deviation_producer_preserves_sorted_wire_order_and_stable_ids tests/test_atlas_deviation_boundary.py::test_actual_deviation_consumer_rejects_type_corruption tests/test_ci_changes.py tests/test_make_gate.py
          make lint typecheck
      - name: Generate reduced baseline and exact ordinary amendment
        run: |
          atlas_baseline_status=0
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --write-baseline --json > "$RUNNER_TEMP/atlas-baseline.json" || atlas_baseline_status=$?
          cat "$RUNNER_TEMP/atlas-baseline.json"
          if [ "$atlas_baseline_status" -ne 0 ]; then exit "$atlas_baseline_status"; fi
          atlas_validation_status=0
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --against 0aee692c767150847089dbcfdcf1765464837ab6 --amendment docs/architecture/decisions/atlas-deviation-types-amendment.json --write-amendment --decided-by ake2l --rationale 'Own immutable recorded Atlas deviations and their deterministic producer, preserve existing wire dictionaries and expose the real checked Scene consumer.' --json > "$RUNNER_TEMP/atlas-against.json" || atlas_validation_status=$?
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          data = json.loads((root / "atlas-against.json").read_bytes())
          keys = ("exit_code","diagnostics","failures","measurements","widenings","unresolved_call_changes","unresolved_call_note")
          print("ATLAS_FINAL_NATIVE=" + json.dumps({key:data.get(key) for key in keys}))
          for marker, name in (("ATLAS_BASELINE=", "architecture-baseline.json"), ("ATLAS_AMENDMENT=", "docs/architecture/decisions/atlas-deviation-types-amendment.json")):
              path = Path(name)
              print(marker + (path.read_text() if path.is_file() else "NOT_WRITTEN"))
          PY
          if [ "$atlas_validation_status" -ne 0 ]; then exit "$atlas_validation_status"; fi
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --against 0aee692c767150847089dbcfdcf1765464837ab6 --amendment docs/architecture/decisions/atlas-deviation-types-amendment.json --json
      - name: Export final authored source and exact generated baseline/receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = ["src/archkeel/render/atlas_deviations.py", "tests/test_atlas_deviation_target.py", "architecture-baseline.json", "docs/architecture/decisions/atlas-deviation-types-amendment.json"]
          print("ATLAS_FINAL_FILES=" + json.dumps({path:Path(path).read_text() for path in paths if Path(path).is_file()}))
          PY
