name: Definition context real source native inventory
on:
  push:
    branches: [verify/542-definition-context-native]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Same current engine observes both authored source revisions
        run: |
          uv run --locked python - <<'PY'
          from dataclasses import asdict
          import gzip,json,time
          from pathlib import Path
          from archkeel.cli.config import parse_config
          from archkeel.cli.observe import observer_for
          from archkeel.check.run import observe_revision,inspect_observation
          from archkeel.ir.codec import observation_payload
          from archkeel.ir.trace import trace_valid_violations
          root=Path.cwd()
          out=root/"context-native"
          out.mkdir(exist_ok=True)
          config=parse_config((root/"archkeel.toml").read_bytes())
          payloads={}
          for label,rev in (("before","b06fd806ae0e76d340cba44eb7b5e84c887384d6"),("after","a79aa22628c7dea56f7bbd89d7d5fe3ef2a6ab4e")):
              start=time.perf_counter()
              result=observe_revision(observer_for(config.language),root,rev,config,declared_at=rev)
              assert result.observation is not None,result.diagnostics
              measurements,status=inspect_observation(result.observation)
              payload=observation_payload(result.observation)
              payloads[label]=payload
              (out/f"{label}.json.gz").write_bytes(gzip.compress(json.dumps(payload,sort_keys=True).encode()))
              print("CONTEXT_NATIVE="+json.dumps(dict(label=label,rev=rev,status=str(status),seconds=time.perf_counter()-start,measurements=asdict(measurements),diagnostics=[str(item) for item in result.diagnostics],trace_violations=[dict(kind=str(r.kind),subjects=r.subjects,data=dict(r.data)) for r in trace_valid_violations(result.observation)])),flush=True)
          print("CONTEXT_UNKNOWN_RAW_EQUAL="+str(payloads["before"]["unknowns"]==payloads["after"]["unknowns"]),flush=True)
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: definition-context-native-records
          path: context-native/*.json.gz
