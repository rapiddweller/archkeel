name: Verify native graph scene final checks
on:
  push:
    branches: [verify/542-native-graph-scene-protocol]
permissions:
  contents: read
jobs:
  final-frozen-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Exact committed artifacts, actual checkJs and authored Target
        run: make browser-graph-check
      - name: Whole existing lint, mypy and repository hygiene
        run: |
          make lint typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  actual-native-source-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - name: Overlay explicit independent observer dependency, never product carrier
        run: |
          git fetch origin cf55d12d5673bbbe0e8999056aba1db3653ed208
          for scene_observer_path in \
            src/archkeel/analyzer/typescript/parse.py \
            src/archkeel/analyzer/typescript/syntax.py \
            src/archkeel/analyzer/typescript/collect.py \
            src/archkeel/ir/profiles.py \
            src/archkeel/ir/codec_observation.py \
            src/archkeel/check/evaluation/evaluate.py; do
            git show "cf55d12d5673bbbe0e8999056aba1db3653ed208:$scene_observer_path" > "$scene_observer_path"
          done
      - run: uv sync --locked
      - name: Actual scene source mutation is observed; capability stays PARTIAL
        run: uv run --locked python -m pytest -q -s prototype/test_graph_scene_native_observer.py

  actual-report-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Decompose actual sample HTML without changing product
        run: uv run --locked python prototype/graph-scene-report-size.py
      - name: Existing report size guard, unchanged
        run: uv run --locked python -m pytest -q tests/test_atlas_report.py::test_default_report_is_one_authentic_repository_with_sparse_native_cells
