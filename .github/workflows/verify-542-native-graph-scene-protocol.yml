name: Actual scene legacy-default parity
on:
  push:
    branches: [verify/542-native-graph-scene-protocol]
permissions:
  contents: read
jobs:
  actual-legacy-default-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Compare actual original and frozen typed source defaults
        run: |
          git show d08dfaf6a2e6992153a434341465306a88d993a2:src/archkeel/render/assets/report-scene.js > "$RUNNER_TEMP/previous-scene.js"
          node prototype/graph-scene-default-parity.cjs "$RUNNER_TEMP/previous-scene.js"
  strict-actual-source-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Check committed canonical artifacts and actual consumer types
        run: |
          make browser-graph-check
      - run: make browser-install
      - name: Actual compiler mutations, ingress, original graph and existing scene/layout
        run: uv run --locked --with playwright==1.62.0 python -m pytest -q --basetemp "$RUNNER_TEMP/scene-tests" tests/test_graph_scene_protocol.py tests/test_report_renderer_units.py
      - name: Same actual own graph before and after performance and wire parity
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          from archkeel.ir.graph_codec import report_bytes
          from archkeel.ir.report_graph import architecture_report
          root = Path(os.environ["RUNNER_TEMP"])
          artifact = root / "scene-tests/self-report/architecture.json"
          observation = parse_observation(decode_canonical_model(json.loads(artifact.read_bytes())))
          (root / "scene-perf.json").write_bytes(report_bytes(architecture_report(observation)))
          PY
          git show d08dfaf6a2e6992153a434341465306a88d993a2:src/archkeel/render/assets/report-scene.js > "$RUNNER_TEMP/previous-scene.js"
          node prototype/graph-scene-timing.cjs "$RUNNER_TEMP/scene-perf.json" "$RUNNER_TEMP/previous-scene.js"
      - name: Native Python checks and hygiene
        run: |
          make lint typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
      - name: Export final formatting
        if: always()
        run: |
          uv run --locked ruff format tools/browser_graph_protocol.py tests/test_graph_scene_protocol.py tests/test_report_renderer_units.py tests/smoke_test.py
          uv run --locked ruff check --fix tools/browser_graph_protocol.py tests/test_graph_scene_protocol.py tests/smoke_test.py
          python - <<'PY'
          import json
          from pathlib import Path
          paths = ["tools/browser_graph_protocol.py", "tests/test_graph_scene_protocol.py", "tests/test_report_renderer_units.py", "tests/smoke_test.py", "src/archkeel/render/assets/report-graph-protocol.js", "src/archkeel/render/assets/report-graph-vocabulary.ts"]
          print("SCENE_ARTIFACTS=" + json.dumps({path: Path(path).read_text() for path in paths}))
          PY
  actual-native-source-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - name: Overlay explicit independent observer dependency, never product carrier
        run: |
          git fetch origin ccd28126663a6ed11891d6d512b4f95c263c8ddc
          for scene_observer_path in \
            src/archkeel/analyzer/typescript/parse.py \
            src/archkeel/analyzer/typescript/syntax.py \
            src/archkeel/analyzer/typescript/collect.py \
            src/archkeel/ir/profiles.py \
            src/archkeel/ir/codec_observation.py \
            src/archkeel/check/evaluation/evaluate.py; do
            git show "ccd28126663a6ed11891d6d512b4f95c263c8ddc:$scene_observer_path" > "$scene_observer_path"
          done
      - run: uv sync --locked
      - name: Actual scene source mutation is observed; capability stays PARTIAL
        run: uv run --locked python -m pytest -q -s prototype/test_graph_scene_native_observer.py
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - run: make browser-install
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: |
          make browser-graph-check
      - name: Actual native graph, routes, filters and Mermaid consumers
        run: |
          uv run --locked --with playwright==1.62.0 python -m pytest -q \
            tests/test_own_uml_target.py::test_own_type_dependencies_have_visible_endpoints_and_connected_focus \
            tests/test_own_uml_target.py::test_member_previews_do_not_squeeze_the_overview_or_change_its_evidence \
            tests/test_own_uml_target.py::test_own_class_overview_keeps_distinct_routes_and_type_cues \
            tests/test_uml_rendering.py::test_keyboard_drilldown_and_view_roundtrip_keep_the_source_scope \
            tests/test_uml_rendering.py::test_source_scope_retains_unresolved_calls_and_parameter_kinds \
            tests/test_uml_rendering.py::test_static_members_are_underlined_in_previews_and_drilldown \
            tests/test_atlas_report.py::test_offline_module_drilldown_reaches_native_classifiers_and_returns \
            tests/test_atlas_report.py::test_offline_scope_url_history_matches_direct_classifier_and_members \
            tests/test_atlas_report.py::test_atlas_browser_keeps_positions_and_unknown_cells_across_lenses
