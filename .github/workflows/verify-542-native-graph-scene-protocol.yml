name: Verify native graph scene final checks
on:
  push:
    branches: [verify/542-native-graph-scene-protocol]
permissions:
  contents: read
jobs:
  final-frozen-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Exact committed artifacts, actual checkJs and authored Target
        run: |
          make browser-graph-generate
          make browser-graph-check
      - name: Whole existing lint, mypy and repository hygiene
        run: |
          make lint typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
      - name: Export actual generated artifacts
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = ["src/archkeel/render/assets/report-graph-vocabulary.ts", "src/archkeel/render/assets/report-graph-protocol.js"]
          print("SCENE_ARTIFACTS=" + json.dumps({path: Path(path).read_text() for path in paths}))
          PY
