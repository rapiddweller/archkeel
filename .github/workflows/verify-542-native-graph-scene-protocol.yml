name: Verify native graph scene protocol
on:
  push:
    branches: [verify/542-native-graph-scene-protocol]
permissions:
  contents: read
jobs:
  graph-scene-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - run: make browser-install
      - name: Actual scene ingress behavior
        run: uv run --locked --with playwright==1.62.0 python -m pytest -q tests/test_graph_scene_protocol.py
