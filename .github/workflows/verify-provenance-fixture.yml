name: Verify complete actual contract provenance fixture
on:
  push:
    branches: [verify/542-provenance-fixture]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ab5af9f9d68703d79688ec7327d58d43dafa72ea
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_validation.py::test_an_inside_may_not_grant_what_requires_never_named
      - run: uv run --locked ruff check tests/test_validation.py
      - run: uv run --locked ruff format tests/test_validation.py --check
      - run: git diff --exit-code
