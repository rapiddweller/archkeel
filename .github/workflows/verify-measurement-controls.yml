name: Verify nominal measurement controls
on:
  push:
    branches: [fix/issue-542-measurement-controls]
permissions:
  contents: read
jobs:
  measurement-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_typed_measurement_controls.py --tb=short
  measurement-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: |
          uv run --locked ruff check --select I --fix src/archkeel/ir/measurements.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/ratchets.py src/archkeel/check/validation/__init__.py src/archkeel/ir/interfaces.py src/archkeel/render/summary.py tests/test_typed_measurement_controls.py
          uv run --locked ruff format src/archkeel/ir/measurements.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/ratchets.py src/archkeel/check/validation/__init__.py src/archkeel/ir/interfaces.py src/archkeel/render/summary.py tests/test_typed_measurement_controls.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","src","tests/test_typed_measurement_controls.py"])).decode())
          PY
          uv run --locked ruff check src/archkeel/ir/measurements.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/ratchets.py src/archkeel/check/validation/__init__.py src/archkeel/ir/interfaces.py src/archkeel/render/summary.py tests/test_typed_measurement_controls.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  measurement-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_measurement_budgets.py tests/test_ratchets.py tests/test_nullable_profile_measurements.py tests/test_facade_budgets.py tests/test_bound_amendments.py tests/test_unresolved_call_sites.py tests/test_contract_model.py tests/test_accepted_lock.py tests/test_summary_badge_types.py tests/test_summary_badge_target.py --tb=short
