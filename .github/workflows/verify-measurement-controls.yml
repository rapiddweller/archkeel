name: Verify nominal measurement controls
on:
  push:
    branches: [fix/issue-542-measurement-controls]
permissions:
  contents: read
jobs:
  measurement-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_typed_measurement_controls.py --tb=short
  measurement-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: |
          uv run --locked ruff check --select I --fix src/archkeel/ir/measurements.py src/archkeel/ir/widening.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/ratchets.py src/archkeel/check/validation/__init__.py src/archkeel/ir/interfaces.py src/archkeel/render/summary.py src/archkeel/render/html.py src/archkeel/check/evaluation/rules.py src/archkeel/check/validation/public_api.py tests/test_typed_measurement_controls.py
          uv run --locked ruff format src/archkeel/ir/measurements.py src/archkeel/ir/widening.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/ratchets.py src/archkeel/check/validation/__init__.py src/archkeel/ir/interfaces.py src/archkeel/render/summary.py src/archkeel/render/html.py src/archkeel/check/evaluation/rules.py src/archkeel/check/validation/public_api.py tests/test_typed_measurement_controls.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","src","tests/test_typed_measurement_controls.py"])).decode())
          PY
          uv run --locked ruff check src/archkeel/ir/measurements.py src/archkeel/ir/widening.py src/archkeel/ir/codec_governance.py src/archkeel/ir/model.py src/archkeel/check/ratchets.py src/archkeel/check/validation/__init__.py src/archkeel/ir/interfaces.py src/archkeel/render/summary.py src/archkeel/render/html.py src/archkeel/check/evaluation/rules.py src/archkeel/check/validation/public_api.py tests/test_typed_measurement_controls.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  measurement-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_measurement_budgets.py tests/test_ratchets.py tests/test_nullable_profile_measurements.py tests/test_facade_budgets.py tests/test_bound_amendments.py tests/test_unresolved_call_sites.py tests/test_contract_model.py tests/test_git_lock.py tests/test_lock_diagnostics.py tests/test_baseline.py tests/test_summary_badge_types.py tests/test_summary_badge_target.py tests/test_terminal.py tests/test_html_report.py --tb=short

  measurement-own-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - name: Validate exact existing baseline and generate the normal owned receipt
        run: |
          git diff --exit-code 3dd2efdc54ef99f2b4cb742f3194cfd1f2619a84 -- architecture-baseline.json schema src/archkeel/ir/decisions.py src/archkeel/ir/facts_codec.py
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 3dd2efdc54ef99f2b4cb742f3194cfd1f2619a84 --amendment docs/architecture/decisions/issue-542-measurement-controls-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Own measurement budget names availability and metric comparison outcomes at their existing DTO and codec boundaries; preserve legacy bytes errors profile capabilities and all budgets; docs/architecture/measurement-control-types.md.' > "$RUNNER_TEMP/measurement-native.json"
          native_status=$?
          set -e
          python - "$RUNNER_TEMP/measurement-native.json" <<'PY'
          import json,pathlib,sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("MEASUREMENT_NATIVE="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          path=pathlib.Path("docs/architecture/decisions/issue-542-measurement-controls-amendment.json")
          if path.exists(): print("MEASUREMENT_RECEIPT="+json.dumps(json.loads(path.read_text()),separators=(",",":")))
          PY
          exit "$native_status"
  measurement-site-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Compare actual type and call sites with multiplicity and targets
        run: |
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/amend-after.json" > "$RUNNER_TEMP/amend-after-result.json"
          git worktree add --detach "$RUNNER_TEMP/amend-before" 3dd2efdc54ef99f2b4cb742f3194cfd1f2619a84
          uv run --locked archkeel report --root "$RUNNER_TEMP/amend-before" --output "$RUNNER_TEMP/amend-before.json" > "$RUNNER_TEMP/amend-before-result.json"
          uv run --locked python - "$RUNNER_TEMP/amend-before.json" "$RUNNER_TEMP/amend-after.json" "$RUNNER_TEMP/amend-before" . <<'PY'
          import ast,json,pathlib,re,sys
          from collections import Counter
          from archkeel.ir.codec import decode_canonical_model,parse_observation
          from archkeel.check.ratchets import unknown_positions_by_rule,call_rows
          from archkeel.ir.decisions import _unknown_evidence_and_counts
          from archkeel.ir.codec_wire import _raw_value
          def read(path): return parse_observation(decode_canonical_model(json.loads(pathlib.Path(path).read_text())))
          before,after=(read(path) for path in sys.argv[1:3])
          before_root,after_root=(pathlib.Path(path) for path in sys.argv[3:5])
          def types(model):
              return {row.id:{"id":row.id,"kind":row.kind,"rule_ids":row.rule_ids,**{key:row.data.get(key) for key in ("qualified_name","position","path","annotation","nested_annotation","reason")}} for row in model.records("unknowns") or () if row.kind in {"boundary_type_position","boundary_type_route"}}
          def calls(model,source_root):
              asts={}
              def call_ast(site,expression):
                  if site.file not in asts:
                      index={}
                      for node in ast.walk(ast.parse((source_root/site.file).read_text())):
                          if isinstance(node,ast.Call):
                              key=(node.lineno,node.col_offset,ast.unparse(node.func))
                              index.setdefault(key,[]).append(ast.dump(node,include_attributes=False))
                      asts[site.file]=index
                  index=asts[site.file]
                  matches=(index.get((site.line,site.column,expression),[]) if site.column is not None else [value for (line,column,name),values in index.items() if line==site.line and name==expression for value in values])
                  assert len(matches)==1,(site,expression,matches)
                  return matches[0]
              evidence={row.id:row for row in model.evidence}
              result={}
              for row in model.records("calls") or ():
                  data=row.data
                  status=data.get("status")
                  if status not in {"unresolved","partially_resolved"}: continue
                  sites=[evidence[identity] for identity in row.evidence_ids if identity in evidence]
                  assert len(sites)==1
                  site=sites[0]
                  caller=re.sub(r"<(genexpr|listcomp|dictcomp|setcomp):[0-9]+:[0-9]+>",r"<\1>",str(data.get("source_scope")))
                  key=(status,site.file,caller,data.get("expression"))
                  result.setdefault(key,[]).append({"record_id":row.id,"status":status,"path":site.file,"line":site.line,"caller":caller,"expression":data.get("expression"),"reason":data.get("reason"),"targets":_raw_value(data.get("targets")),"candidate_count":data.get("candidate_count"),"call_ast":call_ast(site,data.get("expression"))})
              assert sum(len(rows) for rows in result.values())==len(call_rows(model))
              return result
          def selected(model):
              return {rule:[{"id":row.id,"kind":row.kind,"subjects":row.subjects,"rule_ids":row.rule_ids,"data":_raw_value(row.data)} for row in records] for rule,records in _unknown_evidence_and_counts(model)[2].items()}
          old_selected,new_selected=selected(before),selected(after)
          print("MEASUREMENT_ALL_UNKNOWN="+json.dumps({"before":old_selected,"after":new_selected},separators=(",",":")))
          old,new=types(before),types(after)
          old_calls,new_calls=calls(before,before_root),calls(after,after_root)
          added=[{"before":old_calls.get(key,[]),"after":new_calls[key]} for key in new_calls if len(new_calls[key])>len(old_calls.get(key,[]))]
          removed=[{"before":old_calls[key],"after":new_calls.get(key,[])} for key in old_calls if len(old_calls[key])>len(new_calls.get(key,[]))]
          def payload(row):
              return json.dumps({key:row[key] for key in ("status","expression","reason","targets","candidate_count","call_ast")},sort_keys=True)
          new_debt=[]
          removed_debt=[]
          target_changed=[]
          for key in old_calls.keys()|new_calls.keys():
              old_rows,new_rows=old_calls.get(key,[]),new_calls.get(key,[])
              old_counts,new_counts=Counter(map(payload,old_rows)),Counter(map(payload,new_rows))
              positive=new_counts-old_counts
              negative=old_counts-new_counts
              if positive:
                  new_debt.append({"key":key,"added_payload_counts":dict(positive),"before":old_rows,"after":new_rows})
              if negative:
                  removed_debt.append({"key":key,"removed_payload_counts":dict(negative),"before":old_rows,"after":new_rows})
              common_asts={row["call_ast"] for row in old_rows}&{row["call_ast"] for row in new_rows}
              for expression_ast in common_asts:
                  old_targets={json.dumps(row["targets"],sort_keys=True) for row in old_rows if row["call_ast"]==expression_ast}
                  new_targets={json.dumps(row["targets"],sort_keys=True) for row in new_rows if row["call_ast"]==expression_ast}
                  if old_targets!=new_targets:
                      target_changed.append({"key":key,"call_ast":expression_ast,"before":sorted(old_targets),"after":sorted(new_targets)})
          unknown_changes=[]
          for rule in old_selected.keys()|new_selected.keys():
              old_rows={row["id"]:row for row in old_selected.get(rule,[])}
              new_rows={row["id"]:row for row in new_selected.get(rule,[])}
              unknown_changes.extend({"rule":rule,"id":identity,"before":old_rows.get(identity),"after":new_rows.get(identity)} for identity in old_rows.keys()|new_rows.keys() if old_rows.get(identity)!=new_rows.get(identity))
          print("MEASUREMENT_ALL_UNKNOWN_PROOF="+json.dumps({"before_ref":"3dd2efdc54ef99f2b4cb742f3194cfd1f2619a84","before_counts":unknown_positions_by_rule(before),"after_counts":unknown_positions_by_rule(after),"changed_selected_records":unknown_changes,"selected_record_counts":{rule:len(rows) for rule,rows in new_selected.items()}},separators=(",",":")))
          assert not unknown_changes
          summary={"before_ref":"3dd2efdc54ef99f2b4cb742f3194cfd1f2619a84","before_unknown":unknown_positions_by_rule(before),"after_unknown":unknown_positions_by_rule(after),"new_type_positions":[new[key] for key in sorted(new.keys()-old.keys())],"removed_type_positions":[old[key] for key in sorted(old.keys()-new.keys())],"changed_type_positions":[{"before":old[key],"after":new[key]} for key in sorted(old.keys()&new.keys()) if old[key]!=new[key]],"added_call_sites":added,"removed_call_sites":removed,"changed_call_targets":target_changed,"new_or_changed_debt":new_debt,"removed_debt":removed_debt,"before_unresolved":before.coverage.calls_unresolved,"after_unresolved":after.coverage.calls_unresolved,"before_partial":before.coverage.calls_partially_resolved,"after_partial":after.coverage.calls_partially_resolved}
          print("MEASUREMENT_SITE_EVIDENCE="+json.dumps(summary,separators=(",",":")))
          assert not summary["new_type_positions"]
          assert not new_debt
          assert not target_changed
          PY
