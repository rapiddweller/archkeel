name: Verify nominal measurement controls
on:
  push:
    branches: [fix/issue-542-measurement-controls]
permissions:
  contents: read
jobs:
  measurement-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_typed_measurement_controls.py --tb=short
