name: Definition context native RED
on:
  push:
    branches: [verify/542-definition-context-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Real native field probes and unchanged conditional controls
        run: uv run --locked python -m pytest -q tests/test_definition_context_types.py tests/test_conditional_definitions.py --tb=short
