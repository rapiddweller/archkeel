name: Read-only browser control domain inventory
on:
  push:
    branches: [verify/542-browser-control-inventory]
permissions:
  contents: read
jobs:
  actual-authored-browser-ast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: npm ci --prefix tools/browser-runtime --ignore-scripts --no-audit --no-fund
      - run: node browser-control-inventory.cjs
