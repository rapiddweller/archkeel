name: PermissionStatus focused GREEN
on:
  push:
    branches: [verify/542-permission-status-green]
permissions:
  contents: read
jobs:
  actual-permission-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Actual producer, legacy ingress and independent native mutations
        run: |
          uv run --locked ruff format src/archkeel/ir/architecture_projection.py src/archkeel/ir/report_projection.py src/archkeel/render/atlas.py src/archkeel/ir/command_view.py tests/test_permission_status_types.py
          uv run --locked python -m pytest -q tests/test_permission_status_types.py tests/test_architecture_projection.py tests/test_atlas_deviation_target.py tests/test_core_command_result.py
          make lint typecheck
      - name: Export exact authored source
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = ["src/archkeel/ir/architecture_projection.py","src/archkeel/ir/report_projection.py","src/archkeel/render/atlas.py","src/archkeel/ir/command_view.py","tests/test_permission_status_types.py"]
          print("PERMISSION_GREEN_FILES=" + json.dumps({p:Path(p).read_text() for p in paths}))
          PY
