name: Dart nominal implementation proof
on:
  push:
    branches: [verify/542-dart-green]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Format diagnostics
        run: |
          uv run --locked ruff check src/archkeel/analyzer/dart tests/test_dart_typed_controls.py tests/test_dart_target.py --fix || true
          uv run --locked ruff format src/archkeel/analyzer/dart tests/test_dart_typed_controls.py tests/test_dart_target.py
          git diff --binary | python -c 'import base64,sys; print("DART_FORMAT_PATCH="+base64.b64encode(sys.stdin.buffer.read()).decode())'
      - name: Static type checks
        if: ${{ always() }}
        run: uv run --locked mypy src/archkeel
      - name: Dart native and behavior checks
        if: ${{ always() }}
        run: uv run --locked python -m pytest -q tests/test_dart_parse.py tests/test_dart_snapshot.py tests/test_dart_resolve.py tests/test_dart_typed_controls.py tests/test_dart_directives.py tests/test_dart_false_positives.py tests/test_dart_inner_collect.py tests/test_dart_partial_uml.py tests/test_dart_rules.py tests/test_dart_sdk_free.py tests/test_dart_target.py tests/test_dart_unknowns.py tests/test_dart_uml_acceptance.py tests/test_dart_demo.py --tb=short
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Native self-observation and exact measurements
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/task-dart-native.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib
          value = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "task-dart-native.json").read_text())
          print("DART_NATIVE_RESULT=" + json.dumps({key: value.get(key) for key in ("exit_code", "failures", "diagnostics", "measurements")}))
          PY
          exit "$task_status"
      - name: Repository hygiene
        if: ${{ always() }}
        run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py
