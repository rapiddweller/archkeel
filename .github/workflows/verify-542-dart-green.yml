name: Dart nominal implementation proof
on:
  push:
    branches: [verify/542-dart-green]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Format diagnostics
        run: |
          uv run --locked ruff check src/archkeel/analyzer/dart tests/test_dart_typed_controls.py tests/test_dart_target.py --fix || true
          uv run --locked ruff format src/archkeel/analyzer/dart tests/test_dart_typed_controls.py tests/test_dart_target.py
          git diff --binary | python -c 'import base64,sys; print("DART_FORMAT_PATCH="+base64.b64encode(sys.stdin.buffer.read()).decode())'
          uv run --locked ruff check src/archkeel/analyzer/dart tests/test_dart_typed_controls.py tests/test_dart_target.py
      - name: Static type checks
        if: ${{ always() }}
        run: uv run --locked mypy src/archkeel
      - name: Dart native and behavior checks
        if: ${{ always() }}
        run: uv run --locked python -m pytest -q tests/test_dart_parse.py tests/test_dart_snapshot.py tests/test_dart_resolve.py tests/test_dart_typed_controls.py tests/test_dart_directives.py tests/test_dart_false_positives.py tests/test_dart_inner_collect.py tests/test_dart_partial_uml.py tests/test_dart_rules.py tests/test_dart_sdk_free.py tests/test_dart_target.py tests/test_dart_unknowns.py tests/test_dart_uml_acceptance.py tests/test_dart_demo.py --tb=short
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Native self-observation and exact measurements
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/task-dart-native.json"
          task_status=$?
          python - <<'PY'
          import json, os, pathlib
          value = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "task-dart-native.json").read_text())
          print("DART_NATIVE_RESULT=" + json.dumps({key: value.get(key) for key in ("exit_code", "failures", "diagnostics", "measurements")}))
          PY
          exit "$task_status"
      - name: Repository hygiene
        if: ${{ always() }}
        run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py
      - name: Compare every Compass syntax projection with the original parser
        if: ${{ always() }}
        run: |
          git show 508a1efc2af284a1f98362db66bf01f9513486fc:src/archkeel/analyzer/dart/parse.py > "$RUNNER_TEMP/task-original-dart-parse.py"
          uv run --locked python - <<'PY'
          import importlib.util, json, os, pathlib, statistics, sys, time
          from dataclasses import asdict
          from archkeel.analyzer.dart.parse import parse
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "task-original-dart-parse.py"
          spec = importlib.util.spec_from_file_location("task_original_dart", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          samples = [(path, path.read_bytes()) for path in sorted(pathlib.Path("fixtures/J-compass/lib").rglob("*.dart"))]
          for path, data in samples:
              before = json.dumps(asdict(module.parse(data)), sort_keys=True)
              after = json.dumps(asdict(parse(data)), sort_keys=True)
              assert before == after, path
          print("DART_SYNTAX_DIFFERENTIAL=" + str(len(samples)) + " identical Compass projections")
          timings = {}
          for name, parser in (("original", module.parse), ("nominal", parse)):
              batches = []
              for _ in range(5):
                  start = time.perf_counter()
                  for _, data in samples:
                      parser(data)
                  batches.append(time.perf_counter() - start)
              timings[name] = statistics.median(batches)
          print("DART_PARSER_TIMING=" + json.dumps(timings))
          PY
