name: Contract rule grammar verification
on:
  push:
    branches: [aux/issue-542-contract-rule-grammar]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Format and export changed sources
        run: |
          uv run --locked ruff format src/archkeel/ir/model.py src/archkeel/ir/codec_contract.py src/archkeel/ir/codec_wire.py src/archkeel/ir/decisions.py src/archkeel/check/evaluation/rules.py tests/test_typed_contract_rule_grammar.py tests/test_typed_contract_rule_native.py src/archkeel/check/onboarding.py src/archkeel/check/declarations.py src/archkeel/ir/widening.py
          uv run --locked ruff check --fix src/archkeel/ir/model.py src/archkeel/ir/codec_contract.py src/archkeel/ir/codec_wire.py src/archkeel/ir/decisions.py src/archkeel/check/evaluation/rules.py tests/test_typed_contract_rule_grammar.py tests/test_typed_contract_rule_native.py src/archkeel/check/onboarding.py src/archkeel/check/declarations.py src/archkeel/ir/widening.py
          uv run --locked ruff format src/archkeel/ir/model.py src/archkeel/ir/codec_contract.py src/archkeel/ir/codec_wire.py src/archkeel/ir/decisions.py src/archkeel/check/evaluation/rules.py tests/test_typed_contract_rule_grammar.py tests/test_typed_contract_rule_native.py src/archkeel/check/onboarding.py src/archkeel/check/declarations.py src/archkeel/ir/widening.py
          uv run --locked python - <<'PY'
          import json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          print("FORMATTED_RULE_FILES", json.dumps({p: Path(p).read_text() for p in paths if p.endswith(".py")}))
          PY
      - run: make lint typecheck
      - run: uv run --locked python -m pytest -q tests/test_repository_hygiene.py
  grammar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - run: uv run --locked ruff format src/archkeel/ir/model.py src/archkeel/ir/codec_contract.py src/archkeel/ir/codec_wire.py src/archkeel/ir/decisions.py src/archkeel/check/evaluation/rules.py tests/test_typed_contract_rule_grammar.py tests/test_typed_contract_rule_native.py src/archkeel/check/onboarding.py src/archkeel/check/declarations.py src/archkeel/ir/widening.py
      - name: Contract rule and native behavior
        run: uv run --locked python -m pytest -q tests/test_typed_contract_rule_grammar.py tests/test_typed_contract_rule_native.py
      - name: Diagnose native fixture without hiding refusal
        if: failure()
        run: |
          uv run --locked python - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,str(Path("tests").resolve()))
          from test_typed_contract_rule_native import _repository, _contract
          from archkeel.ir.codec import parse_contract
          parse_contract(_contract())
          from archkeel.check.report import run_report
          from archkeel.cli.observe import observe
          root,config=_repository(Path(tempfile.mkdtemp()))
          result,encoded=run_report(root,config=config,analyzer=observe)
          print("FIXTURE_DIAGNOSTICS",result.diagnostics)
          PY
  existing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - run: |
          uv run --locked python -m pytest -q tests/test_contract_model.py tests/test_contract_version_types.py tests/test_typed_graph_vocabulary.py tests/test_dependency_selectors.py tests/test_boundary_alias_contract.py tests/test_boundary_type_nested_mapping.py tests/test_typed_collector_protocol.py tests/test_typed_collector_native.py tests/test_compatibility.py tests/test_cycle_levels.py tests/test_onboarding.py tests/test_onboarding_guidance.py
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Strict actual own baseline and normal amendment
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/grammar-own.json"
          status=$?
          set -e
          uv run --locked python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"grammar-own.json").read_text())
          print("GRAMMAR_OWN",json.dumps(result))
          PY
          exit "$status"
