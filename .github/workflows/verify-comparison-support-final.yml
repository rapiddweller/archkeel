name: Verify frozen shared comparison support API contract
on:
  push:
    branches: [verify/issue-542-comparison-support-final]
permissions:
  contents: read
jobs:
  exact-source-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - name: Prove exact production and native source already exercised by the full gates
        run: |
          git diff --exit-code 3f3f8eea06b5418eedf8bc50d642f4d2a0b05a2e -- src schema architecture-baseline.json architecture-contract.json docs/architecture/contracts Makefile
          git diff --exit-code 6452149d33186dc56d78f7072d73b5dbb988d35a -- tests ':!tests/test_comparison_support_types.py'
          git diff --exit-code 6452149d33186dc56d78f7072d73b5dbb988d35a -- architecture-baseline.json schema src/archkeel/ir/facts_codec.py
          printf 'EXACT_COMPARISON_SUPPORT_SOURCE=4578b47ed0610dad6c35e1f688b7eaca297e195c\n'
          uv run --locked python -m pytest -q tests/test_comparison_support_types.py --tb=short
  strict-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: |
          uv run --locked ruff check tests/test_comparison_support_types.py src/archkeel/ir/model.py src/archkeel/ir/codec_delta.py src/archkeel/ir/bindings.py src/archkeel/ir/references.py src/archkeel/ir/type_fanin.py src/archkeel/ir/structure.py src/archkeel/ir/duplication.py src/archkeel/ir/decisions.py src/archkeel/check/delta.py src/archkeel/check/expectation.py src/archkeel/render/summary.py src/archkeel/render/html.py
          uv run --locked ruff format --check tests/test_comparison_support_types.py src/archkeel/ir/model.py src/archkeel/ir/codec_delta.py src/archkeel/ir/bindings.py src/archkeel/ir/references.py src/archkeel/ir/type_fanin.py src/archkeel/ir/structure.py src/archkeel/ir/duplication.py src/archkeel/ir/decisions.py src/archkeel/check/delta.py src/archkeel/check/expectation.py src/archkeel/render/summary.py src/archkeel/render/html.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
          git diff --exit-code
  no-write-amendment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - name: Validate committed normal receipt without any writer
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against 6452149d33186dc56d78f7072d73b5dbb988d35a --amendment docs/architecture/decisions/issue-542-comparison-support-amendment.json > "$RUNNER_TEMP/comparison-support-no-write.json"
          native_status=$?
          set -e
          python - "$RUNNER_TEMP/comparison-support-no-write.json" <<'PY'
          import json,pathlib,sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("COMPARISON_SUPPORT_NO_WRITE="+json.dumps({key:value.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          assert value["exit_code"]==0 and value["amendment_status"]=="valid"
          assert not value["failures"] and not value["diagnostics"]
          PY
          git diff --exit-code
          exit "$native_status"
