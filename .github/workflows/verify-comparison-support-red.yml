name: Shared comparison support actual boundary RED
on:
  push:
    branches: [fix/issue-542-comparison-support-api]
permissions:
  contents: read
jobs:
  actual-boundary-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual fixture producers and real decision reversion controls on unchanged production
        run: uv run --locked python -m pytest -q tests/test_comparison_support_types.py -k 'actual_claim_producers or actual_invariant_and_decoder or existing_model_owns' --tb=short
