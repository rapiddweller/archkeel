name: Actual Atlas deviation boundary RED
on:
  push:
    branches: [verify/542-atlas-deviation-red]
permissions:
  contents: read
jobs:
  actual-deviation-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - run: make browser-install
      - name: Actual public ingress and independent native value intent
        run: |
          uv run --locked --with playwright==1.62.0 python -m pytest -q -s tests/test_atlas_deviation_boundary.py tests/test_atlas_deviation_target.py
      - name: Format only authored new tests for the next carrier
        if: always()
        run: |
          uv run --locked ruff format tests/test_atlas_deviation_boundary.py tests/test_atlas_deviation_target.py
          python - <<'PY'
          import json
          from pathlib import Path
          paths = ["tests/test_atlas_deviation_boundary.py", "tests/test_atlas_deviation_target.py"]
          print("ATLAS_RED_TEST_FILES=" + json.dumps({path: Path(path).read_text() for path in paths}))
          PY
