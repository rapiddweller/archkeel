name: Exact TypeScript literal-wrapper completion gates
on:
  push:
    branches: [verify/542-typescript-literal-wrappers-final]
permissions:
  contents: read
jobs:
  native-actual-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 11173d0125f0e70b6ef592ae7eec70ec37665e73
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual prior and final sources with the final engine
        run: |
          git worktree add --detach "$RUNNER_TEMP/ts-input-before" a25c37c564c82c1b42457f0528c931c769ee9362
          uv run --locked archkeel report --root "$RUNNER_TEMP/ts-input-before" --output "$RUNNER_TEMP/ts-input-before.json" > "$RUNNER_TEMP/ts-input-before.stdout" || { task_status=$?; cat "$RUNNER_TEMP/ts-input-before.stdout"; exit "$task_status"; }
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/ts-input-after.json" > "$RUNNER_TEMP/ts-input-after.stdout" || { task_status=$?; cat "$RUNNER_TEMP/ts-input-after.stdout"; exit "$task_status"; }
          uv run --locked python - <<'PY'
          import ast,collections,dataclasses,gzip,hashlib,json,os,re,subprocess
          from pathlib import Path
          from archkeel.check.ratchets import call_rows,measure_python_ratchets,unresolved_call_changes
          from archkeel.ir.codec import decode_canonical_model,parse_observation,value_bytes
          from archkeel.ir.decisions import rule_uncertainty_evidence,rule_assessments
          from archkeel.ir.trace import trace_valid_violations
          from archkeel.ir.references import unreferenced_symbols
          
          temporary=Path(os.environ["RUNNER_TEMP"])
          directory=temporary/"ts-input-native-proof"
          directory.mkdir(exist_ok=True)
          basis="a25c37c564c82c1b42457f0528c931c769ee9362"
          models={label:parse_observation(decode_canonical_model(json.loads((temporary/("ts-input-"+label+".json")).read_bytes()))) for label in ("before","after")}
          def emit(marker,value): print(marker+"="+json.dumps(value,sort_keys=True),flush=True)
          def fingerprint(model):
              values={kind:collections.Counter() for kind in ("positions","routes","other")}
              for rule,uncertainty in rule_uncertainty_evidence(model).items():
                  for record in uncertainty.evidence:
                      row={"rule":rule,"id":record.id,"kind":record.kind,"data":json.loads(value_bytes(record.data))}
                      kind=None
                      if record.kind=="boundary_type_position":
                          if record.data.get("reason")!="external_type": kind="positions"
                      elif record.kind=="boundary_type_route": kind="routes"
                      elif record.kind!="boundary_type_limit": kind="other"
                      if kind: values[kind][json.dumps(row,sort_keys=True)]+=1
              return values
          fp={label:fingerprint(model) for label,model in models.items()}
          after_rules=rule_assessments(models["after"],undecided_by_rule={})
          guards=[row for row in after_rules if row.kind=="forbidden_construct" and ("TARGET-TYPESCRIPT-" in row.id or row.id.startswith("DART-"))]
          emit("ACTUAL_ACTIVATION_GUARDS",{"count":len(guards),"rows":[dataclasses.asdict(row) for row in guards]})
          assert len(guards)==11,guards
          assert all(row.status=="PASS" and row.evaluation_proven for row in guards),guards
          for label,model in models.items():
              measured=measure_python_ratchets(model)
              call_rows(model)
              emit("NATIVE_SNAPSHOT",{"label":label,"head":model.source.git_head,"digest":model.source.source_digest,"scalars":dict(measured.scalars.items()),"calls_total":measured.calls_total,"partial":model.coverage.calls_partially_resolved})
          for kind in ("positions","routes","other"):
              old,new=fp["before"][kind],fp["after"][kind]
              emit("UNKNOWN_DIFF",{"kind":kind,"before":sum(old.values()),"after":sum(new.values()),"added":[json.loads(row) for row in sorted((new-old).elements())],"removed":[json.loads(row) for row in sorted((old-new).elements())]})
          paths=["src/archkeel/analyzer/typescript/parse.py"]
          indexes={}
          source_hashes={}
          for label in models:
              for path in paths:
                  if label=="before":
                      raw=subprocess.run(["git","show",basis+":"+path],capture_output=True)
                      if raw.returncode: continue
                      source=raw.stdout.decode()
                  else: source=Path(path).read_text()
                  source_hashes[label+":"+path]=hashlib.sha256(source.encode()).hexdigest()
                  tree=ast.parse(source)
                  parents={child:parent for parent in ast.walk(tree) for child in ast.iter_child_nodes(parent)}
                  calls=collections.defaultdict(list)
                  for node in ast.walk(tree):
                      if isinstance(node,ast.Call): calls[node.lineno,node.col_offset].append(node)
                  indexes[label,path]=(parents,calls)
          proofs=[]
          unmatched=[]
          def normalize(label,data,site):
              caller=data["source_scope"]
              if site.file not in paths: return caller
              parents,calls=indexes[label,site.file]
              candidates=[node for node in calls[site.line,site.column] if ast.unparse(node.func)==data["expression"]]
              if len(candidates)!=1:
                  unmatched.append({"label":label,"caller":caller,"line":site.line,"column":site.column,"expression":data["expression"]})
                  return caller
              named=re.sub(r"\.<(?:genexpr|listcomp|setcomp|dictcomp|lambda):\d+:\d+>","",caller)
              if named==caller: return caller
              call=candidates[0]
              bindings=[]
              parent=parents.get(call)
              while parent is not None:
                  if isinstance(parent,(ast.ClassDef,ast.FunctionDef,ast.AsyncFunctionDef)): break
                  if isinstance(parent,(ast.GeneratorExp,ast.ListComp,ast.SetComp,ast.DictComp)):
                      bindings.append({"kind":type(parent).__name__,"generators":[{"target":ast.dump(g.target,include_attributes=False),"iter":ast.dump(g.iter,include_attributes=False),"ifs":[ast.dump(test,include_attributes=False) for test in g.ifs],"is_async":g.is_async} for g in parent.generators]})
                  elif isinstance(parent,ast.Lambda):
                      bindings.append({"kind":"Lambda","arguments":ast.dump(parent.args,include_attributes=False)})
                  parent=parents.get(parent)
              body=ast.dump(call,include_attributes=False)
              anchor=json.dumps({"call":body,"bindings":bindings},sort_keys=True)
              normalized=named+".<operation:"+hashlib.sha256(anchor.encode()).hexdigest()[:24]+">"
              proofs.append({"label":label,"path":site.file,"raw_caller":caller,"normalized_caller":normalized,"line":site.line,"column":site.column,"call_ast":body,"closure_bindings":bindings})
              return normalized
          counters={label:collections.Counter() for label in models}
          full=[]
          focused=[]
          selected={}
          other={}
          for label,model in models.items():
              evidence={item.id:item for item in model.evidence}
              constructs={row.id:row for row in model.records("constructs")}
              selected[label]=[]
              other[label]=[]
              for violation in trace_valid_violations(model):
                  records=[constructs[i] for i in violation.fact_ids if i in constructs]
                  matches=[record for record in records if record.data.get("form") in {"startswith","endswith"}]
                  if matches:
                      for record in matches:
                          selected[label].append({"owner":record.data.get("owner"),"form":record.data.get("form"),"rules":list(violation.rule_ids),"evidence":[dataclasses.asdict(evidence[i]) for i in record.evidence_ids]})
                  else: other[label].append(dataclasses.asdict(violation))
              for record in model.records("calls"):
                  data=json.loads(value_bytes(record.data))
                  [site]=[evidence[identity] for identity in record.evidence_ids]
                  if site.file in paths:
                      focused.append({"label":label,"id":record.id,"line":site.line,"column":site.column,"excerpt":site.excerpt,"path":site.file,"data":data})
                  if data["status"] not in {"unresolved","partially_resolved"}: continue
                  row={"path":site.file,"caller":normalize(label,data,site),"status":data["status"],"expression":data["expression"],"reason":data["reason"],"targets":sorted(data["targets"])}
                  counters[label][json.dumps(row,sort_keys=True)]+=1
                  full.append({"label":label,"id":record.id,"line":site.line,"column":site.column,"raw_caller":data["source_scope"],"normalized":row})
          emit("AST_JOIN",{"unmatched":unmatched,"scope":"exact changed-module AST calls/arguments and closure binders including filters; caller line tags normalized only for identical call and enclosing bindings"})
          assert not unmatched,unmatched
          deltas=[]
          for key in sorted(counters["before"].keys()|counters["after"].keys()):
              old,new=counters["before"][key],counters["after"][key]
              if old!=new:
                  item={**json.loads(key),"before":old,"after":new}
                  deltas.append(item)
                  emit("CALL_MULTISET_DIFF",item)
          for status in ("unresolved","partially_resolved"):
              chosen=[item for item in deltas if item["status"]==status]
              emit("CALL_MULTISET_COUNTS",{"status":status,"before":sum(count for key,count in counters["before"].items() if json.loads(key)["status"]==status),"after":sum(count for key,count in counters["after"].items() if json.loads(key)["status"]==status),"added":sum(max(item["after"]-item["before"],0) for item in chosen),"removed":sum(max(item["before"]-item["after"],0) for item in chosen)})
          emit("RAW_UNRESOLVED_CHANGES",[dataclasses.asdict(item) for item in unresolved_call_changes(models["before"],models["after"])])
          for label in models:
              counts=collections.Counter(row["owner"].rsplit(".",1)[0] for row in selected[label])
              emit("SELECTED_GRAMMAR",{"label":label,"count":len(selected[label]),"owners":dict(sorted(counts.items()))})
              emit("OTHER_VIOLATIONS",{"label":label,"records":other[label]})
          archive={"calls":full,"focused_source_calls":focused,"counters":{label:[{"row":json.loads(key),"multiplicity":count} for key,count in sorted(counter.items())] for label,counter in counters.items()},"deltas":deltas,"normalization_proofs":proofs,"unknown_fingerprints":{label:{kind:[{"row":json.loads(key),"multiplicity":count} for key,count in sorted(counter.items())] for kind,counter in values.items()} for label,values in fp.items()},"source_hashes":source_hashes,"selected_grammar":selected,"other_violations":other}
          payload=json.dumps(archive,sort_keys=True,separators=(",",":")).encode()
          (directory/"complete-native-input-proof.json.gz").write_bytes(gzip.compress(payload,mtime=0))
          emit("COMPLETE_PROOF",{"json_bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest(),"gzip_bytes":(directory/"complete-native-input-proof.json.gz").stat().st_size})
          emit("EXACT_HEAD",{"head":subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip(),"dirty":subprocess.check_output(["git","status","--porcelain"]).decode()})
          
          for kind in fp["before"]:
              assert fp["before"][kind]==fp["after"][kind],kind
          assert not trace_valid_violations(models["after"]),trace_valid_violations(models["after"])
          assert models["after"].coverage.calls_unresolved<=models["before"].coverage.calls_unresolved
          print("LITERAL_WRAPPER_NATIVE=PASS",flush=True)
          
          PY
      - name: Normal no-write compatibility validator against actual predecessor
        run: uv run --locked archkeel validate --root . --baseline architecture-baseline.json --against a25c37c564c82c1b42457f0528c931c769ee9362 --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-native-ts-wrapper-sites
          path: ${{ runner.temp }}/ts-input-native-proof
          retention-days: 10
  typescript-compatibility-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 11173d0125f0e70b6ef592ae7eec70ec37665e73
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - name: Complete existing TypeScript and native Target controls
        run: uv run --locked python -m pytest -n 4 -q tests/test_typescript*.py tests/test_repository_hygiene.py
      - run: make typescript-compiler-check
  wire-compiler-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 11173d0125f0e70b6ef592ae7eec70ec37665e73
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: git worktree add --detach "$RUNNER_TEMP/ts-wrapper-before" a25c37c564c82c1b42457f0528c931c769ee9362
      - name: Actual process receipts H and Nest plus same-runtime repeated cost
        run: |
          uv run --locked python - <<'PY'
          import ast, dataclasses, gc, gzip, hashlib, importlib.util, json, os, statistics, subprocess, sys, time, tracemalloc
          from pathlib import Path
          from archkeel.analyzer.typescript import collect as collector, parse as current_parser
          from archkeel.cli.config import parse_config
          from archkeel.ir.facts_codec import decode_response, encode_request, encode_response
          from archkeel.ir.protocol import CollectionRequest, CollectionResponse, SnapshotInput, SourceScope, TypeScriptSettings
          temporary=Path(os.environ["RUNNER_TEMP"])
          basis="a25c37c564c82c1b42457f0528c931c769ee9362"
          before=temporary/"ts-wrapper-before"
          directory=temporary/"ts-wrapper-wire-proof";directory.mkdir()
          old_path=before/"src/archkeel/analyzer/typescript/parse.py"
          spec=importlib.util.spec_from_file_location("archkeel.analyzer.typescript._literal_wrapper_before",old_path)
          old_parser=importlib.util.module_from_spec(spec);sys.modules[spec.name]=old_parser;spec.loader.exec_module(old_parser)
          parsers={"before":old_parser.parse,"after":current_parser.parse}
          def emit(name,value): print(name+"="+json.dumps(value,sort_keys=True),flush=True)
          def normalize(wire):
              body=json.loads(wire)
              body["facts"]["adapter"]["code_digest"]="<independently-measured-adapter-code-digest>"
              return json.dumps(body,sort_keys=True,separators=(",",":")).encode()
          proof={}
          for fixture in ("H-uml-typescript","L-nest-realworld"):
              root=Path.cwd()/"fixtures"/fixture
              config=parse_config((root/"archkeel.toml").read_bytes())
              request=CollectionRequest(SnapshotInput(str(root),"a"*40,False),SourceScope(config.roots,config.namespace),TypeScriptSettings(config.tsconfig or "tsconfig.json"))
              actual={}
              for label,source in (("before",before),("after",Path.cwd())):
                  env={**os.environ,"PYTHONPATH":str(source/"src")}
                  completed=subprocess.run([sys.executable,"-m","archkeel.analyzer.typescript.entry"],input=encode_request(request),capture_output=True,env=env,check=True)
                  parsed=decode_response(completed.stdout)
                  assert encode_response(parsed)==completed.stdout,(fixture,label,"strict-replay")
                  actual[label]=completed.stdout
              assert normalize(actual["before"])==normalize(actual["after"]),(fixture,"actual-wire-mismatch")
              samples={label:[] for label in parsers}
              peaks={}
              stable={}
              for label,parse in parsers.items():
                  collector.parse=parse
                  stable[label]=encode_response(CollectionResponse(collector.collect(request)))
              assert stable["before"]==stable["after"],(fixture,"same-runtime-wire-mismatch")
              for iteration in range(5):
                  for label in (("before","after") if iteration%2==0 else ("after","before")):
                      gc.collect();collector.parse=parsers[label]
                      started=time.perf_counter()
                      response=encode_response(CollectionResponse(collector.collect(request)))
                      samples[label].append(time.perf_counter()-started)
                      assert response==stable[label],(fixture,label,"nondeterministic-wire")
              for label,parse in parsers.items():
                  gc.collect();collector.parse=parse;tracemalloc.start()
                  result=collector.collect(request)
                  _,peaks[label]=tracemalloc.get_traced_memory();tracemalloc.stop()
                  assert encode_response(CollectionResponse(result))==stable[label]
              medians={label:statistics.median(values) for label,values in samples.items()}
              row={"fixture":fixture,"actual_process_wire_equal_except_adapter_digest":True,
                   "same_final_runtime_full_wire_equal":True,
                   "actual_wire_bytes":{label:len(wire) for label,wire in actual.items()},
                   "actual_normalized_wire_sha256":hashlib.sha256(normalize(actual["after"])).hexdigest(),
                   "same_runtime_wire_sha256":hashlib.sha256(stable["after"]).hexdigest(),
                   "full_collect_encode_samples_seconds":samples,"medians_seconds":medians,
                   "median_percent_change":(medians["after"]/medians["before"]-1)*100,
                   "peak_traced_collect_bytes":peaks,"repeat_wires_equal":True,
                   "selected_files":len(decode_response(actual["after"]).facts.coverage.selected_files)}
              proof[fixture]=row;emit("ACTUAL_WIRE_AND_COST",row)
          collector.parse=current_parser.parse
          # Compile each real regression body with the pinned language reference.
          tree=ast.parse(Path("tests/test_typescript_string_constructs.py").read_text())
          sources=[]
          for fn in tree.body:
              if not isinstance(fn,ast.FunctionDef) or not fn.name.startswith(("test_ts_value_preserving_literal","test_ts_literal_wrappers_do_not")):continue
              decorator=next(row for row in fn.decorator_list if isinstance(row,ast.Call) and len(row.args)>1)
              key=ast.literal_eval(decorator.args[0]);values=ast.literal_eval(decorator.args[1])
              for value in values:
                  body=value if key=="body" else "return value === "+value+";"
                  path=directory/("case"+str(len(sources))+".ts")
                  path.write_text('enum Mode { Active = "active" }\nexport function decide(value: any, left: any) { '+body+" }\n")
                  sources.append(str(path))
          compiler=subprocess.run(["npx","--yes","--package","typescript@5.9.3","tsc","--noEmit","--skipLibCheck","--target","ES2022",*sources],capture_output=True,text=True)
          emit("ACTUAL_WRAPPER_COMPILER",{"files":len(sources),"exit":compiler.returncode,"output":compiler.stdout+compiler.stderr})
          assert compiler.returncode==0,compiler.stdout+compiler.stderr
          payload=json.dumps(proof,sort_keys=True).encode()
          (directory/"wire-cost-proof.json.gz").write_bytes(gzip.compress(payload,mtime=0))
          emit("WIRE_COST_PROOF",{"sha256":hashlib.sha256(payload).hexdigest(),"bytes":len(payload)})
          emit("EXACT_SOURCE",{"head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"dirty":subprocess.check_output(["git","status","--porcelain"],text=True)})
          assert not subprocess.check_output(["git","status","--porcelain"],text=True)
          print("ACTUAL_TS_WRAPPER_WIRE_COST_COMPILER=PASS",flush=True)
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-ts-wrapper-wire-compiler-cost
          path: ${{ runner.temp }}/ts-wrapper-wire-proof
          retention-days: 10
  repository-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 11173d0125f0e70b6ef592ae7eec70ec37665e73
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv python install 3.12.10
      - name: Repository regression suite
        run: uv run --locked python -m pytest -n 4 --max-worker-restart=0 -q --durations=10 --junitxml="$RUNNER_TEMP/ts-wrapper-full.xml"
      - name: Exact source stays clean
        if: always()
        run: |
          python - <<'PY'
          import json,subprocess
          print("EXACT_FULL_SOURCE="+json.dumps({"head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"dirty":subprocess.check_output(["git","status","--porcelain"],text=True)}))
          PY
