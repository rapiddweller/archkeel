name: TypeScript native probe diagnostics
on:
  push:
    branches: [verify/542-typescript-syntax-probe-diagnostics]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: be25d6152ab6f1ddc14cd6514c3c8d825d8d6124
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Surface native report refusal diagnostics without changing observation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_uml_evaluation.py")
          text = path.read_text()
          old = "assert result.exit_code == 0 and encoded is not None"
          if old not in text:
              raise ValueError("diagnostic helper precondition")
          path.write_text(text.replace(old, "if encoded is not None and result.exit_code:\n        model = parse_observation(decode_canonical_model(json.loads(encoded)))\n        records = {row.id: row for section in model.sections for row in section.records}\n        evidence = {row.id: row for row in model.evidence}\n        valid = {row.id for row in trace_valid_violations(model)}\n        for violation in model.records(\"violations\"):\n            if violation.id not in valid:\n                print(\"INVALID_TRACE=\" + repr({\n                    \"violation\": violation,\n                    \"rules\": [records.get(key) for key in violation.rule_ids],\n                    \"facts\": [(records.get(key), [evidence.get(item) for item in records[key].evidence_ids] if key in records else []) for key in violation.fact_ids],\n                }))\n    " + old))
          PY
          uv run --locked python -m pytest -q 'tests/test_typescript_control_target.py::test_native_parser_and_protocol_strings_fail_without_exceptions[equality-collect]'
