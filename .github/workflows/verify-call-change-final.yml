name: Verify owned call direction and terminal consumers
on:
  push:
    branches: ['verify/542-call-change-final']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: befb7e8ac4adfb39ba2ae4c6b9308f4c33bbd638
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.11.12'
          version: '0.12.13'
      - run: uv sync --locked
      - run: uv run --locked pytest -q tests/test_unresolved_call_change_types.py tests/test_known_delta_action_types.py tests/test_ratchets.py tests/test_terminal.py tests/test_repository_hygiene.py
      - run: git diff --exit-code
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: befb7e8ac4adfb39ba2ae4c6b9308f4c33bbd638
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.11.12'
          version: '0.12.13'
      - run: uv sync --locked
      - run: make lint typecheck
      - if: always()
        run: |
          uv run --locked python - <<'PY'
          import subprocess
          paths = ["src/archkeel/ir/model.py","src/archkeel/check/ratchets.py","src/archkeel/check/validation/__init__.py","src/archkeel/render/summary.py","src/archkeel/render/terminal.py","tests/test_unresolved_call_change_types.py","tests/test_known_delta_action_types.py"]
          for args in (["ruff","format","--check","--diff"],["ruff","check","--diff"]):
              result=subprocess.run(["uv","run","--locked",*args,*paths],text=True,capture_output=True)
              print(result.stdout)
              print(result.stderr)
          PY
      - run: git diff --exit-code
