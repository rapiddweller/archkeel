name: Read-only actual native control-site triage
on:
  push:
    branches: [verify/542-actual-control-site-triage]
permissions:
  contents: read
  actions: read
jobs:
  actual-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5fc94c10298c4bbcd98fd44f8ac72b321b03a0b4
          persist-credentials: false
      - name: Binary capture of the immutable original Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method GET repos/rapiddweller/archkeel/actions/artifacts/12083429473/zip > "${RUNNER_TEMP}/actual-native-sites.zip"
      - name: Read every original native site without changing source or artifact
        run: |
          python3 - <<'PY'
          import gzip,json,os,zipfile
          from pathlib import Path
          archive=Path(os.environ["RUNNER_TEMP"])/"actual-native-sites.zip"
          with zipfile.ZipFile(archive) as zipped:
              names=zipped.namelist()
              print("TRIAGE_ARCHIVE="+json.dumps(names))
              matching=[name for name in names if name.endswith("native-control-sites.json.gz")]
              assert len(matching)==1,matching
              payload=json.loads(gzip.decompress(zipped.read(matching[0])))
          print("TRIAGE_STRUCTURE="+json.dumps(dict(type=type(payload).__name__,keys=list(payload) if isinstance(payload,dict) else None)))
          if isinstance(payload,list):
              rows=payload
          else:
              candidates=[(key,value) for key,value in payload.items() if isinstance(value,list) and len(value)==780]
              assert len(candidates)==1,[(key,len(value)) for key,value in payload.items() if isinstance(value,list)]
              key,rows=candidates[0]
              print("TRIAGE_SITE_KEY="+key)
          assert len(rows)==780,len(rows)
          import ast
          cache={}
          def parsed(file):
              if file not in cache:
                  text=Path(file).read_text()
                  cache[file]=(text,ast.parse(text))
              return cache[file]
          for index,row in enumerate(rows):
              expression=[]
              for location in row["locations"]:
                  text,tree=parsed(location["file"])
                  matches=[node for node in ast.walk(tree)
                           if ((row["form"] in {"compare","membership"} and isinstance(node,ast.Compare))
                           or (row["form"] in {"startswith","endswith"} and isinstance(node,ast.Call)
                               and isinstance(node.func,ast.Attribute) and node.func.attr==row["form"]))
                           and (node.lineno,node.end_lineno,node.col_offset)==(location["line"],location["end_line"],location["column"])]
                  assert len(matches)==1,(index,location,[type(node).__name__ for node in matches])
                  expression.append(ast.get_source_segment(text,matches[0]))
              print("TRIAGE_EXACT_EXPR_JSON="+json.dumps(dict(index=index,expression=expression),sort_keys=True),flush=True)
          for path in Path("src/archkeel").rglob("*.py"):
              text,tree=parsed(str(path))
              module=str(path).removeprefix("src/").removesuffix(".py").replace("/",".")
              for node in ast.walk(tree):
                  if not isinstance(node,ast.ClassDef):
                      continue
                  bases=[ast.unparse(base) for base in node.bases]
                  if any(base.rsplit(".",1)[-1] in {"Enum","StrEnum","IntEnum","Flag","IntFlag"} for base in bases):
                      members=[]
                      for child in node.body:
                          if isinstance(child,ast.Assign):
                              members.extend((ast.unparse(target),ast.unparse(child.value)) for target in child.targets)
                      print("TRIAGE_ENUM_JSON="+json.dumps(dict(owner=module+"."+node.name,line=node.lineno,bases=bases,members=members),sort_keys=True),flush=True)
                  fields={child.target.id:ast.unparse(child.annotation) for child in node.body
                          if isinstance(child,ast.AnnAssign) and isinstance(child.target,ast.Name)
                          and child.target.id in {"kind","status","source_status","role","mode","change","format","visibility","basis","resolution","reason","section","name","family","action","version","profile","language","disposition"}}
                  if fields:
                      print("TRIAGE_FIELDS_JSON="+json.dumps(dict(owner=module+"."+node.name,line=node.lineno,fields=fields),sort_keys=True),flush=True)
          print("TRIAGE_EXACT_SITE_COUNT="+str(len(rows)))
          
          PY
