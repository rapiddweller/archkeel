name: Dart local receiver shadow causal RED
on:
  push:
    branches: [verify/542-dart-shadow-causal]
permissions:
  contents: read
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: predecessor
            ref: 0e3b8a7f62b9b13417cda78e11b52d0de82986cd
          - label: grammar-candidate
            ref: 1f098cea97782e64526602b72005814576bffdd7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Identical independently written tests on both actual sources
        run: git show 1f098cea97782e64526602b72005814576bffdd7:tests/test_dart_input_grammar.py > tests/test_dart_input_grammar.py
      - name: Index control and local function/closure shadow RED
        run: uv run --locked python -m pytest -q tests/test_dart_input_grammar.py::test_index_and_shadowed_receiver_forms_do_not_gain_known_targets --tb=short
      - name: Unchanged source proof
        if: ${{ always() }}
        run: git diff --exit-code -- src docs/architecture/contracts
