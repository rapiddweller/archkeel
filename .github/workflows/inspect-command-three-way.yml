name: Integrate Core command on reviewed Requires and owner stack
on:
  push:
    branches: [fix/issue-542-command-three-way]
permissions:
  contents: read
jobs:
  three-way:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Perform actual Git three-way and expose exact conflict contents
        run: |
          git config user.name 'Codex verification'
          git config user.email 'codex-verification@users.noreply.github.com'
          git checkout --detach 61cfede2ad8f04031cde71013f35f225038a87fd
          set +e
          git merge --no-commit --no-ff edd4a983621eb193ba442fefafe9813db46c7cc5
          merge_status=$?
          set -e
          python - "$merge_status" <<'PY'
          import base64,json,pathlib,subprocess,sys
          status={"exit":int(sys.argv[1]),"base":"61cfede2ad8f04031cde71013f35f225038a87fd","incoming":"edd4a983621eb193ba442fefafe9813db46c7cc5","conflicts":subprocess.check_output(["git","diff","--name-only","--diff-filter=U"]).decode().splitlines()}
          print("MERGE_STATE="+json.dumps(status,separators=(",",":")))
          paths=subprocess.check_output(["git","diff","--name-only","HEAD"]).decode().splitlines()
          for path in paths:
              raw=base64.b64encode(pathlib.Path(path).read_bytes()).decode()
              for index in range(0,len(raw),8000):
                  print("MERGED64="+json.dumps({"path":path,"index":index//8000,"data":raw[index:index+8000]},separators=(",",":")))
          PY

  requires-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 61cfede2ad8f04031cde71013f35f225038a87fd
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - name: Verify preserved owners and regenerate normal Requires receipt
        run: |
          uv run --locked python -m pytest -q tests/test_requires_symbol_ports.py tests/test_typed_amendment_artifact.py tests/test_typed_python_properties.py tests/test_typed_contract_rule_grammar.py tests/test_typed_contract_rule_native.py --tb=short
          make typecheck
          uv run --locked ruff check src/archkeel/ir/model.py src/archkeel/ir/dependency.py src/archkeel/check/evaluation/rules.py src/archkeel/check/evaluation/rule_support.py tools/rule_yield.py
          git diff --exit-code c7444205d4fe87eaae0de5e2dc98b70909fd1cc7 -- architecture-baseline.json schema src/archkeel/ir/decisions.py src/archkeel/ir/facts_codec.py
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json --against c7444205d4fe87eaae0de5e2dc98b70909fd1cc7 --amendment docs/architecture/decisions/issue-564-symbol-requires-amendment.json --write-amendment --decided-by 'ake2l (explicit parser/protocol typing request); Codex implementation, independent Astra review before merge' --rationale 'Integrate the independently reviewed exact Requires symbol policy while preserving current Amendment, Property, RuleGrammar and baseline owners; docs/architecture/symbol-requires-ports.md.' > "$RUNNER_TEMP/requires-checkpoint.json"
          native_status=$?
          set -e
          python - "$RUNNER_TEMP/requires-checkpoint.json" <<'PY'
          import json,pathlib,sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("CHECKPOINT_NATIVE="+json.dumps({key:result.get(key) for key in ("exit_code","failures","diagnostics","measurements","amendment_status")},separators=(",",":")))
          path=pathlib.Path("docs/architecture/decisions/issue-564-symbol-requires-amendment.json")
          if path.exists(): print("CHECKPOINT_RECEIPT="+json.dumps(json.loads(path.read_text()),separators=(",",":")))
          PY
          exit "$native_status"
