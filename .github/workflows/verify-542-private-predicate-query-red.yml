name: Prove real predicate query RED and selector support
on:
  push:
    branches: [verify/542-private-predicate-query-red]
permissions:
  contents: read
jobs:
  actual-native-red-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f2b01beee65c97cdbde2e3bb3a2f4e24a9f84210
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Prove the real missing Query and remaining candidate are RED
        run: |
          set +e
          uv run --locked python -m pytest -q tests/test_python_string_predicate_target.py::test_actual_predicate_enum_and_decoder_satisfy_independent_native_target tests/test_references.py::test_construct_queries_have_direct_native_references tests/test_references.py::test_the_claim_stays_small_enough_to_read > "$RUNNER_TEMP/query-red.txt" 2>&1
          task_status=$?
          cat "$RUNNER_TEMP/query-red.txt"
          test "$task_status" -eq 1
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          output=(Path(os.environ["RUNNER_TEMP"])/"query-red.txt").read_text()
          assert "3 failed" in output and "ERROR " not in output,output
          print("GENUINE_PRIVATE_QUERY_RED=3_FAIL_0_ERROR")
          PY
      - name: Measure actual function selector support without changing the observer
        run: |
          uv run --locked python - <<'PY'
          import dataclasses,json,os,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,str(Path("tests").resolve()))
          from test_python_string_predicate_target import _repository
          from test_uml_evaluation import _model
          from archkeel.ir.decisions import rule_assessments
          from archkeel.ir.trace import trace_valid_violations
          marker="def _comparison_form(literals: _LiteralComparisons, node: ast.Compare) -> str | None:\n"
          source=Path("src/archkeel/analyzer/python/constructs.py").read_text()
          for changed in (False,True):
              with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
                  written=source.replace(marker,marker+'    if node == "raw_protocol":\n        return None\n',1) if changed else source
                  assert marker in written
                  root,config=_repository(Path(directory),written)
                  contract=json.loads((root/"contract.json").read_text())
                  contract["rules"].append({"id":"PROBE-FUNCTION-SOURCE","kind":"forbidden_construct","source":"archkeel.analyzer.python.constructs._comparison_form","constructs":["string_literal_compare"],"rationale":"Probe only the existing function selector without new evaluator authority.","provenance":["docs/architecture/python-string-predicates.md"],"decided_by":"architect"})
                  (root/"contract.json").write_text(json.dumps(contract))
                  model=_model(root,config)
                  rows=[dataclasses.asdict(row) for row in rule_assessments(model,undecided_by_rule={}) if row.id=="PROBE-FUNCTION-SOURCE"]
                  violations=[dataclasses.asdict(row) for row in trace_valid_violations(model) if "PROBE-FUNCTION-SOURCE" in row.rule_ids]
                  print("ACTUAL_FUNCTION_SELECTOR="+json.dumps({"mutation":changed,"assessments":rows,"trace_valid_violations":violations},default=str,sort_keys=True),flush=True)
          
          PY
      - name: Prove existing nominal role and helper static APIs
        run: |
          uv run --locked python - <<'PY'
          import os,subprocess
          from pathlib import Path
          directory=Path(os.environ["RUNNER_TEMP"])
          positive=directory/"legacy-positive.py"
          positive.write_text("from collections.abc import Callable\nfrom archkeel.analyzer.typescript.config import Role\nfrom archkeel.analyzer.typescript.resolve import is_builtin, is_relative\nfrom archkeel.ir.facts import ResolutionRole\nrole: Role = Role.SELECTED\ndef preserve(value: Role) -> ResolutionRole:\n    return value\nchecks: tuple[Callable[[str], bool], Callable[[str], bool]] = (is_builtin, is_relative)\n")
          result=subprocess.run(["uv","run","--locked","mypy","--strict",str(positive)],capture_output=True,text=True)
          print(result.stdout,result.stderr)
          assert result.returncode==0
          negative=directory/"legacy-negative.py"
          negative.write_text("from archkeel.analyzer.typescript.config import Role\nfrom archkeel.analyzer.typescript.resolve import is_builtin, is_relative\nrole: Role = 'selected'\nwrong_builtin: bool = is_builtin(1)\nwrong_relative: bool = is_relative(1)\n")
          result=subprocess.run(["uv","run","--locked","mypy","--strict",str(negative)],capture_output=True,text=True)
          print(result.stdout,result.stderr)
          assert result.returncode==1 and "[assignment]" in result.stdout and result.stdout.count("[arg-type]")==2
          print("ACTUAL_LEGACY_STATIC_API=POSITIVE_PASS_NEGATIVES_REJECTED")
          PY
