name: Publish report gallery

on:
  workflow_run:
    workflows: [Full verification]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the verified report gallery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publish only a passed Full run of the current Main; an older run must not replace a newer report.
      - name: Check that Full passed on the current Main
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$CONCLUSION" == success && "$RUN_SHA" == "$main_sha" \
            && ( "$EVENT" == schedule || "$EVENT" == workflow_dispatch ) \
            && "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to publish: Full was $CONCLUSION ($EVENT, $HEAD_REPO) on $RUN_SHA; Main is $main_sha."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the current report
        if: steps.verified.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: current-report
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download the demo gallery
        if: steps.verified.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-gallery
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Configure GitHub Pages
        if: steps.verified.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        if: steps.verified.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          retention-days: 1

      - name: Deploy the site
        if: steps.verified.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
