name: Pages

# AD-740, AD-754, AD-1060.

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish-gallery:
    name: Publish the report gallery
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # AD-754: the gate profile reuses the Rust cache that CI saves for main.
      ARCHKEEL_CORE_PROFILE: gate
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hash the native tree
        id: native
        run: echo "hash=${{ hashFiles('native/**', '!native/target/**', '!**/__pycache__/**') }}" >> "$GITHUB_OUTPUT"

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11.12"
          version: "0.12.13"

      - name: Install locked dependencies
        run: uv sync --locked

      # AD-1047: the self run in `make report-gallery` reads native/ with compiler facts.
      - name: Install the Rust toolchains with rustc-dev
        run: make type-reach-setup

      - name: Restore the Rust build cache of main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-gate-main-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}-

      - name: Build the core
        env:
          ARCHKEEL_NATIVE_TREE: ${{ steps.native.outputs.hash }}
        run: make core

      # The pinned sources of the real-project fixtures (fixtures/*/SOURCE.json) are fetched when
      # the gallery builds. The cache keeps them between runs; a pin that changes is a new key.
      - name: Restore the pinned sources of the real projects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-artifacts/source-cache
          key: gallery-sources-${{ hashFiles('fixtures/*/SOURCE.json') }}

      # A failed fetch of a pinned source fails this step: the build job fails and nothing is deployed.
      - name: Build the report of each fixture with the core
        run: make report-gallery

      - name: Name the artifact
        id: artifact
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload the gallery
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: test-artifacts/gallery/

  deploy-gallery:
    name: Deploy the report gallery
    needs: publish-gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the gallery
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.publish-gallery.outputs.artifact }}
