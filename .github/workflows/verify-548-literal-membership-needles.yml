name: Verify PR548 literal membership needles

on:
  push:
    branches: [verify/548-literal-membership-needles]

permissions:
  contents: read

jobs:
  needles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv python install 3.11.12 3.12.10
      - run: uv sync --locked
      - name: Format and export exact patch
        run: |
          uv run --locked ruff format src/archkeel/analyzer/python/constructs.py tests/test_string_comparison_observation.py tests/test_analyzer.py
          python - <<'PY'
          import base64, subprocess
          patch = subprocess.check_output(["git", "diff", "--", "src", "tests"])
          print("FORMAT_PATCH=" + base64.b64encode(patch).decode())
          PY
      - name: Native collector, State and binding safety
        run: >-
          uv run --locked python -m pytest -n 2 --dist=loadfile -q
          tests/test_string_comparison_observation.py tests/test_analyzer.py
          tests/test_source_trust_boundary.py tests/test_collection_process.py
          tests/test_source_types.py tests/test_source_namespace_acceptance.py
          tests/test_definition_source_owners.py tests/test_binding_proof_reuse.py
          tests/test_binding_claim_completeness.py tests/test_python_scope_certification.py
          tests/test_boundary_type_ambiguous_bindings.py tests/test_boundary_type_enum_literals.py
          tests/test_source_provenance_acceptance.py tests/test_repository_hygiene.py
          tests/test_typed_state_protocol.py tests/test_state_facts.py
      - name: Ruff and Mypy
        run: |
          uv run --locked ruff check src tests
          uv run --locked mypy src
      - name: Native unchanged 65/919 baseline
        run: |
          set +e
          uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json > "$RUNNER_TEMP/548-needle-native-result.json"
          native_exit=$?
          python - "$RUNNER_TEMP/548-needle-native-result.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print("NATIVE_RESULT=" + json.dumps({
              "exit_code": result["exit_code"], "diagnostics": result["diagnostics"],
              "failures": result["failures"], "measurements": result["measurements"],
          }))
          PY
          exit "$native_exit"
