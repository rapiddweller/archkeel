name: Compare actual inherited reference candidates
on:
  push:
    branches: [verify/542-comparison-reference-base]
permissions:
  contents: read
jobs:
  actual-reference-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Existing real observer on exact before and after source, no expectation changes
        run: |
          uv run --locked python - <<'PY'
          import ast,gzip,importlib,json,subprocess,time
          from dataclasses import asdict
          from pathlib import Path
          from archkeel.cli.config import parse_config
          from archkeel.cli.observe import observer_for
          from archkeel.ir.codec import observation_payload
          from archkeel.ir.facts_codec import raw_record
          from archkeel.ir.references import unreferenced_symbols
          BEFORE="6452149d33186dc56d78f7072d73b5dbb988d35a"
          AFTER="3f3f8eea06b5418eedf8bc50d642f4d2a0b05a2e"
          out=Path("comparison-reference-evidence").resolve()
          out.mkdir(exist_ok=True)
          base=Path("/tmp/comparison-reference-before")
          subprocess.run(["git","worktree","add","--detach",str(base),BEFORE],check=True)
          results={}
          for side,root,revision in (("before",base,BEFORE),("after",Path.cwd(),AFTER)):
              config=parse_config((root/"archkeel.toml").read_bytes())
              started=time.perf_counter()
              result=observer_for(config.language)(root,roots=config.roots,namespace=config.namespace,contract=config.contract,git_head=revision,dirty=False,contract_root=root,language=config.language)
              assert result.observation is not None,result.diagnostics
              observation=result.observation
              claim=unreferenced_symbols(observation)
              records={str(record.data.get("qualified_name")):record for record in observation.records("symbols") or ()}
              evidence={record.id:asdict(record) for record in observation.evidence}
              (out/f"{side}-observation.json.gz").write_bytes(gzip.compress(json.dumps(observation_payload(observation),sort_keys=True).encode()))
              rows=[]
              for candidate in claim.candidates:
                  record=records[candidate.name]
                  cites=[evidence[identity] for identity in record.evidence_ids]
                  assert len(cites)==1,cites
                  cite=cites[0]
                  source=(root/cite["file"]).read_text()
                  leaf=candidate.name.rsplit(".",1)[-1]
                  def names_definition(node):
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)): return node.name==leaf
                      if isinstance(node,ast.AnnAssign): return isinstance(node.target,ast.Name) and node.target.id==leaf
                      if isinstance(node,ast.Assign): return any(isinstance(target,ast.Name) and target.id==leaf for target in node.targets)
                      if isinstance(node,(ast.Import,ast.ImportFrom)): return any((alias.asname or alias.name)==leaf for alias in node.names)
                      return False
                  matches=[node for node in ast.walk(ast.parse(source)) if getattr(node,"lineno",None)==cite["line"] and names_definition(node)]
                  assert len(matches)==1,(candidate,cite,len(matches))
                  rows.append({"candidate":asdict(candidate),"actual_symbol_record":raw_record(record),"citations":cites,"actual_ast":ast.dump(matches[0],include_attributes=False)})
              results[side]={"revision":revision,"status":str(claim.status),"symbols":claim.symbols,"exempt":claim.exempt,"candidates":rows,"seconds":time.perf_counter()-started}
              (out/f"{side}.json").write_text(json.dumps(results[side],sort_keys=True,indent=2))
              (out/f"{side}-observation.json.gz").write_bytes(gzip.compress(json.dumps(observation_payload(observation),sort_keys=True).encode()))
              print("COMPARISON_ACTUAL_REFERENCE_CANDIDATES="+json.dumps({"side":side,"revision":revision,"count":len(rows),"candidates":[row["candidate"]["name"] for row in rows],"seconds":results[side]["seconds"]},sort_keys=True),flush=True)
          old,new=({row["candidate"]["name"]:row for row in results[side]["candidates"]} for side in ("before","after"))
          common=old.keys()&new.keys()
          delta={"before_ref":BEFORE,"after_ref":AFTER,"same_current_engine":"This is a source-claim comparison, not a before/after collector-runtime claim.","before_count":len(old),"after_count":len(new),"added":sorted(new.keys()-old.keys()),"removed":sorted(old.keys()-new.keys()),"changed_candidate_semantics":[name for name in sorted(common) if old[name]["candidate"]!=new[name]["candidate"]],"changed_actual_candidate_asts":[name for name in sorted(common) if old[name]["actual_ast"]!=new[name]["actual_ast"]]}
          (out/"delta.json").write_text(json.dumps(delta,sort_keys=True,indent=2))
          print("COMPARISON_ACTUAL_REFERENCE_DELTA="+json.dumps(delta,sort_keys=True),flush=True)
          assert not delta["added"] and not delta["changed_candidate_semantics"] and not delta["changed_actual_candidate_asts"],delta
          print("COMPARISON_INHERITED_REFERENCE_GATE=PASS",flush=True)
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: comparison-support-reference-candidates
          path: comparison-reference-evidence
