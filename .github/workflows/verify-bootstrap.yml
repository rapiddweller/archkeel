name: Verify shared collector bootstrap
on:
  push:
    branches: [verify/542-shared-runtime-bootstrap]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Prove shared bootstrap digest regression against old runtime source
        run: |
          git show 6e3913738d95a22cb9b1572f51822892548f2270:src/archkeel/analyzer/runtime.py > src/archkeel/analyzer/runtime.py
          set +e
          uv run --locked python -m pytest -q tests/test_shared_runtime_bootstrap.py -k source_contributes > "$RUNNER_TEMP/bootstrap-digest-red.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/bootstrap-digest-red.txt"
          git checkout -- src/archkeel/analyzer/runtime.py
          test "$status" -eq 1
      - name: Format and export exact patch
        run: |
          uv run --locked ruff format src/archkeel/analyzer/bootstrap.py src/archkeel/analyzer/runtime.py src/archkeel/analyzer/python/entry.py src/archkeel/analyzer/dart/entry.py src/archkeel/analyzer/typescript/entry.py tests/test_shared_runtime_bootstrap.py
          python - <<'PY'
          import base64, subprocess
          print("BOOTSTRAP_FORMAT_PATCH=" + base64.b64encode(
              subprocess.check_output(["git", "diff", "--", "src/archkeel/analyzer", "tests/test_shared_runtime_bootstrap.py"])
          ).decode())
          PY
      - name: Native bootstrap and actual entry controls
        run: uv run --locked python -m pytest -q tests/test_shared_runtime_bootstrap.py tests/test_collection_protocol.py tests/test_typed_collector_protocol.py tests/test_typed_collector_native.py tests/test_collection_runtime_gate.py tests/test_source_trust_boundary.py tests/test_language_collectors.py tests/test_typescript_provenance.py tests/test_source_provenance_acceptance.py tests/test_runtime_delta.py
      - name: Static validation
        run: |
          uv run --locked ruff check src/archkeel/analyzer tests/test_shared_runtime_bootstrap.py
          uv run --locked mypy src/archkeel
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
