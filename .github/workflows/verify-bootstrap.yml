name: Verify shared collector bootstrap
on:
  push:
    branches: [verify/542-shared-runtime-bootstrap]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - name: Format and export exact patch
        run: |
          uv run --locked ruff format tests/test_shared_runtime_bootstrap.py
          python - <<'PY'
          import base64, subprocess
          print("BOOTSTRAP_FORMAT_PATCH=" + base64.b64encode(
              subprocess.check_output(["git", "diff", "--", "tests/test_shared_runtime_bootstrap.py"])
          ).decode())
          PY
      - name: Native bootstrap and actual entry controls
        run: uv run --locked python -m pytest -q tests/test_shared_runtime_bootstrap.py
