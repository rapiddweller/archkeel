name: Verify symbol-specific requires
on:
  push:
    branches: [fix/issue-564-symbol-requires]
permissions:
  contents: read
jobs:
  native-symbol-requires:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_requires_symbol_ports.py --tb=short
  requires-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: uv run --locked python -m pytest -q tests/test_analyzer.py tests/test_requires_target_references.py tests/test_requires_component_references.py tests/test_scoped_dependency_proof.py tests/test_interfaces.py tests/test_nested_interface_unknown.py tests/test_nested_interface_lifecycle.py tests/test_dependency_selectors.py --tb=short
  requires-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked

      - run: |
          uv run --locked ruff check --select I --fix src/archkeel/ir/dependency.py src/archkeel/ir/model.py src/archkeel/check/evaluation/rules.py src/archkeel/check/evaluation/rule_support.py tests/test_requires_symbol_ports.py
          uv run --locked ruff format src/archkeel/ir/dependency.py src/archkeel/ir/model.py src/archkeel/check/evaluation/rules.py src/archkeel/check/evaluation/rule_support.py tests/test_requires_symbol_ports.py
          python - <<'PY'
          import base64,subprocess
          print("FORMAT_PATCH="+base64.b64encode(subprocess.check_output(["git","diff","--","src/archkeel/ir/dependency.py","src/archkeel/ir/model.py","src/archkeel/check/evaluation/rules.py","src/archkeel/check/evaluation/rule_support.py","tests/test_requires_symbol_ports.py"])).decode())
          PY
          uv run --locked ruff check src/archkeel/ir/dependency.py src/archkeel/ir/model.py src/archkeel/check/evaluation/rules.py src/archkeel/check/evaluation/rule_support.py tests/test_requires_symbol_ports.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
