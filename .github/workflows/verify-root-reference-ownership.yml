name: Verify exact root reference and ownership correction
on:
  push:
    branches: [verify/542-root-reference-ownership-green]
permissions:
  contents: read
jobs:
  exact-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 16ca88691a250e537439d1b118e767af32744e98
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Check style and static API
        run: |
          uv run --locked ruff check tests/test_references.py tests/test_self.py tests/test_levels.py tests/test_protocol_uml_target.py
          uv run --locked ruff format --check tests/test_references.py tests/test_self.py tests/test_levels.py tests/test_protocol_uml_target.py
          make typecheck
      - name: Verify actual root claims, exact owners, Badge target and legacy property callers
        run: |
          uv run --locked python -m pytest -n 4 -q tests/test_references.py tests/test_self.py tests/test_levels.py tests/test_protocol_uml_target.py tests/test_summary_badge_types.py::test_legacy_summary_exports_are_the_same_owned_objects tests/test_typed_python_properties.py::test_legacy_raw_property_constructor_preserves_dict_operations tests/test_typed_python_properties.py::test_property_decoder_reads_raw_mapping_and_immutable_record_identically
      - name: Typecheck and execute the real public legacy import
        run: |
          uv run --locked python - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          source='''from archkeel.render.summary import State
          from archkeel.render.summary_badges import BadgeState

          def preserve(value: State) -> BadgeState:
              return value

          legacy: State = BadgeState.PASS
          canonical: BadgeState = State.UNKNOWN
          assert State is BadgeState
          assert preserve(legacy) is BadgeState.PASS
          assert canonical is BadgeState.UNKNOWN
          print("LEGACY_IMPORT_RUNTIME_IDENTITY=PASS")
          '''
          (root/"legacy_state_api.py").write_text(source)
          (root/"legacy_state_invalid.py").write_text(
              "from archkeel.render.summary import State\ninvalid: State = 'pass'\n"
          )
          PY
          uv run --locked mypy --strict "$RUNNER_TEMP/legacy_state_api.py"
          uv run --locked python "$RUNNER_TEMP/legacy_state_api.py"
          set +e
          uv run --locked mypy --strict "$RUNNER_TEMP/legacy_state_invalid.py" > "$RUNNER_TEMP/legacy_state_invalid.log"
          task_status=$?
          set -e
          test "$task_status" -eq 1
          uv run --locked python - <<'PY'
          import os,pathlib
          output=(pathlib.Path(os.environ["RUNNER_TEMP"])/"legacy_state_invalid.log").read_text()
          print(output)
          assert "[assignment]" in output and "Incompatible types" in output, output
          print("LEGACY_IMPORT_INVALID_ASSIGNMENT=REJECTED")
          PY
          test -z "$(git status --porcelain)"
      - name: Record exact source
        if: always()
        run: |
          python - <<'PY'
          import json,subprocess
          print("EXACT_SOURCE="+json.dumps({"head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"dirty":subprocess.check_output(["git","status","--porcelain"],text=True).strip()}))
          PY
