name: Diagnose own UML browser regressions
on:
  push:
    branches: [verify/542-own-uml-red]
permissions:
  contents: read
jobs:
  actual-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - run: make browser-install
      - name: Existing failing scenarios with full actual route geometry
        run: |
          set +e
          uv run --locked --with playwright==1.62.0 python -m pytest -q -s \
            'tests/test_own_uml_target.py::test_own_type_dependencies_have_visible_endpoints_and_connected_focus[Target]' \
            'tests/test_own_uml_target.py::test_own_type_dependencies_have_visible_endpoints_and_connected_focus[Diff]' \
            'tests/test_own_uml_target.py::test_member_previews_do_not_squeeze_the_overview_or_change_its_evidence[As-Is]'
          red_status=$?
          test "$red_status" -eq 1
