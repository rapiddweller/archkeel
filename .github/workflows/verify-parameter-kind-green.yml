name: Verify shared source parameter kind
on:
  push:
    branches: [verify/542-shared-parameter-kind-green]
permissions:
  contents: read
jobs:
  exact-port:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f6099877bdb325c095959f5df8f07f406c0f0dc2
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_typed_parameter_kinds.py tests/test_ci_changes.py tests/test_typed_graph_vocabulary.py --tb=short
      - run: uv run --locked ruff format --check src/archkeel/ir/facts.py src/archkeel/ir/architecture_graph.py src/archkeel/analyzer/python/symbols.py tools/ci_changes.py tests/test_ci_changes.py tests/test_typed_parameter_kinds.py tests/test_typed_graph_vocabulary.py
      - run: uv run --locked ruff check src/archkeel/ir/facts.py src/archkeel/ir/architecture_graph.py src/archkeel/analyzer/python/symbols.py tools/ci_changes.py tests/test_ci_changes.py tests/test_typed_parameter_kinds.py tests/test_typed_graph_vocabulary.py
      - run: uv run --locked mypy src/archkeel tools/browser_graph_protocol.py tools/ci_changes.py
      - run: make browser-graph-check
      - run: git diff --exit-code
