name: Dart input owner actual evidence
on:
  push:
    branches: [verify/542-dart-input-grammar-final]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q tests/test_dart_input_grammar.py tests/test_dart_typed_controls.py -k 'not own_dart_module_guards' --tb=short
      - name: Exact source quality
        if: ${{ always() }}
        run: |
          uv run --locked ruff check src/archkeel tests/test_dart_input_grammar.py tests/test_dart_typed_controls.py
          uv run --locked ruff format --check src/archkeel/analyzer/dart tests/test_dart_input_grammar.py tests/test_dart_typed_controls.py
          uv run --locked mypy src/archkeel
  compass-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual prior parser/resolver/producer and complete canonical wire comparison
        run: |
          uv run --locked python - <<'PY'
          import importlib
          import json
          import statistics
          import subprocess
          import sys
          import time
          from dataclasses import asdict
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from archkeel.analyzer.dart.collect import collect
          from archkeel.analyzer.dart.parse import parse
          from archkeel.cli.config import parse_config
          from archkeel.ir.facts_codec import encode_response
          from archkeel.ir.protocol import CollectionRequest, CollectionResponse, DartSettings, SnapshotInput, SourceScope
          repository = Path.cwd()
          base = "0e3b8a7f62b9b13417cda78e11b52d0de82986cd"
          with TemporaryDirectory(prefix="prior-dart-input-") as temporary:
              package_root = Path(temporary) / "prior_dart"
              package_root.mkdir()
              for name in ("__init__", "collect", "parse", "resolve", "snapshot", "syntax"):
                  payload = subprocess.run(["git", "show", f"{base}:src/archkeel/analyzer/dart/{name}.py"], check=True, capture_output=True).stdout
                  (package_root / f"{name}.py").write_bytes(payload)
              sys.path.insert(0, temporary)
              prior_collect = importlib.import_module("prior_dart.collect").collect
              prior_parse = importlib.import_module("prior_dart.parse").parse
              for fixture in ("H-uml-dart", "J-compass"):
                  root = repository / "fixtures" / fixture
                  config = parse_config((root / "archkeel.toml").read_bytes())
                  request = CollectionRequest(SnapshotInput(str(root), "a" * 40, False), SourceScope(config.roots, config.namespace), DartSettings())
                  prior_facts = prior_collect(request)
                  before = encode_response(CollectionResponse(prior_facts))
                  after = encode_response(CollectionResponse(collect(request)))
                  print("DART_COMMON_RUNTIME_WIRE", fixture, len(before), len(after), before == after, flush=True)
                  assert before == after, fixture
                  sources = [(path.relative_to(root).as_posix(), path.read_bytes()) for path in sorted(root.rglob("*.dart"))]
                  changes = []
                  symbols = [record for section in prior_facts.sections if section.name == "symbols" for record in section.records]
                  cited = {item.id: item for item in prior_facts.evidence}
                  for path, data in sources:
                      old, new = asdict(prior_parse(data)), asdict(parse(data))
                      assert len(old["definitions"]) == len(new["definitions"]), path
                      for old_definition, new_definition in zip(old["definitions"], new["definitions"], strict=True):
                          assert len(old_definition["members"]) == len(new_definition["members"]), path
                          for old_member, new_member in zip(old_definition["members"], new_definition["members"], strict=True):
                              if old_member["visibility"] == new_member["visibility"]:
                                  continue
                              assert old_member["kind"] == new_member["kind"] == "constructor", (path, old_member, new_member)
                              span = new_member["span"]
                              spelling = data[span["start_byte"]:span["end_byte"]].decode("utf-8")
                              assert spelling[:400] == span["excerpt"]
                              matching = [record for record in symbols if record.data.get("source_file") == path and record.data.get("name") == new_member["name"] and record.data.get("parent") == record.data.get("module") + "." + new_definition["name"]]
                              assert len(matching) == 1, (path, new_member["name"], len(matching))
                              wire = matching[0]
                              assert wire.data.get("method_kind") in {"constructor", "factory"}
                              assert wire.data.get("visibility_detail").get("kind") == new_member["visibility"]
                              evidence = [cited[key] for key in wire.evidence_ids]
                              assert any(item.file == path and item.line == span["line"] and item.column == span["column"] and item.excerpt == span["excerpt"] for item in evidence), (path, new_member["name"])
                              changes.append(dict(path=path, owner=new_definition["name"], name=new_member["name"], kind=new_member["kind"], line=span["line"], excerpt=spelling, before=old_member["visibility"], after=new_member["visibility"], prior_wire_visibility=wire.data.get("visibility_detail").get("kind")))
                              old_member["visibility"] = new_member["visibility"]
                      assert old == new, path
                  print("DART_CONSTRUCTOR_FORM_PROOFS=" + json.dumps(dict(fixture=fixture, files=len(sources), corrections=changes), sort_keys=True), flush=True)
                  functions = dict(before=prior_collect, after=collect)
                  samples = {key: [] for key in functions}
                  for repeat in range(3):
                      for label in (("before", "after") if repeat % 2 == 0 else ("after", "before")):
                          started = time.perf_counter()
                          functions[label](request)
                          samples[label].append(time.perf_counter() - started)
                  medians = {key: statistics.median(value) for key, value in samples.items()}
                  print("DART_COLLECTION_COST=" + json.dumps(dict(fixture=fixture, samples=3, medians=medians, delta_percent=(medians["after"]/medians["before"]-1)*100)), flush=True)
          PY
  actual-compass-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run --locked --with playwright python -m playwright install --with-deps chromium
      - run: uv run --locked --with playwright python -m pytest -q tests/test_compass_project_report.py --tb=short
