name: Actual Atlas predecessor Scene parity
on:
  push:
    branches: [verify/542-atlas-actual-scene-parity]
permissions:
  contents: read
jobs:
  actual-predecessor-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.11.12"
      - run: uv sync --locked
      - run: make browser-install
      - run: uv run --locked --with playwright==1.62.0 python tools/atlas_scene_parity_probe.py
