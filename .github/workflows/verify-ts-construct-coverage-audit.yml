okens.Active.value; }\n"}},{"id":"class-static-member-ts","group":"member-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { class Tokens { static Active = \"active\"; } return value === Tokens.Active; }\n"}},{"id":"mixed-supported-unknown-ts","group":"mixed","extension":"ts","compiler":true,"expected":1,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const token = \"pending\"; return value === \"active\" || value === token; }\n"}},{"id":"imported-ts","group":"import-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"import { ACTIVE } from \"./tokens.js\";\nexport function decide(value: any, left: any, right: any) { return value === ACTIVE; }\n","src/tokens.ts":"export const ACTIVE = \"active\";\n"}},{"id":"imported-alias-ts","group":"import-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"import { ACTIVE as Token } from \"./tokens.js\";\nexport function decide(value: any, left: any, right: any) { return value === Token; }\n","src/tokens.ts":"export const ACTIVE = \"active\";\n"}},{"id":"namespace-import-ts","group":"import-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"import * as Tokens from \"./tokens.js\";\nexport function decide(value: any, left: any, right: any) { return value === Tokens.ACTIVE; }\n","src/tokens.ts":"export const ACTIVE = \"active\";\n"}},{"id":"reexport-alias-ts","group":"import-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"import { PUBLIC as Token } from \"./public.js\";\nexport function decide(value: any, left: any, right: any) { return value === Token; }\n","src/tokens.ts":"export const ACTIVE = \"active\";\n","src/public.ts":"export { ACTIVE as PUBLIC } from \"./tokens.js\";\n"}},{"id":"unresolved-import-ts","group":"unresolved-import","extension":"ts","compiler":false,"expecte