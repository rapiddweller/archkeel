name: Bounded actual TypeScript construct coverage audit
on:
  push:
    branches: [verify/542-ts-construct-coverage-audit]
permissions:
  contents: read
jobs:
  actual-native-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b15822a9bef0d4035ad51478339ca5c0ab275b99
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Actual collector strict wire and Core controls on fixed Target
        run: |
          uv run --locked python - <<'PY'
          import collections, dataclasses, gzip, hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"tests"))
          from test_typescript_collect import _facts
          from test_typescript_string_constructs import _assemble, _constructs, _assessment, OPTIONS
          from archkeel.analyzer.typescript import parse as parser
          from archkeel.ir.facts import ConstructSupport, ForbiddenConstructKind, LocalTarget
          from archkeel.ir.facts_codec import decode_response, encode_response
          from archkeel.ir.protocol import CollectionResponse
          from archkeel.ir.trace import trace_valid_violations
          CASES = json.loads(r'''[{"id":"eq-ts","group":"written-positive","extension":"ts","compiler":true,"expected":1,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return value === \"active\"; }\n"}},{"id":"reversed-ts","group":"written-positive","extension":"ts","compiler":true,"expected":1,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return \"active\" !== value; }\n"}},{"id":"parens-ts","group":"written-positive","extension":"ts","compiler":true,"expected":1,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return value === ((/*protocol*/ \"active\")); }\n"}},{"id":"static-template-ts","group":"written-positive","extension":"ts","compiler":true,"expected":1,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return value === `active`; }\n"}},{"id":"switch-ts","group":"written-positive","extension":"ts","compiler":true,"expected":1,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { switch(value) { case \"active\": return true; default: return false; } }\n"}},{"id":"local-const-ts","group":"local-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const token = \"active\"; return value === token; }\n"}},{"id":"local-alias-ts","group":"local-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const token = \"active\"; const alias = token; return value === alias; }\n"}},{"id":"switch-alias-ts","group":"local-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const token = \"active\"; switch(value) { case token: return true; default: return false; } }\n"}},{"id":"mutated-label-ts","group":"value-flow-boundary","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { let token = \"active\"; token = left; return value === token; }\n"}},{"id":"shadowed-label-ts","group":"value-flow-boundary","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const token = \"active\"; return ((token) => value === token)(left); }\n"}},{"id":"captured-label-ts","group":"local-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const token = \"active\"; return () => value === token; }\n"}},{"id":"inline-array-ts","group":"membership","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return [\"active\", \"pending\"].includes(value); }\n"}},{"id":"named-array-ts","group":"membership","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const tokens = [\"active\", \"pending\"]; return tokens.includes(value); }\n"}},{"id":"array-alias-ts","group":"membership","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const tokens = [\"active\"]; const alias = tokens; return alias.includes(value); }\n"}},{"id":"mutated-array-ts","group":"membership-boundary","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const tokens = [\"active\"]; tokens.push(left); return tokens.includes(value); }\n"}},{"id":"inline-set-ts","group":"membership","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return new Set([\"active\", \"pending\"]).has(value); }\n"}},{"id":"named-set-ts","group":"membership","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const tokens = new Set([\"active\"]); return tokens.has(value); }\n"}},{"id":"mutated-set-ts","group":"membership-boundary","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const tokens = new Set([\"active\"]); tokens.add(left); return tokens.has(value); }\n"}},{"id":"custom-has-ts","group":"membership-boundary","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { const tokens = { has: (item) => Boolean(item) }; return tokens.has(value); }\n"}},{"id":"prefix-ts","group":"string-method","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return value.startsWith(\"active\"); }\n"}},{"id":"suffix-ts","group":"string-method","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return value.endsWith(\"active\"); }\n"}},{"id":"method-include-ts","group":"string-method","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return value.includes(\"active\"); }\n"}},{"id":"computed-prefix-ts","group":"string-method","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return value[\"startsWith\"](\"active\"); }\n"}},{"id":"optional-prefix-ts","group":"string-method","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\nexport function decide(value: any, left: any, right: any) { return value?.startsWith?.(\"active\"); }\n"}},{"id":"data-variables-ts","group":"allowed-data","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"\