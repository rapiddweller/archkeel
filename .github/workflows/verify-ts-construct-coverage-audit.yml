          # A compiler check establishes that the positive/unsupported examples really are valid
          # language inputs, without granting the detector compiler or runtime-value authority.
          compiler_project=root/"tsconfig-audit.json"
          compiler_files=[str((root/case["id"]/path).resolve()) for case in CASES if case["compiler"] for path in case["files"]]
          compiler_project.write_text(json.dumps({
              "compilerOptions":{"target":"ES2022","module":"CommonJS","moduleResolution":"Node",
                                 "allowJs":True,"checkJs":False,"noEmit":True,"skipLibCheck":True},
