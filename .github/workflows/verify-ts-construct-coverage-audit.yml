              assert len(records)==case["expected"],(case["id"],len(records),case["expected"])
              expected_status="FAIL" if records else "UNKNOWN"
              assessment=_assessment(model)
              assert assessment.status==expected_status,(case["id"],assessment)
              assert _assessment(replay_model).status==expected_status,case["id"]
              assert len(violations)==len(records),case["id"]
              evidence={row.id:row for row in facts.evidence}
              assert all(row.evidence_ids and row.id in {fact for v in violations for fact in v.fact_ids} for row in records),case["id"]
              for record in records:
                  for evidence_id in record.evidence_ids:
                      citation=evidence[evidence_id]
                      assert citation.excerpt in case["files"][citation.file],(case["id"],citation)
                      assert citation.line>=1 and citation.column>=1,(case["id"],citation)
              if case["group"]=="import-value-flow":
                  assert facts.imports and all(isinstance(row,LocalTarget) for row in facts.imports),(case["id"],facts.imports)
              syntax=parser.parse("src/main."+case["extension"],case["files"]["src/main."+case["extension"]].encode())
              row={
                  **case,"records":[dataclasses.asdict(item) for item in records],
                  "evidence":[dataclasses.asdict(evidence[key]) for item in records for key in item.evidence_ids],
                  "assessment":dataclasses.asdict(assessment),"violations":[dataclasses.asdict(item) for item in violations],
                  "construct_support":str(support[ForbiddenConstructKind.STRING_LITERAL_COMPARE]),
