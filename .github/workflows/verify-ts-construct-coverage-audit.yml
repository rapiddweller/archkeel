mpiler":true,"expected":1,"files":{"src/main.js":"\nexport function decide(value, left, right) { const token = \"pending\"; return value === \"active\" || value === token; }\n"}},{"id":"imported-js","group":"import-value-flow","extension":"js","compiler":true,"expected":0,"files":{"src/main.js":"import { ACTIVE } from \"./tokens.js\";\nexport function decide(value, left, right) { return value === ACTIVE; }\n","src/tokens.js":"export const ACTIVE = \"active\";\n"}},{"id":"imported-alias-js","group":"import-value-flow","extension":"js","compiler":true,"expected":0,"files":{"src/main.js":"import { ACTIVE as Token } from \"./tokens.js\";\nexport function decide(value, left, right) { return value === Token; }\n","src/tokens.js":"export const ACTIVE = \"active\";\n"}},{"id":"namespace-import-js","group":"import-value-flow","extension":"js","compiler":true,"expected":0,"files":{"src/main.js":"import * as Tokens from \"./tokens.js\";\nexport function decide(value, left, right) { return value === Tokens.ACTIVE; }\n","src/tokens.js":"export const ACTIVE = \"active\";\n"}},{"id":"reexport-alias-js","group":"import-value-flow","extension":"js","compiler":true,"expected":0,"files":{"src/main.js":"import { PUBLIC as Token } from \"./public.js\";\nexport function decide(value, left, right) { return value === Token; }\n","src/tokens.js":"export const ACTIVE = \"active\";\n","src/public.js":"export { ACTIVE as PUBLIC } from \"./tokens.js\";\n"}},{"id":"unresolved-import-js","group":"unresolved-import","extension":"js","compiler":false,"expected":0,"files":{"src/main.js":"import { ACTIVE as Token } from \"./missing.js\";\nexport function decide(value, left, right) { return value === Token; }\n"}},{"id":"ts-const-object","group":"member-value-flow","extension":"ts","compiler":true,"expected":0,"files":{"src/main.ts":"const Tokens = { Active: \"active\" } as const;\nexport function decide(value: any, left: any, right: any) { return value === Tokens.Active; }\n"}},{"id":"ts-enum-member"