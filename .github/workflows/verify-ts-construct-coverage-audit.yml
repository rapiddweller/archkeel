          compiler=subprocess.run(["npx","--yes","--package","typescript@5.9.3","tsc","--project",str(compiler_project)],capture_output=True,text=True)
          (root/"compiler-stdout.txt").write_text(compiler.stdout+compiler.stderr)
          emit("COMPILER_VALID_INPUTS",{"cases":sum(case["compiler"] for case in CASES),"files":len(compiler_files),"exit_code":compiler.returncode,"output":compiler.stdout+compiler.stderr})
          assert compiler.returncode==0,compiler.stdout+compiler.stderr
          invalid=root/"invalid-enum-value.ts"
          invalid.write_text('enum Mode { Active = "active" }\nexport function decide(value: string) { return value === Mode.Active.value; }\n')
          negative=subprocess.run(["npx","--yes","--package","typescript@5.9.3","tsc","--noEmit","--skipLibCheck","--target","ES2022",str(invalid)],capture_output=True,text=True)
          emit("ENUM_VALUE_INVALID_CONTROL",{"exit_code":negative.returncode,"output":negative.stdout+negative.stderr})
          assert negative.returncode!=0 and "TS2551" in negative.stdout or negative.returncode!=0 and "TS2339" in negative.stdout
          assert target.read_bytes()==target_before
          assert not subprocess.check_output(["git","status","--porcelain"],text=True)
          proof={
              "product_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "target_sha256":hashlib.sha256(target_before).hexdigest(),
              "cases":result,
              "compiler_valid_case_count":sum(case["compiler"] for case in CASES),
              "invalid_enum_value_diagnostic":negative.stdout+negative.stderr,
              "limits":["Written syntax only; no runtime receiver, imported value, closure or mutation proof",
                        "Case intent is fixture annotation, not a semantic classification supplied by the detector",
                        "PARTIAL capability cannot prove global absence or PASS",
                        "JS compiler setting checks syntax, not checkJs semantic typing"]
