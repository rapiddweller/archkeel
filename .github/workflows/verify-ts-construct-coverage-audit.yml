}; return new Set([\"active\"]).has(value); }\n"}},{"id":"shadowed-set-js","group":"membership-boundary","extension":"js","compiler":true,"expected":0,"files":{"src/main.js":"export function decide(value, left, right) { const Set = class { constructor(items) {} has(item) { return true; } }; return new Set([\"active\"]).has(value); }\n"}}]''')
          root=Path(os.environ["RUNNER_TEMP"])/"ts-control-coverage-audit"
          root.mkdir()
          before=subprocess.check_output(["git","status","--porcelain"],text=True)
          assert not before, before
          target=Path("docs/architecture/contracts/typescript.json")
          target_before=target.read_bytes()
          result=[]
          def emit(name,value):
              print(name+"="+json.dumps(value,sort_keys=True,default=str),flush=True)
          for case in CASES:
              directory=root/case["id"]
              facts=_facts(directory,case["files"],options={**OPTIONS,"target":"ES2022"})
              encoded=encode_response(CollectionResponse(facts))
              replay=decode_response(encoded).facts
              assert encode_response(CollectionResponse(replay)) == encoded,case["id"]
              model=_assemble(directory,facts)
              replay_model=_assemble(directory,replay)
              records=_constructs(facts)
              replay_records=_constructs(replay)
              violations=trace_valid_violations(model)
              assert records==replay_records,case["id"]
              assert tuple(dataclasses.asdict(row) for row in violations)==tuple(dataclasses.asdict(row) for row in trace_valid_violations(replay_model)),case["id"]
              support={row.name:row.status for row in facts.capabilities.constructs}
