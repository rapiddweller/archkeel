          encoded_proof=json.dumps(proof,sort_keys=True,default=str).encode()
          with gzip.open(root/"bounded-ts-construct-audit.json.gz","wb") as output: output.write(encoded_proof)
          emit("AUDIT_PROOF",{"cases":len(result),"proof_bytes":len(encoded_proof),"sha256":hashlib.sha256(encoded_proof).hexdigest(),"target_sha256":proof["target_sha256"]})
          emit("GROUPS",{group:{"cases":len(rows),"records":sum(len(row["records"]) for row in rows),"FAIL":sum(row["assessment"]["status"]=="FAIL" for row in rows),"UNKNOWN":sum(row["assessment"]["status"]=="UNKNOWN" for row in rows)} for group,rows in ((key,[row for row in result if row["group"]==key]) for key in sorted({row["group"] for row in result}))})
          emit("EXACT_SOURCE",{"head":proof["product_head"],"dirty":subprocess.check_output(["git","status","--porcelain"],text=True),"target_unchanged":True})
