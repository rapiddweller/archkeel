name: Python classifier native source comparison
on:
  push:
    branches: [verify/542-class-kind-native]
permissions:
  contents: read
jobs:
  native-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ba5a865ac32f2684f10d8d0439b90c12d9647673
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - run: |
          uv run --locked python - <<'PY'
          import ast, collections, gzip, hashlib, json, subprocess
          from dataclasses import asdict
          from pathlib import Path
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          artifact=Path("/tmp/archkeel-native-current-controls")
          artifact.mkdir()
          report=artifact/"actual-report.json"
          run=subprocess.run(["uv","run","--locked","archkeel","report","--root",".","--output",str(report)],capture_output=True,text=True)
          (artifact/"actual-result.json").write_text(run.stdout)
          print(run.stderr[-4000:],flush=True)
          assert run.returncode==0,(run.returncode,run.stdout[-5000:])
          result=json.loads(run.stdout)
          assert not result["diagnostics"],result["diagnostics"]
          assert result["observation_complete"]=="PASS",result
          model=parse_observation(decode_canonical_model(json.loads(report.read_bytes())))
          assert model.coverage.calls_unresolved <= 838,model.coverage
          assert not model.records("violations")
          evidence={row.id:row for row in model.evidence}
          rows=[]
          for item in model.records("constructs"):
              if item.kind!="string_literal_compare": continue
              locations=[asdict(evidence[key]) for key in item.evidence_ids]
              rows.append({"record":asdict(item),"locations":locations,"owner":item.data.get("owner"),"form":item.data.get("form")})

          files=["src/archkeel/ir/model.py","src/archkeel/ir/facts.py","src/archkeel/analyzer/python/symbols.py","src/archkeel/analyzer/python/resolve.py","src/archkeel/analyzer/python/state.py","src/archkeel/check/evaluation/state.py","src/archkeel/check/evaluation/boundary_types.py","src/archkeel/ir/source_graph.py","src/archkeel/check/evaluation/rules.py"]
          guarded=[]
          matched=0
          for row in rows:
              location=row["locations"][0]
              if location["file"] not in files: continue
              source=Path(location["file"]).read_text()
              tree=ast.parse(source)
              candidates=[node for node in ast.walk(tree) if isinstance(node,ast.Compare) and node.lineno==location["line"] and node.col_offset==location["column"]]
              if row["form"] in {"compare","membership"}:
                  assert len(candidates)==1,(location,row["form"],candidates)
                  matched+=1
              for node in candidates:
                  names={child.id for child in ast.walk(node) if isinstance(child,ast.Name)}
                  fields={child.value for child in ast.walk(node) if isinstance(child,ast.Constant) and isinstance(child.value,str)}
                  if names & {"class_kind","inherited"} or "class_kind" in fields:
                      guarded.append(row)
          assert matched > 20,matched
          assert not guarded,guarded
          print("CLASS_KIND_ACTUAL_NATIVE_LITERAL_DECISIONS=0; AST-matched native decisions="+str(matched)+"; other source grammars remain outside this slice",flush=True)

          raw=(json.dumps(rows,sort_keys=True,indent=2)+"\n").encode()
          (artifact/"native-control-sites.json").write_bytes(raw)
          module_counts=collections.Counter()
          forms=collections.Counter()
          for row in rows:
              assert row["locations"]
              module_counts.update({row["locations"][0]["file"]:1})
              forms.update({row["form"]:1})
          summary={"source":"ba5a865ac32f2684f10d8d0439b90c12d9647673","scope":"actual own Python native observation; supported syntax only, not semantic whole-program or defect count","constructs":len(rows),"by_file":dict(module_counts.most_common()),"forms":dict(forms),"site_payload_sha256":hashlib.sha256(raw).hexdigest(),"calls_unresolved":model.coverage.calls_unresolved}
          (artifact/"summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          print("ACTUAL_NATIVE_CURRENT_CONTROL_AUDIT="+json.dumps(summary,sort_keys=True),flush=True)
          print("ACTUAL_NATIVE_CONTROL_SAMPLES="+json.dumps(rows[:3],sort_keys=True),flush=True)
          for file in list(artifact.glob("*.json")):
              packed=file.with_suffix(file.suffix+".gz")
              packed.write_bytes(gzip.compress(file.read_bytes(),compresslevel=1,mtime=0))
              file.unlink()
          subprocess.run(["git","diff","--exit-code"],check=True)
          
          PY

      - name: Verify changed-source quality and boundary regressions
        run: |
          uv run --locked ruff check src/archkeel/ir/model.py src/archkeel/ir/facts.py src/archkeel/analyzer/python/symbols.py src/archkeel/analyzer/python/resolve.py src/archkeel/analyzer/python/state.py src/archkeel/check/evaluation/state.py src/archkeel/check/evaluation/boundary_types.py src/archkeel/ir/source_graph.py src/archkeel/check/evaluation/rules.py tests/test_typed_symbol_class_kinds.py
          uv run --locked ruff format --check src/archkeel/ir/model.py src/archkeel/ir/facts.py src/archkeel/analyzer/python/symbols.py src/archkeel/analyzer/python/resolve.py src/archkeel/analyzer/python/state.py src/archkeel/check/evaluation/state.py src/archkeel/check/evaluation/boundary_types.py src/archkeel/ir/source_graph.py src/archkeel/check/evaluation/rules.py tests/test_typed_symbol_class_kinds.py
          make lint typecheck
          uv run --locked pytest tests/test_typed_symbol_class_kinds.py tests/test_boundary*.py tests/test_uml_classifier_facts.py tests/test_typed_parameter_kinds.py tests/test_definition_context_types.py -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: actual-native-current-control-sites
          path: /tmp/archkeel-native-current-controls/*.gz
