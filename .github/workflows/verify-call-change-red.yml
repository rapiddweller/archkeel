name: Verify unresolved call direction native RED
on:
  push:
    branches: ['verify/542-call-change-red']
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a728b7d236ca0f72a13cf635fdc6b62fc9e2f758
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.11.12'
          version: '0.12.13'
      - run: uv sync --locked
      - run: |
          uv run --locked python - <<'PY'
          import subprocess
          result = subprocess.run(["uv","run","--locked","pytest","-q","tests/test_unresolved_call_change_types.py"],capture_output=True,text=True)
          print(result.stdout)
          print(result.stderr)
          assert result.returncode == 1, result.returncode
          assert "15 failed, 1 passed" in result.stdout
          assert "ERROR collecting" not in result.stdout
          PY
      - run: git diff --exit-code
