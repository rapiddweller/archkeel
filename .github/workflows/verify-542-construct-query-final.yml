name: Verify direct construct query API
on:
  push:
    branches: [verify/542-construct-receiver-final]
permissions:
  contents: read
jobs:
  query-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Verify direct native references and existing construct controls
        run: |
          make lint typecheck
          uv run --locked python -m pytest -q tests/test_references.py tests/test_string_comparison_observation.py tests/test_repository_hygiene.py
      - name: Validate actual source without debt changes
        run: uv run --locked archkeel validate --root . --baseline architecture-baseline.json --json
  actual-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - name: Observe both actual source trees
        run: |
          git worktree add --detach "$RUNNER_TEMP/site-before" 9b9e0f095d598c2b1fb6c61922de6c4bb1d127f4
          uv run --locked archkeel report --root "$RUNNER_TEMP/site-before" --output "$RUNNER_TEMP/site-before.json" > "$RUNNER_TEMP/before-result.json"
          uv run --locked archkeel report --root . --output "$RUNNER_TEMP/site-after.json" > "$RUNNER_TEMP/after-result.json"
      - name: Compare semantic call and UNKNOWN sites
        run: |
          uv run --locked python - <<'PY'
          from collections import Counter
          from dataclasses import asdict
          import json, os, pathlib, re
          from archkeel.ir.codec import decode_canonical_model, parse_observation
          from archkeel.check.ratchets import call_rows, unknown_positions_by_rule
          from archkeel.ir.references import unreferenced_symbols
          def read(name):
              data = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / name).read_text())
              return parse_observation(decode_canonical_model(data))
          before, after = read("site-before.json"), read("site-after.json")
          def calls(model):
              return Counter(
                  (row.path, re.sub(r'<(genexpr|listcomp|dictcomp|setcomp|lambda):\d+:\d+>', r'<\1>', row.caller), row.expression, row.status, row.reason)
                  for row in call_rows(model)
              )
          old_calls, new_calls = calls(before), calls(after)
          def positions(model):
              return {
                  row.id: {"id": row.id, "kind": row.kind, "rule_ids": list(row.rule_ids),
                           **{key: row.data.get(key) for key in ("qualified_name", "position", "path", "annotation", "nested_annotation", "reason")}}
                  for row in model.records("unknowns") or ()
                  if row.kind in {"boundary_type_position", "boundary_type_route"}
              }
          old, new = positions(before), positions(after)
          evidence = {
              "before_ref": "9b9e0f095d598c2b1fb6c61922de6c4bb1d127f4", "after_ref": "4570ac145d1c91ae03efc771f40efe88e90fbd7a",
              "before_calls": before.coverage.calls_unresolved,
              "after_calls": after.coverage.calls_unresolved,
              "new_unresolved_calls": [{"site": key, "count": count} for key, count in sorted((new_calls-old_calls).items())],
              "removed_unresolved_calls": [{"site": key, "count": count} for key, count in sorted((old_calls-new_calls).items())],
              "before_unknown": unknown_positions_by_rule(before),
              "after_unknown": unknown_positions_by_rule(after),
              "new_type_positions": [new[key] for key in sorted(new.keys()-old.keys())],
              "resolved_type_positions": [old[key] for key in sorted(old.keys()-new.keys())],
              "changed_type_positions": [{"before": old[key], "after": new[key]} for key in sorted(old.keys() & new.keys()) if old[key] != new[key]],
          }
          print("ACTUAL_SITE_EVIDENCE=" + json.dumps(evidence, separators=(",", ":")))
          assert not [row for row in evidence["new_unresolved_calls"] if row["site"][3] == "unresolved"], evidence["new_unresolved_calls"]
          assert not evidence["new_type_positions"], evidence["new_type_positions"]
          PY
