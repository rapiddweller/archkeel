name: Read-only host ordering event verification
on:
  push:
    branches: [verify/542-host-order-events]
permissions:
  contents: read
jobs:
  host-order-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5fee8979975908c3e977dbce79df953721b6c7cf
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Genuine missing-port RED
        run: uv run --locked pytest -q tests/test_typed_host_events.py
