name: Maintenance

on:
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: read

concurrency:
  group: actions-maintenance
  cancel-in-progress: false

jobs:
  prune:
    name: Maintain Actions and report artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # A schedule runs on Main, so the prune plan compares against the trusted Main workflows.
      - name: Check out trusted main workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Disable obsolete workflow registrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: make prune-workflows DISABLE=true WORKFLOW_PRUNE_DIR="$RUNNER_TEMP/workflow-prune"

      - name: Prune old report artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: make prune-report-artifacts DELETE=true REPORT_ARTIFACT_PRUNE_DIR="$RUNNER_TEMP/report-artifact-prune"

      - name: Upload workflow maintenance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-maintenance-${{ github.job }}
          path: ${{ runner.temp }}/workflow-prune/plan.json
          if-no-files-found: warn
          retention-days: 7
